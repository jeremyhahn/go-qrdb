    rpc CeremonyClaimShareBegin(CeremonyClaimShareBeginRequest) returns (CeremonyClaimShareBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // CeremonyClaimShareComplete verifies the custodian's factor response and
