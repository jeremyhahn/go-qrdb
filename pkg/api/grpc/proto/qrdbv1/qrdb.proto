    // CeremonyInitialize starts the initialization ceremony.
    rpc CeremonyInitialize(CeremonyInitializeRequest) returns (CeremonyInitializeResponse) {
        option (qrdb.v1.permission) = "ceremony:initialize";
    }

    // CeremonyStatus returns the current ceremony state.
    rpc CeremonyStatus(google.protobuf.Empty) returns (CeremonyStatusResponse) {
        option (qrdb.v1.permission) = "ceremony:status";
    }

    // CeremonyClaimCertBegin starts a certificate claim challenge for an officer.
    rpc CeremonyClaimCertBegin(CeremonyClaimCertBeginRequest) returns (CeremonyClaimCertBeginResponse) {
        option (qrdb.v1.permission) = "ceremony:claim_cert";
    }

    // CeremonyClaimCertComplete completes a certificate claim by submitting the signed nonce.
    rpc CeremonyClaimCertComplete(CeremonyClaimCertCompleteRequest) returns (CeremonyClaimCertCompleteResponse) {
        option (qrdb.v1.permission) = "ceremony:claim_cert";
    }

    // CeremonyBeginClaimShare starts the Shamir share claim handshake for an
    // officer. The caller MUST present an mTLS client certificate; the server
