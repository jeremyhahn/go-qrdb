// ===========================================================================
// Basic KV messages (unchanged)
// ===========================================================================

// PutRequest is the request payload for Put.
message PutRequest {
    string key = 1;
    bytes value = 2;
    WriteMode write_mode = 3;
}

// PutResponse is the response payload for Put.
message PutResponse {}

// GetRequest is the request payload for Get.
message GetRequest {
    string key = 1;
    ConsistencyLevel consistency = 2;
}

// GetResponse is the response payload for Get.
message GetResponse {
    bytes value = 1;
}

// DeleteRequest is the request payload for Delete.
message DeleteRequest {
    string key = 1;
    WriteMode write_mode = 2;
}

// DeleteResponse is the response payload for Delete.
message DeleteResponse {}

// PutIfAbsentRequest is the request payload for PutIfAbsent.
message PutIfAbsentRequest {
    string key = 1;
    bytes value = 2;
}

// PutIfAbsentResponse reports whether the value was stored: true when the key
// was absent and the value was written, false when the key was already present.
message PutIfAbsentResponse {
    bool stored = 1;
}

// CompareAndDeleteRequest is the request payload for CompareAndDelete.
message CompareAndDeleteRequest {
    string key = 1;
    bytes expected = 2;
}

// CompareAndDeleteResponse reports whether the key was deleted: true when the
// stored value equalled expected and the key was removed, false otherwise.
message CompareAndDeleteResponse {
    bool deleted = 1;
}

// CompareAndSwapRequest is the request payload for CompareAndSwap.
message CompareAndSwapRequest {
    string key = 1;
    bytes expected = 2;
    bytes next = 3;
}

// CompareAndSwapResponse reports whether the value was replaced: true when the
// stored value equalled expected and next was written, false otherwise —
// including when the key was absent, since a swap does not create.
message CompareAndSwapResponse {
    bool swapped = 1;
}

// ListRequest is the request payload for List.
message ListRequest {
    string prefix = 1;
    ConsistencyLevel consistency = 2;
}

// ListResponse is the response payload for List.
message ListResponse {
    repeated string keys = 1;
}

// ScanRequest is the request payload for Scan.
message ScanRequest {
    string prefix = 1;
    ConsistencyLevel consistency = 2;
}

// ScanResponse is the response payload for Scan.
message ScanResponse {
    map<string, bytes> pairs = 1;
}

// ===========================================================================
// MVCC messages
// ===========================================================================

// KeyValue is a versioned key-value pair with MVCC revision metadata.
message KeyValue {
    bytes key = 1;
    bytes value = 2;
    int64 create_revision = 3;
    int64 mod_revision = 4;
    int64 version = 5;
    int64 lease_id = 6;
}

// PutWithLeaseRequest stores a key-value pair with an attached lease.
message PutWithLeaseRequest {
    string key = 1;
    bytes value = 2;
    int64 lease_id = 3;
    WriteMode write_mode = 4;
}

// PutWithLeaseResponse returns the resulting key-value.
message PutWithLeaseResponse {
    KeyValue kv = 1;
}

// GetRevisionRequest retrieves a key with full revision metadata.
message GetRevisionRequest {
    string key = 1;
    ConsistencyLevel consistency = 2;
}

// GetRevisionResponse returns the key-value with revision metadata.
message GetRevisionResponse {
    KeyValue kv = 1;
}

// GetAtRevisionRequest retrieves a key at a historical revision.
message GetAtRevisionRequest {
    string key = 1;
    int64 revision = 2;
    ConsistencyLevel consistency = 3;
}

// GetAtRevisionResponse returns the historical key-value.
message GetAtRevisionResponse {
    KeyValue kv = 1;
}

// RangeRequest queries a range of keys.
message RangeRequest {
    bytes start = 1;
    bytes end = 2;
    int64 limit = 3;
    int64 revision = 4;
    bool count_only = 5;
    bool keys_only = 6;
    SortOrder sort_order = 7;
    SortTarget sort_target = 8;
    ConsistencyLevel consistency = 9;
}

// SortOrder specifies the sort direction.
enum SortOrder {
    SORT_NONE = 0;
    SORT_ASCEND = 1;
    SORT_DESCEND = 2;
}

// SortTarget specifies which field to sort by.
enum SortTarget {
    SORT_BY_KEY = 0;
    SORT_BY_VERSION = 1;
    SORT_BY_CREATE_REVISION = 2;
    SORT_BY_MOD_REVISION = 3;
    SORT_BY_VALUE = 4;
}

// ConsistencyLevel selects the read-consistency guarantee for a read
// operation. UNSPECIFIED lets the server choose its default (linearizable),
// keeping older clients that omit the field unaffected.
enum ConsistencyLevel {
    CONSISTENCY_LEVEL_UNSPECIFIED = 0;
    CONSISTENCY_LEVEL_STRONG = 1;
    CONSISTENCY_LEVEL_LINEARIZABLE = 2;
    CONSISTENCY_LEVEL_EVENTUAL = 3;
}

// WriteMode selects the durability guarantee for a write operation.
// UNSPECIFIED lets the server choose its default (sync/quorum), keeping
// older clients that omit the field unaffected.
enum WriteMode {
    WRITE_MODE_UNSPECIFIED = 0;
    WRITE_MODE_SYNC = 1;
    WRITE_MODE_WAL_DURABLE = 2;
    WRITE_MODE_BATCHED = 3;
}

// RangeResponse returns the matched key-values, total count, and the MVCC
// revision the read was performed at.
message RangeResponse {
    repeated KeyValue kvs = 1;
    int64 count = 2;
    int64 revision = 3;
}

// CompactRequest compacts revisions up to the specified revision.
message CompactRequest {
    int64 revision = 1;
}

// CurrentRevisionResponse returns the latest revision.
message CurrentRevisionResponse {
    int64 revision = 1;
}

// RestoreAction identifies the change a restore plan makes to one key.
enum RestoreAction {
    RESTORE_ACTION_UNSPECIFIED = 0;
    RESTORE_ACTION_REVERT = 1;
    RESTORE_ACTION_RECREATE = 2;
    RESTORE_ACTION_DELETE = 3;
}

// RestoreRevisionRequest describes a selective point-in-time restore.
// Exactly one of prefix and keys must be set: an unscoped request (neither
// set) is refused, and a request setting both is refused as ambiguous.
message RestoreRevisionRequest {
    // revision is the target MVCC revision to restore the scoped keys to.
    int64 revision = 1;
    // prefix scopes the restore to every key beginning with it. Mutually
    // exclusive with keys. Carried as bytes, not string, so an arbitrary
    // byte-valued prefix round-trips exactly.
    bytes prefix = 2;
    // keys scopes the restore to an explicit key list. Mutually exclusive
    // with prefix. Carried as bytes, not string, for the same reason.
    repeated bytes keys = 3;
    // dry_run computes and returns the plan without writing anything.
    bool dry_run = 4;
    // force applies the plan unconditionally, bypassing the default
    // compare-and-swap guard on each key.
    bool force = 5;
}

// RestoreKeyChange is one entry in a restore plan: the change that would be
// (or was) applied to a single key. It never carries the restored value --
// only Applier metadata (the action and its revisions/size) -- so a plan is
// not a bulk data export of the keyspace at a historical revision.
message RestoreKeyChange {
    bytes key = 1;
    RestoreAction action = 2;
    int64 from_revision = 3;
    int64 to_revision = 4;
    int64 value_bytes = 5;
}

// RestoreRevisionResponse reports the outcome of a selective restore.
message RestoreRevisionResponse {
    int64 revision = 1;
    repeated RestoreKeyChange changes = 2;
    repeated RestoreKeyChange conflicts = 3;
    int64 applied = 4;
    int64 skipped = 5;
    int64 conflicted = 6;
    bool dry_run = 7;
}

// ===========================================================================
// Transaction messages
// ===========================================================================

// CompareTarget selects which field to compare.
enum CompareTarget {
    COMPARE_VERSION = 0;
    COMPARE_CREATE_REVISION = 1;
    COMPARE_MOD_REVISION = 2;
    COMPARE_VALUE = 3;
}

// CompareResult specifies the comparison operator.
enum CompareResult {
    COMPARE_EQUAL = 0;
    COMPARE_GREATER = 1;
    COMPARE_LESS = 2;
    COMPARE_NOT_EQUAL = 3;
}

// Compare is a single precondition in a transaction.
message Compare {
    bytes key = 1;
    CompareTarget target = 2;
    CompareResult result = 3;
    // target_union contains the comparison value based on target type.
    oneof target_union {
        int64 version = 4;
        int64 create_revision = 5;
        int64 mod_revision = 6;
        bytes value = 7;
    }
}

// OpType identifies the type of operation.
enum OpType {
    OP_PUT = 0;
    OP_GET = 1;
    OP_DELETE = 2;
    OP_RANGE = 3;
}

// Op is a single operation within a transaction or batch.
message Op {
    OpType type = 1;
    bytes key = 2;
    bytes value = 3;
    bytes range_end = 4;
    int64 lease_id = 5;
}

// OpResponse is the result of a single operation.
message OpResponse {
    repeated KeyValue kvs = 1;
    int64 count = 2;
    bool succeeded = 3;
}

// TransactionRequest executes a compare-and-swap transaction.
message TransactionRequest {
    repeated Compare compares = 1;
    repeated Op success_ops = 2;
    repeated Op failure_ops = 3;
}

// TransactionResponse returns the result of a transaction.
message TransactionResponse {
    bool succeeded = 1;
    int64 revision = 2;
    repeated OpResponse responses = 3;
}

// ===========================================================================
// Batch messages
// ===========================================================================

// BatchRequest executes multiple operations atomically.
message BatchRequest {
    repeated Op ops = 1;
}

// BatchResponse returns the per-operation results.
message BatchResponse {
    repeated OpResponse responses = 1;
}

// BatchImportRequest carries a file to be parsed and imported as key-value
// pairs. The target database is carried by the transport's scope mechanism
// (gRPC x-qrdb-database metadata / Unix socket equivalent), not by a field
// on this message, mirroring BatchRequest and every other data-plane RPC.
message BatchImportRequest {
    bytes  file           = 1;
    string format         = 2;
    string filename       = 3;
    string key_field      = 4;
    string value_mode     = 5;
    string value_field    = 6;
    bool   skip_header    = 7;
    bool   transactional  = 8;
}

// BatchImportError describes a single row that failed during import.
message BatchImportError {
    int32  row     = 1;
    string key     = 2;
    string message = 3;
}

// BatchImportResponse returns statistics from a batch import operation.
message BatchImportResponse {
    int32                     total     = 1;
    int32                     succeeded = 2;
    int32                     failed    = 3;
    repeated BatchImportError errors    = 4;
}

// ===========================================================================
// Watch messages
// ===========================================================================

// EventType identifies the type of a watch event.
enum EventType {
    EVENT_PUT = 0;
    EVENT_DELETE = 1;
}

// Event represents a single change to a key.
message Event {
    EventType type = 1;
    KeyValue kv = 2;
    KeyValue prev_kv = 3;
}

// WatchRequest creates a watcher.
message WatchRequest {
    bytes key = 1;
    bytes range_end = 2;
    int64 start_revision = 3;
    bool prev_kv = 4;
    bool progress_notify = 5;
}

// WatchResponse delivers watch events.
message WatchResponse {
    int64 watch_id = 1;
    repeated Event events = 2;
    bool canceled = 3;
    string cancel_reason = 4;
    int64 revision = 5;
}

// ===========================================================================
// Lease messages
// ===========================================================================

// Lease describes a distributed TTL lease.
message Lease {
    int64 id = 1;
    int64 ttl = 2;
    int64 granted_ttl = 3;
    int64 remaining_ttl = 4;
    repeated bytes keys = 5;
}

// LeaseGrantRequest creates a new lease.
message LeaseGrantRequest {
    int64 ttl = 1;
}

// LeaseGrantResponse returns the created lease.
message LeaseGrantResponse {
    Lease lease = 1;
}

// LeaseRevokeRequest expires a lease.
message LeaseRevokeRequest {
    int64 lease_id = 1;
}

// LeaseKeepAliveRequest resets a lease TTL.
message LeaseKeepAliveRequest {
    int64 lease_id = 1;
}

// LeaseKeepAliveResponse returns the refreshed lease.
message LeaseKeepAliveResponse {
    Lease lease = 1;
}

// LeaseTimeToLiveRequest queries a lease.
message LeaseTimeToLiveRequest {
    int64 lease_id = 1;
}

// LeaseTimeToLiveResponse returns the lease state.
message LeaseTimeToLiveResponse {
    Lease lease = 1;
}

// LeaseListResponse returns all active leases.
message LeaseListResponse {
    repeated Lease leases = 1;
}

// ===========================================================================
// Distributed lock messages
// ===========================================================================

// LockInfo describes an acquired distributed lock.
message LockInfo {
    string key = 1;
    int64 fencing_token = 2;
    int64 lease_id = 3;
    string holder_id = 4;
    bool reentrant = 5;
    int32 acquire_count = 6;
    int64 ttl = 7;
    int64 acquired_at = 8;
}

// LockAcquireRequest acquires a lock, blocking until acquired.
message LockAcquireRequest {
    string key = 1;
    string holder_id = 2;
    int64 ttl = 3;
    bool reentrant = 4;
}

// LockAcquireResponse returns the acquired lock.
message LockAcquireResponse {
    LockInfo lock = 1;
}

// LockTryLockRequest attempts to acquire a lock without blocking.
message LockTryLockRequest {
    string key = 1;
    string holder_id = 2;
    int64 ttl = 3;
    bool reentrant = 4;
}

// LockTryLockResponse returns the acquired lock.
message LockTryLockResponse {
    LockInfo lock = 1;
}

// LockReleaseRequest releases a held lock.
message LockReleaseRequest {
    string key = 1;
    int64 fencing_token = 2;
}

// LockExtendRequest refreshes the TTL on a held lock.
message LockExtendRequest {
    string key = 1;
    int64 fencing_token = 2;
}

// LockExtendResponse returns the updated lock state.
message LockExtendResponse {
    LockInfo lock = 1;
}

// LockStatusRequest queries the current state of a lock.
message LockStatusRequest {
    string key = 1;
}

// LockStatusResponse returns the lock state.
message LockStatusResponse {
    LockInfo lock = 1;
}

// LockListRequest lists active locks filtered by key prefix.
message LockListRequest {
    string prefix = 1;
}

// LockListResponse returns active locks.
message LockListResponse {
    repeated LockInfo locks = 1;
}

// ===========================================================================
// Index messages (Tier 2)
// ===========================================================================

// IndexCreateRequest creates a new secondary index.
message IndexCreateRequest {
    string name = 1;
    string field_name = 2;
    bool unique = 3;
    bool sparse = 4;
    // numeric encodes field values as fixed-width 8-byte big-endian integers
    // so byte ordering matches numeric ordering. Absent means string ordering,
    // which is what every request written before this field existed meant.
    bool numeric = 5;
    // case_insensitive folds string field values on write, backfill and
    // lookup. The field marks the POSITIVE claim so an absent value decodes to
    // a case-SENSITIVE index -- the behaviour requests predating it were
    // created under (go-qrdb#34).
    bool case_insensitive = 6;
}

// IndexDropRequest removes a secondary index.
message IndexDropRequest {
    string name = 1;
}

// IndexQueryRequest queries an index for exact match.
message IndexQueryRequest {
    string index_name = 1;
    bytes value = 2;
}

// IndexQueryResponse returns matching entry keys.
message IndexQueryResponse {
    repeated bytes keys = 1;
}

// IndexScanRequest scans an index within a value range.
message IndexScanRequest {
    string index_name = 1;
    // start and end are OPTIONAL: an absent bound means the range is open on
    // that side (go-qrdb#36). An explicit empty bound is distinct from an
    // absent one, which is why proto3 `optional` presence is required here.
    optional bytes start = 2;
    optional bytes end = 3;
}

// IndexScanEntry maps an index value to its matching entry keys.
message IndexScanEntry {
    string value = 1;
    repeated bytes keys = 2;
}

// IndexScanResponse returns the scan results.
message IndexScanResponse {
    repeated IndexScanEntry entries = 1;
}

// IndexListResponse returns the names of all registered indexes.
message IndexListResponse {
    repeated string names = 1;
}

// ===========================================================================
// Time-series messages (Tier 2)
// ===========================================================================

// TSTag is a key-value label for time-series data.
message TSTag {
    string key = 1;
    string value = 2;
}

// TSDataPoint is a single time-series measurement.
message TSDataPoint {
    string metric = 1;
    double value = 2;
    int64 timestamp_ns = 3;
    repeated TSTag tags = 4;
}

// TSWriteRequest stores a single data point.
message TSWriteRequest {
    TSDataPoint point = 1;
}

// TSWriteBatchRequest stores multiple data points.
message TSWriteBatchRequest {
    repeated TSDataPoint points = 1;
}

// TSQueryRequest retrieves data points in a time range.
message TSQueryRequest {
    string metric = 1;
    int64 start_ns = 2;
    int64 end_ns = 3;
    repeated TSTag tags = 4;
    int32 limit = 5;
    bool descending = 6;
    ConsistencyLevel consistency = 7;
}

// TSQueryResponse returns matching data points.
message TSQueryResponse {
    repeated TSDataPoint points = 1;
}

// AggFunc identifies an aggregation function.
enum AggFunc {
    AGG_AVG = 0;
    AGG_SUM = 1;
    AGG_MIN = 2;
    AGG_MAX = 3;
    AGG_COUNT = 4;
    AGG_PERCENTILE = 5;
}

// TSAggregateRequest computes an aggregation over a time range.
message TSAggregateRequest {
    string metric = 1;
    int64 start_ns = 2;
    int64 end_ns = 3;
    AggFunc function = 4;
    int64 interval_ns = 5;
    ConsistencyLevel consistency = 6;
}

// TSAggResult is an aggregation result for a single interval.
message TSAggResult {
    int64 timestamp_ns = 1;
    double value = 2;
    int64 count = 3;
}

// TSAggregateResponse returns the aggregation results.
message TSAggregateResponse {
    repeated TSAggResult results = 1;
}

// TSRichQueryRequest performs a rich query with aggregation, downsampling, and grouping.
message TSRichQueryRequest {
    string metric = 1;
    repeated TSTag tags = 2;
    int64 start_ns = 3;
    int64 end_ns = 4;
    AggFunc aggregation = 5;
    int64 interval_ns = 6;
    repeated string group_by = 7;
    int32 limit = 8;
    double percentile = 9;
    ConsistencyLevel consistency = 10;
}

// TSRichQueryResponse returns the result of a rich query.
message TSRichQueryResponse {
    string metric = 1;
    repeated TSTag tags = 2;
    repeated TSDataPoint points = 3;
    double aggregated_value = 4;
    bool has_aggregated_value = 5;
    repeated TSGroupedResult grouped_results = 6;
}

// TSGroupedResult is a grouped query result containing tags, points, and optional aggregation.
message TSGroupedResult {
    repeated TSTag tags = 1;
    repeated TSDataPoint points = 2;
    double aggregated_value = 3;
    bool has_aggregated_value = 4;
}

// TSDeleteSeriesRequest deletes time-series data matching the criteria.
message TSDeleteSeriesRequest {
    string metric = 1;
    repeated TSTag tags = 2;
    int64 start_ns = 3;
    int64 end_ns = 4;
}

// TSGetRetentionRequest retrieves the retention policy for a metric.
message TSGetRetentionRequest {
    string metric = 1;
}

// TSRetentionPolicyResponse returns the retention policy for a metric.
message TSRetentionPolicyResponse {
    int64 duration_ns = 1;
    int64 resolution_ns = 2;
    AggFunc aggregation = 3;
}

// TSSetRetentionRequest sets the retention policy for a metric.
message TSSetRetentionRequest {
    string metric = 1;
    int64 duration_ns = 2;
    int64 resolution_ns = 3;
    AggFunc aggregation = 4;
}

// TSListMetricsRequest lists metric names matching a prefix.
message TSListMetricsRequest {
    string prefix = 1;
    int32 limit = 2;
    ConsistencyLevel consistency = 3;
}

// TSListMetricsResponse returns matching metric names.
message TSListMetricsResponse {
    repeated string metrics = 1;
}

// ===========================================================================
// Admin messages (unchanged)
// ===========================================================================

// HealthResponse is the response payload for Health.
message HealthResponse {
    string status = 1;
    bool leader = 2;
}

// StatusResponse is the response payload for Status.
message StatusResponse {
    string node_id = 1;
    string raft_address = 2;
    bool is_leader = 3;
    uint64 leader_id = 4;
    int32 shard_count = 5;
    bool is_draining = 6;
}

// PeersResponse is the response payload for Peers.
message PeersResponse {
    repeated ShardPeers shards = 1;
}

// ShardPeers describes the peers for a single shard.
message ShardPeers {
    uint64 shard_id = 1;
    uint64 leader_id = 2;
    repeated PeerInfo peers = 3;
}

// PeerInfo describes a single peer in a shard.
message PeerInfo {
    uint64 replica_id = 1;
    string address = 2;
    bool is_leader = 3;
}

// AddMemberRequest is the request payload for AddMember.
message AddMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    string raft_address = 3;
}

// RemoveMemberRequest is the request payload for RemoveMember.
message RemoveMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
}

// RequestSnapshotMessage is the request payload for RequestSnapshot.
message RequestSnapshotMessage {
    uint64 shard_id = 1;
}

// CapabilitiesRequest is the request payload for Capabilities.
message CapabilitiesRequest {}

// CapabilitiesResponse describes the effective feature set of the node:
// the intersection of build tags, run mode, and configuration. A false
// value may mean not-compiled, mode-gated, or config-disabled.
message CapabilitiesResponse {
    bool kv = 1;
    bool mvcc = 2;
    bool transaction = 3;
    bool batch = 4;
    bool watch = 5;
    bool lease = 6;
    bool index = 7;
    bool time_series = 8;
    bool vector = 9;
    // mode is the run mode: "standalone" or "raft".
    string mode = 10;
    bool lock = 11;
    bool cluster = 12;
    bool backup = 13;
    bool rebalance = 14;
    bool sql = 15;
    bool mysql = 16;
    bool postgresql = 17;
    bool etcd = 18;
    bool fts = 19;
}

// StartShardRequest is the request payload for StartShard.
message StartShardRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    map<uint64, string> members = 3;
    bool join = 4;
}

// StopShardRequest is the request payload for StopShard.
message StopShardRequest {
    uint64 shard_id = 1;
}

// GetShardStateRequest is the request payload for GetShardState.
message GetShardStateRequest {
    uint64 shard_id = 1;
}

// ShardStateResponse describes the Raft state of a single shard.
message ShardStateResponse {
    uint64 shard_id = 1;
    uint64 config_change_index = 2;
    uint64 term = 3;
    uint64 leader_id = 4;
    bool has_leader = 5;
}

// TopologyResponse describes the full cluster topology.
message TopologyResponse {
    string node_id = 1;
    string raft_address = 2;
    int32 shard_count = 3;
    repeated ShardInfoProto shards = 4;
}

// ShardInfoProto describes a single shard in the topology.
message ShardInfoProto {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    bool is_leader = 3;
    uint64 leader_id = 4;
    map<uint64, string> nodes = 5;
}

// ===========================================================================
// Vector messages (Tier 2)
// ===========================================================================

// DistanceMetric specifies how vector similarity is measured.
enum DistanceMetric {
    // DISTANCE_COSINE measures the cosine of the angle between vectors.
    DISTANCE_COSINE = 0;

    // DISTANCE_EUCLIDEAN measures the straight-line distance between vectors.
    DISTANCE_EUCLIDEAN = 1;

    // DISTANCE_DOT_PRODUCT measures similarity via the dot product.
    DISTANCE_DOT_PRODUCT = 2;
}

// VectorIndexType specifies the vector index algorithm.
enum VectorIndexType {
    // INDEX_HNSW uses hierarchical navigable small world graphs.
    INDEX_HNSW = 0;

    // INDEX_FLAT uses brute-force exact search.
    INDEX_FLAT = 1;

    // INDEX_IVF_FLAT uses inverted file index with flat quantization.
    INDEX_IVF_FLAT = 2;
}

// ---------------------------------------------------------------------------
// Namespace messages
// ---------------------------------------------------------------------------

// VectorCreateNamespaceRequest creates a new vector namespace.
message VectorCreateNamespaceRequest {
    string namespace = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    string index_params_json = 5;
    uint64 shard_id = 6;
}

// VectorCreateNamespaceResponse is the result of a namespace creation.
message VectorCreateNamespaceResponse {
    bool created = 1;
    int64 timestamp = 2;
}

// VectorDeleteNamespaceRequest removes a namespace and all its vectors.
message VectorDeleteNamespaceRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorListNamespacesRequest lists all vector namespaces.
message VectorListNamespacesRequest {
    uint64 shard_id = 1;
}

// VectorListNamespacesResponse returns all namespace names.
message VectorListNamespacesResponse {
    repeated string namespaces = 1;
}

// VectorGetNamespaceInfoRequest retrieves namespace metadata.
message VectorGetNamespaceInfoRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorNamespaceInfo contains metadata about a vector namespace.
message VectorNamespaceInfo {
    string namespace = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    int64 vector_count = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
}

// ---------------------------------------------------------------------------
// Vector CRUD messages
// ---------------------------------------------------------------------------

// VectorDataProto represents a single vector with metadata and versioning.
message VectorDataProto {
    string id = 1;
    repeated float vector = 2;
    string metadata_json = 3;
    int64 version = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// VectorUpsertRequest inserts or updates a vector.
message VectorUpsertRequest {
    string namespace = 1;
    string id = 2;
    repeated float vector = 3;
    string metadata_json = 4;
    uint64 shard_id = 5;
}

// VectorUpsertResponse is the result of a vector upsert.
message VectorUpsertResponse {
    int64 version = 1;
    int64 timestamp = 2;
    bool created = 3;
}

// VectorGetRequest retrieves a single vector by ID.
message VectorGetRequest {
    string namespace = 1;
    string id = 2;
    ConsistencyLevel consistency = 3;
    uint64 shard_id = 4;
}

// VectorDeleteRequest removes a single vector by ID.
message VectorDeleteRequest {
    string namespace = 1;
    string id = 2;
    uint64 shard_id = 3;
}

// VectorBatchError describes a failure for a single vector in a batch.
message VectorBatchError {
    string id = 1;
    string error = 2;
}

// VectorBatchUpsertRequest inserts or updates multiple vectors.
message VectorBatchUpsertRequest {
    string namespace = 1;
    repeated VectorDataProto vectors = 2;
    uint64 shard_id = 3;
}

// VectorBatchUpsertResponse is the result of a batch upsert.
message VectorBatchUpsertResponse {
    int32 succeeded = 1;
    int32 failed = 2;
    repeated VectorBatchError errors = 3;
}

// VectorBatchDeleteRequest removes multiple vectors by ID.
message VectorBatchDeleteRequest {
    string namespace = 1;
    repeated string ids = 2;
    uint64 shard_id = 3;
}

// VectorBatchDeleteResponse is the result of a batch delete.
message VectorBatchDeleteResponse {
    int32 deleted = 1;
    int32 failed = 2;
    repeated VectorBatchError errors = 3;
}

// VectorListRequest returns a paginated list of vectors.
message VectorListRequest {
    string namespace = 1;
    int32 limit = 2;
    int32 offset = 3;
    string cursor = 4;
    uint64 shard_id = 5;
}

// VectorListResponse contains a paginated list of vectors.
message VectorListResponse {
    repeated VectorDataProto vectors = 1;
    string next_cursor = 2;
    int64 total = 3;
}

// VectorUpdateMetadataRequest updates vector metadata without modifying data.
message VectorUpdateMetadataRequest {
    string namespace = 1;
    string id = 2;
    string metadata_json = 3;
    uint64 shard_id = 4;
}

// ---------------------------------------------------------------------------
// Vector search messages
// ---------------------------------------------------------------------------

// VectorSearchResultProto is a single result from a similarity search.
message VectorSearchResultProto {
    string id = 1;
    double score = 2;
    repeated float vector = 3;
    string metadata_json = 4;
}

// VectorSearchSimilarRequest performs k-nearest-neighbor search.
message VectorSearchSimilarRequest {
    string namespace = 1;
    repeated float vector = 2;
    int32 k = 3;
    int32 ef_search = 4;
    double min_score = 5;
    ConsistencyLevel consistency = 6;
    uint64 shard_id = 7;
}

// VectorSearchSimilarResponse contains similarity search results.
message VectorSearchSimilarResponse {
    repeated VectorSearchResultProto results = 1;
    int64 took = 2;
}

// VectorSearchByMetadataRequest returns vectors matching metadata filters.
message VectorSearchByMetadataRequest {
    string namespace = 1;
    string filters_json = 2;
    int32 limit = 3;
    int32 offset = 4;
    ConsistencyLevel consistency = 5;
    uint64 shard_id = 6;
}

// VectorSearchByMetadataResponse contains metadata search results.
message VectorSearchByMetadataResponse {
    repeated VectorDataProto results = 1;
    int64 total = 2;
}

// VectorHybridSearchRequest combines vector similarity and metadata filtering.
message VectorHybridSearchRequest {
    string namespace = 1;
    repeated float vector = 2;
    string metadata_filters_json = 3;
    int32 k = 4;
    double vector_weight = 5;
    double metadata_weight = 6;
    ConsistencyLevel consistency = 7;
    uint64 shard_id = 8;
}

// VectorHybridSearchResponse contains hybrid search results.
message VectorHybridSearchResponse {
    repeated VectorSearchResultProto results = 1;
    int64 took = 2;
}

// VectorSearchByIDRequest searches using an existing vector's ID.
message VectorSearchByIDRequest {
    string namespace = 1;
    string id = 2;
    int32 k = 3;
    ConsistencyLevel consistency = 4;
    uint64 shard_id = 5;
}

// ---------------------------------------------------------------------------
// Vector index management messages
// ---------------------------------------------------------------------------

// VectorRebuildIndexRequest triggers an asynchronous index rebuild.
message VectorRebuildIndexRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorRebuildIndexResponse is the result of an index rebuild request.
message VectorRebuildIndexResponse {
    string job_id = 1;
    bool started = 2;
    int64 timestamp = 3;
}

// VectorGetRebuildProgressRequest queries rebuild progress.
message VectorGetRebuildProgressRequest {
    string namespace = 1;
    string job_id = 2;
    uint64 shard_id = 3;
}

// VectorRebuildProgress describes the current state of a rebuild job.
message VectorRebuildProgress {
    string job_id = 1;
    string status = 2;
    double progress = 3;
    int64 started_at = 4;
    int64 finished_at = 5;
    string error = 6;
}

// VectorGetIndexStatsRequest queries index statistics.
message VectorGetIndexStatsRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorIndexStats describes the current state of a namespace's vector index.
message VectorIndexStats {
    int64 vector_count = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    int64 memory_usage = 5;
    int64 disk_usage = 6;
}

// ---------------------------------------------------------------------------
// Vector compaction messages
// ---------------------------------------------------------------------------

// VectorCompactNamespaceRequest triggers asynchronous namespace compaction.
message VectorCompactNamespaceRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorCompactNamespaceResponse is the result of a compaction request.
message VectorCompactNamespaceResponse {
    string job_id = 1;
    bool started = 2;
}

// VectorGetCompactionProgressRequest queries compaction progress.
message VectorGetCompactionProgressRequest {
    string namespace = 1;
    string job_id = 2;
    uint64 shard_id = 3;
}

// VectorCompactionProgress describes the current state of a compaction job.
message VectorCompactionProgress {
    string job_id = 1;
    string status = 2;
    double progress = 3;
    int64 started_at = 4;
    int64 finished_at = 5;
    string error = 6;
}

// ===========================================================================
// User management messages
// ===========================================================================

// CreateUserRequest creates a new passwordless user.
message CreateUserRequest {
    string tenant_id = 1;
    string username = 2;
    repeated string role_ids = 3;
    // email is the canonical tenant-unique login key.
    string email = 4;
    // name is the display name; presentation only.
    string name = 5;
    // without_email_login_key creates a user that has no email login key and so
    // cannot be resolved by GetUserByEmail — a certificate-only or bootstrap
    // identity. It exists so the omission is declared rather than defaulted.
    bool without_email_login_key = 6;
    // group_ids are opaque group-membership identifiers. qrdb stores the
    // membership edge and owns no Group entity.
    repeated string group_ids = 7;
    // auth_methods are the permitted authentication methods ("webauthn",
    // "piv"). Empty states no restriction.
    repeated string auth_methods = 8;
    // lifecycle is the state to create the account in. Empty defaults to
    // "active", or "pending" when pending is set. Only pending, active and
    // disabled may be created directly.
    string lifecycle = 9;
    // pending is the shorthand for lifecycle "pending". Setting both is
    // refused unless they agree.
    bool pending = 10;
}

// GetUserRequest retrieves a user by ID.
message GetUserRequest {
    uint64 id = 1;
}

// GetUserByUsernameRequest retrieves a user by tenant-scoped username.
message GetUserByUsernameRequest {
    string tenant_id = 1;
    string username = 2;
}

// GetUserByEmailRequest resolves a user by tenant-scoped email — the canonical
// login key. The tenant is required: an email is unique within a tenant, not
// globally, so a lookup without one is ambiguous by construction.
message GetUserByEmailRequest {
    string tenant_id = 1;
    string email = 2;
}

// GetUserByCertThumbprintRequest resolves a user by an mTLS certificate's
// SPKI thumbprint via the secondary index.
message GetUserByCertThumbprintRequest {
    string thumbprint = 1;
}

// AddCertBindingRequest binds an mTLS certificate's SPKI thumbprint to a user.
// A not_after_unix > 0 sets the binding's expiry; otherwise it never expires.
message AddCertBindingRequest {
    uint64 user_id = 1;
    string thumbprint = 2;
    int64 not_after_unix = 3;
}

// UpdateUserProtoRequest applies partial updates to an existing user.
// Named with "Proto" suffix to avoid collision with the Go domain type.
message UpdateUserProtoRequest {
    uint64 id = 1;
    string username = 2;
    repeated string role_ids = 3;
    // email replaces the canonical login key when non-empty.
    string email = 4;
    // name replaces the display name when non-empty.
    string name = 5;
    // group_ids replaces the group memberships when present. Because proto3
    // cannot distinguish an absent repeated field from an empty one, the
    // has_group_ids flag carries the nil-vs-empty distinction the domain
    // request needs: absent means "leave alone", present-and-empty means
    // "clear".
    repeated string group_ids = 6;
    bool has_group_ids = 7;
    // auth_methods replaces the permitted methods when present; has_auth_methods
    // carries nil-vs-empty for the same reason as group_ids.
    repeated string auth_methods = 8;
    bool has_auth_methods = 9;
    // lifecycle transitions the account when non-empty. Checked against the
    // transition table; nothing moves out of "deleting".
    string lifecycle = 10;
    // last_auth_unix raises the last-successful-authentication high-water mark
    // when > 0. Seconds since the epoch, UTC. A value at or before the stored
    // one writes nothing.
    int64 last_auth_unix = 11;
}

// DeleteUserRequest removes a user by ID.
message DeleteUserRequest {
    uint64 id = 1;
}

// ListUsersRequest returns a paginated list of users.
message ListUsersRequest {
    string tenant_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// ListUsersResponse holds the paginated user list.
message ListUsersResponse {
    repeated UserResponse users = 1;
    int32 total = 2;
    bool has_more = 3;
}

// EnableUserRequest activates a user account.
message EnableUserRequest {
    uint64 id = 1;
}

// DisableUserRequest deactivates a user account.
message DisableUserRequest {
    uint64 id = 1;
}

// UserResponse is the response payload for user operations.
message UserResponse {
    uint64 id = 1;
    string tenant_id = 2;
    string username = 3;
    repeated string role_ids = 4;
    bool enabled = 5;
    bool system = 6;
    string created_at = 7;
    string updated_at = 8;
    // email is the canonical tenant-unique login key. Empty for system users.
    string email = 9;
    // name is the display name. Presentation only; never a lookup key.
    string name = 10;
    // lifecycle is the canonical account state: pending, active, suspended,
    // locked, disabled or deleting. `enabled` is a derived projection of it
    // (exactly lifecycle == "active") and cannot distinguish a suspended
    // account from a locked or pending one, so a client that needs the
    // distinction reads this.
    string lifecycle = 11;
    // group_ids are opaque group-membership identifiers.
    repeated string group_ids = 12;
    // auth_methods are the permitted authentication methods.
    repeated string auth_methods = 13;
    // last_auth_unix is the last successful authentication, seconds since the
    // epoch UTC. Zero when the account has never authenticated.
    int64 last_auth_unix = 14;
}

// ===========================================================================
// Role management messages
// ===========================================================================

// CreateRoleRequest creates a new role.
message CreateRoleRequest {
    string tenant_id = 1;
    string name = 2;
    repeated string permissions = 3;
    // id is an optional pre-assigned deterministic identifier. When empty,
    // the server generates a random UUID (preserving legacy behavior).
    string id = 4;
}

// GetRoleRequest retrieves a role by ID.
message GetRoleRequest {
    string id = 1;
}
message GetRoleByNameRequest {
    string tenant_id = 1;
    string name = 2;
}
message ResolveRolePermissionsRequest {
    repeated string role_ids = 1;
}
message ResolveRolePermissionsResponse {
    repeated string permissions = 1;
}

// ReconcileBuiltInRolesRequest names the tenant to converge.
message ReconcileBuiltInRolesRequest {
    // tenant_id is the tenant to reconcile. Empty means the caller's own
    // effective tenant.
    string tenant_id = 1;
}

// RoleReconcileResult records what reconciliation changed for one built-in
// role. Only changed roles are reported.
message RoleReconcileResult {
    string role_id = 1;
    string name = 2;
    // created is true when the built-in was absent and was seeded; added then
    // holds its whole permission set.
    bool created = 3;
    repeated string added = 4;
    repeated string removed = 5;
}

// ReconcileBuiltInRolesResponse is the per-tenant reconciliation report. An
// empty roles list means the tenant already agreed with the build.
message ReconcileBuiltInRolesResponse {
    string tenant_id = 1;
    repeated RoleReconcileResult roles = 2;
}

// UpdateRoleProtoRequest applies partial updates to an existing role.
// Named with "Proto" suffix to avoid collision with the Go domain type.
message UpdateRoleProtoRequest {
    string id = 1;
    string name = 2;
    repeated string permissions = 3;
}

// DeleteRoleRequest removes a role by ID.
message DeleteRoleRequest {
    string id = 1;
}

// ListRolesRequest returns a paginated list of roles.
message ListRolesRequest {
    string tenant_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// ListRolesResponse holds the paginated role list.
message ListRolesResponse {
    repeated RoleResponse roles = 1;
    int32 total = 2;
    bool has_more = 3;
}

// AssignRoleRequest assigns a role to a user.
message AssignRoleRequest {
    uint64 user_id = 1;
    string role_id = 2;
}

// UnassignRoleRequest removes a role assignment from a user.
message UnassignRoleRequest {
    uint64 user_id = 1;
    string role_id = 2;
}

// RoleResponse is the response payload for role operations.
message RoleResponse {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    repeated string permissions = 4;
    bool system = 5;
    string created_at = 6;
    string updated_at = 7;
    // retired_permissions are the members of permissions this build no longer
    // defines. Derived on read from the live permission registry, never
    // stored: it is drift between what the tenant was seeded with and what the
    // server now grants, visible before ReconcileBuiltInRoles repairs it.
    repeated string retired_permissions = 8;
}

// PermissionCategory groups related permissions under a display name.
message PermissionCategory {
    string name = 1;
    string group = 2;
    repeated string permissions = 3;
}

// ListPermissionsResponse holds all permission categories.
message ListPermissionsResponse {
    repeated PermissionCategory categories = 1;
}

// ===========================================================================
// Certificate management messages
// ===========================================================================

// GenerateCertRequest creates a client certificate.
message GenerateCertRequest {
    string username = 1;
    string tenant_id = 2;
    string ttl = 3;
}

// CertBundleResponse holds the generated certificate bundle.
message CertBundleResponse {
    string cert_pem = 1;
    string key_pem = 2;
    string serial = 3;
}

// ExportCertRequest exports a certificate as PKCS#12.
message ExportCertRequest {
    string cert_pem = 1;
    string key_pem = 2;
    string passphrase = 3;
}

// ExportCertResponse holds the base64-encoded PKCS#12 archive.
message ExportCertResponse {
    string pkcs12 = 1;
}

// RevokeCertRequest marks a certificate serial as revoked.
message RevokeCertRequest {
    string serial = 1;
}

// RevokeCertResponse reports what RevokeCert did. record_found
// distinguishes a certificate the node holds a CertRecord for from a
// deny-by-serial revocation of one it does not -- both are successes,
// which is why the distinction is carried here rather than as an error.
message RevokeCertResponse {
    bool record_found = 1;
}

// ListCertsRequest lists all issued certificates for a tenant.
message ListCertsRequest {
    string tenant_id = 1;
}

// CertRecord is the metadata for an issued certificate.
message CertRecord {
    string serial = 1;
    string username = 2;
    string tenant_id = 3;
    string issued_at = 4;
    string expires_at = 5;
    bool revoked = 6;
}

// ListCertsResponse holds a list of issued certificate records.
message ListCertsResponse {
    repeated CertRecord certs = 1;
}

// ===========================================================================
// Collection messages
// ===========================================================================

// CreateCollectionRequest contains parameters for creating a collection.
message CreateCollectionRequest {
    string database = 1;
    string name = 2;
    string id_strategy = 3;
    string field_hash = 4;
}

// GetCollectionInfoRequest retrieves metadata for a specific collection.
message GetCollectionInfoRequest {
    string database = 1;
    string name = 2;
}

// ListCollectionsRequest lists all collections in a database.
message ListCollectionsRequest {
    string database = 1;
}

// DropCollectionRequest removes a collection and all its documents.
message DropCollectionRequest {
    string database = 1;
    string name = 2;
}

// CollectionInfoResponse holds metadata about a collection.
message CollectionInfoResponse {
    string name = 1;
    string database = 2;
    string id_strategy = 3;
    string field_hash = 4;
    map<string, string> schema = 5;
    int64 document_count = 6;
    string created_at = 7;
}

// ListCollectionsResponse holds a list of collection metadata.
message ListCollectionsResponse {
    repeated CollectionInfoResponse collections = 1;
}

// InsertDocumentRequest inserts a document into a collection.
message InsertDocumentRequest {
    string database = 1;
    string collection = 2;
    string document = 3;
}

// InsertDocumentResponse holds the ID of the inserted document.
message InsertDocumentResponse {
    uint64 id = 1;
}

// GetDocumentRequest retrieves a document by ID.
message GetDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
}

// DocumentResponse holds a document and its ID.
message DocumentResponse {
    uint64 id = 1;
    string document = 2;
}

// UpdateDocumentRequest replaces an existing document.
message UpdateDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
    string document = 4;
}

// DeleteDocumentRequest removes a document by ID.
message DeleteDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
}

// ListDocumentsRequest retrieves a paginated list of documents.
message ListDocumentsRequest {
    string database = 1;
    string collection = 2;
    int32 page_size = 3;
    string page_token = 4;
}

// ListDocumentsResponse holds a page of documents.
message ListDocumentsResponse {
    repeated DocumentResponse documents = 1;
    string next_page_token = 2;
    int64 total_count = 3;
}

// ===========================================================================
// Database management messages
// ===========================================================================

// DatabaseCreateRequest contains parameters for creating a new database.
message DatabaseCreateRequest {
    string name = 1;
    string engine = 2;
    string backend = 3;
    string data_dir = 4;
    DatabaseProtocolConfig protocol = 5;
    DatabaseRaftConfig raft = 6;
    // replicas is the requested replication factor for a dedicated-raft
    // database. Meaningful only for raft-backed databases; ignored otherwise.
    // Unset (0) defaults to 1 replica.
    uint32 replicas = 7;
    // barrier, when set with enabled=true, bootstraps the database's
    // encryption barrier at creation time using the embedded secret /
    // strategy / threshold / total. See DatabaseBarrierConfig.
    DatabaseBarrierConfig barrier = 8;
}

// DatabaseGetRequest retrieves information about a specific database.
message DatabaseGetRequest {
    string name = 1;
}

// DatabaseDropRequest removes a database by name.
message DatabaseDropRequest {
    string name = 1;
}

// DatabaseListResponse holds a list of database information entries.
message DatabaseListResponse {
    repeated DatabaseInfoResponse databases = 1;
}

// DatabaseInfoResponse holds runtime information about a database.
message DatabaseInfoResponse {
    string name = 1;
    string engine = 2;
    string backend = 3;
    string status = 4;
    DatabaseProtocolConfig protocol = 5;
    string data_dir = 6;
    uint64 shard_id = 7;
    string mode = 8;
    DatabaseRaftConfig raft = 9;
    DatabaseBarrierConfig barrier = 10;
    DatabaseConnectionConfig connection = 11;
    string tenant_id = 12;
    // replicas is the replication factor of a dedicated-raft database. Zero for
    // non-raft databases.
    uint32 replicas = 13;
}

// DatabaseProtocolConfig holds wire protocol settings for a database.
message DatabaseProtocolConfig {
    bool mysql = 1;
    bool postgresql = 2;
    DatabaseEtcdConfig etcd = 3;
}

// DatabaseEtcdConfig holds etcd wire protocol settings.
message DatabaseEtcdConfig {
    bool enabled = 1;
    string listen_addr = 2;
    repeated string advertise_client_urls = 3;
}

// DatabaseRaftConfig holds Raft consensus settings for a database.
message DatabaseRaftConfig {
    string cluster_mode = 1;
    uint64 shard_id = 2;
    uint64 replica_id = 3;
    string raft_address = 4;
    repeated string peers = 5;
    int32 local_node_count = 6;
    string discovery = 7;
    DatabaseStaticDiscovery static = 8;
    DatabaseMulticastDiscovery multicast = 9;
    DatabaseDNSDiscovery dns = 10;
    DatabaseTokenDiscovery token = 11;
}

// DatabaseStaticDiscovery holds static peer discovery configuration.
message DatabaseStaticDiscovery {
    repeated string peers = 1;
    string shared_secret = 2;
}

// DatabaseMulticastDiscovery holds multicast peer discovery configuration.
message DatabaseMulticastDiscovery {
    string shared_secret = 1;
    string multicast_group = 2;
    string iface = 3 [json_name = "interface"];
    int32 min_peers = 4;
    string announce_interval = 5;
    string discover_timeout = 6;
}

// DatabaseDNSDiscovery holds DNS SRV record peer discovery configuration.
message DatabaseDNSDiscovery {
    string service = 1;
    string proto = 2;
    string domain = 3;
    string lookup_timeout = 4;
}

// DatabaseTokenDiscovery holds token-based discovery configuration.
message DatabaseTokenDiscovery {
    string endpoint = 1;
    string token = 2;
    int32 cluster_size = 3;
    string timeout = 4;
}

// DatabaseBarrierConfig holds encryption barrier settings.
// secret, mode, shares_required, and shares_total are only meaningful on
// DatabaseCreateRequest (initial barrier bootstrap); they are ignored by
// DatabaseUpdateBarrierRequest, which only toggles enabled. secret is never
// persisted server-side and is zeroed as soon as it is copied into the
// seal.Credentials passed to EnsureBarrier.
message DatabaseBarrierConfig {
    bool enabled = 1;
    // mode is the target keyed strategy: "passphrase" or "shamir".
    string mode = 2;
    // shares_required is the Shamir threshold (M of N).
    int32 shares_required = 3;
    // shares_total is the total Shamir share count (N).
    int32 shares_total = 4;
    // secret is the barrier passphrase/credential for the initial
    // Initialize call. Create-time only; never echoed back.
    string secret = 5;
}

// DatabaseConnectionConfig holds remote connection settings.
message DatabaseConnectionConfig {
    string remote_address = 1;
    bool use_tls = 2;
    string transport = 3;
    string ca_file = 4;
    string cert_file = 5;
    string key_file = 6;
}

// DatabaseUpdateProtocolRequest updates the wire protocol configuration.
message DatabaseUpdateProtocolRequest {
    string name = 1;
    bool mysql = 2;
    bool postgresql = 3;
}

// DatabaseUpdateEtcdRequest updates the etcd wire protocol configuration.
message DatabaseUpdateEtcdRequest {
    string name = 1;
    bool enabled = 2;
    string listen_addr = 3;
    repeated string advertise_client_urls = 4;
}

// DatabaseUpdateRaftRequest updates the Raft consensus configuration.
message DatabaseUpdateRaftRequest {
    string name = 1;
    DatabaseRaftConfig raft = 2;
}

// DatabaseScaleRequest changes the replication factor of an existing
// dedicated-raft database.
message DatabaseScaleRequest {
    string name = 1;
    int32 target_replicas = 2;
}

// DatabaseUpdateBarrierRequest updates the encryption barrier configuration.
message DatabaseUpdateBarrierRequest {
    string name = 1;
    DatabaseBarrierConfig barrier = 2;
}

// DatabaseUpdateConnectionRequest updates the remote connection configuration.
message DatabaseUpdateConnectionRequest {
    string name = 1;
    DatabaseConnectionConfig connection = 2;
}

// ===========================================================================
// Barrier messages
// ===========================================================================

// BarrierInitializeRequest initializes the barrier with a single master key.
//
// secret is the strategy wrapping passphrase. so_pin and user_pin, when
// supplied, are routed to the canonical pin.PINBackend on the server.
// They are independent of and complementary to secret: secret protects
// the wrapping key; the PINs gate two-PIN authorization on administrative
// operations.
//
// secret is `bytes`, not `string`, so the generated Go field is a []byte the
// caller can zeroize after the call. proto3 encodes string and bytes
// identically (length-delimited), so this is a source-level change only and
// the wire format is unchanged.
message BarrierInitializeRequest {
    bytes secret = 1;
    string so_pin = 2;
    string user_pin = 3;
}

// BarrierUnsealRequest unseals the barrier with a master key. secret is
// `bytes` so callers can zeroize it; see BarrierInitializeRequest.
message BarrierUnsealRequest {
    bytes secret = 1;
}

// BarrierStatusResponse describes the current barrier state.
// shamir_threshold and shamir_total carry the configured M-of-N quorum
// when the barrier uses the Shamir strategy and are zero otherwise.
message BarrierStatusResponse {
    bool sealed = 1;
    string strategy = 2;
    bool hardware_backed = 3;
    string initialized_at = 4;
    int32 shamir_threshold = 5;
    int32 shamir_total = 6;
}

// BarrierEnableEncryptionRequest migrates a barrier from none to a keyed
// strategy. tenant_id, when set, scopes the migration to that tenant's
// dedicated barrier; empty means the system barrier (admin scope).
// passphrase is `bytes` so callers can zeroize it.
message BarrierEnableEncryptionRequest {
    string tenant_id = 1;
    string strategy = 2;      // "passphrase" or "shamir"
    string mechanism = 3;     // "swap" (default) or "in-place"
    string availability = 4;  // "quiesced" (default) or "online"
    bytes passphrase = 5;
    int32 shamir_threshold = 6;
    int32 shamir_total = 7;
}

// BarrierEnableEncryptionResponse acknowledges that the migration has started.
message BarrierEnableEncryptionResponse {
    string status = 1; // e.g. "migration_started"
    string scope = 2;  // "system" or "tenant"
}

// BarrierShamirInitializeRequest initializes the barrier with Shamir secret sharing.
//
// secret is the strategy wrapping passphrase and is `bytes` so callers can
// zeroize it. so_pin and user_pin, when supplied, are routed to the canonical
// pin.PINBackend on the server.
message BarrierShamirInitializeRequest {
    bytes secret = 1;
    int32 threshold = 2;
    int32 total_shares = 3;
    string so_pin = 4;
    string user_pin = 5;
}

// BarrierShamirOperationResponse is the share-free result of a Shamir
// initialization or rekey. Raw share bytes are never returned; shares are
// distributed directly to enrolled Security Officers via the claim flow.
message BarrierShamirOperationResponse {
    reserved 1;
    reserved "shares";
    int32 threshold   = 2;
    int32 total_shares = 3;
    int32 share_count  = 4;
}

// BarrierShamirUnsealShareRequest submits a single Shamir share.
message BarrierShamirUnsealShareRequest {
    string share = 1;
}

// BarrierShamirUnsealShareResponse reports unseal progress.
message BarrierShamirUnsealShareResponse {
    int32 required = 1;
    int32 submitted = 2;
    bool complete = 3;
}

// BarrierShamirUnsealSharesRequest submits multiple Shamir shares.
message BarrierShamirUnsealSharesRequest {
    repeated string shares = 1;
}

// BarrierRekeyRequest generates new Shamir shares.
//
// so_pin is the optional Security Officer PIN required for the rekey
// administrative operation when the server has a pin.PINBackend
// configured with a SO PIN set. When the backend is unconfigured or no
// SO PIN has been set, this field is ignored (preserves dev-mode flows).
//
// Field 4 (new_secret) was a dead passphrase-rotation field the server
// never read; rekey is Shamir-only and derives everything server-side.
message BarrierRekeyRequest {
    reserved 4;
    reserved "new_secret";
    int32 threshold = 1;
    int32 total = 2;
    string so_pin = 3;
}

// BarrierRecoveryGenerateRequest generates recovery keys.
//
// so_pin is the optional Security Officer PIN required for the recovery
// key generation administrative operation when the server has a
// pin.PINBackend configured with a SO PIN set.
message BarrierRecoveryGenerateRequest {
    int32 threshold = 1;
    int32 total = 2;
    string so_pin = 3;
}

// BarrierRecoveryKeysResponse is the share-free result of recovery key
// generation. Raw share bytes are never returned; shares are distributed
// directly to enrolled recovery Security Officers via the claim flow.
message BarrierRecoveryKeysResponse {
    reserved 1;
    reserved "keys";
    int32 threshold   = 2;
    int32 total       = 3;
    int32 share_count = 4;
}

// BarrierOfficerRegisterRequest carries the parameters for registering a new
// Security Officer against the system barrier.
message BarrierOfficerRegisterRequest {
    string username           = 1;
    bytes  csr_pem            = 2;
    string authenticator_type = 3;
    string authenticator_ref  = 4;
}

// BarrierOfficerRegisterResponse carries the signed certificate for the newly
// registered Security Officer.
message BarrierOfficerRegisterResponse {
    bytes cert_pem   = 1;
    int32 share_index = 2;
}

// BarrierOfficerListResponse carries the list of registered Security Officers
// for the system barrier.
message BarrierOfficerListResponse {
    repeated OfficerStatus officers = 1;
}

// OfficerStatus is a non-secret view of an enrolled Security Officer. No share
// material is present.
message OfficerStatus {
    string username        = 1;
    string cert_thumbprint = 2;
    int32  share_index     = 3;
    string auth_factor     = 4;
    string enrolled_at     = 5;  // RFC3339
    string claimed_at      = 6;  // RFC3339; empty = unclaimed
    bool   share_pending   = 7;
}

// BarrierShareClaimBeginRequest starts the share claim handshake for the
// named Security Officer.
message BarrierShareClaimBeginRequest {
    string username = 1;
}

// BarrierShareClaimBeginResponse carries the challenge nonce for the SO to sign.
message BarrierShareClaimBeginResponse {
    string nonce_hex  = 1;
    string expires_at = 2;  // RFC3339
}

// BarrierShareClaimCompleteRequest carries the signed nonce to complete the
// share claim handshake.
message BarrierShareClaimCompleteRequest {
    string username  = 1;
    string nonce_hex = 2;
    bytes  signature = 3;
}

// BarrierShareClaimCompleteResponse carries the SO's share bytes. This is the
// ONLY proto message that contains share_bytes on the wire.
message BarrierShareClaimCompleteResponse {
    int32 share_index = 1;
    bytes share_bytes = 2;
}

// BarrierShamirSealVoteRequest carries a Shamir share submitted as a seal vote.
message BarrierShamirSealVoteRequest {
    string share = 1;
}

// BarrierShamirSealVoteResponse reports the quorum progress of a seal vote.
message BarrierShamirSealVoteResponse {
    int32 required  = 1;
    int32 submitted = 2;
    bool  complete  = 3;
}

// BarrierOfficerClaimStatusResponse carries per-officer claim status for the
// system barrier. Never includes share bytes.
message BarrierOfficerClaimStatusResponse {
    repeated OfficerStatus officers = 1;
}

// BarrierRecoveryRecoverRequest unseals the barrier using recovery keys.
message BarrierRecoveryRecoverRequest {
    repeated string keys = 1;
}

// BarrierRecoveryStatusResponse indicates whether recovery keys exist.
message BarrierRecoveryStatusResponse {
    bool has_recovery_keys = 1;
}

// BarrierRootTokenRequest generates a root token using Shamir shares.
message BarrierRootTokenRequest {
    repeated string shares = 1;
}

// BarrierRootTokenResponse returns a newly generated root token.
message BarrierRootTokenResponse {
    string token = 1;
    string created_at = 2;
}

// ===========================================================================
// Ceremony messages
// ===========================================================================

// CeremonyOfficer describes a single officer for M-of-N initialization.
message CeremonyOfficer {
    string username = 1;
    string csr_pem = 2;
}

// CeremonyInitializeRequest starts the initialization ceremony.
message CeremonyInitializeRequest {
    string so_pin = 1;
    string user_pin = 2;
    int32 threshold = 3;
    string credential_seal_strategy = 4;
    repeated CeremonyOfficer officers = 5;
    string hostname = 6;
    repeated string sans = 7;
}

// CeremonyInitializeResponse returns the result of ceremony initialization.
message CeremonyInitializeResponse {
    string spki_pin = 1;
    string ca_cert_pem = 2;
    string tls_cert_pem = 3;
    reserved 4, 5;
    reserved "so_cert_pem", "so_key_pem";
    string state = 6;
    int32 share_count = 7;
}

// CeremonyStatusResponse describes the current ceremony state.
message CeremonyStatusResponse {
    string state = 1;
    string spki_pin = 2;
}

// CeremonyClaimCertBeginRequest starts a certificate claim challenge.
message CeremonyClaimCertBeginRequest {
    string username = 1;
}

// CeremonyClaimCertBeginResponse returns the challenge nonce.
message CeremonyClaimCertBeginResponse {
    string nonce_hex = 1;
    string expires_at = 2;
}

// CeremonyClaimCertCompleteRequest completes a certificate claim.
message CeremonyClaimCertCompleteRequest {
    string username = 1;
    string nonce_hex = 2;
    string signature = 3;
}

// CeremonyClaimCertCompleteResponse returns the issued certificate.
message CeremonyClaimCertCompleteResponse {
    string cert_pem = 1;
    string ca_cert_pem = 2;
}

// CeremonyBeginClaimShareRequest starts the Shamir share claim handshake for
// the named officer. No thumbprint travels on the wire: the server derives it
// from the caller's mTLS peer certificate so a client cannot assert one.
message CeremonyBeginClaimShareRequest {
    string username = 1;
}

// CeremonyBeginClaimShareResponse carries the challenge nonce the officer
// must sign with the private key matching their enrolled certificate.
message CeremonyBeginClaimShareResponse {
    string nonce_hex  = 1;
    string expires_at = 2;  // RFC3339
}

// CeremonyCompleteClaimShareRequest carries the signed nonce completing the
// Shamir share claim handshake.
message CeremonyCompleteClaimShareRequest {
    string username  = 1;
    string nonce_hex = 2;
    bytes  signature = 3;
}

// CeremonyCompleteClaimShareResponse returns the officer's Shamir share. The
// share is released exactly once and only over the officer's own mTLS session.
message CeremonyCompleteClaimShareResponse {
    int32  share_index = 1;
    string share       = 2;
}

// CeremonySignCSRRequest submits a CSR for signing during the ceremony.
message CeremonySignCSRRequest {
    string username = 1;
    string so_pin = 2;
    string csr_pem = 3;
    string role = 4;
}

// CeremonySignCSRResponse returns the signed certificate.
message CeremonySignCSRResponse {
    string cert_pem = 1;
}

// CeremonyEnrollExternalOfficerRequest requests enrolment of an external
// officer whose key material lives outside go-qrdb.
message CeremonyEnrollExternalOfficerRequest {
    string username    = 1;
    string cert_pem    = 2;
    string pubkey_pem  = 3;
    int32  share_index = 4;
    string auth_factor = 5;
    bytes  share_bytes = 6;
}

// CeremonyEnrollExternalOfficerResponse returns the sealed share envelope.
message CeremonyEnrollExternalOfficerResponse {
    string sealed_share = 1;
}

// ===========================================================================
// Tenant messages
// ===========================================================================

// TenantQuotas holds per-tenant resource limits. -1 means unlimited, 0 means
// use the system default.
message TenantQuotas {
    int64 max_databases     = 1;
    int64 max_raft_groups   = 2;
    int64 max_collections   = 3;
    int64 max_keys          = 4;
    int64 max_storage_bytes = 5;
    int64 max_users         = 6;
    int64 max_roles         = 7;
    int64 max_certificates  = 8;
    int64 max_backups       = 9;
    int64 max_vector_dims   = 10;
    int64 max_ts_metrics    = 11;
    int64 max_database_size_bytes = 12;
    // max_replicas_per_group caps the replication factor of any single
    // dedicated-raft database. max_total_replicas caps the aggregate replicas a
    // tenant may hold across all of its raft groups. -1 = unlimited; 0 = default.
    int64 max_replicas_per_group = 13;
    int64 max_total_replicas = 14;
    // system_barrier_quota governs an isolated tenant's use of the shared system
    // barrier (bytes): 0 makes the option unavailable, -1 unlimited, >0 a cap.
    int64 system_barrier_quota = 15;
    // max_dedicated_wal_groups caps the number of dedicated-raft groups a tenant
    // may grant a dedicated WAL. -1 = unlimited; 0 = default (no dedicated WAL).
    int64 max_dedicated_wal_groups = 16;
}

// TenantEntitlements describes which isolation tiers and dedicated-storage
// features a tenant's plan permits.
message TenantEntitlements {
    repeated string allowed_isolation_modes = 1;
    bool allow_dedicated_raft               = 2;
    bool allow_volume_storage               = 3;
    // allow_system_managed_barrier permits a tenant to opt into the
    // system-managed auto-unseal key-management mode for its dedicated barrier.
    bool allow_system_managed_barrier       = 4;
    // allowed_barrier_modes lists the dedicated-barrier sealing strategies the
    // isolated tenant may select (none/passphrase/shamir or an xkms hardware id).
    repeated string allowed_barrier_modes   = 5;
    // allow_dedicated_wal permits a tenant to opt a dedicated-raft database into
    // a dedicated WAL group (requires the allow_dedicated_raft entitlement).
    bool allow_dedicated_wal                = 6;
}

// TenantResponse is the shared response shape for tenant CRUD operations.
message TenantResponse {
    string       id             = 1;
    string       name           = 2;
    string       isolation_type = 3;
    TenantQuotas quotas         = 4;
    string       created_at     = 5;
    string       updated_at     = 6;
    TenantEntitlements entitlements = 7;
    // data_root is the dedicated filesystem root for an IsolationVolume /
    // IsolationRaft tenant, whether pool-allocated or pinned via
    // TenantCreateRequest.data_root. Empty for prefix/barrier tenants.
    string data_root = 8;
}

// TenantCreateRequest creates a new tenant.
message TenantCreateRequest {
    string id             = 1;
    string name           = 2;
    string isolation_type = 3;
    // barrier_auto_unseal opts a dedicated-isolation tenant (barrier/volume)
    // into the system-managed auto-unseal key-management mode. The default
    // (false) is the secure self-managed mode. Entitlement-gated.
    bool barrier_auto_unseal = 4;
    // data_root pins an IsolationVolume/IsolationRaft tenant's dedicated
    // filesystem DataRoot to this operator-supplied absolute path instead of
    // pool allocation. Empty (the default) allocates from the configured
    // volume pool. Rejected for prefix/barrier isolation.
    string data_root = 5;
}

// TenantGetRequest retrieves a tenant by ID.
message TenantGetRequest {
    string id = 1;
}

// TenantListResponse returns all tenants.
message TenantListResponse {
    repeated TenantResponse tenants = 1;
}

// TenantUpdateRequest applies a partial update to an existing tenant.
message TenantUpdateRequest {
    string id             = 1;
    string name           = 2;
    string isolation_type = 3;
}

// TenantDeleteRequest removes a tenant by ID.
message TenantDeleteRequest {
    string id = 1;
}

// TenantUpdateQuotasRequest sets the resource quotas for a tenant.
message TenantUpdateQuotasRequest {
    string       id     = 1;
    TenantQuotas quotas = 2;
}

// TenantUpdateEntitlementsRequest sets the feature entitlements for a tenant.
message TenantUpdateEntitlementsRequest {
    string             id           = 1;
    TenantEntitlements entitlements = 2;
}

// ===========================================================================
// Credential messages
// ===========================================================================

// CredentialSubmitRequest carries the named credential value to store. The
// value is bytes (not string) because credentials routinely carry non-UTF-8
// content (private keys, certificates, random tokens); proto3 string fields
// reject non-UTF-8 during marshal.
message CredentialSubmitRequest {
    string name  = 1;
    bytes  value = 2;
}

// CredentialStoreRequest carries the named credential value to persist. See
// CredentialSubmitRequest for why value is bytes.
message CredentialStoreRequest {
    string name  = 1;
    bytes  value = 2;
}

// CredentialRetrieveRequest identifies a credential to read by name.
message CredentialRetrieveRequest {
    string name = 1;
}

// CredentialRetrieveResponse carries the credential value for the named
// credential. value is bytes to preserve arbitrary binary content.
message CredentialRetrieveResponse {
    bytes value = 1;
}

// CredentialStrategyResponse describes the active credential management
// strategy.
message CredentialStrategyResponse {
    string strategy = 1;
}

// CredentialDeleteRequest identifies a credential to delete by name.
message CredentialDeleteRequest {
    string name = 1;
}

// CredentialListRequest is the request shape for credential enumeration.
// Currently empty; reserved for future filter fields (tenant, prefix, label).
message CredentialListRequest {}

// CredentialListResponse returns the sorted list of credential names.
message CredentialListResponse {
    repeated string names = 1;
}

// CredentialRotateRequest captures all inputs to a CredentialRotate call.
// grace_period_seconds == 0 means "no grace" — the previous value is wiped
// immediately.
message CredentialRotateRequest {
    string name                  = 1;
    bytes  new_value             = 2;
    int64  grace_period_seconds  = 3;
}

// CredentialRotateResponse describes the outcome of a rotation.
// grace_until_unix is zero when no previous version existed or when the
// caller specified grace_period_seconds == 0.
message CredentialRotateResponse {
    string name             = 1;
    uint64 previous_version = 2;
    uint64 new_version      = 3;
    int64  grace_until_unix = 4;
}

// CredentialRetrieveVersionRequest selects a specific version of a
// credential to retrieve. version == 0 means "current version".
message CredentialRetrieveVersionRequest {
    string name    = 1;
    uint64 version = 2;
}

// CredentialRetrieveVersionResponse carries the credential value for the
// requested version. value is bytes to preserve arbitrary binary content.
message CredentialRetrieveVersionResponse {
    bytes value = 1;
}

// CredentialListVersionsRequest identifies the credential whose version
// history is being requested.
message CredentialListVersionsRequest {
    string name = 1;
}

// CredentialVersionInfo is the wire-format version metadata entry. The
// value bytes are intentionally absent — use CredentialRetrieveVersion to
// read the bytes for a specific version.
message CredentialVersionInfo {
    uint64 version           = 1;
    bool   is_current        = 2;
    int64  created_at_unix   = 3;
    int64  grace_until_unix  = 4;
}

// CredentialListVersionsResponse returns one entry per non-expired version
// (current + grace history).
message CredentialListVersionsResponse {
    string                         name     = 1;
    repeated CredentialVersionInfo versions = 2;
}

// CredentialGCRequest names the credential whose expired grace versions
// should be reaped.
message CredentialGCRequest {
    string name = 1;
}

// CredentialGCResponse reports how many historical versions were reaped.
message CredentialGCResponse {
    int32 reaped = 1;
}

// ===========================================================================
// Backup messages
//
// compression is one of "none", "zstd", "snappy"; encryption is one of
// "none", "aes256"; status is one of "pending", "running", "complete",
// "failed". These mirror the string-typed service enums.
// ===========================================================================

// BackupCreateRequest describes a backup to capture. An empty shard_ids list
// backs up every shard on the host.
message BackupCreateRequest {
    string              destination    = 1;
    string              compression    = 2;
    string              encryption     = 3;
    bytes               encryption_key = 4;
    map<string, string> metadata       = 5;
    repeated uint64     shard_ids      = 6;
}

// BackupInfo is the metadata describing a stored backup artifact.
message BackupInfo {
    string              id            = 1;
    int64               timestamp_ns  = 2;
    int64               size          = 3;
    int32               shard_count   = 4;
    string              status        = 5;
    string              checksum      = 6;
    string              destination   = 7;
    string              compression   = 8;
    string              encryption    = 9;
    map<string, string> metadata      = 10;
    int64               duration_ns   = 11;
    string              error_message = 12;
}

// BackupListResponse enumerates stored backups. Artifact contents are never
// returned.
message BackupListResponse {
    repeated BackupInfo backups = 1;
}

// BackupGetRequest names a backup by ID.
message BackupGetRequest {
    string id = 1;
}

// BackupDeleteRequest names a backup to remove.
message BackupDeleteRequest {
    string id = 1;
}

// BackupRestoreRequest restores shards from a stored backup. An empty
// target_shards list restores every shard captured in the backup.
message BackupRestoreRequest {
    string          backup_id      = 1;
    repeated uint64 target_shards  = 2;
    bool            validate_first = 3;
    bytes           decryption_key = 4;
}

// ShardError reports a per-shard failure during restore.
message ShardError {
    uint64 shard_id = 1;
    string message  = 2;
}

// BackupRestoreResponse reports the outcome of a restore.
message BackupRestoreResponse {
    string              backup_id       = 1;
    int32               shards_restored = 2;
    int64               duration_ns     = 3;
    repeated ShardError errors          = 4;
}

// BackupVerifyRequest names a backup to verify.
message BackupVerifyRequest {
    string id = 1;
}

// BackupVerifyResponse reports backup integrity-check results.
message BackupVerifyResponse {
    bool            valid             = 1;
    bool            checksum_match    = 2;
    string          expected_checksum = 3;
    string          actual_checksum   = 4;
    repeated string errors            = 5;
}

// ===========================================================================
// Rebalance messages
// ===========================================================================

// RebalanceShardStatsRequest names a shard to inspect.
message RebalanceShardStatsRequest {
    uint64 shard_id = 1;
}

// ShardStats contains statistics for a single shard.
message ShardStats {
    uint64 shard_id      = 1;
    uint64 key_count     = 2;
    uint64 byte_count    = 3;
    uint64 leader_id     = 4;
    int32  replica_count = 5;
}

// RebalancePlanRequest parameterizes plan generation. max_moves == 0 means no
// limit; target_balance is a percentage (0-100).
message RebalancePlanRequest {
    int32  max_moves      = 1;
    bool   dry_run        = 2;
    double target_balance = 3;
}

// RebalanceMove describes a single planned shard move.
message RebalanceMove {
    uint64 shard_id        = 1;
    string from_node       = 2;
    string to_node         = 3;
    uint64 estimated_bytes = 4;
}

// RebalancePlan is the generated set of moves and its metadata. It is both the
// result of RebalanceCreatePlan and the input to RebalanceExecute.
message RebalancePlan {
    repeated RebalanceMove moves                 = 1;
    int64                  estimated_duration_ns = 2;
    double                 current_imbalance     = 3;
}

// RebalanceExecutionResponse reports the outcome of an executed plan.
message RebalanceExecutionResponse {
    int32  moves_completed = 1;
    int32  moves_failed    = 2;
    int64  duration_ns     = 3;
    double final_imbalance = 4;
}

// NodeLoad describes the load distribution on a single node.
message NodeLoad {
    string node_id      = 1;
    string address      = 2;
    int32  shard_count  = 3;
    uint64 total_keys   = 4;
    uint64 total_bytes  = 5;
    int32  leader_count = 6;
}

// ImbalanceReport describes the cluster's current load distribution.
message ImbalanceReport {
    repeated NodeLoad nodes           = 1;
    double            imbalance_score = 2;
    repeated string   hotspots        = 3;
}

// ===========================================================================
// Embedding messages
// ===========================================================================

// EmbeddingVector wraps a single embedding vector so a repeated field can
// model a [][]float matrix.
message EmbeddingVector {
    repeated float values = 1;
}

// EmbeddingUsage reports token consumption for an embedding request.
message EmbeddingUsage {
    int32 prompt_tokens = 1;
    int32 total_tokens  = 2;
}

// EmbeddingModelInfo describes a single embedding model.
message EmbeddingModelInfo {
    string name       = 1;
    int32  dimensions = 2;
    int32  max_tokens = 3;
}

// EmbedRequest embeds one or more texts. An empty provider/model selects the
// service default.
message EmbedRequest {
    repeated string texts    = 1;
    string          model    = 2;
    string          provider = 3;
}

// EmbedResponse returns one vector per input text, in input order.
message EmbedResponse {
    repeated EmbeddingVector embeddings = 1;
    string                   model      = 2;
    EmbeddingUsage           usage      = 3;
    bool                     cached     = 4;
}

// BatchEmbedRequest embeds a large set of texts. batch_size == 0 lets the
// service pick a default.
message BatchEmbedRequest {
    repeated string texts      = 1;
    string          model      = 2;
    string          provider   = 3;
    int32           batch_size = 4;
}

// BatchEmbedResponse returns one vector per input text, in input order.
message BatchEmbedResponse {
    repeated EmbeddingVector embeddings  = 1;
    string                   model       = 2;
    EmbeddingUsage           total_usage = 3;
}

// ListEmbeddingModelsRequest names a provider to query (empty = default).
message ListEmbeddingModelsRequest {
    string provider = 1;
}

// ListEmbeddingModelsResponse enumerates a provider's models.
message ListEmbeddingModelsResponse {
    repeated EmbeddingModelInfo models = 1;
}

// ===========================================================================
// RAG (retrieval-augmented generation) messages
// ===========================================================================

// ChunkConfig overrides the document chunking configuration.
message ChunkConfig {
    string strategy   = 1;
    int32  chunk_size = 2;
    int32  overlap    = 3;
    int32  min_size   = 4;
}

// RAGIngestDocumentRequest chunks, embeds, and stores a document.
message RAGIngestDocumentRequest {
    string              document_id  = 1;
    string              text         = 2;
    string              namespace    = 3;
    string              model        = 4;
    string              provider     = 5;
    ChunkConfig         chunk_config = 6;
    map<string, string> metadata     = 7;
}

// RAGIngestDocumentResponse reports the outcome of ingestion.
message RAGIngestDocumentResponse {
    string document_id = 1;
    int32  chunk_count = 2;
    string namespace   = 3;
}

// RAGQueryRequest searches a namespace for semantically similar passages.
message RAGQueryRequest {
    string              query     = 1;
    string              namespace = 2;
    int32               top_k     = 3;
    string              model     = 4;
    string              provider  = 5;
    map<string, string> filter    = 6;
}

// RAGQueryResult is a single retrieved passage.
message RAGQueryResult {
    string              chunk_text  = 1;
    float               score       = 2;
    string              document_id = 3;
    int32               chunk_index = 4;
    map<string, string> metadata    = 5;
}

// RAGQueryResponse returns retrieved passages ordered by relevance.
message RAGQueryResponse {
    repeated RAGQueryResult results = 1;
}

// RAGDeleteDocumentRequest names a document to remove from a namespace.
message RAGDeleteDocumentRequest {
    string document_id = 1;
    string namespace   = 2;
}

// RAGDeleteDocumentResponse reports how many chunks were removed.
message RAGDeleteDocumentResponse {
    string document_id   = 1;
    int32  chunks_removed = 2;
}

// RAGListDocumentsRequest pages through documents in a namespace. limit == 0
// means no limit.
message RAGListDocumentsRequest {
    string namespace = 1;
    int32  limit     = 2;
    int32  offset    = 3;
}

// RAGDocumentInfo describes an ingested document.
message RAGDocumentInfo {
    string              id          = 1;
    string              namespace   = 2;
    int32               chunk_count = 3;
    map<string, string> metadata    = 4;
}

// RAGListDocumentsResponse returns a page of documents and the namespace total.
message RAGListDocumentsResponse {
    repeated RAGDocumentInfo documents = 1;
    int32                    total     = 2;
}

// ===========================================================================
// Database encryption-barrier messages
// ===========================================================================

// DatabaseSealRequest names the database whose barrier should be sealed.
message DatabaseSealRequest {
    string name = 1;
}

// DatabaseUnsealRequest carries the unseal secret for a database barrier.
message DatabaseUnsealRequest {
    string name   = 1;
    string secret = 2;
}

// DatabaseBarrierStatusRequest names the database to query.
message DatabaseBarrierStatusRequest {
    string name = 1;
}

// DatabaseBarrierStatusResponse reports a database barrier's sealed state and
// active strategy metadata.
message DatabaseBarrierStatusResponse {
    bool   sealed              = 1;
    string strategy            = 2;
    bool   hardware_backed     = 3;
    int64  initialized_at_unix = 4;
}

// ===========================================================================
// SQL messages
// ===========================================================================

// SQLQueryRequest executes an ad-hoc SQL query against a named database.
message SQLQueryRequest {
    string query = 1;
    string database = 2;
    // consistency is an optional read-consistency level ("linearizable",
    // "sequential", "eventual"); empty defaults to the server's default.
    string consistency = 3;
}

// SQLRow is a single result row, keyed by column name. All cell values are
// pre-formatted as strings, mirroring service.SQLQueryResult.Rows.
message SQLRow {
    map<string, string> values = 1;
}

// SQLQueryResponse is the result of a SQL query execution.
message SQLQueryResponse {
    repeated string columns = 1;
    repeated SQLRow rows = 2;
    int64 row_count = 3;
    // duration is the human-readable query execution duration.
    string duration = 4;
}

// ===========================================================================
// Ceremony custodian claim-share / unseal-share messages
// ===========================================================================

// CeremonyClaimShareBeginRequest names the enrolled custodian beginning a claim.
message CeremonyClaimShareBeginRequest {
    string custodian_id = 1;
}

// CeremonyClaimShareBeginResponse carries the factor challenge the custodian
// must answer.
message CeremonyClaimShareBeginResponse {
    string custodian_id    = 1;
    bytes  nonce           = 2;
    int64  expires_at_unix = 3;
}

// CeremonyClaimShareCompleteRequest carries the custodian's factor response.
message CeremonyClaimShareCompleteRequest {
    string custodian_id    = 1;
    string challenge_id    = 2;
    bytes  factor_response = 3;
}

// CeremonyCustodianResponse is the custodian metadata returned after a
// successful claim-complete.
message CeremonyCustodianResponse {
    string id                   = 1;
    string username             = 2;
    string tenant_id            = 3;
    string method               = 4;
    string enrollment_id        = 5;
    string public_key_pem       = 6;
    int32  share_index          = 7;
    int64  enrolled_at_unix     = 8;
    int64  revoked_at_unix      = 9;
    bool   share_claimed        = 10;
    int64  share_claimed_at_unix = 11;
}

// CeremonySubmitUnsealShareRequest carries a custodian's plaintext share plus
// factor proof.
message CeremonySubmitUnsealShareRequest {
    string custodian_id    = 1;
    string challenge_id    = 2;
    bytes  factor_response = 3;
    bytes  share_bytes     = 4;
}

// CeremonySubmitUnsealShareResponse reports quorum progress after submission.
message CeremonySubmitUnsealShareResponse {
    int32 submitted = 1;
    int32 required  = 2;
    bool  unsealed  = 3;
}

// ===========================================================================
// TenantBarrierService — per-tenant barrier lifecycle (none/passphrase/shamir)
//
// Each tenant barrier is independent of the system barrier and may use a
// different strategy. Service-layer authorization (caller must be a tenant
// admin of the target tenant; the system tenant is denied) is enforced by the
// interceptors; the handlers delegate to pkg/tenant.TenantServicer.
// ===========================================================================
service TenantBarrierService {
    // Init initializes a tenant barrier with the selected strategy. For the
    // Shamir strategy the share_count field indicates how many officer shares
    // were sealed; shares are never returned in the response.
    //
    // identity:gated at the interceptor because a self-managed tenant's IAM
    // is encrypted BEHIND the barrier being initialized: no role able to
    // satisfy tenant_barrier:init can exist before the first init. The
    // handler runs the full RBAC check with the shared trust-on-first-init
    // fallback (middleware.AuthorizeTenantBarrierInit), identical to every
    // other transport.
    rpc Init(TenantBarrierInitRequest) returns (TenantBarrierInitResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // Unseal unseals a tenant barrier using a single key (passphrase strategy).
    //
    // identity:gated at the interceptor: unseal must remain reachable while
    // the tenant's IAM is unreachable (sealed window). The handler runs the
    // full RBAC check with the shared sealed-window fallback
    // (middleware.AuthorizeTenantBarrierSealedOp).
    rpc Unseal(TenantBarrierUnsealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // UnsealShare submits one Shamir share toward the tenant quorum threshold,
    // auto-unsealing once enough distinct shares have been submitted.
    // identity:gated for the same sealed-window reason as Unseal.
    rpc UnsealShare(TenantBarrierUnsealShareRequest) returns (TenantBarrierUnsealProgress) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // Seal seals a tenant barrier.
    rpc Seal(TenantBarrierSealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "tenant_barrier:seal";
    }

    // Status reports a tenant barrier's sealed/initialized state and strategy.
    // identity:gated for the same sealed-window reason as Unseal: polling
    // status is how a tenant admin drives the unseal flow.
    rpc Status(TenantBarrierStatusRequest) returns (TenantBarrierStatusResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // OfficerRegister enrolls a Security Officer for this tenant's barrier.
    // Only valid for Shamir-strategy tenant barriers.
    rpc OfficerRegister(TenantBarrierOfficerRegisterRequest) returns (TenantBarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_register";
    }

    // OfficerList returns the enrolled officers for this tenant's barrier.
    rpc OfficerList(TenantBarrierOfficerListRequest) returns (TenantBarrierOfficerListResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_list";
    }

    // ShareClaimBegin issues a challenge nonce to the named officer as the
    // first step of the two-phase share claim flow.
    rpc ShareClaimBegin(TenantBarrierShareClaimBeginRequest) returns (TenantBarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // ShareClaimComplete verifies the signed nonce and returns the share bytes
    // exactly once, then destroys the enclave.
    rpc ShareClaimComplete(TenantBarrierShareClaimCompleteRequest) returns (TenantBarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // OfficerClaimStatus returns per-officer claim status for admin visibility.
    rpc OfficerClaimStatus(TenantBarrierOfficerClaimStatusRequest) returns (TenantBarrierOfficerClaimStatusResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_list";
    }

    // ShamirSealVote submits one share toward the quorum-gated seal threshold.
    rpc ShamirSealVote(TenantBarrierShamirSealVoteRequest) returns (TenantBarrierShamirSealVoteResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:seal_vote";
    }
}

// TenantBarrierInitRequest initializes the barrier for tenant_id.
// passphrase is `bytes` so callers can zeroize it.
message TenantBarrierInitRequest {
    string tenant_id  = 1;
    bytes  passphrase = 2;
    int32  threshold  = 3;
    int32  shares     = 4;
    string strategy   = 5;
}

// TenantBarrierInitResponse carries the init outcome. For the Shamir strategy
// share_count indicates how many officer shares were sealed into enclaves;
// share bytes are never returned in the wire response.
message TenantBarrierInitResponse {
    string tenant_id    = 1;
    string strategy     = 2;
    reserved 3;
    reserved "shares";
    int32  threshold    = 4;
    int32  total_shares = 5;
    int32  share_count  = 6;
}

// TenantBarrierUnsealRequest carries single-key unseal material.
message TenantBarrierUnsealRequest {
    string tenant_id = 1;
    bytes  key       = 2;
}

// TenantBarrierUnsealShareRequest carries one Shamir share.
message TenantBarrierUnsealShareRequest {
    string tenant_id = 1;
    string share     = 2;
}

// TenantBarrierUnsealProgress reports quorum progress for a Shamir unseal.
message TenantBarrierUnsealProgress {
    string tenant_id = 1;
    int32  required  = 2;
    int32  submitted = 3;
    bool   complete  = 4;
    bool   sealed    = 5;
}

// TenantBarrierSealRequest seals the barrier for tenant_id.
message TenantBarrierSealRequest {
    string tenant_id = 1;
}

// TenantBarrierStatusRequest queries the barrier state for tenant_id.
message TenantBarrierStatusRequest {
    string tenant_id = 1;
}

// TenantBarrierStatusResponse reports the per-tenant barrier state.
message TenantBarrierStatusResponse {
    string tenant_id        = 1;
    bool   sealed           = 2;
    bool   initialized      = 3;
    string strategy         = 4;
    bool   hardware_backed  = 5;
    int32  shamir_threshold = 6;
    int32  shamir_total     = 7;
}

// TenantBarrierOfficerRegisterRequest enrolls a Security Officer for a
// Shamir-strategy tenant barrier.
message TenantBarrierOfficerRegisterRequest {
    string tenant_id          = 1;
    string username           = 2;
    bytes  csr_pem            = 3;
    string authenticator_type = 4;
}

// TenantBarrierOfficerRegisterResponse carries the signed officer certificate
// and the share index assigned to the new officer.
message TenantBarrierOfficerRegisterResponse {
    bytes cert_pem    = 1;
    int32 share_index = 2;
}

// TenantBarrierOfficerListRequest selects the tenant whose officers to list.
message TenantBarrierOfficerListRequest {
    string tenant_id = 1;
}

// TenantBarrierOfficerListResponse carries the per-officer status snapshots.
message TenantBarrierOfficerListResponse {
    repeated OfficerStatus officers = 1;
}

// TenantBarrierShareClaimBeginRequest initiates the two-phase share claim for
// a Security Officer on a Shamir-strategy tenant barrier.
message TenantBarrierShareClaimBeginRequest {
    string tenant_id              = 1;
    string username               = 2;
    string caller_cert_thumbprint = 3;
}

// TenantBarrierShareClaimBeginResponse carries the challenge nonce.
message TenantBarrierShareClaimBeginResponse {
    string nonce_hex = 1;
    int64  expires   = 2;
}

// TenantBarrierShareClaimCompleteRequest completes the two-phase share claim
// by presenting the signed nonce.
message TenantBarrierShareClaimCompleteRequest {
    string tenant_id              = 1;
    string username               = 2;
    string nonce_hex              = 3;
    bytes  signature              = 4;
    string caller_cert_thumbprint = 5;
}

// TenantBarrierShareClaimCompleteResponse carries the share bytes for the
// claiming officer. The enclave is destroyed after this response is sent.
message TenantBarrierShareClaimCompleteResponse {
    bytes share_bytes = 1;
}

// TenantBarrierOfficerClaimStatusRequest selects the tenant whose claim
// status to query.
message TenantBarrierOfficerClaimStatusRequest {
    string tenant_id = 1;
}

// TenantBarrierOfficerClaimStatusResponse carries per-officer claim status
// snapshots for admin visibility.
message TenantBarrierOfficerClaimStatusResponse {
    repeated OfficerStatus officers = 1;
}

// TenantBarrierShamirSealVoteRequest submits one Shamir share toward the
// quorum-gated seal threshold for a tenant barrier.
message TenantBarrierShamirSealVoteRequest {
    string tenant_id   = 1;
    string share_value = 2;
}

// TenantBarrierShamirSealVoteResponse reports quorum progress toward a seal.
message TenantBarrierShamirSealVoteResponse {
    int32 required  = 1;
    int32 submitted = 2;
    bool  complete  = 3;
}

// ===========================================================================
// AuditService — compliance-grade audit query (qrdb.v1.AuditService)
//
// Query returns a paginated page of audit events matching a filter.
// Authorization: requires "audit:query" permission.
// ===========================================================================
service AuditService {
    // Query returns audit events matching the supplied filter.
    rpc Query(AuditQueryRequest) returns (AuditQueryResponse) {
        option (qrdb.v1.permission) = "audit:query";
    }
}

// AuditQueryRequest carries the filter criteria for an audit query.
message AuditQueryRequest {
    // from_rfc3339 and to_rfc3339 bound the query time range (RFC3339, optional).
    string from_rfc3339 = 1;
    string to_rfc3339   = 2;

    // actor filters to events by a specific actor identity.
    string actor     = 3;
    // resource filters to events on a specific resource.
    string resource  = 4;
    // action filters to a specific action.
    string action    = 5;
    // outcome filters to a result prefix ("success", "failure").
    string outcome   = 6;
    // tenant_id filters to events for a specific tenant.
    string tenant_id = 7;
    // limit caps the number of events returned (default 100, max 1000).
    int32  limit     = 8;
    // cursor is an opaque pagination token from a previous AuditQueryResponse.
    string cursor    = 9;
}

// AuditQueryResponse carries a paginated page of audit events.
message AuditQueryResponse {
    // events contains the matching audit events in chronological order.
    repeated AuditEvent events = 1;
    // next is an opaque cursor for the next page; empty when exhausted.
    string next  = 2;
    // total is the total count of matching events, or -1 if unknown.
    int32  total = 3;
}

// AuditEvent is a single compliance-grade structured audit record.
message AuditEvent {
    // timestamp_rfc3339 is the UTC time of the event (RFC3339).
    string timestamp_rfc3339            = 1;
    string actor                        = 2;
    string tenant_id                    = 3;
    string role                         = 4;
    string resource                     = 5;
    string action                       = 6;
    string outcome                      = 7;
    map<string, string> attributes      = 8;
    string client_ip                    = 9;
    string request_id                   = 10;
    string prev_hash                    = 11;
}

// ===========================================================================
// AuthFactorService — custodian hardware-factor enrollment/challenge/verify
// (qrdb.v1.AuthFactorService)
//
// This service manages the lifecycle of hardware auth factors (FIDO2, PIV,
// PKCS#11) for ceremony custodians. Authorization is per-method; see the
// permission constants in pkg/permission.
// ===========================================================================
service AuthFactorService {
    // EnrollFactor enrolls a custodian in the given auth factor type.
    rpc EnrollFactor(EnrollFactorRequest) returns (EnrollFactorResponse) {
        option (qrdb.v1.permission) = "authfactor:enroll";
    }

    // ChallengeFactor issues a challenge for a previously enrolled factor.
    rpc ChallengeFactor(ChallengeFactorRequest) returns (ChallengeFactorResponse) {
        option (qrdb.v1.permission) = "authfactor:challenge";
    }

    // VerifyFactor verifies the custodian's challenge response.
    rpc VerifyFactor(VerifyFactorRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "authfactor:verify";
    }

    // ListFactors lists enrolled auth factors, optionally filtered by subject.
    rpc ListFactors(ListFactorsRequest) returns (ListFactorsResponse) {
        option (qrdb.v1.permission) = "authfactor:list";
    }

    // RevokeFactor permanently revokes an enrollment.
    rpc RevokeFactor(RevokeFactorRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "authfactor:revoke";
    }
}

// EnrollFactorRequest carries the enrollment parameters.
message EnrollFactorRequest {
    string              factor_name   = 1;
    string              subject       = 2;
    string              tenant_id     = 3;
    map<string, string> method_params = 4;
}

// EnrollFactorResponse carries the enrollment result.
message EnrollFactorResponse {
    string              enrollment_id = 1;
    string              factor_name   = 2;
    string              user_id       = 3;
    string              tenant_id     = 4;
    map<string, string> metadata      = 5;
    // enrolled_at is an RFC3339 timestamp.
    string              enrolled_at   = 6;
}

// ChallengeFactorRequest carries the enrollment ID to challenge.
message ChallengeFactorRequest {
    string enrollment_id = 1;
}

// ChallengeFactorResponse carries the challenge payload.
message ChallengeFactorResponse {
    string challenge_id  = 1;
    string enrollment_id = 2;
    bytes  nonce         = 3;
    // expires_at is an RFC3339 timestamp.
    string expires_at    = 4;
    // method_data carries algorithm-specific challenge context.
    map<string, string> method_data = 5;
}

// VerifyFactorRequest carries the challenge response.
message VerifyFactorRequest {
    string              factor_name  = 1;
    string              challenge_id = 2;
    bytes               value        = 3;
    map<string, string> metadata     = 4;
}

// ListFactorsRequest optionally filters by subject.
message ListFactorsRequest {
    string subject = 1;
}

// EnrollmentEntry is a single enrollment list entry.
message EnrollmentEntry {
    string              enrollment_id = 1;
    string              factor_name   = 2;
    string              user_id       = 3;
    string              tenant_id     = 4;
    map<string, string> metadata      = 5;
    // enrolled_at and revoked_at are RFC3339 timestamps.
    string              enrolled_at   = 6;
    string              revoked_at    = 7;
}

// ListFactorsResponse carries the enrollments list.
message ListFactorsResponse {
    repeated EnrollmentEntry enrollments = 1;
    int32                    total       = 2;
}

// RevokeFactorRequest carries the enrollment ID to revoke.
message RevokeFactorRequest {
    string enrollment_id = 1;
}

// ===========================================================================
// UserAuthFactorService — user-side auth factor management (M14)
// (qrdb.v1.UserAuthFactorService)
//
// This service manages auth factors stored in the QRDB auth layer
// (TOTP, passkey, etc.) for end-users. Authorization is per-method.
// ===========================================================================
service UserAuthFactorService {
    // Add registers a new auth factor for a user.
    rpc Add(UserAuthFactorAddRequest) returns (UserAuthFactorAddResponse) {
        option (qrdb.v1.permission) = "user_authfactors:add";
    }

    // List returns all auth factors for a user.
    rpc List(UserAuthFactorListRequest) returns (UserAuthFactorListResponse) {
        option (qrdb.v1.permission) = "user_authfactors:list";
    }

    // Get retrieves a single auth factor by ID.
    rpc Get(UserAuthFactorGetRequest) returns (UserAuthFactorGetResponse) {
        option (qrdb.v1.permission) = "user_authfactors:get";
    }

    // Remove deletes an auth factor.
    rpc Remove(UserAuthFactorRemoveRequest) returns (UserAuthFactorRemoveResponse) {
        option (qrdb.v1.permission) = "user_authfactors:remove";
    }

    // Rotate atomically replaces one factor with another.
    rpc Rotate(UserAuthFactorRotateRequest) returns (UserAuthFactorRotateResponse) {
        option (qrdb.v1.permission) = "user_authfactors:rotate";
    }

    // Relabel updates the human-readable label of a factor.
    rpc Relabel(UserAuthFactorRelabelRequest) returns (UserAuthFactorRelabelResponse) {
        option (qrdb.v1.permission) = "user_authfactors:relabel";
    }

    // Login looks up the auth factor matching a credential key and returns
    // the associated user identity.
    rpc Login(UserAuthFactorLoginRequest) returns (UserAuthFactorLoginResponse) {
        option (qrdb.v1.permission) = "user_authfactors:login";
    }
}

// UserAuthFactorRecord is the wire shape for a single auth factor.
message UserAuthFactorRecord {
    string              id            = 1;
    uint64              user_id       = 2;
    string              type          = 3;
    string              label         = 4;
    bytes               credential    = 5;
    map<string, string> metadata      = 6;
    // Timestamps are RFC3339 strings; last_used_at and revoked_at are empty
    // when not set.
    string              registered_at = 7;
    string              last_used_at  = 8;
    string              revoked_at    = 9;
    string              created_by    = 10;
    // Optional renewal-stable secondary lookup key: SHA-256 of the
    // certificate's SubjectPublicKeyInfo for mtls / piv factors.
    bytes               spki_credential = 11;
}

// UserAuthFactorAddRequest carries the registration parameters.
message UserAuthFactorAddRequest {
    uint64              user_id    = 1;
    string              type       = 2;
    string              label      = 3;
    bytes               credential = 4;
    map<string, string> metadata   = 5;
    string              created_by = 6;
    // Optional renewal-stable secondary lookup key (mtls / piv).
    bytes               spki_credential = 7;
}

// UserAuthFactorAddResponse carries the newly registered factor.
message UserAuthFactorAddResponse {
    UserAuthFactorRecord factor = 1;
}

// UserAuthFactorListRequest carries the user ID to list factors for.
message UserAuthFactorListRequest {
    uint64 user_id = 1;
}

// UserAuthFactorListResponse carries the factors list.
message UserAuthFactorListResponse {
    repeated UserAuthFactorRecord factors = 1;
    int32                         total   = 2;
}

// UserAuthFactorGetRequest carries the factor ID to retrieve.
message UserAuthFactorGetRequest {
    string factor_id = 1;
}

// UserAuthFactorGetResponse carries the retrieved factor.
message UserAuthFactorGetResponse {
    UserAuthFactorRecord factor = 1;
}

// UserAuthFactorRemoveRequest carries the factor ID to remove.
message UserAuthFactorRemoveRequest {
    string factor_id = 1;
    bool   force     = 2;
}

// UserAuthFactorRemoveResponse reports the removal outcome.
message UserAuthFactorRemoveResponse {
    string status = 1;
}

// UserAuthFactorNewFactor carries the registration parameters for Rotate.
message UserAuthFactorNewFactor {
    uint64              user_id    = 1;
    string              type       = 2;
    string              label      = 3;
    bytes               credential = 4;
    map<string, string> metadata   = 5;
    string              created_by = 6;
    // Optional renewal-stable secondary lookup key (mtls / piv).
    bytes               spki_credential = 7;
}

// UserAuthFactorRotateRequest atomically replaces one factor with another.
message UserAuthFactorRotateRequest {
    string               old_factor_id = 1;
    UserAuthFactorNewFactor new_factor = 2;
}

// UserAuthFactorRotateResponse carries the new factor after rotation.
message UserAuthFactorRotateResponse {
    UserAuthFactorRecord new_factor = 1;
}

// UserAuthFactorRelabelRequest carries the factor ID and new label.
message UserAuthFactorRelabelRequest {
    string factor_id = 1;
    string label     = 2;
}

// UserAuthFactorRelabelResponse carries the updated factor.
message UserAuthFactorRelabelResponse {
    UserAuthFactorRecord factor = 1;
}

// UserAuthFactorLoginRequest carries the factor type and credential lookup key.
message UserAuthFactorLoginRequest {
    string type       = 1;
    bytes  lookup_key = 2;
}

// UserAuthFactorLoginResponse carries the authenticated user identity.
message UserAuthFactorLoginResponse {
    uint64               user_id   = 1;
    string               username  = 2;
    string               email     = 3;
    string               tenant_id = 4;
    repeated string      roles     = 5;
    bool                 active    = 6;
    UserAuthFactorRecord factor    = 7;
}
