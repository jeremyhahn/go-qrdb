    rpc CeremonyBeginClaimShare(CeremonyBeginClaimShareRequest) returns (CeremonyBeginClaimShareResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // CeremonyCompleteClaimShare completes the Shamir share claim handshake by
