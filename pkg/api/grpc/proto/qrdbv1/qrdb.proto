syntax = "proto3";

package qrdb.v1;

option go_package = "github.com/jeremyhahn/go-qrdb/pkg/api/grpc/proto/qrdbv1";

import "google/protobuf/empty.proto";
import "pkg/api/grpc/proto/qrdbv1/authz.proto";

// QRDBService is the gRPC API for the QRDB distributed key-value database.
// It provides data-plane (KV CRUD) and control-plane (admin) operations.
service QRDBService {
    // -----------------------------------------------------------------------
    // Basic KV operations (unchanged)
    // -----------------------------------------------------------------------

    // Put stores a key-value pair via Raft consensus.
    rpc Put(PutRequest) returns (PutResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // Get retrieves a value by key using a linearizable read.
    rpc Get(GetRequest) returns (GetResponse) {
        option (qrdb.v1.permission) = "kv:get";
    }

    // Delete removes a key via Raft consensus.
    rpc Delete(DeleteRequest) returns (DeleteResponse) {
        option (qrdb.v1.permission) = "kv:delete";
    }

    // PutIfAbsent atomically stores a key-value pair only when the key is
    // absent, evaluating the condition in the state machine. It is the acquire
    // half of a claim (go-qrdb#119); a guarded put is still a put, so it
    // carries the kv:put permission.
    rpc PutIfAbsent(PutIfAbsentRequest) returns (PutIfAbsentResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // CompareAndDelete atomically removes a key only when its stored value
    // still equals the expected value. It is the release half of PutIfAbsent
    // (go-qrdb#119); a guarded delete is still a delete.
    rpc CompareAndDelete(CompareAndDeleteRequest) returns (CompareAndDeleteResponse) {
        option (qrdb.v1.permission) = "kv:delete";
    }

    // CompareAndSwap atomically replaces a key's value only when its stored
    // value still equals the expected value. It is the edit half of the
    // guarded set PutIfAbsent and CompareAndDelete began (go-qrdb#121); an
    // absent key is left absent, so a swap can never create. A guarded swap
    // is still a put.
    rpc CompareAndSwap(CompareAndSwapRequest) returns (CompareAndSwapResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // List returns sorted keys matching a prefix.
    rpc List(ListRequest) returns (ListResponse) {
        option (qrdb.v1.permission) = "kv:list";
    }

    // Scan returns key-value pairs matching a prefix.
    rpc Scan(ScanRequest) returns (ScanResponse) {
        option (qrdb.v1.permission) = "kv:range";
    }

    // -----------------------------------------------------------------------
    // MVCC operations
    // -----------------------------------------------------------------------

    // PutWithLease stores a key-value pair with an attached lease.
    rpc PutWithLease(PutWithLeaseRequest) returns (PutWithLeaseResponse) {
        option (qrdb.v1.permission) = "mvcc:put_with_lease";
    }

    // GetRevision retrieves a key-value pair with full MVCC revision metadata.
    rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:get_revision";
    }

    // GetAtRevision retrieves a key-value pair at a historical revision.
    rpc GetAtRevision(GetAtRevisionRequest) returns (GetAtRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:get_at_revision";
    }

    // Range returns key-value pairs in the half-open interval [start, end).
    rpc Range(RangeRequest) returns (RangeResponse) {
        option (qrdb.v1.permission) = "mvcc:range";
    }

    // Compact discards all MVCC revisions older than the specified revision.
    rpc Compact(CompactRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "mvcc:compact";
    }

    // CurrentRevision returns the latest committed MVCC revision.
    rpc CurrentRevision(google.protobuf.Empty) returns (CurrentRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:current_revision";
    }

    // RestoreToRevision returns a bounded set of keys to the value they held
    // at an earlier MVCC revision by proposing new writes -- a logical undo,
    // never a Raft rewind. Exactly one of RestoreRevisionRequest.prefix and
    // .keys must be set.
    rpc RestoreToRevision(RestoreRevisionRequest) returns (RestoreRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:restore";
    }

    // -----------------------------------------------------------------------
    // Transaction operations
    // -----------------------------------------------------------------------

    // Transaction executes an atomic compare-and-swap transaction.
    rpc Transaction(TransactionRequest) returns (TransactionResponse) {
        option (qrdb.v1.permission) = "transaction:execute";
    }

    // -----------------------------------------------------------------------
    // Batch operations
    // -----------------------------------------------------------------------

    // Batch executes multiple operations atomically.
    rpc Batch(BatchRequest) returns (BatchResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // BatchImport parses and imports key-value pairs from a file (CSV, JSON,
    // NDJSON, YAML, or archive) carried in the request. This is a bounded
    // unary RPC, not a stream; the file must fit within the server's
    // configured max receive message size (mirrors the REST /batch/import
    // 100 MB bound).
    rpc BatchImport(BatchImportRequest) returns (BatchImportResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // -----------------------------------------------------------------------
    // Watch operations
    // -----------------------------------------------------------------------

    // Watch creates a server-streaming watcher that delivers events for
    // the specified key or prefix.
    rpc Watch(WatchRequest) returns (stream WatchResponse) {
        option (qrdb.v1.permission) = "watch:watch";
    }

    // -----------------------------------------------------------------------
    // Lease operations
    // -----------------------------------------------------------------------

    // LeaseGrant creates a new lease with the specified TTL.
    rpc LeaseGrant(LeaseGrantRequest) returns (LeaseGrantResponse) {
        option (qrdb.v1.permission) = "lease:grant";
    }

    // LeaseRevoke immediately expires a lease and deletes attached keys.
    rpc LeaseRevoke(LeaseRevokeRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "lease:revoke";
    }

    // LeaseKeepAlive resets the TTL on an existing lease.
    rpc LeaseKeepAlive(LeaseKeepAliveRequest) returns (LeaseKeepAliveResponse) {
        option (qrdb.v1.permission) = "lease:keepalive";
    }

    // LeaseTimeToLive returns the current state of a lease.
    rpc LeaseTimeToLive(LeaseTimeToLiveRequest) returns (LeaseTimeToLiveResponse) {
        option (qrdb.v1.permission) = "lease:ttl";
    }

    // LeaseList returns all active leases.
    rpc LeaseList(google.protobuf.Empty) returns (LeaseListResponse) {
        option (qrdb.v1.permission) = "lease:list";
    }

    // -----------------------------------------------------------------------
    // Distributed lock operations
    // -----------------------------------------------------------------------

    // LockAcquire acquires a distributed lock, blocking until acquired or
    // the context is cancelled.
    rpc LockAcquire(LockAcquireRequest) returns (LockAcquireResponse) {
        option (qrdb.v1.permission) = "locks:acquire";
    }

    // LockTryLock attempts to acquire a lock immediately without blocking.
    rpc LockTryLock(LockTryLockRequest) returns (LockTryLockResponse) {
        option (qrdb.v1.permission) = "locks:acquire";
    }

    // LockRelease releases a held lock. The fencing token must match.
    rpc LockRelease(LockReleaseRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "locks:release";
    }

    // LockExtend refreshes the TTL on a held lock without releasing it.
    rpc LockExtend(LockExtendRequest) returns (LockExtendResponse) {
        option (qrdb.v1.permission) = "locks:extend";
    }

    // LockStatus returns the current lock state for a key.
    rpc LockStatus(LockStatusRequest) returns (LockStatusResponse) {
        option (qrdb.v1.permission) = "locks:status";
    }

    // LockList returns all active locks, optionally filtered by prefix.
    rpc LockList(LockListRequest) returns (LockListResponse) {
        option (qrdb.v1.permission) = "locks:list";
    }

    // -----------------------------------------------------------------------
    // Index operations (Tier 2)
    // -----------------------------------------------------------------------

    // IndexCreate creates a new secondary index.
    rpc IndexCreate(IndexCreateRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "index:create";
    }

    // IndexDrop removes a secondary index.
    rpc IndexDrop(IndexDropRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "index:drop";
    }

    // IndexQuery returns entry IDs matching an exact value in an index.
    rpc IndexQuery(IndexQueryRequest) returns (IndexQueryResponse) {
        option (qrdb.v1.permission) = "index:query";
    }

    // IndexScan returns entries in an index within a value range.
    rpc IndexScan(IndexScanRequest) returns (IndexScanResponse) {
        option (qrdb.v1.permission) = "index:scan";
    }

    // IndexList returns the names of all registered indexes.
    rpc IndexList(google.protobuf.Empty) returns (IndexListResponse) {
        option (qrdb.v1.permission) = "index:list";
    }

    // -----------------------------------------------------------------------
    // Time-series operations (Tier 2)
    // -----------------------------------------------------------------------

    // TSWrite stores a single time-series data point.
    rpc TSWrite(TSWriteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write";
    }

    // TSWriteBatch stores multiple time-series data points atomically.
    rpc TSWriteBatch(TSWriteBatchRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write_batch";
    }

    // TSQuery retrieves data points for a metric within a time range.
    rpc TSQuery(TSQueryRequest) returns (TSQueryResponse) {
        option (qrdb.v1.permission) = "timeseries:query";
    }

    // TSAggregate computes an aggregation over data points in a time range.
    rpc TSAggregate(TSAggregateRequest) returns (TSAggregateResponse) {
        option (qrdb.v1.permission) = "timeseries:aggregate";
    }

    // TSWritePoint stores a single validated data point.
    rpc TSWritePoint(TSWriteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write_point";
    }

    // TSRichQuery performs a rich query with aggregation, downsampling, and grouping.
    rpc TSRichQuery(TSRichQueryRequest) returns (TSRichQueryResponse) {
        option (qrdb.v1.permission) = "timeseries:rich_query";
    }

    // TSDeleteSeries deletes time-series data matching the criteria.
    rpc TSDeleteSeries(TSDeleteSeriesRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:delete_series";
    }

    // TSGetRetention retrieves the retention policy for a metric.
    rpc TSGetRetention(TSGetRetentionRequest) returns (TSRetentionPolicyResponse) {
        option (qrdb.v1.permission) = "timeseries:get_retention";
    }

    // TSSetRetention sets the retention policy for a metric.
    rpc TSSetRetention(TSSetRetentionRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:set_retention";
    }

    // TSListMetrics lists metric names matching a prefix.
    rpc TSListMetrics(TSListMetricsRequest) returns (TSListMetricsResponse) {
        option (qrdb.v1.permission) = "timeseries:list_metrics";
    }

    // -----------------------------------------------------------------------
    // Vector operations (Tier 2)
    // -----------------------------------------------------------------------

    // VectorCreateNamespace creates a new vector namespace.
    rpc VectorCreateNamespace(VectorCreateNamespaceRequest) returns (VectorCreateNamespaceResponse) {
        option (qrdb.v1.permission) = "vector:namespace_create";
    }

    // VectorDeleteNamespace removes a namespace and all its vectors.
    rpc VectorDeleteNamespace(VectorDeleteNamespaceRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:namespace_delete";
    }

    // VectorListNamespaces returns all vector namespace names.
    rpc VectorListNamespaces(VectorListNamespacesRequest) returns (VectorListNamespacesResponse) {
        option (qrdb.v1.permission) = "vector:namespace_list";
    }

    // VectorGetNamespaceInfo returns metadata about a namespace.
    rpc VectorGetNamespaceInfo(VectorGetNamespaceInfoRequest) returns (VectorNamespaceInfo) {
        option (qrdb.v1.permission) = "vector:namespace_info";
    }

    // VectorUpsert inserts or updates a vector in a namespace.
    rpc VectorUpsert(VectorUpsertRequest) returns (VectorUpsertResponse) {
        option (qrdb.v1.permission) = "vector:upsert";
    }

    // VectorGet retrieves a single vector by ID.
    rpc VectorGet(VectorGetRequest) returns (VectorDataProto) {
        option (qrdb.v1.permission) = "vector:get";
    }

    // VectorDelete removes a single vector by ID.
    rpc VectorDelete(VectorDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:delete";
    }

    // VectorBatchUpsert inserts or updates multiple vectors.
    rpc VectorBatchUpsert(VectorBatchUpsertRequest) returns (VectorBatchUpsertResponse) {
        option (qrdb.v1.permission) = "vector:batch_upsert";
    }

    // VectorBatchDelete removes multiple vectors by ID.
    rpc VectorBatchDelete(VectorBatchDeleteRequest) returns (VectorBatchDeleteResponse) {
        option (qrdb.v1.permission) = "vector:batch_delete";
    }

    // VectorList returns a paginated list of vectors in a namespace.
    rpc VectorList(VectorListRequest) returns (VectorListResponse) {
        option (qrdb.v1.permission) = "vector:list";
    }

    // VectorUpdateMetadata updates vector metadata without modifying vector data.
    rpc VectorUpdateMetadata(VectorUpdateMetadataRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:update_metadata";
    }

    // VectorSearchSimilar performs k-nearest-neighbor search using a query vector.
    rpc VectorSearchSimilar(VectorSearchSimilarRequest) returns (VectorSearchSimilarResponse) {
        option (qrdb.v1.permission) = "vector:search_similar";
    }

    // VectorSearchByMetadata returns vectors matching metadata filters.
    rpc VectorSearchByMetadata(VectorSearchByMetadataRequest) returns (VectorSearchByMetadataResponse) {
        option (qrdb.v1.permission) = "vector:search_by_metadata";
    }

    // VectorHybridSearch combines vector similarity and metadata filtering.
    rpc VectorHybridSearch(VectorHybridSearchRequest) returns (VectorHybridSearchResponse) {
        option (qrdb.v1.permission) = "vector:hybrid_search";
    }

    // VectorSearchByID searches using an existing vector's ID as the query.
    rpc VectorSearchByID(VectorSearchByIDRequest) returns (VectorSearchSimilarResponse) {
        option (qrdb.v1.permission) = "vector:search_by_id";
    }

    // VectorRebuildIndex triggers an asynchronous index rebuild for a namespace.
    rpc VectorRebuildIndex(VectorRebuildIndexRequest) returns (VectorRebuildIndexResponse) {
        option (qrdb.v1.permission) = "vector:rebuild_index";
    }

    // VectorGetRebuildProgress returns the progress of an index rebuild job.
    rpc VectorGetRebuildProgress(VectorGetRebuildProgressRequest) returns (VectorRebuildProgress) {
        option (qrdb.v1.permission) = "vector:get_rebuild_progress";
    }

    // VectorGetIndexStats returns statistics about a namespace's vector index.
    rpc VectorGetIndexStats(VectorGetIndexStatsRequest) returns (VectorIndexStats) {
        option (qrdb.v1.permission) = "vector:get_index_stats";
    }

    // VectorCompactNamespace triggers asynchronous compaction for a namespace.
    rpc VectorCompactNamespace(VectorCompactNamespaceRequest) returns (VectorCompactNamespaceResponse) {
        option (qrdb.v1.permission) = "vector:compact";
    }

    // VectorGetCompactionProgress returns the progress of a compaction job.
    rpc VectorGetCompactionProgress(VectorGetCompactionProgressRequest) returns (VectorCompactionProgress) {
        option (qrdb.v1.permission) = "vector:get_compaction_progress";
    }

    // -----------------------------------------------------------------------
    // Admin operations (unchanged)
    // -----------------------------------------------------------------------

    // Health returns the node health status.
    rpc Health(google.protobuf.Empty) returns (HealthResponse) {
        option (qrdb.v1.permission) = "admin:health";
    }

    // Status returns detailed node status information.
    rpc Status(google.protobuf.Empty) returns (StatusResponse) {
        option (qrdb.v1.permission) = "admin:status";
    }

    // Peers returns the peer list for all loaded shards.
    rpc Peers(google.protobuf.Empty) returns (PeersResponse) {
        option (qrdb.v1.permission) = "admin:peers";
    }

    // AddMember adds a new node to a shard.
    rpc AddMember(AddMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:add_member";
    }

    // RemoveMember removes a node from a shard.
    rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:remove_member";
    }

    // RequestSnapshot triggers a snapshot for the given shard.
    rpc RequestSnapshot(RequestSnapshotMessage) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:snapshot";
    }

    // Drain transitions the node into drain mode.
    rpc Drain(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:drain";
    }

    // Capabilities returns the compile-time feature set of the node.
    rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse) {
        option (qrdb.v1.permission) = "admin:capabilities";
    }

    // StartShard initializes and starts a Raft group for the given shard.
    rpc StartShard(StartShardRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:start_shard";
    }

    // StopShard stops the Raft group for the given shard.
    rpc StopShard(StopShardRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:stop_shard";
    }

    // GetShardState returns the Raft state for a shard.
    rpc GetShardState(GetShardStateRequest) returns (ShardStateResponse) {
        option (qrdb.v1.permission) = "admin:shard_state";
    }

    // GetTopology returns the full cluster topology.
    rpc GetTopology(google.protobuf.Empty) returns (TopologyResponse) {
        option (qrdb.v1.permission) = "admin:topology";
    }

    // -----------------------------------------------------------------------
    // User management
    // -----------------------------------------------------------------------

    // CreateUser creates a new passwordless user.
    rpc CreateUser(CreateUserRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:create";
    }

    // GetUser retrieves a user by ID.
    rpc GetUser(GetUserRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }

    // GetUserByUsername retrieves a user by tenant-scoped username.
    rpc GetUserByUsername(GetUserByUsernameRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }
    rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }

    // GetUserByCertThumbprint resolves a user by an mTLS certificate's
    // SPKI thumbprint via the secondary index (the mTLS-auth hot path).
    rpc GetUserByCertThumbprint(GetUserByCertThumbprintRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:get_by_cert_thumbprint";
    }

    // AddCertBinding binds an mTLS certificate's SPKI thumbprint to a user
    // so GetUserByCertThumbprint resolves it (the enrollment seam).
    rpc AddCertBinding(AddCertBindingRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:add_cert_binding";
    }

    // UpdateUser applies partial updates to an existing user.
    rpc UpdateUser(UpdateUserProtoRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:update";
    }

    // DeleteUser removes a non-system user by ID.
    rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:delete";
    }

    // ListUsers returns a paginated list of users.
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
        option (qrdb.v1.permission) = "users:list";
    }

    // EnableUser activates a user account.
    rpc EnableUser(EnableUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:enable";
    }

    // DisableUser deactivates a user account.
    rpc DisableUser(DisableUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:disable";
    }

    // -----------------------------------------------------------------------
    // Role management
    // -----------------------------------------------------------------------

    // CreateRole creates a new role.
    rpc CreateRole(CreateRoleRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:create";
    }

    // GetRole retrieves a role by ID.
    rpc GetRole(GetRoleRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:read";
    }

    // GetRoleByName retrieves a role by tenant-scoped name.
    rpc GetRoleByName(GetRoleByNameRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:read";
    }

    // UpdateRole applies partial updates to an existing role.
    rpc UpdateRole(UpdateRoleProtoRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:update";
    }

    // DeleteRole removes a non-system role by ID.
    rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:delete";
    }

    // ListRoles returns a paginated list of roles.
    rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
        option (qrdb.v1.permission) = "roles:list";
    }

    // AssignRole assigns a role to a user.
    rpc AssignRole(AssignRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:assign";
    }

    // UnassignRole removes a role assignment.
    rpc UnassignRole(UnassignRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:unassign";
    }

    // ListPermissions returns all available permission categories.
    rpc ListPermissions(google.protobuf.Empty) returns (ListPermissionsResponse) {
        option (qrdb.v1.permission) = "permissions:list";
    }

    // ResolveRolePermissions returns the union of effective permissions
    // for the given role IDs (sorted, deduplicated).
    rpc ResolveRolePermissions(ResolveRolePermissionsRequest) returns (ResolveRolePermissionsResponse) {
        option (qrdb.v1.permission) = "permissions:resolve";
    }

    // ReconcileBuiltInRoles converges a tenant's stored built-in roles onto
    // this build's definitions. It carries roles:create rather than a
    // permission of its own: reconciliation IS the seeding operation applied
    // to an existing tenant, and a dedicated verb would be absent from every
    // role seeded before it existed -- so nobody would hold the permission
    // needed to repair that exact absence.
    rpc ReconcileBuiltInRoles(ReconcileBuiltInRolesRequest) returns (ReconcileBuiltInRolesResponse) {
        option (qrdb.v1.permission) = "roles:create";
    }

    // -----------------------------------------------------------------------
    // Certificate management
    // -----------------------------------------------------------------------

    // GenerateCert creates a client certificate.
    rpc GenerateCert(GenerateCertRequest) returns (CertBundleResponse) {
        option (qrdb.v1.permission) = "certs:generate";
    }

    // ExportCert exports a certificate as PKCS#12.
    rpc ExportCert(ExportCertRequest) returns (ExportCertResponse) {
        option (qrdb.v1.permission) = "certs:export";
    }

    // RevokeCert marks a certificate serial as revoked.
    rpc RevokeCert(RevokeCertRequest) returns (RevokeCertResponse) {
        option (qrdb.v1.permission) = "certs:revoke";
    }

    // ListCerts lists all issued client certificates for a tenant.
    rpc ListCerts(ListCertsRequest) returns (ListCertsResponse) {
        option (qrdb.v1.permission) = "certs:list";
    }

    // -----------------------------------------------------------------------
    // Collection operations
    // -----------------------------------------------------------------------

    // CreateCollection creates a new document collection in a database.
    rpc CreateCollection(CreateCollectionRequest) returns (CollectionInfoResponse) {
        option (qrdb.v1.permission) = "collections:create";
    }

    // GetCollectionInfo returns metadata about a specific collection.
    rpc GetCollectionInfo(GetCollectionInfoRequest) returns (CollectionInfoResponse) {
        option (qrdb.v1.permission) = "collections:read";
    }

    // ListCollections returns all collections within a database.
    rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
        option (qrdb.v1.permission) = "collections:list";
    }

    // DropCollection removes a collection and all its documents.
    rpc DropCollection(DropCollectionRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:drop";
    }

    // InsertDocument inserts a document into a collection.
    rpc InsertDocument(InsertDocumentRequest) returns (InsertDocumentResponse) {
        option (qrdb.v1.permission) = "collections:insert";
    }

    // GetDocument retrieves a single document by ID.
    rpc GetDocument(GetDocumentRequest) returns (DocumentResponse) {
        option (qrdb.v1.permission) = "collections:read";
    }

    // UpdateDocument replaces an existing document in a collection.
    rpc UpdateDocument(UpdateDocumentRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:update";
    }

    // DeleteDocument removes a document from a collection by ID.
    rpc DeleteDocument(DeleteDocumentRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:delete";
    }

    // ListDocuments returns a paginated list of documents in a collection.
    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
        option (qrdb.v1.permission) = "collections:list";
    }

    // -----------------------------------------------------------------------
    // Database management operations
    // -----------------------------------------------------------------------

    // DatabaseCreate creates a new database with the specified configuration.
    rpc DatabaseCreate(DatabaseCreateRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:create";
    }

    // DatabaseGet returns information about a specific database.
    rpc DatabaseGet(DatabaseGetRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:read";
    }

    // DatabaseList returns information about all open databases.
    rpc DatabaseList(google.protobuf.Empty) returns (DatabaseListResponse) {
        option (qrdb.v1.permission) = "databases:list";
    }

    // DatabaseDrop closes and removes a database.
    rpc DatabaseDrop(DatabaseDropRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "databases:delete";
    }

    // DatabaseUpdateProtocol updates the wire protocol configuration.
    rpc DatabaseUpdateProtocol(DatabaseUpdateProtocolRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateEtcd updates the etcd wire protocol configuration.
    rpc DatabaseUpdateEtcd(DatabaseUpdateEtcdRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateRaft updates the Raft consensus configuration.
    rpc DatabaseUpdateRaft(DatabaseUpdateRaftRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseScale changes the replication factor of an existing
    // dedicated-raft database.
    rpc DatabaseScale(DatabaseScaleRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:scale";
    }

    // DatabaseUpdateBarrier updates the encryption barrier configuration.
    rpc DatabaseUpdateBarrier(DatabaseUpdateBarrierRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateConnection updates the remote connection configuration.
    rpc DatabaseUpdateConnection(DatabaseUpdateConnectionRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // -----------------------------------------------------------------------
    // Barrier operations
    // -----------------------------------------------------------------------

    // BarrierInitialize initializes the cryptographic barrier with a single
    // master key.
    rpc BarrierInitialize(BarrierInitializeRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:bootstrap";
    }

    // BarrierUnseal unseals the barrier using the master key.
    rpc BarrierUnseal(BarrierUnsealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:unseal";
    }

    // BarrierSeal seals the barrier, preventing data access until unsealed.
    rpc BarrierSeal(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:seal";
    }

    // BarrierStatus returns the current barrier state.
    rpc BarrierStatus(google.protobuf.Empty) returns (BarrierStatusResponse) {
        option (qrdb.v1.permission) = "seal:status";
    }

    // BarrierShamirInitialize initializes the barrier with Shamir secret sharing.
    rpc BarrierShamirInitialize(BarrierShamirInitializeRequest) returns (BarrierShamirOperationResponse) {
        option (qrdb.v1.permission) = "seal:initialize_shamir";
    }

    // BarrierShamirUnsealShare submits a single Shamir share toward the unseal threshold.
    rpc BarrierShamirUnsealShare(BarrierShamirUnsealShareRequest) returns (BarrierShamirUnsealShareResponse) {
        option (qrdb.v1.permission) = "barrier:unseal-share";
    }

    // BarrierShamirUnsealShares submits multiple Shamir shares to unseal in one call.
    rpc BarrierShamirUnsealShares(BarrierShamirUnsealSharesRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "barrier:unseal-share";
    }

    // BarrierRekey generates new Shamir shares with the specified parameters.
    rpc BarrierRekey(BarrierRekeyRequest) returns (BarrierShamirOperationResponse) {
        option (qrdb.v1.permission) = "seal:rekey";
    }

    // BarrierEnableEncryption migrates a previously-unencrypted barrier to a
    // keyed strategy (enable encryption after the fact). The migration runs
    // asynchronously because a system-scope migration recycles the data-plane
    // server in process; the call returns immediately and clients poll
    // BarrierStatus for the strategy change.
    rpc BarrierEnableEncryption(BarrierEnableEncryptionRequest) returns (BarrierEnableEncryptionResponse) {
        option (qrdb.v1.permission) = "seal:enable_encryption";
    }

    // -----------------------------------------------------------------------
    // Barrier Security Officer management (system barrier)
    // -----------------------------------------------------------------------

    // BarrierOfficerRegister registers a new Security Officer for the system barrier.
    rpc BarrierOfficerRegister(BarrierOfficerRegisterRequest) returns (BarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "seal:officer_register";
    }

    // BarrierOfficerList lists all registered Security Officers for the system barrier.
    rpc BarrierOfficerList(google.protobuf.Empty) returns (BarrierOfficerListResponse) {
        option (qrdb.v1.permission) = "seal:officer_list";
    }

    // BarrierShareClaimBegin starts the share claim handshake for the calling SO.
    rpc BarrierShareClaimBegin(BarrierShareClaimBeginRequest) returns (BarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierShareClaimComplete completes the share claim handshake and returns
    // the share exactly once. Only callable by the SO's own mTLS session.
    rpc BarrierShareClaimComplete(BarrierShareClaimCompleteRequest) returns (BarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierOfficerClaimStatus returns per-officer claim status (no share data).
    rpc BarrierOfficerClaimStatus(google.protobuf.Empty) returns (BarrierOfficerClaimStatusResponse) {
        option (qrdb.v1.permission) = "seal:officer_list";
    }

    // BarrierShamirSealVote submits a share as a seal vote (Shamir barriers only).
    rpc BarrierShamirSealVote(BarrierShamirSealVoteRequest) returns (BarrierShamirSealVoteResponse) {
        option (qrdb.v1.permission) = "seal:submit_seal_vote";
    }

    // BarrierRecoveryOfficerRegister registers an SO for recovery key distribution.
    rpc BarrierRecoveryOfficerRegister(BarrierOfficerRegisterRequest) returns (BarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "seal:officer_register";
    }

    // BarrierRecoveryShareClaimBegin starts the recovery share claim handshake.
    rpc BarrierRecoveryShareClaimBegin(BarrierShareClaimBeginRequest) returns (BarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRecoveryShareClaimComplete completes the recovery share claim handshake.
    rpc BarrierRecoveryShareClaimComplete(BarrierShareClaimCompleteRequest) returns (BarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRecoveryGenerate generates recovery keys for disaster recovery.
    rpc BarrierRecoveryGenerate(BarrierRecoveryGenerateRequest) returns (BarrierRecoveryKeysResponse) {
        option (qrdb.v1.permission) = "seal:generate_recovery";
    }

    // BarrierRecoveryRecover unseals the barrier using recovery keys.
    rpc BarrierRecoveryRecover(BarrierRecoveryRecoverRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:recover_with_keys";
    }

    // BarrierRecoveryDelete deletes all stored recovery keys.
    rpc BarrierRecoveryDelete(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:generate_recovery";
    }

    // BarrierRecoveryStatus checks whether recovery keys have been generated.
    rpc BarrierRecoveryStatus(google.protobuf.Empty) returns (BarrierRecoveryStatusResponse) {
        option (qrdb.v1.permission) = "seal:status";
    }

    // BarrierRootToken generates a new root token using Shamir shares.
    rpc BarrierRootToken(BarrierRootTokenRequest) returns (BarrierRootTokenResponse) {
        option (qrdb.v1.permission) = "seal:bootstrap";
    }

