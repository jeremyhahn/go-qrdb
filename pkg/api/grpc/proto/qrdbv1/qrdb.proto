syntax = "proto3";

package qrdb.v1;

option go_package = "github.com/jeremyhahn/go-qrdb/pkg/api/grpc/proto/qrdbv1";

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "qrdb/v1/permission.proto";

// QRDBService is the gRPC API for the QRDB distributed key-value database.
// It provides data-plane (KV CRUD) and control-plane (admin) operations.
service QRDBService {
    // -----------------------------------------------------------------------
    // Basic KV operations (unchanged)
    // -----------------------------------------------------------------------

    // Put stores a key-value pair via Raft consensus.
    rpc Put(PutRequest) returns (PutResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // Get retrieves a value by key using a linearizable read.
    rpc Get(GetRequest) returns (GetResponse) {
        option (qrdb.v1.permission) = "kv:get";
    }

    // Delete removes a key via Raft consensus.
    rpc Delete(DeleteRequest) returns (DeleteResponse) {
        option (qrdb.v1.permission) = "kv:delete";
    }

    // PutIfAbsent atomically stores a key-value pair only when the key is
    // absent, evaluating the condition in the state machine. It is the acquire
    // half of a claim (go-qrdb#119); a guarded put is still a put, so it
    // carries the kv:put permission.
    rpc PutIfAbsent(PutIfAbsentRequest) returns (PutIfAbsentResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // CompareAndDelete atomically removes a key only when its stored value
    // still equals the expected value. It is the release half of PutIfAbsent
    // (go-qrdb#119); a guarded delete is still a delete.
    rpc CompareAndDelete(CompareAndDeleteRequest) returns (CompareAndDeleteResponse) {
        option (qrdb.v1.permission) = "kv:delete";
    }

    // CompareAndSwap atomically replaces a key's value only when its stored
    // value still equals the expected value. It is the edit half of the
    // guarded set PutIfAbsent and CompareAndDelete began (go-qrdb#121); an
    // absent key is left absent, so a swap can never create. A guarded swap
    // is still a put.
    rpc CompareAndSwap(CompareAndSwapRequest) returns (CompareAndSwapResponse) {
        option (qrdb.v1.permission) = "kv:put";
    }

    // List returns sorted keys matching a prefix.
    rpc List(ListRequest) returns (ListResponse) {
        option (qrdb.v1.permission) = "kv:list";
    }

    // Scan returns key-value pairs matching a prefix.
    rpc Scan(ScanRequest) returns (ScanResponse) {
        option (qrdb.v1.permission) = "kv:range";
    }

    // -----------------------------------------------------------------------
    // MVCC operations
    // -----------------------------------------------------------------------

    // PutWithLease stores a key-value pair with an attached lease.
    rpc PutWithLease(PutWithLeaseRequest) returns (PutWithLeaseResponse) {
        option (qrdb.v1.permission) = "mvcc:put_with_lease";
    }

    // GetRevision retrieves a key-value pair with full MVCC revision metadata.
    rpc GetRevision(GetRevisionRequest) returns (GetRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:get_revision";
    }

    // GetAtRevision retrieves a key-value pair at a historical revision.
    rpc GetAtRevision(GetAtRevisionRequest) returns (GetAtRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:get_at_revision";
    }

    // Range returns key-value pairs in the half-open interval [start, end).
    rpc Range(RangeRequest) returns (RangeResponse) {
        option (qrdb.v1.permission) = "mvcc:range";
    }

    // Compact discards all MVCC revisions older than the specified revision.
    rpc Compact(CompactRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "mvcc:compact";
    }

    // CurrentRevision returns the latest committed MVCC revision.
    rpc CurrentRevision(google.protobuf.Empty) returns (CurrentRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:current_revision";
    }

    // RestoreToRevision returns a bounded set of keys to the value they held
    // at an earlier MVCC revision by proposing new writes -- a logical undo,
    // never a Raft rewind. Exactly one of RestoreRevisionRequest.prefix and
    // .keys must be set.
    rpc RestoreToRevision(RestoreRevisionRequest) returns (RestoreRevisionResponse) {
        option (qrdb.v1.permission) = "mvcc:restore";
    }

    // -----------------------------------------------------------------------
    // Transaction operations
    // -----------------------------------------------------------------------

    // Transaction executes an atomic compare-and-swap transaction.
    rpc Transaction(TransactionRequest) returns (TransactionResponse) {
        option (qrdb.v1.permission) = "transaction:execute";
    }

    // -----------------------------------------------------------------------
    // Batch operations
    // -----------------------------------------------------------------------

    // Batch executes multiple operations atomically.
    rpc Batch(BatchRequest) returns (BatchResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // ImportBegin starts a chunked import session scoped to the caller's
    // (tenant, database) and (tenant, identity), returning the session ID
    // passed to ImportAppend/ImportCommit/ImportAbort. Carries a dataset of
    // any size as many small calls instead of one message no transport's
    // pre-auth cap can admit -- the replacement for the single-message
    // BatchImport RPC this service used to carry, deleted outright with no
    // compat once every transport, SDK and the CLI moved to this session
    // (go-qrdb#576 part 2). See docs/transactions/architecture.md ("Import
    // session").
    rpc ImportBegin(ImportBeginRequest) returns (ImportBeginResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // ImportAppend stages chunk as sequence seq of session_id. seq must be
    // exactly one more than the last appended sequence, or equal to it
    // with identical bytes (an idempotent replay); any other value is
    // refused.
    rpc ImportAppend(ImportAppendRequest) returns (ImportAppendResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // ImportCommit applies every staged chunk of session_id atomically,
    // exactly as the retired BatchImport RPC applied its one file, and
    // releases the session on success.
    rpc ImportCommit(ImportCommitRequest) returns (ImportCommitResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // ImportAbort releases session_id -- its lease, and therefore its
    // metadata record and every staged chunk -- without applying
    // anything.
    rpc ImportAbort(ImportAbortRequest) returns (ImportAbortResponse) {
        option (qrdb.v1.permission) = "batch:execute";
    }

    // -----------------------------------------------------------------------
    // Watch operations
    // -----------------------------------------------------------------------

    // Watch creates a server-streaming watcher that delivers events for
    // the specified key or prefix.
    rpc Watch(WatchRequest) returns (stream WatchResponse) {
        option (qrdb.v1.permission) = "watch:watch";
    }

    // -----------------------------------------------------------------------
    // Lease operations
    // -----------------------------------------------------------------------

    // LeaseGrant creates a new lease with the specified TTL.
    rpc LeaseGrant(LeaseGrantRequest) returns (LeaseGrantResponse) {
        option (qrdb.v1.permission) = "lease:grant";
    }

    // LeaseRevoke immediately expires a lease and deletes attached keys.
    rpc LeaseRevoke(LeaseRevokeRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "lease:revoke";
    }

    // LeaseKeepAlive resets the TTL on an existing lease.
    rpc LeaseKeepAlive(LeaseKeepAliveRequest) returns (LeaseKeepAliveResponse) {
        option (qrdb.v1.permission) = "lease:keepalive";
    }

    // LeaseTimeToLive returns the current state of a lease.
    rpc LeaseTimeToLive(LeaseTimeToLiveRequest) returns (LeaseTimeToLiveResponse) {
        option (qrdb.v1.permission) = "lease:ttl";
    }

    // LeaseList returns all active leases.
    rpc LeaseList(google.protobuf.Empty) returns (LeaseListResponse) {
        option (qrdb.v1.permission) = "lease:list";
    }

    // -----------------------------------------------------------------------
    // Distributed lock operations
    // -----------------------------------------------------------------------

    // LockAcquire acquires a distributed lock, blocking until acquired or
    // the context is cancelled.
    rpc LockAcquire(LockAcquireRequest) returns (LockAcquireResponse) {
        option (qrdb.v1.permission) = "locks:acquire";
    }

    // LockTryLock attempts to acquire a lock immediately without blocking.
    rpc LockTryLock(LockTryLockRequest) returns (LockTryLockResponse) {
        option (qrdb.v1.permission) = "locks:acquire";
    }

    // LockRelease releases a held lock. The fencing token must match.
    rpc LockRelease(LockReleaseRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "locks:release";
    }

    // LockExtend refreshes the TTL on a held lock without releasing it.
    rpc LockExtend(LockExtendRequest) returns (LockExtendResponse) {
        option (qrdb.v1.permission) = "locks:extend";
    }

    // LockStatus returns the current lock state for a key.
    rpc LockStatus(LockStatusRequest) returns (LockStatusResponse) {
        option (qrdb.v1.permission) = "locks:status";
    }

    // LockList returns all active locks, optionally filtered by prefix.
    rpc LockList(LockListRequest) returns (LockListResponse) {
        option (qrdb.v1.permission) = "locks:list";
    }

    // -----------------------------------------------------------------------
    // Index operations (Tier 2)
    // -----------------------------------------------------------------------

    // IndexCreate creates a new secondary index.
    rpc IndexCreate(IndexCreateRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "index:create";
    }

    // IndexDrop removes a secondary index.
    rpc IndexDrop(IndexDropRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "index:drop";
    }

    // IndexQuery returns entry IDs matching an exact value in an index.
    rpc IndexQuery(IndexQueryRequest) returns (IndexQueryResponse) {
        option (qrdb.v1.permission) = "index:query";
    }

    // IndexScan returns entries in an index within a value range.
    rpc IndexScan(IndexScanRequest) returns (IndexScanResponse) {
        option (qrdb.v1.permission) = "index:scan";
    }

    // IndexList returns the names of all registered indexes.
    rpc IndexList(google.protobuf.Empty) returns (IndexListResponse) {
        option (qrdb.v1.permission) = "index:list";
    }

    // -----------------------------------------------------------------------
    // Time-series operations (Tier 2)
    // -----------------------------------------------------------------------

    // TSWrite stores a single time-series data point.
    rpc TSWrite(TSWriteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write";
    }

    // TSWriteBatch stores multiple time-series data points atomically.
    rpc TSWriteBatch(TSWriteBatchRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write_batch";
    }

    // TSQuery retrieves data points for a metric within a time range.
    rpc TSQuery(TSQueryRequest) returns (TSQueryResponse) {
        option (qrdb.v1.permission) = "timeseries:query";
    }

    // TSAggregate computes an aggregation over data points in a time range.
    rpc TSAggregate(TSAggregateRequest) returns (TSAggregateResponse) {
        option (qrdb.v1.permission) = "timeseries:aggregate";
    }

    // TSWritePoint stores a single validated data point.
    rpc TSWritePoint(TSWriteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:write_point";
    }

    // TSRichQuery performs a rich query with aggregation, downsampling, and grouping.
    rpc TSRichQuery(TSRichQueryRequest) returns (TSRichQueryResponse) {
        option (qrdb.v1.permission) = "timeseries:rich_query";
    }

    // TSDeleteSeries deletes time-series data matching the criteria.
    rpc TSDeleteSeries(TSDeleteSeriesRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:delete_series";
    }

    // TSGetRetention retrieves the retention policy for a metric.
    rpc TSGetRetention(TSGetRetentionRequest) returns (TSRetentionPolicyResponse) {
        option (qrdb.v1.permission) = "timeseries:get_retention";
    }

    // TSSetRetention sets the retention policy for a metric.
    rpc TSSetRetention(TSSetRetentionRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "timeseries:set_retention";
    }

    // TSListMetrics lists metric names matching a prefix.
    rpc TSListMetrics(TSListMetricsRequest) returns (TSListMetricsResponse) {
        option (qrdb.v1.permission) = "timeseries:list_metrics";
    }

    // -----------------------------------------------------------------------
    // Vector operations (Tier 2)
    // -----------------------------------------------------------------------

    // VectorCreateNamespace creates a new vector namespace.
    rpc VectorCreateNamespace(VectorCreateNamespaceRequest) returns (VectorCreateNamespaceResponse) {
        option (qrdb.v1.permission) = "vector:namespace_create";
    }

    // VectorUpdateNamespace changes a namespace's index parameters and
    // metadata in place, keeping every vector.
    rpc VectorUpdateNamespace(VectorUpdateNamespaceRequest) returns (VectorUpdateNamespaceResponse) {
        option (qrdb.v1.permission) = "vector:namespace_update";
    }

    // VectorDeleteNamespace removes a namespace and all its vectors.
    rpc VectorDeleteNamespace(VectorDeleteNamespaceRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:namespace_delete";
    }

    // VectorListNamespaces returns all vector namespace names.
    rpc VectorListNamespaces(VectorListNamespacesRequest) returns (VectorListNamespacesResponse) {
        option (qrdb.v1.permission) = "vector:namespace_list";
    }

    // VectorGetNamespaceInfo returns metadata about a namespace.
    rpc VectorGetNamespaceInfo(VectorGetNamespaceInfoRequest) returns (VectorNamespaceInfo) {
        option (qrdb.v1.permission) = "vector:namespace_info";
    }

    // VectorUpsert inserts or updates a vector in a namespace.
    rpc VectorUpsert(VectorUpsertRequest) returns (VectorUpsertResponse) {
        option (qrdb.v1.permission) = "vector:upsert";
    }

    // VectorGet retrieves a single vector by ID.
    rpc VectorGet(VectorGetRequest) returns (VectorDataProto) {
        option (qrdb.v1.permission) = "vector:get";
    }

    // VectorDelete removes a single vector by ID.
    rpc VectorDelete(VectorDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:delete";
    }

    // VectorBatchUpsert inserts or updates multiple vectors.
    rpc VectorBatchUpsert(VectorBatchUpsertRequest) returns (VectorBatchUpsertResponse) {
        option (qrdb.v1.permission) = "vector:batch_upsert";
    }

    // VectorBatchDelete removes multiple vectors by ID.
    rpc VectorBatchDelete(VectorBatchDeleteRequest) returns (VectorBatchDeleteResponse) {
        option (qrdb.v1.permission) = "vector:batch_delete";
    }

    // VectorList returns a paginated list of vectors in a namespace.
    rpc VectorList(VectorListRequest) returns (VectorListResponse) {
        option (qrdb.v1.permission) = "vector:list";
    }

    // VectorUpdateMetadata updates vector metadata without modifying vector data.
    rpc VectorUpdateMetadata(VectorUpdateMetadataRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "vector:update_metadata";
    }

    // VectorSearchSimilar performs k-nearest-neighbor search using a query vector.
    rpc VectorSearchSimilar(VectorSearchSimilarRequest) returns (VectorSearchSimilarResponse) {
        option (qrdb.v1.permission) = "vector:search_similar";
    }

    // VectorSearchByMetadata returns vectors matching metadata filters.
    rpc VectorSearchByMetadata(VectorSearchByMetadataRequest) returns (VectorSearchByMetadataResponse) {
        option (qrdb.v1.permission) = "vector:search_by_metadata";
    }

    // VectorHybridSearch combines vector similarity and metadata filtering.
    rpc VectorHybridSearch(VectorHybridSearchRequest) returns (VectorHybridSearchResponse) {
        option (qrdb.v1.permission) = "vector:hybrid_search";
    }

    // VectorSearchByID searches using an existing vector's ID as the query.
    rpc VectorSearchByID(VectorSearchByIDRequest) returns (VectorSearchSimilarResponse) {
        option (qrdb.v1.permission) = "vector:search_by_id";
    }

    // VectorRebuildIndex triggers an asynchronous index rebuild for a namespace.
    rpc VectorRebuildIndex(VectorRebuildIndexRequest) returns (VectorRebuildIndexResponse) {
        option (qrdb.v1.permission) = "vector:rebuild_index";
    }

    // VectorGetRebuildProgress returns the progress of an index rebuild job.
    rpc VectorGetRebuildProgress(VectorGetRebuildProgressRequest) returns (VectorRebuildProgress) {
        option (qrdb.v1.permission) = "vector:get_rebuild_progress";
    }

    // VectorGetIndexStats returns statistics about a namespace's vector index.
    rpc VectorGetIndexStats(VectorGetIndexStatsRequest) returns (VectorIndexStats) {
        option (qrdb.v1.permission) = "vector:get_index_stats";
    }

    // VectorCompactNamespace triggers asynchronous compaction for a namespace.
    rpc VectorCompactNamespace(VectorCompactNamespaceRequest) returns (VectorCompactNamespaceResponse) {
        option (qrdb.v1.permission) = "vector:compact";
    }

    // VectorGetCompactionProgress returns the progress of a compaction job.
    rpc VectorGetCompactionProgress(VectorGetCompactionProgressRequest) returns (VectorCompactionProgress) {
        option (qrdb.v1.permission) = "vector:get_compaction_progress";
    }

    // -----------------------------------------------------------------------
    // Verifiable log operations (RFC 9162 Merkle logs, C2SP checkpoints)
    // -----------------------------------------------------------------------

    // VlogCreate creates a verifiable log in the caller's tenant and database.
    rpc VlogCreate(VlogCreateRequest) returns (VlogCreateResponse) {
        option (qrdb.v1.permission) = "vlog:create";
    }

    // VlogList lists the verifiable logs in the caller's tenant and database.
    rpc VlogList(VlogListRequest) returns (VlogListResponse) {
        option (qrdb.v1.permission) = "vlog:list";
    }

    // VlogAppend appends entries to a verifiable log in one proposal.
    rpc VlogAppend(VlogAppendRequest) returns (VlogAppendResponse) {
        option (qrdb.v1.permission) = "vlog:append";
    }

    // VlogGet reads a range of a verifiable log's entries.
    rpc VlogGet(VlogGetRequest) returns (VlogGetResponse) {
        option (qrdb.v1.permission) = "vlog:get";
    }

    // VlogProveInclusion returns an RFC 9162 inclusion proof for one leaf.
    rpc VlogProveInclusion(VlogProveInclusionRequest) returns (VlogInclusionProof) {
        option (qrdb.v1.permission) = "vlog:proof";
    }

    // VlogProveConsistency returns an RFC 9162 consistency proof between two tree sizes.
    rpc VlogProveConsistency(VlogProveConsistencyRequest) returns (VlogConsistencyProof) {
        option (qrdb.v1.permission) = "vlog:proof";
    }

    // VlogHead returns a verifiable log's current size, root and latest checkpoint.
    rpc VlogHead(VlogHeadRequest) returns (VlogHeadResponse) {
        option (qrdb.v1.permission) = "vlog:head";
    }

    // VlogSignHead signs the current head with the log's owner key and records the checkpoint.
    rpc VlogSignHead(VlogSignHeadRequest) returns (VlogSignHeadResponse) {
        option (qrdb.v1.permission) = "vlog:sign_head";
    }

    // VlogExpireBodies drops the entry bodies below a cutoff, keeping their leaf hashes.
    rpc VlogExpireBodies(VlogExpireBodiesRequest) returns (VlogExpireBodiesResponse) {
        option (qrdb.v1.permission) = "vlog:expire";
    }

    // VlogRotateKey makes a new key the one that signs the log's heads; heads
    // signed under an earlier key still verify against it.
    rpc VlogRotateKey(VlogRotateKeyRequest) returns (VlogRotateKeyResponse) {
        option (qrdb.v1.permission) = "vlog:sign_head";
    }

    // -----------------------------------------------------------------------
    // Admin operations (unchanged)
    // -----------------------------------------------------------------------

    // Health returns the node health status.
    rpc Health(google.protobuf.Empty) returns (HealthResponse) {
        option (qrdb.v1.permission) = "admin:health";
    }

    // Status returns detailed node status information.
    rpc Status(google.protobuf.Empty) returns (StatusResponse) {
        option (qrdb.v1.permission) = "admin:status";
    }

    // Peers returns the peer list for all loaded shards.
    rpc Peers(google.protobuf.Empty) returns (PeersResponse) {
        option (qrdb.v1.permission) = "admin:peers";
    }

    // AddMember adds a new node to a shard.
    rpc AddMember(AddMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:add_member";
    }

    // RemoveMember removes a node from a shard.
    rpc RemoveMember(RemoveMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:remove_member";
    }

    // PromoteMember promotes a committed observer of a shard to a voter,
    // keeping the address and identity the shard already committed for it.
    rpc PromoteMember(PromoteMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:add_member";
    }

    // TransferLeadership hands a shard's leadership to a named voter and
    // returns once it leads. A target that has not taken over within the
    // server's bound fails with UNAVAILABLE (LeaderTransferTimeoutError).
    // It carries the permission RemoveMember needs for the leadership move
    // it makes before removing a leader.
    rpc TransferLeadership(TransferLeadershipRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:remove_member";
    }

    // RequestSnapshot triggers a snapshot for the given shard.
    rpc RequestSnapshot(RequestSnapshotMessage) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:snapshot";
    }

    // Drain transitions the node into drain mode.
    rpc Drain(google.protobuf.Empty) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:drain";
    }

    // Capabilities returns the compile-time feature set of the node.
    rpc Capabilities(CapabilitiesRequest) returns (CapabilitiesResponse) {
        option (qrdb.v1.permission) = "admin:capabilities";
    }

    // StartShard initializes and starts a Raft group for the given shard.
    rpc StartShard(StartShardRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:start_shard";
    }

    // StopShard stops the Raft group for the given shard.
    rpc StopShard(StopShardRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:stop_shard";
    }

    // GetShardState returns the Raft state for a shard.
    rpc GetShardState(GetShardStateRequest) returns (ShardStateResponse) {
        option (qrdb.v1.permission) = "admin:shard_state";
    }

    // GetTopology returns the full cluster topology.
    rpc GetTopology(google.protobuf.Empty) returns (TopologyResponse) {
        option (qrdb.v1.permission) = "admin:topology";
    }

    // GetReplicaStates reports, for every replica the answering node holds,
    // its applied index and state-machine hash, so replicas of one shard can
    // be compared at an equal applied index. It answers for this node only
    // and is never forwarded. admin:replica_state is ScopeCross: system
    // tenant only.
    rpc GetReplicaStates(GetReplicaStatesRequest) returns (ReplicaStatesResponse) {
        option (qrdb.v1.permission) = "admin:replica_state";
    }

    // GetNodeCompaction returns the platform's node-keyspace compaction
    // policy. admin:node_compaction is ScopeCross: system tenant only.
    rpc GetNodeCompaction(google.protobuf.Empty) returns (NodeCompactionResponse) {
        option (qrdb.v1.permission) = "admin:node_compaction";
    }

    // SetNodeCompaction sets the platform's node-keyspace compaction policy;
    // an unset compaction turns it off. System tenant only.
    rpc SetNodeCompaction(SetNodeCompactionRequest) returns (NodeCompactionResponse) {
        option (qrdb.v1.permission) = "admin:node_compaction";
    }

    // GetStateHashes returns the answering node's replica state hashes: each
    // replica's applied index and the SHA-256 digest of its state machine at
    // that index, read locally with no proposal. admin:state_hash is
    // ScopeCross: system tenant only.
    rpc GetStateHashes(GetStateHashesRequest) returns (GetStateHashesResponse) {
        option (qrdb.v1.permission) = "admin:state_hash";
    }

    // MintJoinToken mints a single-use, identity-bound member-side CSR join
    // token (see pkg/clusterenroll.MintJoinToken). ScopeCross, platform-only:
    // no built-in role carries cluster:join_token by default.
    rpc MintJoinToken(MintJoinTokenRequest) returns (MintJoinTokenResponse) {
        option (qrdb.v1.permission) = "cluster:join_token";
    }

    // AddObserverMember adds a new replica to a shard as a non-voting
    // observer rather than a voter; see PromoteMember for turning it into a
    // voter later.
    rpc AddObserverMember(AddObserverMemberRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "admin:add_member";
    }

    // ListPendingJoinRequests lists tokenless member-side CSR join requests
    // awaiting an operator's approval or rejection (see
    // pkg/clusterenroll's approval queue). ScopeCross, platform-only, the
    // same admission decision cluster:join_token already gates.
    rpc ListPendingJoinRequests(google.protobuf.Empty) returns (ListPendingJoinRequestsResponse) {
        option (qrdb.v1.permission) = "cluster:join_token";
    }

    // ApproveJoinRequest binds a queued CSR to an operator-chosen node
    // identity; the leaf is signed the next time the joiner's own retry
    // reaches the join listener, not by this call.
    rpc ApproveJoinRequest(ApproveJoinRequestRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "cluster:join_token";
    }

    // RejectJoinRequest records a terminal refusal of a queued CSR.
    rpc RejectJoinRequest(RejectJoinRequestRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "cluster:join_token";
    }

    // RetireJoinIdentity permanently refuses any future admission for a
    // node identity (see pkg/clusterenroll.RetireJoinIdentity). ScopeCross,
    // platform-only: no built-in role carries cluster:join_identity_retire
    // by default.
    rpc RetireJoinIdentity(RetireJoinIdentityRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "cluster:join_identity_retire";
    }

    // -----------------------------------------------------------------------
    // User management
    // -----------------------------------------------------------------------

    // CreateUser creates a new passwordless user.
    rpc CreateUser(CreateUserRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:create";
    }

    // GetUser retrieves a user by ID.
    rpc GetUser(GetUserRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }

    // GetUserByUsername retrieves a user by tenant-scoped username.
    rpc GetUserByUsername(GetUserByUsernameRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }
    rpc GetUserByEmail(GetUserByEmailRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:read";
    }

    // GetUserByCertThumbprint resolves a user by an mTLS certificate's
    // SPKI thumbprint via the secondary index (the mTLS-auth hot path).
    rpc GetUserByCertThumbprint(GetUserByCertThumbprintRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:get_by_cert_thumbprint";
    }

    // AddCertBinding binds an mTLS certificate's SPKI thumbprint to a user
    // so GetUserByCertThumbprint resolves it (the enrollment seam).
    rpc AddCertBinding(AddCertBindingRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:add_cert_binding";
    }

    // RemoveCertBinding withdraws an mTLS certificate's SPKI thumbprint from a
    // user so it no longer resolves and no longer authenticates. Withdrawing
    // the LAST binding returns the account to CN/OU admission.
    rpc RemoveCertBinding(RemoveCertBindingRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:remove_cert_binding";
    }

    // UpdateUser applies partial updates to an existing user.
    rpc UpdateUser(UpdateUserProtoRequest) returns (UserResponse) {
        option (qrdb.v1.permission) = "users:update";
    }

    // DeleteUser removes a non-system user by ID.
    rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:delete";
    }

    // ListUsers returns a paginated list of users.
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
        option (qrdb.v1.permission) = "users:list";
    }

    // EnableUser activates a user account.
    rpc EnableUser(EnableUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:enable";
    }

    // DisableUser deactivates a user account.
    rpc DisableUser(DisableUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:disable";
    }

    // SuspendUser moves an active user account to suspended.
    rpc SuspendUser(SuspendUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:suspend";
    }

    // UnsuspendUser returns a suspended user account to active.
    rpc UnsuspendUser(UnsuspendUserRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "users:unsuspend";
    }

    // -----------------------------------------------------------------------
    // Role management
    // -----------------------------------------------------------------------

    // CreateRole creates a new role.
    rpc CreateRole(CreateRoleRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:create";
    }

    // GetRole retrieves a role by ID.
    rpc GetRole(GetRoleRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:read";
    }

    // GetRoleByName retrieves a role by tenant-scoped name.
    rpc GetRoleByName(GetRoleByNameRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:read";
    }

    // UpdateRole applies partial updates to an existing role.
    rpc UpdateRole(UpdateRoleProtoRequest) returns (RoleResponse) {
        option (qrdb.v1.permission) = "roles:update";
    }

    // DeleteRole removes a non-system role by ID.
    rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:delete";
    }

    // ListRoles returns a paginated list of roles.
    rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
        option (qrdb.v1.permission) = "roles:list";
    }

    // AssignRole assigns a role to a user.
    rpc AssignRole(AssignRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:assign";
    }

    // UnassignRole removes a role assignment.
    rpc UnassignRole(UnassignRoleRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "roles:unassign";
    }

    // ListPermissions returns all available permission categories.
    rpc ListPermissions(google.protobuf.Empty) returns (ListPermissionsResponse) {
        option (qrdb.v1.permission) = "permissions:list";
    }

    // ResolveRolePermissions returns the union of effective permissions
    // for the given role IDs (sorted, deduplicated).
    rpc ResolveRolePermissions(ResolveRolePermissionsRequest) returns (ResolveRolePermissionsResponse) {
        option (qrdb.v1.permission) = "permissions:resolve";
    }

    // ListOwnPermissions returns the authenticated caller's own effective
    // permissions, resolved from its role bindings in its own tenant. The
    // identity is the authenticated one, never a request field, so the RPC
    // needs authentication only: identity:gated, no permission of its own.
    rpc ListOwnPermissions(google.protobuf.Empty) returns (ListOwnPermissionsResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // Authorize answers whether an identity may perform an action on a
    // resource in the targeted tenant, decided by the server's auth chain.
    // Asking about the caller (no identity, or the caller's own subject and
    // tenant) needs authentication only: identity:gated. Asking about
    // another identity needs permissions:resolve in that identity's tenant,
    // which the handler enforces.
    rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // ReconcileBuiltInRoles converges a tenant's stored built-in roles onto
    // this build's definitions. It carries roles:create rather than a
    // permission of its own: reconciliation IS the seeding operation applied
    // to an existing tenant, and a dedicated verb would be absent from every
    // role seeded before it existed -- so nobody would hold the permission
    // needed to repair that exact absence.
    rpc ReconcileBuiltInRoles(ReconcileBuiltInRolesRequest) returns (ReconcileBuiltInRolesResponse) {
        option (qrdb.v1.permission) = "roles:create";
    }

    // ReconcileBuiltInRolesAllTenants converges the stored built-in roles of
    // EVERY tenant the serving node knows onto this build's definitions, in
    // one pass, leaving custom roles untouched. It writes every tenant's IAM
    // data, so it carries the cross-scope roles:reconcile_all, effective only
    // for a system-tenant caller. A tenant whose barrier is sealed, or that
    // the node refuses, is reported skipped; one tenant's failure is
    // reported in failed and never stops the pass.
    rpc ReconcileBuiltInRolesAllTenants(google.protobuf.Empty) returns (ReconcileBuiltInRolesAllTenantsResponse) {
        option (qrdb.v1.permission) = "roles:reconcile_all";
    }

    // -----------------------------------------------------------------------
    // Certificate management
    // -----------------------------------------------------------------------

    // IssueCert issues a certificate from a CSR for an EXISTING account of the
    // caller's own tenant, signed by that tenant's own Key B CA, and binds it
    // to the account. The requester keeps its private key: no RPC generates
    // one. (GenerateCert, which did, is removed.)
    rpc IssueCert(IssueCertRequest) returns (EnrolledCertResponse) {
        option (qrdb.v1.permission) = "certs:issue";
    }

    // EnrollCert binds a bring-your-own certificate to an EXISTING account of
    // the caller's own tenant, after verifying it chains to one of the
    // tenant's registered trust anchors and authenticates as that account.
    rpc EnrollCert(EnrollCertRequest) returns (EnrolledCertResponse) {
        option (qrdb.v1.permission) = "certs:enroll";
    }

    // IssueDelegation has the caller's own tenant's CA issue a short-lived
    // delegation certificate from a CSR: the named service principal may act
    // inside the tenant with at most the delegated scope. The system tenant
    // and a delegated caller are refused.
    rpc IssueDelegation(IssueDelegationRequest) returns (IssuedDelegationResponse) {
        option (qrdb.v1.permission) = "certs:delegate";
    }

    // TrustAnchorAdd registers CA certificates as trust anchors of
    // tenant_id, which must be the caller's own tenant.
    rpc TrustAnchorAdd(TrustAnchorAddRequest) returns (TrustAnchorListResponse) {
        option (qrdb.v1.permission) = "trust_anchors:add";
    }

    // TrustAnchorList lists tenant_id's trust anchors (the caller's own).
    rpc TrustAnchorList(TrustAnchorListRequest) returns (TrustAnchorListResponse) {
        option (qrdb.v1.permission) = "trust_anchors:list";
    }

    // TrustAnchorRemove withdraws one of tenant_id's trust anchors (the
    // caller's own).
    rpc TrustAnchorRemove(TrustAnchorRemoveRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "trust_anchors:remove";
    }

    // RevokeCert marks a certificate serial as revoked.
    rpc RevokeCert(RevokeCertRequest) returns (RevokeCertResponse) {
        option (qrdb.v1.permission) = "certs:revoke";
    }

    // ListCerts lists all issued client certificates for a tenant.
    rpc ListCerts(ListCertsRequest) returns (ListCertsResponse) {
        option (qrdb.v1.permission) = "certs:list";
    }

    // -----------------------------------------------------------------------
    // Invitation self-enrolment
    // -----------------------------------------------------------------------

    // InviteUser creates a pending account in the caller's own tenant -- or
    // re-invites one that is still pending -- and returns a single-use
    // enrolment token, returned exactly once.
    rpc InviteUser(InviteUserRequest) returns (InvitationResponse) {
        option (qrdb.v1.permission) = "users:invite";
    }

    // RedeemInvitation is PUBLIC: an invited user holds no credential yet, so
    // the token from InviteUser is the authority. No Connect/authentication
    // is required first; the server registers this method with
    // AuthMiddleware.RegisterPublicGRPCMethods, which bypasses both
    // authentication and authorization for it alone, before this option is
    // ever looked up. The "identity:public" sentinel is declared anyway so
    // the default-deny completeness guard
    // (TestGRPCPermissions_EveryMethodMapped) accounts for this RPC rather
    // than treating it the same as a forgotten annotation.
    rpc RedeemInvitation(RedeemInvitationRequest) returns (EnrolledCertResponse) {
        option (qrdb.v1.permission) = "identity:public";
    }

    // -----------------------------------------------------------------------
    // Collection operations
    // -----------------------------------------------------------------------

    // CreateCollection creates a new document collection in a database.
    rpc CreateCollection(CreateCollectionRequest) returns (CollectionInfoResponse) {
        option (qrdb.v1.permission) = "collections:create";
    }

    // GetCollectionInfo returns metadata about a specific collection.
    rpc GetCollectionInfo(GetCollectionInfoRequest) returns (CollectionInfoResponse) {
        option (qrdb.v1.permission) = "collections:read";
    }

    // ListCollections returns all collections within a database.
    rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse) {
        option (qrdb.v1.permission) = "collections:list";
    }

    // DropCollection removes a collection and all its documents.
    rpc DropCollection(DropCollectionRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:drop";
    }

    // InsertDocument inserts a document into a collection.
    rpc InsertDocument(InsertDocumentRequest) returns (InsertDocumentResponse) {
        option (qrdb.v1.permission) = "collections:insert";
    }

    // GetDocument retrieves a single document by ID.
    rpc GetDocument(GetDocumentRequest) returns (DocumentResponse) {
        option (qrdb.v1.permission) = "collections:read";
    }

    // UpdateDocument replaces an existing document in a collection.
    rpc UpdateDocument(UpdateDocumentRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:update";
    }

    // DeleteDocument removes a document from a collection by ID.
    rpc DeleteDocument(DeleteDocumentRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "collections:delete";
    }

    // ListDocuments returns a paginated list of documents in a collection.
    rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
        option (qrdb.v1.permission) = "collections:list";
    }

    // -----------------------------------------------------------------------
    // Database management operations
    // -----------------------------------------------------------------------

    // DatabaseCreate creates a new database with the specified configuration.
    rpc DatabaseCreate(DatabaseCreateRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:create";
    }

    // DatabaseGet returns information about a specific database.
    rpc DatabaseGet(DatabaseGetRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:read";
    }

    // DatabaseList returns information about all open databases.
    rpc DatabaseList(google.protobuf.Empty) returns (DatabaseListResponse) {
        option (qrdb.v1.permission) = "databases:list";
    }

    // DatabaseDrop closes and removes a database.
    rpc DatabaseDrop(DatabaseDropRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "databases:delete";
    }

    // DatabaseUpdateProtocol updates the wire protocol configuration.
    rpc DatabaseUpdateProtocol(DatabaseUpdateProtocolRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateEtcd updates the etcd wire protocol configuration.
    rpc DatabaseUpdateEtcd(DatabaseUpdateEtcdRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateRaft updates the Raft consensus configuration.
    rpc DatabaseUpdateRaft(DatabaseUpdateRaftRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseScale changes the replication factor of an existing
    // dedicated-raft database.
    rpc DatabaseScale(DatabaseScaleRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:scale";
    }

    // DatabaseUpdateBarrier updates the encryption barrier configuration.
    rpc DatabaseUpdateBarrier(DatabaseUpdateBarrierRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateConnection updates the remote connection configuration.
    rpc DatabaseUpdateConnection(DatabaseUpdateConnectionRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateSQL updates a database's SQL settings -- its
    // sql.concurrency (optimistic or pessimistic). See docs/row-locking/.
    rpc DatabaseUpdateSQL(DatabaseUpdateSQLRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "databases:update";
    }

    // DatabaseUpdateCompaction sets a database's scheduled-compaction policy
    // (off, revision or period). Setting one is compacting on a schedule, so
    // it takes mvcc:compact, and only the owning tenant may set it. See
    // docs/key-value/engineering.md "Scheduled compaction".
    rpc DatabaseUpdateCompaction(DatabaseUpdateCompactionRequest) returns (DatabaseInfoResponse) {
        option (qrdb.v1.permission) = "mvcc:compact";
    }

    // -----------------------------------------------------------------------
    // Barrier operations
    // -----------------------------------------------------------------------

    // BarrierInitialize initializes the cryptographic barrier with a single
    // master key.
    rpc BarrierInitialize(BarrierInitializeRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:bootstrap";
    }

    // BarrierUnseal unseals the barrier using the master key.
    rpc BarrierUnseal(BarrierUnsealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:unseal";
    }

    // BarrierChangePassphrase re-wraps the root key of the unsealed,
    // passphrase-sealed barrier under the next passphrase once the current
    // one opens it. A wrong current passphrase is PERMISSION_DENIED and
    // changes nothing; a concurrent root-key write is ABORTED.
    rpc BarrierChangePassphrase(BarrierChangePassphraseRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:rekey";
    }

    // BarrierSeal seals the barrier, preventing data access until unsealed.
    rpc BarrierSeal(BarrierSealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:seal";
    }

    // BarrierStatus returns the current barrier state.
    rpc BarrierStatus(google.protobuf.Empty) returns (BarrierStatusResponse) {
        option (qrdb.v1.permission) = "seal:status";
    }

    // BarrierClusterUnseal clears a cluster-wide seal of the node barrier. It
    // unseals nothing: the receiving node must already have unsealed itself.
    rpc BarrierClusterUnseal(BarrierClusterUnsealRequest) returns (ClusterSealState) {
        option (qrdb.v1.permission) = "seal:unseal";
    }

    // BarrierShamirInitialize initializes the barrier with Shamir secret sharing.
    rpc BarrierShamirInitialize(BarrierShamirInitializeRequest) returns (BarrierShamirOperationResponse) {
        option (qrdb.v1.permission) = "seal:initialize_shamir";
    }

    // BarrierEnableEncryption migrates a previously-unencrypted barrier to a
    // keyed strategy (enable encryption after the fact). The migration runs
    // asynchronously because a system-scope migration recycles the data-plane
    // server in process; the call returns immediately and clients poll
    // BarrierStatus for the strategy change.
    rpc BarrierEnableEncryption(BarrierEnableEncryptionRequest) returns (BarrierEnableEncryptionResponse) {
        // Authorized per request: seal:enable_encryption for the node's
        // barrier, tenant_barrier:enable_encryption for a named tenant's.
        option (qrdb.v1.permission) = "identity:gated";
    }

    // -----------------------------------------------------------------------
    // Barrier Security Officer management (system barrier)
    // -----------------------------------------------------------------------

    // BarrierOfficerRegister registers a new Security Officer for the system barrier.
    rpc BarrierOfficerRegister(BarrierOfficerRegisterRequest) returns (BarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "seal:officer_register";
    }

    // BarrierOfficerList lists all registered Security Officers for the system barrier.
    rpc BarrierOfficerList(google.protobuf.Empty) returns (BarrierOfficerListResponse) {
        option (qrdb.v1.permission) = "seal:officer_list";
    }

    // BarrierShareClaimBegin starts the share claim handshake for the calling SO.
    rpc BarrierShareClaimBegin(BarrierShareClaimBeginRequest) returns (BarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierShareClaimComplete completes the share claim handshake and returns
    // the share exactly once. Only callable by the SO's own mTLS session.
    rpc BarrierShareClaimComplete(BarrierShareClaimCompleteRequest) returns (BarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRecoveryOfficerRegister registers an SO for recovery key distribution.
    rpc BarrierRecoveryOfficerRegister(BarrierOfficerRegisterRequest) returns (BarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "seal:officer_register";
    }

    // BarrierRecoveryShareClaimBegin starts the recovery share claim handshake.
    rpc BarrierRecoveryShareClaimBegin(BarrierShareClaimBeginRequest) returns (BarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRecoveryShareClaimComplete completes the recovery share claim handshake.
    rpc BarrierRecoveryShareClaimComplete(BarrierShareClaimCompleteRequest) returns (BarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRecoveryGenerate generates recovery keys for disaster recovery.
    rpc BarrierRecoveryGenerate(BarrierRecoveryGenerateRequest) returns (BarrierRecoveryKeysResponse) {
        option (qrdb.v1.permission) = "seal:generate_recovery";
    }

    // BarrierRecoveryDelete deletes all stored recovery keys.
    rpc BarrierRecoveryDelete(BarrierRecoveryDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "seal:generate_recovery";
    }

    // BarrierRecoveryStatus checks whether recovery keys have been generated.
    rpc BarrierRecoveryStatus(google.protobuf.Empty) returns (BarrierRecoveryStatusResponse) {
        option (qrdb.v1.permission) = "seal:status";
    }

    // -----------------------------------------------------------------------
    // Share-holder quorums
    // -----------------------------------------------------------------------

    // BarrierQuorumBegin issues the factor challenge a share holder answers to
    // submit a share toward a quorum (unseal, seal, root-token, rekey,
    // recover). Reachable in the sealed window; the holder is authenticated
    // by the factor proof at submission.
    rpc BarrierQuorumBegin(BarrierQuorumBeginRequest) returns (BarrierQuorumChallenge) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierQuorumSubmit submits one authenticated holder's share. The
    // operation runs when M distinct holders have submitted.
    rpc BarrierQuorumSubmit(BarrierQuorumSubmitRequest) returns (BarrierQuorumOutcome) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // BarrierRekeyStart opens a rekey round; a quorum of the current holders
    // then completes it through BarrierQuorumSubmit.
    rpc BarrierRekeyStart(BarrierRekeyStartRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "seal:rekey";
    }

    // BarrierOfficerRevoke revokes a share holder by opening a rekey round
    // that excludes them; the remaining holders complete it.
    rpc BarrierOfficerRevoke(BarrierOfficerRevokeRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "seal:officer_revoke";
    }

    // -----------------------------------------------------------------------
    // Ceremony operations
    // -----------------------------------------------------------------------

    // CeremonyInitialize starts the initialization ceremony.
    rpc CeremonyInitialize(CeremonyInitializeRequest) returns (CeremonyInitializeResponse) {
        option (qrdb.v1.permission) = "ceremony:initialize";
    }

    // CeremonyStatus returns the current ceremony state.
    rpc CeremonyStatus(google.protobuf.Empty) returns (CeremonyStatusResponse) {
        option (qrdb.v1.permission) = "ceremony:status";
    }

    // CeremonySignCSR submits a CSR for signing during the ceremony.
    rpc CeremonySignCSR(CeremonySignCSRRequest) returns (CeremonySignCSRResponse) {
        option (qrdb.v1.permission) = "ceremony:sign_csr";
    }

    // -----------------------------------------------------------------------
    // Tenant operations
    // -----------------------------------------------------------------------

    // TenantCreate creates a new tenant with the given ID, name, and isolation type.
    rpc TenantCreate(TenantCreateRequest) returns (TenantCreateResponse) {
        option (qrdb.v1.permission) = "tenants:create";
    }

    // TenantGet retrieves a tenant by ID.
    rpc TenantGet(TenantGetRequest) returns (TenantResponse) {
        option (qrdb.v1.permission) = "tenants:read";
    }

    // TenantList returns metadata for all registered tenants.
    rpc TenantList(google.protobuf.Empty) returns (TenantListResponse) {
        option (qrdb.v1.permission) = "tenants:list";
    }

    // TenantUpdate applies a partial update to an existing tenant.
    rpc TenantUpdate(TenantUpdateRequest) returns (TenantResponse) {
        option (qrdb.v1.permission) = "tenants:update";
    }

    // TenantDelete removes a tenant and its metadata.
    rpc TenantDelete(TenantDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "tenants:delete";
    }

    // TenantUpdateQuotas sets the resource quotas for a tenant. Quotas are
    // the tenant's plan, set by the platform operator only: tenants:set_quotas
    // is ScopeCross.
    rpc TenantUpdateQuotas(TenantUpdateQuotasRequest) returns (TenantResponse) {
        option (qrdb.v1.permission) = "tenants:set_quotas";
    }

    // TenantUpdateEntitlements sets the feature entitlements for a tenant.
    rpc TenantUpdateEntitlements(TenantUpdateEntitlementsRequest) returns (TenantResponse) {
        option (qrdb.v1.permission) = "tenants:set_entitlements";
    }

    // TenantListDeleted pages through retired tenant ids with their deletion
    // records, in ascending id order. A deleted tenant id is retired
    // permanently; this is how an operator enumerates which ids can never be
    // used again, and when each was retired.
    rpc TenantListDeleted(TenantListDeletedRequest) returns (TenantListDeletedResponse) {
        option (qrdb.v1.permission) = "tenants:list_deleted";
    }

    // TenantReconcileDeleted removes, from the node serving the request, the
    // on-disk residue of every retired tenant id -- directories a replica kept
    // because it was down, or not hosting the tenant, when the tenant was
    // deleted. It never removes a directory a live tenant claims.
    rpc TenantReconcileDeleted(google.protobuf.Empty) returns (TenantReconcileDeletedResponse) {
        option (qrdb.v1.permission) = "tenants:reconcile_deleted";
    }

    // -----------------------------------------------------------------------
    // Volume pool operations (docs/volume-pools/api.md) -- Tier 1: every
    // capability here is served on every transport (REST, gRPC, Unix over
    // the same gRPC wire, QUIC, MCP, embedded). Every permission below is
    // ScopeCross: only an identity in the system tenant may exercise it.
    // -----------------------------------------------------------------------

    // VolumePoolList lists every pool in the catalog with its aggregate
    // usage, tenant count and per-node health tally. Not paginated: a
    // cluster has a handful of pools.
    rpc VolumePoolList(google.protobuf.Empty) returns (VolumePoolListResponse) {
        option (qrdb.v1.permission) = "volume_pools:list";
    }

    // VolumePoolGet inspects one pool, with one row per node that has
    // reported it.
    rpc VolumePoolGet(VolumePoolGetRequest) returns (VolumePoolDetail) {
        option (qrdb.v1.permission) = "volume_pools:read";
    }

    // VolumePoolCreate adds a pool to the catalog. The pool is not served
    // until each node maps it in its own configuration and restarts or
    // reloads.
    rpc VolumePoolCreate(VolumePoolCreateRequest) returns (VolumePool) {
        option (qrdb.v1.permission) = "volume_pools:create";
    }

    // VolumePoolUpdate changes a pool's description, capacity or overcommit
    // factor. The provider is immutable.
    rpc VolumePoolUpdate(VolumePoolUpdateRequest) returns (VolumePool) {
        option (qrdb.v1.permission) = "volume_pools:update";
    }

    // VolumePoolDelete removes a pool from the catalog. Refused while any
    // tenant is assigned to it.
    rpc VolumePoolDelete(VolumePoolDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "volume_pools:delete";
    }

    // VolumePoolListTenants lists the tenants assigned to a pool, with each
    // one's reservation and measured use. Paginated.
    rpc VolumePoolListTenants(VolumePoolListTenantsRequest) returns (VolumePoolListTenantsResponse) {
        option (qrdb.v1.permission) = "volume_pools:read";
    }

    // -----------------------------------------------------------------------
    // Credential operations
    // -----------------------------------------------------------------------

    // CredentialSubmit submits a named credential value via the active strategy.
    rpc CredentialSubmit(CredentialSubmitRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "credentials:submit";
    }

    // CredentialStrategy returns the active credential management strategy.
    rpc CredentialStrategy(google.protobuf.Empty) returns (CredentialStrategyResponse) {
        option (qrdb.v1.permission) = "credentials:strategy";
    }

    // CredentialDelete removes a named credential and any non-current versions.
    rpc CredentialDelete(CredentialDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "credentials:delete";
    }

    // CredentialList returns the names of every stored credential. Values are
    // never returned by enumeration.
    rpc CredentialList(CredentialListRequest) returns (CredentialListResponse) {
        option (qrdb.v1.permission) = "credentials:list";
    }

    // CredentialRotate atomically replaces the current value of a credential,
    // optionally keeping the previous version retrievable for a grace period.
    rpc CredentialRotate(CredentialRotateRequest) returns (CredentialRotateResponse) {
        option (qrdb.v1.permission) = "credentials:rotate";
    }

    // CredentialRetrieveVersion returns the stored credential value for a
    // specific version. Version == 0 means "current version".
    rpc CredentialRetrieveVersion(CredentialRetrieveVersionRequest) returns (CredentialRetrieveVersionResponse) {
        option (qrdb.v1.permission) = "credentials:retrieve_version";
    }

    // CredentialListVersions returns the version history (current + non-expired
    // grace versions) for a credential. Values are never returned.
    rpc CredentialListVersions(CredentialListVersionsRequest) returns (CredentialListVersionsResponse) {
        option (qrdb.v1.permission) = "credentials:list_versions";
    }

    // CredentialGCExpired reaps historical versions whose grace period has
    // elapsed. Returns the count reaped.
    rpc CredentialGCExpired(CredentialGCRequest) returns (CredentialGCResponse) {
        option (qrdb.v1.permission) = "credentials:gc_expired";
    }

    // CredentialStore persists a credential value under the given name.
    rpc CredentialStore(CredentialStoreRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "credentials:store";
    }

    // CredentialRetrieve returns the credential value for the given name. For
    // the manual strategy this blocks until the credential is submitted or the
    // context is cancelled.
    rpc CredentialRetrieve(CredentialRetrieveRequest) returns (CredentialRetrieveResponse) {
        option (qrdb.v1.permission) = "credentials:retrieve";
    }

    // -----------------------------------------------------------------------
    // Tenant DEK keyring operations
    //
    // Every RPC acts on the CALLER's tenant. tenant_id is optional and, when
    // set, must name that tenant; any other value is PermissionDenied, from
    // the system tenant too. Keys never leave the server.
    // -----------------------------------------------------------------------

    // TenantDEKStatus returns the caller's keyring versions (no key material).
    rpc TenantDEKStatus(TenantDEKRequest) returns (TenantDEKStatusResponse) {
        option (qrdb.v1.permission) = "dek:status";
    }

    // TenantDEKRotate adds a key version and makes it current. Earlier
    // versions keep decrypting until retired.
    rpc TenantDEKRotate(TenantDEKRequest) returns (TenantDEKStatusResponse) {
        option (qrdb.v1.permission) = "dek:rotate";
    }

    // TenantDEKRetire destroys an old key version. The current version is
    // refused (FailedPrecondition).
    rpc TenantDEKRetire(TenantDEKRetireRequest) returns (TenantDEKStatusResponse) {
        option (qrdb.v1.permission) = "dek:retire";
    }

    // TenantDEKEncrypt seals plaintext under the current key version,
    // binding aad.
    rpc TenantDEKEncrypt(TenantDEKEncryptRequest) returns (TenantDEKEncryptResponse) {
        option (qrdb.v1.permission) = "dek:encrypt";
    }

    // TenantDEKDecrypt opens a ciphertext sealed for the caller's tenant and
    // the same aad.
    rpc TenantDEKDecrypt(TenantDEKDecryptRequest) returns (TenantDEKDecryptResponse) {
        option (qrdb.v1.permission) = "dek:decrypt";
    }

    // TenantDEKRewrap re-seals a ciphertext under the current key version
    // without returning its plaintext.
    rpc TenantDEKRewrap(TenantDEKRewrapRequest) returns (TenantDEKRewrapResponse) {
        option (qrdb.v1.permission) = "dek:rewrap";
    }

    // -----------------------------------------------------------------------
    // ABAC policy operations
    //
    // Policies are records of the CALLER's tenant. A tenant_id, or a
    // document's metadata.tenant, is optional and, when set, must name that
    // tenant; any other value is PermissionDenied, from the system tenant
    // too. Every read returns the stored document unchanged.
    // -----------------------------------------------------------------------

    // CreateABACPolicy validates, compiles and stores a new policy. A name
    // the tenant already holds is AlreadyExists.
    rpc CreateABACPolicy(ABACPolicy) returns (ABACPolicy) {
        option (qrdb.v1.permission) = "abac_policies:create";
    }

    // GetABACPolicy returns one stored policy document.
    rpc GetABACPolicy(ABACPolicyRequest) returns (ABACPolicy) {
        option (qrdb.v1.permission) = "abac_policies:read";
    }

    // ListABACPolicies returns every policy of the tenant, sorted by name.
    rpc ListABACPolicies(ABACPolicyListRequest) returns (ABACPolicyListResponse) {
        option (qrdb.v1.permission) = "abac_policies:list";
    }

    // UpdateABACPolicy replaces an existing policy's document, keeping its
    // creation time. A concurrent change is Aborted.
    rpc UpdateABACPolicy(ABACPolicy) returns (ABACPolicy) {
        option (qrdb.v1.permission) = "abac_policies:update";
    }

    // DeleteABACPolicy removes one policy.
    rpc DeleteABACPolicy(ABACPolicyRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "abac_policies:delete";
    }

    // -----------------------------------------------------------------------
    // Backup operations
    // -----------------------------------------------------------------------

    // BackupCreate captures a consistent snapshot of the selected shards (or
    // all shards) and stores it as a named backup artifact.
    rpc BackupCreate(BackupCreateRequest) returns (BackupInfo) {
        option (qrdb.v1.permission) = "backup:create";
    }

    // BackupList returns metadata for every stored backup. Artifact contents
    // are never returned by enumeration.
    rpc BackupList(google.protobuf.Empty) returns (BackupListResponse) {
        option (qrdb.v1.permission) = "backup:list";
    }

    // BackupGet returns the metadata for a single backup by ID.
    rpc BackupGet(BackupGetRequest) returns (BackupInfo) {
        option (qrdb.v1.permission) = "backup:read";
    }

    // BackupDelete removes a stored backup and its artifact.
    rpc BackupDelete(BackupDeleteRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "backup:delete";
    }

    // BackupRestore restores shards from a previously created backup.
    rpc BackupRestore(BackupRestoreRequest) returns (BackupRestoreResponse) {
        option (qrdb.v1.permission) = "backup:restore";
    }

    // BackupVerify validates the integrity (checksum) of a stored backup.
    rpc BackupVerify(BackupVerifyRequest) returns (BackupVerifyResponse) {
        option (qrdb.v1.permission) = "backup:verify";
    }

    // -----------------------------------------------------------------------
    // Rebalance operations
    // -----------------------------------------------------------------------

    // RebalanceGetShardStats returns statistics for a single shard including
    // key count, byte count, leader, and replica count.
    rpc RebalanceGetShardStats(RebalanceShardStatsRequest) returns (ShardStats) {
        option (qrdb.v1.permission) = "rebalance:stats";
    }

    // RebalanceCreatePlan analyzes shard distribution across nodes and
    // generates an optimal move plan to balance the cluster.
    rpc RebalanceCreatePlan(RebalancePlanRequest) returns (RebalancePlan) {
        option (qrdb.v1.permission) = "rebalance:plan";
    }

    // RebalanceExecute executes a previously generated rebalance plan by
    // moving shards between nodes.
    rpc RebalanceExecute(RebalancePlan) returns (RebalanceExecutionResponse) {
        option (qrdb.v1.permission) = "rebalance:execute";
    }

    // RebalanceGetImbalanceReport returns the current cluster balance report
    // including per-node load distribution and hotspot identification.
    rpc RebalanceGetImbalanceReport(google.protobuf.Empty) returns (ImbalanceReport) {
        option (qrdb.v1.permission) = "rebalance:report";
    }

    // -----------------------------------------------------------------------
    // Embedding operations
    // -----------------------------------------------------------------------

    // Embed generates embedding vectors for one or more texts.
    rpc Embed(EmbedRequest) returns (EmbedResponse) {
        option (qrdb.v1.permission) = "embedding:embed";
    }

    // BatchEmbed embeds a large set of texts, splitting them into provider
    // sub-batches and aggregating the results in input order.
    rpc BatchEmbed(BatchEmbedRequest) returns (BatchEmbedResponse) {
        option (qrdb.v1.permission) = "embedding:embed";
    }

    // ListEmbeddingModels returns the embedding models available from a
    // provider.
    rpc ListEmbeddingModels(ListEmbeddingModelsRequest) returns (ListEmbeddingModelsResponse) {
        option (qrdb.v1.permission) = "embedding:list_models";
    }

    // -----------------------------------------------------------------------
    // RAG (retrieval-augmented generation) operations
    // -----------------------------------------------------------------------

    // RAGIngestDocument chunks, embeds, and stores a document for later
    // semantic retrieval.
    rpc RAGIngestDocument(RAGIngestDocumentRequest) returns (RAGIngestDocumentResponse) {
        option (qrdb.v1.permission) = "rag:ingest";
    }

    // RAGQuery embeds the query text and retrieves the most semantically
    // similar passages from a namespace.
    rpc RAGQuery(RAGQueryRequest) returns (RAGQueryResponse) {
        option (qrdb.v1.permission) = "rag:query";
    }

    // RAGDeleteDocument removes a document and all of its chunk vectors and
    // KV entries.
    rpc RAGDeleteDocument(RAGDeleteDocumentRequest) returns (RAGDeleteDocumentResponse) {
        option (qrdb.v1.permission) = "rag:delete_document";
    }

    // RAGListDocuments returns metadata about ingested documents in a
    // namespace, with optional pagination.
    rpc RAGListDocuments(RAGListDocumentsRequest) returns (RAGListDocumentsResponse) {
        option (qrdb.v1.permission) = "rag:list_documents";
    }

    // -----------------------------------------------------------------------
    // Database encryption-barrier operations
    // -----------------------------------------------------------------------

    // DatabaseSeal seals the encryption barrier for a database.
    rpc DatabaseSeal(DatabaseSealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "databases:seal";
    }

    // DatabaseUnseal unseals the encryption barrier for a database.
    rpc DatabaseUnseal(DatabaseUnsealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "databases:unseal";
    }

    // DatabaseBarrierStatus returns the encryption-barrier status for a database.
    rpc DatabaseBarrierStatus(DatabaseBarrierStatusRequest) returns (DatabaseBarrierStatusResponse) {
        option (qrdb.v1.permission) = "databases:barrier_status";
    }

    // Shamir custody of a database barrier (docs/databases/api.md): the
    // share-holder operations of a tenant barrier, scoped to one database.
    // Each request names the database and nests the system holder request,
    // whose fields mean what they mean there; a database barrier has the
    // unseal domain only.

    // DatabaseBarrierOfficerRegister enrols a share holder of a database's barrier.
    rpc DatabaseBarrierOfficerRegister(DatabaseBarrierOfficerRegisterRequest) returns (BarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "databases:officer_register";
    }

    // DatabaseBarrierOfficerList lists a database barrier's holders.
    rpc DatabaseBarrierOfficerList(DatabaseBarrierOfficerListRequest) returns (BarrierOfficerListResponse) {
        option (qrdb.v1.permission) = "databases:officer_list";
    }

    // DatabaseBarrierShamirInitialize splits a database's root key to its holders.
    rpc DatabaseBarrierShamirInitialize(DatabaseBarrierShamirInitializeRequest) returns (BarrierShamirOperationResponse) {
        option (qrdb.v1.permission) = "databases:initialize_shamir";
    }

    // DatabaseBarrierShareClaimBegin issues a holder's claim nonce. Identity-gated.
    rpc DatabaseBarrierShareClaimBegin(DatabaseBarrierShareClaimBeginRequest) returns (BarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // DatabaseBarrierShareClaimComplete delivers a holder's envelope once. Identity-gated.
    rpc DatabaseBarrierShareClaimComplete(DatabaseBarrierShareClaimCompleteRequest) returns (BarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // DatabaseBarrierQuorumBegin issues a holder's quorum challenge. Identity-gated.
    rpc DatabaseBarrierQuorumBegin(DatabaseBarrierQuorumBeginRequest) returns (BarrierQuorumChallenge) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // DatabaseBarrierQuorumSubmit submits a holder's share. Identity-gated.
    rpc DatabaseBarrierQuorumSubmit(DatabaseBarrierQuorumSubmitRequest) returns (BarrierQuorumOutcome) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // DatabaseBarrierRekeyStart opens a rekey round on a database barrier.
    rpc DatabaseBarrierRekeyStart(DatabaseBarrierRekeyStartRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "databases:rekey";
    }

    // DatabaseBarrierOfficerRevoke opens a rekey round that removes a holder.
    rpc DatabaseBarrierOfficerRevoke(DatabaseBarrierOfficerRevokeRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "databases:officer_revoke";
    }

    // DatabaseBarrierOfficerUnenrol removes an enrolled holder before the
    // database's custody is initialized, when it holds no share. After
    // initialization a holder is removed by DatabaseBarrierOfficerRevoke.
    rpc DatabaseBarrierOfficerUnenrol(DatabaseBarrierOfficerUnenrolRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "databases:officer_unenrol";
    }

    // -----------------------------------------------------------------------
    // SQL operations
    // -----------------------------------------------------------------------

    // SQLQuery executes an ad-hoc SQL query against a named database and
    // returns the result set. Mirrors the REST POST /sql/query contract.
    rpc SQLQuery(SQLQueryRequest) returns (SQLQueryResponse) {
        option (qrdb.v1.permission) = "kv:range";
    }

}

// ===========================================================================
// Basic KV messages (unchanged)
// ===========================================================================

// PutRequest is the request payload for Put.
message PutRequest {
    string key = 1;
    bytes value = 2;
    WriteMode write_mode = 3;
}

// PutResponse is the response payload for Put.
message PutResponse {}

// GetRequest is the request payload for Get.
message GetRequest {
    string key = 1;
    ConsistencyLevel consistency = 2;
}

// GetResponse is the response payload for Get.
message GetResponse {
    bytes value = 1;
}

// DeleteRequest is the request payload for Delete.
message DeleteRequest {
    string key = 1;
    WriteMode write_mode = 2;
}

// DeleteResponse is the response payload for Delete.
message DeleteResponse {}

// PutIfAbsentRequest is the request payload for PutIfAbsent.
message PutIfAbsentRequest {
    string key = 1;
    bytes value = 2;
}

// PutIfAbsentResponse reports whether the value was stored: true when the key
// was absent and the value was written, false when the key was already present.
message PutIfAbsentResponse {
    bool stored = 1;
}

// CompareAndDeleteRequest is the request payload for CompareAndDelete.
message CompareAndDeleteRequest {
    string key = 1;
    bytes expected = 2;
}

// CompareAndDeleteResponse reports whether the key was deleted: true when the
// stored value equalled expected and the key was removed, false otherwise.
message CompareAndDeleteResponse {
    bool deleted = 1;
}

// CompareAndSwapRequest is the request payload for CompareAndSwap.
message CompareAndSwapRequest {
    string key = 1;
    bytes expected = 2;
    bytes next = 3;
}

// CompareAndSwapResponse reports whether the value was replaced: true when the
// stored value equalled expected and next was written, false otherwise —
// including when the key was absent, since a swap does not create.
message CompareAndSwapResponse {
    bool swapped = 1;
}

// ListRequest is the request payload for List.
message ListRequest {
    string prefix = 1;
    ConsistencyLevel consistency = 2;
}

// ListResponse is the response payload for List.
message ListResponse {
    repeated string keys = 1;
}

// ScanRequest is the request payload for Scan.
message ScanRequest {
    string prefix = 1;
    ConsistencyLevel consistency = 2;
}

// ScanResponse is the response payload for Scan.
message ScanResponse {
    map<string, bytes> pairs = 1;
}

// ===========================================================================
// MVCC messages
// ===========================================================================

// KeyValue is a versioned key-value pair with MVCC revision metadata.
message KeyValue {
    bytes key = 1;
    bytes value = 2;
    int64 create_revision = 3;
    int64 mod_revision = 4;
    int64 version = 5;
    int64 lease_id = 6;
}

// PutWithLeaseRequest stores a key-value pair with an attached lease.
message PutWithLeaseRequest {
    string key = 1;
    bytes value = 2;
    int64 lease_id = 3;
    WriteMode write_mode = 4;
}

// PutWithLeaseResponse returns the resulting key-value.
message PutWithLeaseResponse {
    KeyValue kv = 1;
}

// GetRevisionRequest retrieves a key with full revision metadata.
message GetRevisionRequest {
    string key = 1;
    ConsistencyLevel consistency = 2;
}

// GetRevisionResponse returns the key-value with revision metadata.
message GetRevisionResponse {
    KeyValue kv = 1;
}

// GetAtRevisionRequest retrieves a key at a historical revision.
message GetAtRevisionRequest {
    string key = 1;
    int64 revision = 2;
    ConsistencyLevel consistency = 3;
}

// GetAtRevisionResponse returns the historical key-value.
message GetAtRevisionResponse {
    KeyValue kv = 1;
}

// RangeRequest queries a range of keys.
message RangeRequest {
    bytes start = 1;
    bytes end = 2;
    int64 limit = 3;
    int64 revision = 4;
    bool count_only = 5;
    bool keys_only = 6;
    SortOrder sort_order = 7;
    SortTarget sort_target = 8;
    ConsistencyLevel consistency = 9;
}

// SortOrder specifies the sort direction.
enum SortOrder {
    SORT_NONE = 0;
    SORT_ASCEND = 1;
    SORT_DESCEND = 2;
}

// SortTarget specifies which field to sort by.
enum SortTarget {
    SORT_BY_KEY = 0;
    SORT_BY_VERSION = 1;
    SORT_BY_CREATE_REVISION = 2;
    SORT_BY_MOD_REVISION = 3;
    SORT_BY_VALUE = 4;
}

// ConsistencyLevel selects the read-consistency guarantee for a read
// operation. UNSPECIFIED lets the server choose its default (linearizable),
// keeping older clients that omit the field unaffected.
enum ConsistencyLevel {
    CONSISTENCY_LEVEL_UNSPECIFIED = 0;
    CONSISTENCY_LEVEL_STRONG = 1;
    CONSISTENCY_LEVEL_LINEARIZABLE = 2;
    CONSISTENCY_LEVEL_EVENTUAL = 3;
}

// WriteMode selects the durability guarantee for a write operation.
// UNSPECIFIED lets the server choose its default (sync/quorum), keeping
// older clients that omit the field unaffected.
enum WriteMode {
    WRITE_MODE_UNSPECIFIED = 0;
    WRITE_MODE_SYNC = 1;
    WRITE_MODE_WAL_DURABLE = 2;
    WRITE_MODE_BATCHED = 3;
}

// RangeResponse returns the matched key-values, total count, and the MVCC
// revision the read was performed at.
message RangeResponse {
    repeated KeyValue kvs = 1;
    int64 count = 2;
    int64 revision = 3;
}

// CompactRequest compacts revisions up to the specified revision.
message CompactRequest {
    int64 revision = 1;
}

// CurrentRevisionResponse returns the latest revision.
message CurrentRevisionResponse {
    int64 revision = 1;
}

// RestoreAction identifies the change a restore plan makes to one key.
enum RestoreAction {
    RESTORE_ACTION_UNSPECIFIED = 0;
    RESTORE_ACTION_REVERT = 1;
    RESTORE_ACTION_RECREATE = 2;
    RESTORE_ACTION_DELETE = 3;
}

// RestoreRevisionRequest describes a selective point-in-time restore.
// Exactly one of prefix and keys must be set: an unscoped request (neither
// set) is refused, and a request setting both is refused as ambiguous.
message RestoreRevisionRequest {
    // revision is the target MVCC revision to restore the scoped keys to.
    int64 revision = 1;
    // prefix scopes the restore to every key beginning with it. Mutually
    // exclusive with keys. Carried as bytes, not string, so an arbitrary
    // byte-valued prefix round-trips exactly.
    bytes prefix = 2;
    // keys scopes the restore to an explicit key list. Mutually exclusive
    // with prefix. Carried as bytes, not string, for the same reason.
    repeated bytes keys = 3;
    // dry_run computes and returns the plan without writing anything.
    bool dry_run = 4;
    // force applies the plan unconditionally, bypassing the default
    // compare-and-swap guard on each key.
    bool force = 5;
}

// RestoreKeyChange is one entry in a restore plan: the change that would be
// (or was) applied to a single key. It never carries the restored value --
// only Applier metadata (the action and its revisions/size) -- so a plan is
// not a bulk data export of the keyspace at a historical revision.
message RestoreKeyChange {
    bytes key = 1;
    RestoreAction action = 2;
    int64 from_revision = 3;
    int64 to_revision = 4;
    int64 value_bytes = 5;
}

// RestoreRevisionResponse reports the outcome of a selective restore.
message RestoreRevisionResponse {
    int64 revision = 1;
    repeated RestoreKeyChange changes = 2;
    repeated RestoreKeyChange conflicts = 3;
    int64 applied = 4;
    int64 skipped = 5;
    int64 conflicted = 6;
    bool dry_run = 7;
}

// ===========================================================================
// Transaction messages
// ===========================================================================

// CompareTarget selects which field to compare.
enum CompareTarget {
    COMPARE_VERSION = 0;
    COMPARE_CREATE_REVISION = 1;
    COMPARE_MOD_REVISION = 2;
    COMPARE_VALUE = 3;
}

// CompareResult specifies the comparison operator.
enum CompareResult {
    COMPARE_EQUAL = 0;
    COMPARE_GREATER = 1;
    COMPARE_LESS = 2;
    COMPARE_NOT_EQUAL = 3;
}

// Compare is a single precondition in a transaction.
message Compare {
    bytes key = 1;
    CompareTarget target = 2;
    CompareResult result = 3;
    // target_union contains the comparison value based on target type.
    oneof target_union {
        int64 version = 4;
        int64 create_revision = 5;
        int64 mod_revision = 6;
        bytes value = 7;
    }
}

// OpType identifies the type of operation.
enum OpType {
    OP_PUT = 0;
    OP_GET = 1;
    OP_DELETE = 2;
    OP_RANGE = 3;
}

// Op is a single operation within a transaction or batch.
message Op {
    OpType type = 1;
    bytes key = 2;
    bytes value = 3;
    bytes range_end = 4;
    int64 lease_id = 5;
}

// OpResponse is the result of a single operation.
message OpResponse {
    repeated KeyValue kvs = 1;
    int64 count = 2;
    bool succeeded = 3;
}

// TransactionRequest executes a compare-and-swap transaction.
message TransactionRequest {
    repeated Compare compares = 1;
    repeated Op success_ops = 2;
    repeated Op failure_ops = 3;
}

// TransactionResponse returns the result of a transaction.
message TransactionResponse {
    bool succeeded = 1;
    int64 revision = 2;
    repeated OpResponse responses = 3;
}

// ===========================================================================
// Batch messages
// ===========================================================================

// BatchRequest executes multiple operations atomically.
message BatchRequest {
    repeated Op ops = 1;
}

// BatchResponse returns the per-operation results and the single MVCC
// revision every write in the batch committed at (zero when the batch held
// no put or delete).
message BatchResponse {
    repeated OpResponse responses = 1;
    int64 revision = 2;
}

// BatchImportError describes a single row that failed during import. Named
// for the single-message BatchImport RPC it originally served (deleted, no
// compat, go-qrdb#576 part 2); kept and reused by ImportCommitResponse
// below, which carries the same per-row failure shape.
message BatchImportError {
    int32  row     = 1;
    string key     = 2;
    string message = 3;
}

// ImportBeginRequest configures a chunked import session.
message ImportBeginRequest {
    string format        = 1;
    string filename      = 2;
    string key_field     = 3;
    string value_mode    = 4;
    string value_field   = 5;
    bool   skip_header   = 6;
    bool   transactional = 7;
}

// ImportBeginResponse carries the new session's ID.
message ImportBeginResponse {
    string session_id = 1;
}

// ImportAppendRequest stages chunk as sequence seq of session_id.
message ImportAppendRequest {
    string session_id = 1;
    uint64 seq         = 2;
    bytes  chunk       = 3;
}

// ImportAppendResponse is empty: success is the response arriving at all.
message ImportAppendResponse {}

// ImportCommitRequest names the session to apply.
message ImportCommitRequest {
    string session_id = 1;
}

// ImportCommitResponse returns import statistics, reusing BatchImportError
// for its per-row failures.
message ImportCommitResponse {
    int32                     total     = 1;
    int32                     succeeded = 2;
    int32                     failed    = 3;
    repeated BatchImportError errors    = 4;
}

// ImportAbortRequest names the session to discard.
message ImportAbortRequest {
    string session_id = 1;
}

// ImportAbortResponse is empty: success is the response arriving at all.
message ImportAbortResponse {}

// ===========================================================================
// Watch messages
// ===========================================================================

// EventType identifies the type of a watch event.
enum EventType {
    EVENT_PUT = 0;
    EVENT_DELETE = 1;
}

// Event represents a single change to a key.
message Event {
    EventType type = 1;
    KeyValue kv = 2;
    KeyValue prev_kv = 3;
}

// WatchRequest creates a watcher.
message WatchRequest {
    bytes key = 1;
    bytes range_end = 2;
    int64 start_revision = 3;
    bool prev_kv = 4;
    bool progress_notify = 5;
}

// WatchResponse delivers watch events.
message WatchResponse {
    int64 watch_id = 1;
    repeated Event events = 2;
    bool canceled = 3;
    string cancel_reason = 4;
    int64 revision = 5;
}

// ===========================================================================
// Lease messages
// ===========================================================================

// Lease describes a distributed TTL lease.
message Lease {
    int64 id = 1;
    int64 ttl = 2;
    int64 granted_ttl = 3;
    int64 remaining_ttl = 4;
    repeated bytes keys = 5;
}

// LeaseGrantRequest creates a new lease.
message LeaseGrantRequest {
    int64 ttl = 1;
}

// LeaseGrantResponse returns the created lease.
message LeaseGrantResponse {
    Lease lease = 1;
}

// LeaseRevokeRequest expires a lease.
message LeaseRevokeRequest {
    int64 lease_id = 1;
}

// LeaseKeepAliveRequest resets a lease TTL.
message LeaseKeepAliveRequest {
    int64 lease_id = 1;
}

// LeaseKeepAliveResponse returns the refreshed lease.
message LeaseKeepAliveResponse {
    Lease lease = 1;
}

// LeaseTimeToLiveRequest queries a lease.
message LeaseTimeToLiveRequest {
    int64 lease_id = 1;
}

// LeaseTimeToLiveResponse returns the lease state.
message LeaseTimeToLiveResponse {
    Lease lease = 1;
}

// LeaseListResponse returns all active leases.
message LeaseListResponse {
    repeated Lease leases = 1;
}

// ===========================================================================
// Distributed lock messages
// ===========================================================================

// LockInfo describes an acquired distributed lock.
message LockInfo {
    string key = 1;
    int64 fencing_token = 2;
    int64 lease_id = 3;
    string holder_id = 4;
    bool reentrant = 5;
    int32 acquire_count = 6;
    int64 ttl = 7;
    int64 acquired_at = 8;
}

// LockAcquireRequest acquires a lock, blocking until acquired.
message LockAcquireRequest {
    string key = 1;
    string holder_id = 2;
    int64 ttl = 3;
    bool reentrant = 4;
}

// LockAcquireResponse returns the acquired lock.
message LockAcquireResponse {
    LockInfo lock = 1;
}

// LockTryLockRequest attempts to acquire a lock without blocking.
message LockTryLockRequest {
    string key = 1;
    string holder_id = 2;
    int64 ttl = 3;
    bool reentrant = 4;
}

// LockTryLockResponse returns the acquired lock.
message LockTryLockResponse {
    LockInfo lock = 1;
}

// LockReleaseRequest releases a held lock.
message LockReleaseRequest {
    string key = 1;
    int64 fencing_token = 2;
}

// LockExtendRequest refreshes the TTL on a held lock.
message LockExtendRequest {
    string key = 1;
    int64 fencing_token = 2;
}

// LockExtendResponse returns the updated lock state.
message LockExtendResponse {
    LockInfo lock = 1;
}

// LockStatusRequest queries the current state of a lock.
message LockStatusRequest {
    string key = 1;
}

// LockStatusResponse returns the lock state.
message LockStatusResponse {
    LockInfo lock = 1;
}

// LockListRequest lists active locks filtered by key prefix.
message LockListRequest {
    string prefix = 1;
}

// LockListResponse returns active locks.
message LockListResponse {
    repeated LockInfo locks = 1;
}

// ===========================================================================
// Index messages (Tier 2)
// ===========================================================================

// IndexCreateRequest creates a new secondary index.
message IndexCreateRequest {
    string name = 1;
    string field_name = 2;
    bool unique = 3;
    bool sparse = 4;
    // numeric encodes field values as order-preserving numeric terms
    // so byte ordering matches numeric ordering. Absent means string ordering,
    // which is what every request written before this field existed meant.
    bool numeric = 5;
    // case_insensitive folds string field values on write, backfill and
    // lookup. The field marks the POSITIVE claim so an absent value decodes to
    // a case-SENSITIVE index -- the behaviour requests predating it were
    // created under (go-qrdb#34).
    bool case_insensitive = 6;
}

// IndexDropRequest removes a secondary index.
message IndexDropRequest {
    string name = 1;
}

// IndexQueryRequest queries an index for exact match.
message IndexQueryRequest {
    string index_name = 1;
    bytes value = 2;
}

// IndexQueryResponse returns matching entry keys.
message IndexQueryResponse {
    repeated bytes keys = 1;
}

// IndexScanRequest scans an index within a value range.
message IndexScanRequest {
    string index_name = 1;
    // start and end are OPTIONAL: an absent bound means the range is open on
    // that side (go-qrdb#36). An explicit empty bound is distinct from an
    // absent one, which is why proto3 `optional` presence is required here.
    optional bytes start = 2;
    optional bytes end = 3;
}

// IndexScanEntry maps an index value to its matching entry keys.
message IndexScanEntry {
    string value = 1;
    repeated bytes keys = 2;
}

// IndexScanResponse returns the scan results.
message IndexScanResponse {
    repeated IndexScanEntry entries = 1;
}

// IndexListResponse returns the names of all registered indexes.
message IndexListResponse {
    repeated string names = 1;
}

// ===========================================================================
// Time-series messages (Tier 2)
// ===========================================================================

// TSTag is a key-value label for time-series data.
message TSTag {
    string key = 1;
    string value = 2;
}

// TSDataPoint is a single time-series measurement.
message TSDataPoint {
    string metric = 1;
    double value = 2;
    int64 timestamp_ns = 3;
    repeated TSTag tags = 4;
}

// TSWriteRequest stores a single data point.
message TSWriteRequest {
    TSDataPoint point = 1;
}

// TSWriteBatchRequest stores multiple data points.
message TSWriteBatchRequest {
    repeated TSDataPoint points = 1;
}

// TSQueryRequest retrieves data points in a time range.
message TSQueryRequest {
    string metric = 1;
    int64 start_ns = 2;
    int64 end_ns = 3;
    repeated TSTag tags = 4;
    int32 limit = 5;
    bool descending = 6;
    ConsistencyLevel consistency = 7;
}

// TSQueryResponse returns matching data points.
message TSQueryResponse {
    repeated TSDataPoint points = 1;
}

// AggFunc identifies an aggregation function.
enum AggFunc {
    AGG_AVG = 0;
    AGG_SUM = 1;
    AGG_MIN = 2;
    AGG_MAX = 3;
    AGG_COUNT = 4;
    AGG_PERCENTILE = 5;
}

// TSAggregateRequest computes an aggregation over a time range.
message TSAggregateRequest {
    string metric = 1;
    int64 start_ns = 2;
    int64 end_ns = 3;
    AggFunc function = 4;
    int64 interval_ns = 5;
    ConsistencyLevel consistency = 6;
}

// TSAggResult is an aggregation result for a single interval.
message TSAggResult {
    int64 timestamp_ns = 1;
    double value = 2;
    int64 count = 3;
}

// TSAggregateResponse returns the aggregation results.
message TSAggregateResponse {
    repeated TSAggResult results = 1;
}

// TSRichQueryRequest performs a rich query with aggregation, downsampling, and grouping.
message TSRichQueryRequest {
    string metric = 1;
    repeated TSTag tags = 2;
    int64 start_ns = 3;
    int64 end_ns = 4;
    AggFunc aggregation = 5;
    int64 interval_ns = 6;
    repeated string group_by = 7;
    int32 limit = 8;
    double percentile = 9;
    ConsistencyLevel consistency = 10;
}

// TSRichQueryResponse returns the result of a rich query.
message TSRichQueryResponse {
    string metric = 1;
    repeated TSTag tags = 2;
    repeated TSDataPoint points = 3;
    double aggregated_value = 4;
    bool has_aggregated_value = 5;
    repeated TSGroupedResult grouped_results = 6;
}

// TSGroupedResult is a grouped query result containing tags, points, and optional aggregation.
message TSGroupedResult {
    repeated TSTag tags = 1;
    repeated TSDataPoint points = 2;
    double aggregated_value = 3;
    bool has_aggregated_value = 4;
}

// TSDeleteSeriesRequest deletes time-series data matching the criteria.
message TSDeleteSeriesRequest {
    string metric = 1;
    repeated TSTag tags = 2;
    int64 start_ns = 3;
    int64 end_ns = 4;
}

// TSGetRetentionRequest retrieves the retention policy for a metric.
message TSGetRetentionRequest {
    string metric = 1;
}

// TSRetentionPolicyResponse returns the retention policy for a metric.
message TSRetentionPolicyResponse {
    int64 duration_ns = 1;
    int64 resolution_ns = 2;
    AggFunc aggregation = 3;
}

// TSSetRetentionRequest sets the retention policy for a metric.
message TSSetRetentionRequest {
    string metric = 1;
    int64 duration_ns = 2;
    int64 resolution_ns = 3;
    AggFunc aggregation = 4;
}

// TSListMetricsRequest lists metric names matching a prefix.
message TSListMetricsRequest {
    string prefix = 1;
    int32 limit = 2;
    ConsistencyLevel consistency = 3;
}

// TSListMetricsResponse returns matching metric names.
message TSListMetricsResponse {
    repeated string metrics = 1;
}

// ===========================================================================
// Admin messages (unchanged)
// ===========================================================================

// HealthResponse is the response payload for Health.
message HealthResponse {
    string status = 1;
    bool leader = 2;

    // diagnostics_dropped is the process-wide count of go-quicraft library
    // log records dropped since the process started because the slog
    // handler was not keeping up with its bounded diagnostics queue. A
    // rising count means the handler is blocking or far slower than the
    // process logs.
    uint64 diagnostics_dropped = 3;
}

// StatusResponse is the response payload for Status.
message StatusResponse {
    string node_id = 1;
    string raft_address = 2;
    bool is_leader = 3;
    uint64 leader_id = 4;
    int32 shard_count = 5;
    bool is_draining = 6;
}

// PeersResponse is the response payload for Peers.
message PeersResponse {
    repeated ShardPeers shards = 1;
}

// ShardPeers describes the peers for a single shard.
message ShardPeers {
    uint64 shard_id = 1;
    uint64 leader_id = 2;
    repeated PeerInfo peers = 3;
}

// PeerInfo describes a single peer in a shard.
message PeerInfo {
    uint64 replica_id = 1;
    string address = 2;
    bool is_leader = 3;
}

// AddMemberRequest is the request payload for AddMember.
message AddMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    string raft_address = 3;
    // member_identity is the operator-supplied Raft member identity
    // (spki:<sha256-hex>) of the replica. Empty means "the identity the
    // cluster has already committed for this replica or its host". Required
    // for a node no committed membership names yet.
    string member_identity = 4;
}

// RemoveMemberRequest is the request payload for RemoveMember.
message RemoveMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
}

// PromoteMemberRequest is the request payload for PromoteMember.
message PromoteMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
}

// TransferLeadershipRequest is the request payload for TransferLeadership.
message TransferLeadershipRequest {
    uint64 shard_id = 1;
    // replica_id is the voter that is to lead shard_id.
    uint64 replica_id = 2;
}

// RequestSnapshotMessage is the request payload for RequestSnapshot.
message RequestSnapshotMessage {
    uint64 shard_id = 1;
}

// MintJoinTokenRequest is the request payload for MintJoinToken.
// ttl_seconds <= 0 uses the server's default TTL.
message MintJoinTokenRequest {
    string node_id    = 1;
    int64  ttl_seconds = 2;
}

// MintJoinTokenResponse is returned by MintJoinToken. token is returned
// exactly once; there is no "list minted tokens" read path.
message MintJoinTokenResponse {
    string token      = 1;
    string expires_at = 2;  // RFC3339
}

// AddObserverMemberRequest is the request payload for AddObserverMember.
message AddObserverMemberRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    string raft_address = 3;
    // member_identity is the operator-supplied Raft member identity
    // (spki:<sha256-hex>) of the replica. Empty means "the identity the
    // cluster has already committed for this replica or its host".
    string member_identity = 4;
}

// PendingJoinRequestMessage describes one queued, tokenless member-side
// CSR join request awaiting a decision -- see ListPendingJoinRequests.
message PendingJoinRequestMessage {
    string id = 1;
    // node_uri is the joiner's OWN self-reported identity, informational
    // only: it plays no part in the identity ApproveJoinRequest eventually
    // binds the leaf to.
    string node_uri = 2;
    uint64 replica_id = 3;
    repeated string features = 4;
    string submitted_at = 5;  // RFC3339
    string expires_at = 6;    // RFC3339
}

// ListPendingJoinRequestsResponse is returned by ListPendingJoinRequests.
message ListPendingJoinRequestsResponse {
    repeated PendingJoinRequestMessage requests = 1;
}

// ApproveJoinRequestRequest is the request payload for ApproveJoinRequest.
message ApproveJoinRequestRequest {
    string id      = 1;
    string node_id = 2;
}

// RejectJoinRequestRequest is the request payload for RejectJoinRequest.
message RejectJoinRequestRequest {
    string id     = 1;
    string reason = 2;
}

// RetireJoinIdentityRequest is the request payload for RetireJoinIdentity.
// reason is an optional, free-text operator note carried for audit only.
message RetireJoinIdentityRequest {
    string node_id = 1;
    string reason   = 2;
}

// CapabilitiesRequest is the request payload for Capabilities.
message CapabilitiesRequest {}

// CapabilitiesResponse describes the effective feature set of the node:
// the intersection of build tags, run mode, and configuration. A false
// value may mean not-compiled, mode-gated, or config-disabled.
message CapabilitiesResponse {
    bool kv = 1;
    bool mvcc = 2;
    bool transaction = 3;
    bool batch = 4;
    bool watch = 5;
    bool lease = 6;
    bool index = 7;
    bool time_series = 8;
    bool vector = 9;
    // mode is the run mode: "standalone" or "raft".
    string mode = 10;
    bool lock = 11;
    bool cluster = 12;
    bool backup = 13;
    bool rebalance = 14;
    bool sql = 15;
    bool mysql = 16;
    bool postgresql = 17;
    bool etcd = 18;
    bool fts = 19;
    // unencrypted_at_rest lists, when seal is enabled, where the node keeps
    // data on disk outside the barrier's at-rest encryption. Empty otherwise.
    repeated string unencrypted_at_rest = 20;
}

// StartShardRequest is the request payload for StartShard.
message StartShardRequest {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    map<uint64, string> members = 3;
    bool join = 4;
}

// StopShardRequest is the request payload for StopShard.
message StopShardRequest {
    uint64 shard_id = 1;
}

// GetShardStateRequest is the request payload for GetShardState.
message GetShardStateRequest {
    uint64 shard_id = 1;
}

// ShardStateResponse describes the Raft state of a single shard.
message ShardStateResponse {
    uint64 shard_id = 1;
    uint64 config_change_index = 2;
    uint64 term = 3;
    uint64 leader_id = 4;
    bool has_leader = 5;
}

// TopologyResponse describes the full cluster topology.
message TopologyResponse {
    string node_id = 1;
    string raft_address = 2;
    int32 shard_count = 3;
    repeated ShardInfoProto shards = 4;
}

// ShardInfoProto describes a single shard in the topology.
message ShardInfoProto {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    bool is_leader = 3;
    uint64 leader_id = 4;
    map<uint64, string> nodes = 5;
}

// GetReplicaStatesRequest selects the shard to report; 0 reports every shard
// the node holds a replica of.
message GetReplicaStatesRequest {
    uint64 shard_id = 1;
}

// ReplicaStatesResponse lists the answering node's replicas, ordered by
// shard ID. Witnesses hold no state machine and are never listed.
message ReplicaStatesResponse {
    string node_id = 1;
    repeated ReplicaStateProto replicas = 2;
}

// ReplicaStateProto is one replica's applied index and the hash of its state
// machine taken at that index. Two replicas of a shard at the same applied
// index hold the same state exactly when their hashes are equal.
message ReplicaStateProto {
    uint64 shard_id = 1;
    uint64 replica_id = 2;
    uint64 applied_index = 3;
    uint64 hash = 4;
}

// ===========================================================================
// Vector messages (Tier 2)
// ===========================================================================

// DistanceMetric specifies how vector similarity is measured.
enum DistanceMetric {
    // DISTANCE_COSINE measures the cosine of the angle between vectors.
    DISTANCE_COSINE = 0;

    // DISTANCE_EUCLIDEAN measures the straight-line distance between vectors.
    DISTANCE_EUCLIDEAN = 1;

    // DISTANCE_DOT_PRODUCT measures similarity via the dot product.
    DISTANCE_DOT_PRODUCT = 2;

    // DISTANCE_MANHATTAN measures the sum of absolute coordinate differences
    // (the L1 distance) between vectors.
    DISTANCE_MANHATTAN = 3;
}

// VectorIndexType specifies the vector index algorithm.
enum VectorIndexType {
    // INDEX_HNSW uses hierarchical navigable small world graphs.
    INDEX_HNSW = 0;

    // INDEX_FLAT uses brute-force exact search.
    INDEX_FLAT = 1;

    // INDEX_IVF_FLAT uses inverted file index with flat quantization.
    INDEX_IVF_FLAT = 2;
}

// ---------------------------------------------------------------------------
// Namespace messages
// ---------------------------------------------------------------------------

// VectorCreateNamespaceRequest creates a new vector namespace.
message VectorCreateNamespaceRequest {
    string namespace = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    string index_params_json = 5;
    uint64 shard_id = 6;
}

// VectorCreateNamespaceResponse is the result of a namespace creation.
message VectorCreateNamespaceResponse {
    bool created = 1;
    int64 timestamp = 2;
}

// VectorUpdateNamespaceRequest changes a namespace in place. Each key of the
// index parameters and metadata is merged over the stored value; a key not
// named keeps its value. A non-zero dimension must equal the namespace's.
message VectorUpdateNamespaceRequest {
    string namespace = 1;
    int32 dimension = 2;
    string index_params_json = 3;
    string metadata_json = 4;
}

// VectorUpdateNamespaceResponse reports an in-place namespace update.
message VectorUpdateNamespaceResponse {
    bool updated = 1;
    bool requires_rebuild = 2;
    int64 timestamp = 3;
}

// VectorDeleteNamespaceRequest removes a namespace and all its vectors.
message VectorDeleteNamespaceRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorListNamespacesRequest lists all vector namespaces.
message VectorListNamespacesRequest {
    uint64 shard_id = 1;
}

// VectorListNamespacesResponse returns all namespace names.
message VectorListNamespacesResponse {
    repeated string namespaces = 1;
}

// VectorGetNamespaceInfoRequest retrieves namespace metadata.
message VectorGetNamespaceInfoRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorNamespaceInfo contains metadata about a vector namespace.
message VectorNamespaceInfo {
    string namespace = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    int64 vector_count = 5;
    int64 created_at = 6;
    int64 updated_at = 7;
    // index_config is the namespace's index parameters, as merged by every
    // VectorUpdateNamespace so far.
    map<string, string> index_config = 8;
    // metadata_json is the namespace's metadata as a JSON object, as merged
    // by every VectorUpdateNamespace so far; empty when it has none.
    string metadata_json = 9;
}

// ---------------------------------------------------------------------------
// Vector CRUD messages
// ---------------------------------------------------------------------------

// VectorDataProto represents a single vector with metadata and versioning.
message VectorDataProto {
    string id = 1;
    repeated float vector = 2;
    string metadata_json = 3;
    int64 version = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// VectorUpsertRequest inserts or updates a vector.
message VectorUpsertRequest {
    string namespace = 1;
    string id = 2;
    repeated float vector = 3;
    string metadata_json = 4;
    uint64 shard_id = 5;
}

// VectorUpsertResponse is the result of a vector upsert.
message VectorUpsertResponse {
    int64 version = 1;
    int64 timestamp = 2;
    bool created = 3;
}

// VectorGetRequest retrieves a single vector by ID.
message VectorGetRequest {
    string namespace = 1;
    string id = 2;
    ConsistencyLevel consistency = 3;
    uint64 shard_id = 4;
}

// VectorDeleteRequest removes a single vector by ID.
message VectorDeleteRequest {
    string namespace = 1;
    string id = 2;
    uint64 shard_id = 3;
}

// VectorBatchError describes a failure for a single vector in a batch.
message VectorBatchError {
    string id = 1;
    string error = 2;
}

// VectorBatchUpsertRequest inserts or updates multiple vectors.
message VectorBatchUpsertRequest {
    string namespace = 1;
    repeated VectorDataProto vectors = 2;
    uint64 shard_id = 3;
}

// VectorBatchUpsertResponse is the result of a batch upsert.
message VectorBatchUpsertResponse {
    int32 succeeded = 1;
    int32 failed = 2;
    repeated VectorBatchError errors = 3;
}

// VectorBatchDeleteRequest removes multiple vectors by ID.
message VectorBatchDeleteRequest {
    string namespace = 1;
    repeated string ids = 2;
    uint64 shard_id = 3;
}

// VectorBatchDeleteResponse is the result of a batch delete.
message VectorBatchDeleteResponse {
    int32 deleted = 1;
    int32 failed = 2;
    repeated VectorBatchError errors = 3;
}

// VectorListRequest returns a paginated list of vectors.
message VectorListRequest {
    string namespace = 1;
    int32 limit = 2;
    int32 offset = 3;
    string cursor = 4;
    uint64 shard_id = 5;
}

// VectorListResponse contains a paginated list of vectors.
message VectorListResponse {
    repeated VectorDataProto vectors = 1;
    string next_cursor = 2;
    int64 total = 3;
}

// VectorUpdateMetadataRequest updates vector metadata without modifying data.
message VectorUpdateMetadataRequest {
    string namespace = 1;
    string id = 2;
    string metadata_json = 3;
    uint64 shard_id = 4;
}

// ---------------------------------------------------------------------------
// Vector search messages
// ---------------------------------------------------------------------------

// VectorSearchResultProto is a single result from a similarity search.
message VectorSearchResultProto {
    string id = 1;
    double score = 2;
    repeated float vector = 3;
    string metadata_json = 4;
}

// VectorSearchSimilarRequest performs k-nearest-neighbor search.
message VectorSearchSimilarRequest {
    string namespace = 1;
    repeated float vector = 2;
    int32 k = 3;
    int32 ef_search = 4;
    double min_score = 5;
    ConsistencyLevel consistency = 6;
    uint64 shard_id = 7;
}

// VectorSearchSimilarResponse contains similarity search results.
message VectorSearchSimilarResponse {
    repeated VectorSearchResultProto results = 1;
    int64 took = 2;
}

// VectorSearchByMetadataRequest returns vectors matching metadata filters.
message VectorSearchByMetadataRequest {
    string namespace = 1;
    string filters_json = 2;
    int32 limit = 3;
    int32 offset = 4;
    ConsistencyLevel consistency = 5;
    uint64 shard_id = 6;
}

// VectorSearchByMetadataResponse contains metadata search results.
message VectorSearchByMetadataResponse {
    repeated VectorDataProto results = 1;
    int64 total = 2;
}

// VectorHybridSearchRequest combines vector similarity and metadata filtering.
message VectorHybridSearchRequest {
    string namespace = 1;
    repeated float vector = 2;
    string metadata_filters_json = 3;
    int32 k = 4;
    double vector_weight = 5;
    double metadata_weight = 6;
    ConsistencyLevel consistency = 7;
    uint64 shard_id = 8;
}

// VectorHybridSearchResponse contains hybrid search results.
message VectorHybridSearchResponse {
    repeated VectorSearchResultProto results = 1;
    int64 took = 2;
}

// VectorSearchByIDRequest searches using an existing vector's ID.
message VectorSearchByIDRequest {
    string namespace = 1;
    string id = 2;
    int32 k = 3;
    ConsistencyLevel consistency = 4;
    uint64 shard_id = 5;
}

// ---------------------------------------------------------------------------
// Vector index management messages
// ---------------------------------------------------------------------------

// VectorRebuildIndexRequest triggers an asynchronous index rebuild.
message VectorRebuildIndexRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorRebuildIndexResponse is the result of an index rebuild request.
message VectorRebuildIndexResponse {
    string job_id = 1;
    bool started = 2;
    int64 timestamp = 3;
}

// VectorGetRebuildProgressRequest queries rebuild progress.
message VectorGetRebuildProgressRequest {
    string namespace = 1;
    string job_id = 2;
    uint64 shard_id = 3;
}

// VectorRebuildProgress describes the current state of a rebuild job.
message VectorRebuildProgress {
    string job_id = 1;
    string status = 2;
    double progress = 3;
    int64 started_at = 4;
    int64 finished_at = 5;
    string error = 6;
}

// VectorGetIndexStatsRequest queries index statistics.
message VectorGetIndexStatsRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorIndexStats describes the current state of a namespace's vector index.
message VectorIndexStats {
    int64 vector_count = 1;
    int32 dimension = 2;
    DistanceMetric distance_metric = 3;
    VectorIndexType index_type = 4;
    int64 memory_usage = 5;
    int64 disk_usage = 6;
}

// ---------------------------------------------------------------------------
// Vector compaction messages
// ---------------------------------------------------------------------------

// VectorCompactNamespaceRequest triggers asynchronous namespace compaction.
message VectorCompactNamespaceRequest {
    string namespace = 1;
    uint64 shard_id = 2;
}

// VectorCompactNamespaceResponse is the result of a compaction request.
message VectorCompactNamespaceResponse {
    string job_id = 1;
    bool started = 2;
}

// VectorGetCompactionProgressRequest queries compaction progress.
message VectorGetCompactionProgressRequest {
    string namespace = 1;
    string job_id = 2;
    uint64 shard_id = 3;
}

// VectorCompactionProgress describes the current state of a compaction job.
message VectorCompactionProgress {
    string job_id = 1;
    string status = 2;
    double progress = 3;
    int64 started_at = 4;
    int64 finished_at = 5;
    string error = 6;
}

// ===========================================================================
// Verifiable log messages
// ===========================================================================
//
// Every request names its log within the caller's tenant; the database is
// taken from the request metadata, as for the vector requests.

// VlogSignatureType is the signature scheme of a log's owner key, restricted
// to the RFC 9162 types.
enum VlogSignatureType {
    // VLOG_SIGNATURE_TYPE_UNSPECIFIED names no key: a log created with it has
    // no owner key and its head cannot be signed.
    VLOG_SIGNATURE_TYPE_UNSPECIFIED = 0;

    // VLOG_SIGNATURE_TYPE_ED25519 is Ed25519 (signed-note type 0x01).
    VLOG_SIGNATURE_TYPE_ED25519 = 1;

    // VLOG_SIGNATURE_TYPE_ECDSA_P256_SHA256 is ECDSA over P-256 with SHA-256
    // (signed-note type 0x02).
    VLOG_SIGNATURE_TYPE_ECDSA_P256_SHA256 = 2;
}

// VlogLogID identifies a verifiable log.
message VlogLogID {
    string tenant_id = 1;
    string database = 2;
    string log = 3;
}

// VlogHeadKey is one version of a log's owner key.
message VlogHeadKey {
    uint32 version = 1;
    // ref is the key's reference in the key store.
    string ref = 2;
    // public_key is the PKIX DER public key a verifier checks heads against.
    bytes public_key = 3;
}

// VlogCreateRequest creates a verifiable log.
message VlogCreateRequest {
    string log = 1;
    // origin is the log's identity, the first line of every checkpoint for it.
    string origin = 2;
    // verifier_keys are the keys a checkpoint's signature is checked against.
    repeated string verifier_keys = 3;
    bool allow_expire_bodies = 4;
    // signing_key_type creates an owner key of that type; UNSPECIFIED creates none.
    VlogSignatureType signing_key_type = 5;
}

// VlogCreateResponse is the created log and its owner key, if one was created.
message VlogCreateResponse {
    VlogLogID log = 1;
    VlogHeadKey key = 2;
}

// VlogListRequest lists the logs in the caller's tenant and database.
message VlogListRequest {}

// VlogListResponse is the logs in one database.
message VlogListResponse {
    repeated VlogLogID logs = 1;
}

// VlogAppendRequest appends entries to a log.
message VlogAppendRequest {
    string log = 1;
    repeated bytes entries = 2;
}

// VlogAppendResponse is the leaf index of the first appended entry and the
// number appended.
message VlogAppendResponse {
    uint64 first_index = 1;
    int64 count = 2;
}

// VlogGetRequest reads up to limit entries from leaf index from.
message VlogGetRequest {
    string log = 1;
    uint64 from = 2;
    int64 limit = 3;
}

// VlogEntry is one log entry; an expired entry has no body.
message VlogEntry {
    uint64 index = 1;
    bytes body = 2;
    bool expired = 3;
}

// VlogGetResponse is the entries read.
message VlogGetResponse {
    repeated VlogEntry entries = 1;
}

// VlogProveInclusionRequest asks for the inclusion proof of leaf_index in the
// tree of tree_size leaves.
message VlogProveInclusionRequest {
    string log = 1;
    uint64 leaf_index = 2;
    uint64 tree_size = 3;
}

// VlogInclusionProof is an RFC 9162 section 2.1.3 inclusion proof.
message VlogInclusionProof {
    uint64 leaf_index = 1;
    uint64 tree_size = 2;
    repeated bytes hashes = 3;
}

// VlogProveConsistencyRequest asks for the consistency proof between tree
// sizes size1 and size2.
message VlogProveConsistencyRequest {
    string log = 1;
    uint64 size1 = 2;
    uint64 size2 = 3;
}

// VlogConsistencyProof is an RFC 9162 section 2.1.4 consistency proof.
message VlogConsistencyProof {
    uint64 size1 = 1;
    uint64 size2 = 2;
    repeated bytes hashes = 3;
}

// VlogHeadRequest reads a log's head.
message VlogHeadRequest {
    string log = 1;
}

// VlogHeadResponse is a log's current size and root, the lowest index whose
// body is kept, and the latest checkpoint with its tree size.
message VlogHeadResponse {
    uint64 size = 1;
    bytes root = 2;
    uint64 bodies_from = 3;
    bytes checkpoint = 4;
    uint64 checkpoint_size = 5;
}

// VlogSignHeadRequest signs a log's current head.
message VlogSignHeadRequest {
    string log = 1;
}

// VlogSignedHead is a head signed with one version of the log's owner key.
message VlogSignedHead {
    uint64 size = 1;
    bytes root = 2;
    uint32 key_version = 3;
    VlogSignatureType signature_type = 4;
    bytes signature = 5;
}

// VlogSignHeadResponse is the signed head and the checkpoint recorded for it.
message VlogSignHeadResponse {
    VlogSignedHead head = 1;
    // checkpoint is the C2SP signed-note checkpoint text.
    bytes checkpoint = 2;
}

// VlogExpireBodiesRequest drops the entry bodies below leaf index cutoff.
message VlogExpireBodiesRequest {
    string log = 1;
    uint64 cutoff = 2;
}

// VlogExpireBodiesResponse is the number of bodies expired.
message VlogExpireBodiesResponse {
    uint64 expired = 1;
}

// VlogRotateKeyRequest asks for a log's next head-signing key.
message VlogRotateKeyRequest {
    string log = 1;
    // signing_key_type is the new key's type; UNSPECIFIED is refused.
    VlogSignatureType signing_key_type = 2;
}

// VlogRotateKeyResponse is the key that now signs the log's heads.
message VlogRotateKeyResponse {
    VlogHeadKey key = 1;
}

// ===========================================================================
// User management messages
// ===========================================================================

// CreateUserRequest creates a new passwordless user.
message CreateUserRequest {
    // group_ids was an opaque group-membership list that no qrdb authorization
    // path read; group membership belongs to the layer that owns groups.
    reserved 7;
    reserved "group_ids";

    string tenant_id = 1;
    string username = 2;
    repeated string role_ids = 3;
    // email is the canonical tenant-unique login key.
    string email = 4;
    // name is the display name; presentation only.
    string name = 5;
    // without_email_login_key creates a user that has no email login key and so
    // cannot be resolved by GetUserByEmail — a certificate-only or bootstrap
    // identity. It exists so the omission is declared rather than defaulted.
    bool without_email_login_key = 6;
    // auth_methods are the permitted authentication methods ("webauthn",
    // "piv"). Empty states no restriction.
    repeated string auth_methods = 8;
    // lifecycle is the state to create the account in. Empty defaults to
    // "active", or "pending" when pending is set. Only pending, active and
    // disabled may be created directly.
    string lifecycle = 9;
    // pending is the shorthand for lifecycle "pending". Setting both is
    // refused unless they agree.
    bool pending = 10;
}

// GetUserRequest retrieves a user by ID.
message GetUserRequest {
    uint64 id = 1;
}

// GetUserByUsernameRequest retrieves a user by tenant-scoped username.
message GetUserByUsernameRequest {
    string tenant_id = 1;
    string username = 2;
}

// GetUserByEmailRequest resolves a user by tenant-scoped email — the canonical
// login key. The tenant is required: an email is unique within a tenant, not
// globally, so a lookup without one is ambiguous by construction.
message GetUserByEmailRequest {
    string tenant_id = 1;
    string email = 2;
}

// GetUserByCertThumbprintRequest resolves a user by an mTLS certificate's
// SPKI thumbprint via the secondary index.
message GetUserByCertThumbprintRequest {
    string thumbprint = 1;
}

// AddCertBindingRequest binds an mTLS certificate's SPKI thumbprint to a user.
// A not_after_unix > 0 sets the binding's expiry; otherwise it never expires.
message AddCertBindingRequest {
    uint64 user_id = 1;
    string thumbprint = 2;
    int64 not_after_unix = 3;
}

// UpdateUserProtoRequest applies partial updates to an existing user.
// Named with "Proto" suffix to avoid collision with the Go domain type.
message UpdateUserProtoRequest {
    // group_ids / has_group_ids were an opaque group-membership list that no
    // qrdb authorization path read.
    reserved 6, 7;
    reserved "group_ids", "has_group_ids";

    uint64 id = 1;
    string username = 2;
    repeated string role_ids = 3;
    // email replaces the canonical login key when non-empty.
    string email = 4;
    // name replaces the display name when non-empty.
    string name = 5;
    // auth_methods replaces the permitted methods when present. Because proto3
    // cannot distinguish an absent repeated field from an empty one, the
    // has_auth_methods flag carries the nil-vs-empty distinction the domain
    // request needs: absent means "leave alone", present-and-empty means
    // "clear".
    repeated string auth_methods = 8;
    bool has_auth_methods = 9;
    // lifecycle transitions the account when non-empty. Checked against the
    // transition table; nothing moves out of "deleting".
    string lifecycle = 10;
    // last_auth_unix raises the last-successful-authentication high-water mark
    // when > 0. Seconds since the epoch, UTC. A value at or before the stored
    // one writes nothing.
    int64 last_auth_unix = 11;
    // role_bindings replaces the tenant-scoped role bindings when
    // has_role_bindings is true. proto3 cannot distinguish an absent repeated
    // field from an empty one, so has_role_bindings carries the nil-vs-empty
    // distinction the domain request needs, exactly as has_auth_methods does.
    repeated RoleBinding role_bindings = 12;
    bool has_role_bindings = 13;
    // attributes replaces the ABAC attributes when has_attributes is true.
    // Same nil-vs-empty reasoning as role_bindings: proto3 maps have no way
    // to represent "absent".
    map<string, string> attributes = 14;
    bool has_attributes = 15;
}

// DeleteUserRequest removes a user by ID.
message DeleteUserRequest {
    uint64 id = 1;
}

// ListUsersRequest returns a paginated list of users.
message ListUsersRequest {
    string tenant_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// ListUsersResponse holds the paginated user list.
message ListUsersResponse {
    repeated UserResponse users = 1;
    int32 total = 2;
    bool has_more = 3;
}

// EnableUserRequest activates a user account.
message EnableUserRequest {
    uint64 id = 1;
}

// DisableUserRequest deactivates a user account.
message DisableUserRequest {
    uint64 id = 1;
}

// SuspendUserRequest moves an active user account to suspended.
message SuspendUserRequest {
    uint64 id = 1;
}

// UnsuspendUserRequest returns a suspended user account to active.
message UnsuspendUserRequest {
    uint64 id = 1;
}

// UserResponse is the response payload for user operations.
message UserResponse {
    // enabled was a derived projection of lifecycle; lifecycle is now the only
    // account-state field. group_ids was an opaque group-membership list that
    // no qrdb authorization path read.
    reserved 5, 12;
    reserved "enabled", "group_ids";

    uint64 id = 1;
    string tenant_id = 2;
    string username = 3;
    repeated string role_ids = 4;
    bool system = 6;
    string created_at = 7;
    string updated_at = 8;
    // email is the canonical tenant-unique login key. Empty for system users.
    string email = 9;
    // name is the display name. Presentation only; never a lookup key.
    string name = 10;
    // lifecycle is the canonical and only account state: pending, active,
    // suspended, locked, disabled or deleting. Only active can authenticate.
    string lifecycle = 11;
    // auth_methods are the permitted authentication methods.
    repeated string auth_methods = 13;
    // last_auth_unix is the last successful authentication, seconds since the
    // epoch UTC. Zero when the account has never authenticated.
    int64 last_auth_unix = 14;
    // cert_bindings are the account's enrolled mTLS keys, in enrolment order
    // and in full — expired ones included, because an expired binding still
    // holds the account in the enforcing posture (only a matching certificate
    // authenticates as an account with any binding). A thumbprint read here
    // can be passed straight to RemoveCertBinding.
    repeated CertBinding cert_bindings = 15;
    // role_bindings grants roles within a tenant scope (tenant-scoped RBAC),
    // additive alongside role_ids (system-scoped roles).
    repeated RoleBinding role_bindings = 16;
    // attributes carries ABAC key/value pairs evaluated by policy.
    map<string, string> attributes = 17;
    // factors lists enrolled auth-factor METADATA ONLY; the opaque data blob
    // a factor interprets during verification never crosses this or any
    // other transport (go-qrdb#192/#197).
    repeated FactorMetadata factors = 18;
    // mfa_enabled/mfa_methods/mfa_enrolled_at are DERIVED from factors, never
    // stored: an enrolled factor is not a policy statement that MFA is
    // required for this account.
    bool mfa_enabled = 19;
    repeated string mfa_methods = 20;
    string mfa_enrolled_at = 21;
}

// CertBinding is one mTLS key enrolled on a user.
message CertBinding {
    // thumbprint is the base64url SHA-256 the certificate is matched by.
    string thumbprint = 1;
    // kind is what the thumbprint is over: "spki_thumbprint" (canonical),
    // "full_cert_fingerprint" or "piv_attested".
    string kind = 2;
    // not_after_unix is when the binding stops authenticating, seconds since
    // the epoch UTC. Zero when the binding does not expire on its own.
    int64 not_after_unix = 3;
}

// RoleBinding grants a role within a tenant scope.
message RoleBinding {
    string role_id = 1;
    string tenant_id = 2;
}

// FactorMetadata is the wire projection of a user's enrolled auth factor with
// its opaque data blob omitted.
message FactorMetadata {
    string id = 1;
    string factor_name = 2;
    string created_at = 3;
}

// ===========================================================================
// Role management messages
// ===========================================================================

// CreateRoleRequest creates a new role.
message CreateRoleRequest {
    string tenant_id = 1;
    string name = 2;
    repeated string permissions = 3;
    // id is an optional pre-assigned deterministic identifier. When empty,
    // the server generates a random UUID (preserving legacy behavior).
    string id = 4;
}

// GetRoleRequest retrieves a role by ID.
message GetRoleRequest {
    string id = 1;
}
message GetRoleByNameRequest {
    string tenant_id = 1;
    string name = 2;
}
message ResolveRolePermissionsRequest {
    repeated string role_ids = 1;
}
message ResolveRolePermissionsResponse {
    repeated string permissions = 1;
}

// ReconcileBuiltInRolesRequest names the tenant to converge.
message ReconcileBuiltInRolesRequest {
    // tenant_id is the tenant to reconcile. Empty means the caller's own
    // effective tenant.
    string tenant_id = 1;
}

// RoleReconcileResult records what reconciliation changed for one built-in
// role. Only changed roles are reported.
message RoleReconcileResult {
    string role_id = 1;
    string name = 2;
    // created is true when the built-in was absent and was seeded; added then
    // holds its whole permission set.
    bool created = 3;
    repeated string added = 4;
    repeated string removed = 5;
}

// ReconcileBuiltInRolesResponse is the per-tenant reconciliation report. An
// empty roles list means the tenant already agreed with the build.
message ReconcileBuiltInRolesResponse {
    string tenant_id = 1;
    repeated RoleReconcileResult roles = 2;
}

// RoleReconcileSkippedTenant names a tenant the all-tenant reconcile did not
// open. reason is "sealed" (its barrier is sealed on this node) or "refused"
// (this node does not serve it); detail is the human-readable cause.
message RoleReconcileSkippedTenant {
    string tenant_id = 1;
    string reason = 2;
    string detail = 3;
}

// RoleReconcileFailedTenant names a tenant whose reconcile failed, and why.
message RoleReconcileFailedTenant {
    string tenant_id = 1;
    string error = 2;
}

// ReconcileBuiltInRolesAllTenantsResponse is the all-tenant pass's report:
// one per-tenant report for every tenant converged (system first, then by
// id; an empty roles list is a tenant already in agreement), and the
// tenants skipped or failed. A non-empty failed list is a partial pass.
message ReconcileBuiltInRolesAllTenantsResponse {
    repeated ReconcileBuiltInRolesResponse tenants = 1;
    repeated RoleReconcileSkippedTenant skipped = 2;
    repeated RoleReconcileFailedTenant failed = 3;
}

// UpdateRoleProtoRequest applies partial updates to an existing role.
// Named with "Proto" suffix to avoid collision with the Go domain type.
message UpdateRoleProtoRequest {
    string id = 1;
    string name = 2;
    repeated string permissions = 3;
}

// DeleteRoleRequest removes a role by ID.
message DeleteRoleRequest {
    string id = 1;
}

// ListRolesRequest returns a paginated list of roles.
message ListRolesRequest {
    string tenant_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// ListRolesResponse holds the paginated role list.
message ListRolesResponse {
    repeated RoleResponse roles = 1;
    int32 total = 2;
    bool has_more = 3;
}

// AssignRoleRequest assigns a role to a user.
message AssignRoleRequest {
    uint64 user_id = 1;
    string role_id = 2;
}

// UnassignRoleRequest removes a role assignment from a user.
message UnassignRoleRequest {
    uint64 user_id = 1;
    string role_id = 2;
}

// RoleResponse is the response payload for role operations.
message RoleResponse {
    string id = 1;
    string tenant_id = 2;
    string name = 3;
    repeated string permissions = 4;
    bool system = 5;
    string created_at = 6;
    string updated_at = 7;
    // retired_permissions are the members of permissions this build no longer
    // defines. Derived on read from the live permission registry, never
    // stored: it is drift between what the tenant was seeded with and what the
    // server now grants, visible before ReconcileBuiltInRoles repairs it.
    repeated string retired_permissions = 8;
}

// PermissionCategory groups related permissions under a display name.
message PermissionCategory {
    string name = 1;
    string group = 2;
    repeated string permissions = 3;
}

// ListPermissionsResponse holds all permission categories.
message ListPermissionsResponse {
    repeated PermissionCategory categories = 1;
}

// OwnPermission is one of the caller's effective permissions.
message OwnPermission {
    // name is the permission in "resource:action" form.
    string name = 1;
    // resource is the portion before the colon.
    string resource = 2;
    // action is the portion after the colon.
    string action = 3;
    // scope is the permission's declared tenancy reach: "self", "cross",
    // "tenant-only" or "self-strict".
    string scope = 4;
}

// ListOwnPermissionsResponse holds the caller's effective permissions,
// sorted and deduplicated.
message ListOwnPermissionsResponse {
    repeated OwnPermission permissions = 1;
}

// AuthorizeIdentity names the identity an Authorize request evaluates. Only
// its subject, tenant and roles cross the wire: metadata is set by
// authentication alone and is never taken from a request.
message AuthorizeIdentity {
    string subject = 1;
    string tenant_id = 2;
    repeated string roles = 3;
}

// AuthorizeRequest asks whether identity may perform action on resource.
// An absent identity is the caller.
message AuthorizeRequest {
    AuthorizeIdentity identity = 1;
    string resource = 2;
    string action = 3;
}

// AuthorizeResponse is the decision, with the denial's reason when it is not
// allowed.
message AuthorizeResponse {
    bool allowed = 1;
    string reason = 2;
}

// ===========================================================================
// Certificate management messages
// ===========================================================================

// IssueCertRequest asks for a certificate for an existing account of the
// caller's own tenant. Only the CSR's key is used: the certificate names the
// account, whatever the CSR's Subject says.
message IssueCertRequest {
    string username = 1;
    string csr_pem = 2;
    // ttl is a Go duration; empty is the issuer's default.
    string ttl = 3;
}

// EnrollCertRequest enrols a bring-your-own certificate (leaf first; any
// further certificates, and all of chain_pem, are offered as intermediates)
// for an existing account of the caller's own tenant.
message EnrollCertRequest {
    string username = 1;
    string cert_pem = 2;
    string chain_pem = 3;
}

// EnrolledCertResponse is a certificate now bound to an account. There is no
// key field: the requester keeps its own.
message EnrolledCertResponse {
    uint64 user_id = 1;
    string username = 2;
    string tenant_id = 3;
    string cert_pem = 4;
    // serial is empty for a bring-your-own certificate.
    string serial = 5;
    string thumbprint = 6;
    // not_after is RFC 3339.
    string not_after = 7;
}

// IssueDelegationRequest asks the caller's own tenant's CA to delegate scope
// to a service principal. Only the CSR's key is used.
message IssueDelegationRequest {
    string principal = 1;
    repeated string scope = 2;
    string csr_pem = 3;
    // ttl is a Go duration; empty is the delegation default of one hour, and
    // more than 24h is refused.
    string ttl = 4;
}

// IssuedDelegationResponse is a delegation certificate the tenant's CA
// issued; it is revoked by serial like any other.
message IssuedDelegationResponse {
    string tenant_id = 1;
    string principal = 2;
    repeated string scope = 3;
    string cert_pem = 4;
    string serial = 5;
    // not_after is RFC 3339.
    string not_after = 6;
}

// TrustAnchorAddRequest registers every CA certificate in certs_pem.
message TrustAnchorAddRequest {
    string tenant_id = 1;
    string certs_pem = 2;
}

// TrustAnchorListRequest lists a tenant's trust anchors.
message TrustAnchorListRequest {
    string tenant_id = 1;
}

// TrustAnchorRemoveRequest withdraws the anchor with fingerprint (lowercase
// hex SHA-256 of its DER).
message TrustAnchorRemoveRequest {
    string tenant_id = 1;
    string fingerprint = 2;
}

// TrustAnchor is one registered trust anchor. Times are RFC 3339.
message TrustAnchor {
    string fingerprint = 1;
    string subject = 2;
    string not_before = 3;
    string not_after = 4;
    string cert_pem = 5;
    string added_at = 6;
}

// TrustAnchorListResponse is a tenant's trust anchors.
message TrustAnchorListResponse {
    repeated TrustAnchor anchors = 1;
}

// RevokeCertRequest marks a certificate serial as revoked.
message RevokeCertRequest {
    string serial = 1;
}

// RevokeCertResponse reports what RevokeCert did. record_found
// distinguishes a certificate the node holds a CertRecord for from a
// deny-by-serial revocation of one it does not -- both are successes,
// which is why the distinction is carried here rather than as an error.
message RevokeCertResponse {
    bool record_found = 1;
}

// ListCertsRequest lists all issued certificates for a tenant.
message ListCertsRequest {
    string tenant_id = 1;
}

// CertRecord is the metadata for an issued certificate.
message CertRecord {
    string serial = 1;
    string username = 2;
    string tenant_id = 3;
    string issued_at = 4;
    string expires_at = 5;
    bool revoked = 6;
}

// ListCertsResponse holds a list of issued certificate records.
message ListCertsResponse {
    repeated CertRecord certs = 1;
}

// InviteUserRequest creates a pending account in the caller's own tenant --
// or re-invites one that is still pending.
message InviteUserRequest {
    string username = 1;
    string email = 2;
    string name = 3;
    repeated string role_ids = 4;
    // key_pin_fingerprint, when set, pins the invitation to one key: the SPKI
    // thumbprint the invited user sent out of band.
    string key_pin_fingerprint = 5;
}

// InvitationResponse carries the one-time enrolment token. It is the only
// time the token is ever returned.
message InvitationResponse {
    uint64 id = 1;
    string token = 2;
    // expires_at is RFC 3339.
    string expires_at = 3;
    uint64 user_id = 4;
    string username = 5;
    string tenant_id = 6;
    // created reports that the account was created by this invitation rather
    // than re-invited.
    bool created = 7;
    string key_pin_fingerprint = 8;
}

// RedeemInvitationRequest redeems token in tenant_id. csr_pem is always
// required: it carries the proof that the redeemer holds the key. cert_pem
// (leaf first) and chain_pem, when given, are a bring-your-own certificate
// over that same key.
message RedeemInvitationRequest {
    string tenant_id = 1;
    string token = 2;
    string csr_pem = 3;
    string cert_pem = 4;
    string chain_pem = 5;
}

// ===========================================================================
// Collection messages
// ===========================================================================

// CollectionIndexDefinition declares a secondary index on one collection
// field. The collection creates the index, owns it, and drops it with the
// collection.
message CollectionIndexDefinition {
    string field_name = 1;
    bool unique = 2;
    bool sparse = 3;
}

// CreateCollectionRequest contains parameters for creating a collection.
message CreateCollectionRequest {
    string database = 1;
    string name = 2;
    string id_strategy = 3;
    string field_hash = 4;
    // storage_codec overrides the database's default document codec.
    string storage_codec = 5;
    // indexes declares the collection's secondary indexes. The collection is
    // reported active only once every one of them exists.
    repeated CollectionIndexDefinition indexes = 6;
}

// GetCollectionInfoRequest retrieves metadata for a specific collection.
message GetCollectionInfoRequest {
    string database = 1;
    string name = 2;
}

// ListCollectionsRequest lists all collections in a database.
message ListCollectionsRequest {
    string database = 1;
}

// DropCollectionRequest removes a collection and all its documents.
message DropCollectionRequest {
    string database = 1;
    string name = 2;
}

// CollectionInfoResponse holds metadata about a collection.
message CollectionInfoResponse {
    string name = 1;
    string database = 2;
    string id_strategy = 3;
    string field_hash = 4;
    map<string, string> schema = 5;
    int64 document_count = 6;
    string created_at = 7;
    string storage_codec = 8;
    repeated CollectionIndexDefinition indexes = 9;
    // state is the collection's lifecycle state: "active", "creating" (its
    // indexes are being built) or "dropping" (it is being torn down). Only an
    // active collection serves documents.
    string state = 10;
    // state_since is when the collection entered state (RFC 3339).
    string state_since = 11;
}

// ListCollectionsResponse holds a list of collection metadata.
message ListCollectionsResponse {
    repeated CollectionInfoResponse collections = 1;
}

// InsertDocumentRequest inserts a document into a collection.
message InsertDocumentRequest {
    string database = 1;
    string collection = 2;
    string document = 3;
}

// InsertDocumentResponse holds the ID of the inserted document.
message InsertDocumentResponse {
    uint64 id = 1;
}

// GetDocumentRequest retrieves a document by ID.
message GetDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
}

// DocumentResponse holds a document and its ID.
message DocumentResponse {
    uint64 id = 1;
    string document = 2;
}

// UpdateDocumentRequest replaces an existing document.
message UpdateDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
    string document = 4;
}

// DeleteDocumentRequest removes a document by ID.
message DeleteDocumentRequest {
    string database = 1;
    string collection = 2;
    uint64 id = 3;
}

// ListDocumentsRequest retrieves a paginated list of documents.
message ListDocumentsRequest {
    string database = 1;
    string collection = 2;
    int32 page_size = 3;
    string page_token = 4;
}

// ListDocumentsResponse holds a page of documents.
message ListDocumentsResponse {
    repeated DocumentResponse documents = 1;
    string next_page_token = 2;
    int64 total_count = 3;
}

// ===========================================================================
// Database management messages
// ===========================================================================

// DatabaseCreateRequest contains parameters for creating a new database.
message DatabaseCreateRequest {
    reserved 2;
    reserved "engine"; // removed in v0.45 (OD-13): every database serves every engine.
    string name = 1;
    string backend = 3;
    string data_dir = 4;
    DatabaseProtocolConfig protocol = 5;
    DatabaseRaftConfig raft = 6;
    // replicas is the requested replication factor for a dedicated-raft
    // database. Meaningful only for raft-backed databases; ignored otherwise.
    // Unset (0) defaults to 1 replica.
    uint32 replicas = 7;
    // barrier, when set with enabled=true, bootstraps the database's
    // encryption barrier at creation time using the embedded secret /
    // strategy / threshold / total. See DatabaseBarrierConfig.
    DatabaseBarrierConfig barrier = 8;
    // sql holds the database's SQL settings; unset means the defaults.
    DatabaseSQLConfig sql = 9;
    // dedicated_wal requests a dedicated WAL, keyed by the tenant's own key,
    // for a dedicated-raft database (raft backend only). Required for every
    // database of a strict-isolation tenant.
    bool dedicated_wal = 10;
}

// DatabaseGetRequest retrieves information about a specific database.
message DatabaseGetRequest {
    string name = 1;
}

// DatabaseDropRequest removes a database by name.
message DatabaseDropRequest {
    string name = 1;
}

// DatabaseListResponse holds a list of database information entries.
message DatabaseListResponse {
    repeated DatabaseInfoResponse databases = 1;
}

// DatabaseInfoResponse holds runtime information about a database.
message DatabaseInfoResponse {
    reserved 2;
    reserved "engine"; // removed in v0.45 (OD-13): every database serves every engine.
    string name = 1;
    string backend = 3;
    string status = 4;
    DatabaseProtocolConfig protocol = 5;
    string data_dir = 6;
    uint64 shard_id = 7;
    string mode = 8;
    // raft and barrier are read views: a secret set on a database is
    // write-only and is reported only as set. Their field numbers match the
    // request messages', less the secrets.
    DatabaseRaftInfo raft = 9;
    DatabaseBarrierInfo barrier = 10;
    DatabaseConnectionConfig connection = 11;
    string tenant_id = 12;
    // replicas is the replication factor of a dedicated-raft database. Zero for
    // non-raft databases.
    uint32 replicas = 13;
    // sql holds the database's SQL settings; unset means the defaults.
    DatabaseSQLConfig sql = 14;
    // dedicated_wal reports that a dedicated-raft database's Raft log is
    // encrypted under the tenant's own key.
    bool dedicated_wal = 15;
    // storage_codec is the codec the database's values are stored in; empty
    // means the node's default.
    string storage_codec = 16;
    // compaction is the database's scheduled-compaction policy; unset means
    // off.
    DatabaseCompactionConfig compaction = 17;
    // compaction_unavailable reports that the database's store could not be
    // read for its policy: compaction is unknown, not off.
    bool compaction_unavailable = 18;
}

// DatabaseRaftInfo is a database's Raft configuration as a response reports
// it: DatabaseRaftConfig without its secrets.
message DatabaseRaftInfo {
    string cluster_mode = 1;
    // Field 2 was shard_id: a database's shard ID is reported once, as
    // DatabaseInfoResponse.shard_id.
    reserved 2;
    reserved "shard_id";
    uint64 replica_id = 3;
    string raft_address = 4;
    repeated string peers = 5;
    int32 local_node_count = 6;
    string discovery = 7;
    DatabaseStaticDiscoveryInfo static = 8;
    DatabaseMulticastDiscoveryInfo multicast = 9;
    DatabaseDNSDiscovery dns = 10;
    DatabaseTokenDiscoveryInfo token = 11;
}

// DatabaseStaticDiscoveryInfo reports static peer discovery.
message DatabaseStaticDiscoveryInfo {
    repeated string peers = 1;
    reserved 2;
    reserved "shared_secret";
    // shared_secret_set reports that an HMAC shared secret is configured.
    bool shared_secret_set = 3;
}

// DatabaseMulticastDiscoveryInfo reports multicast peer discovery.
message DatabaseMulticastDiscoveryInfo {
    reserved 1;
    reserved "shared_secret";
    string multicast_group = 2;
    string iface = 3 [json_name = "interface"];
    int32 min_peers = 4;
    string announce_interval = 5;
    string discover_timeout = 6;
    // shared_secret_set reports that the HMAC shared secret is configured.
    bool shared_secret_set = 7;
}

// DatabaseTokenDiscoveryInfo reports token-based peer discovery.
message DatabaseTokenDiscoveryInfo {
    string endpoint = 1;
    reserved 2;
    reserved "token";
    int32 cluster_size = 3;
    string timeout = 4;
    // token_set reports that the bootstrap token is configured.
    bool token_set = 5;
}

// DatabaseBarrierInfo is a database's barrier configuration as a response
// reports it. The passphrase is never stored, so it has no secret field.
message DatabaseBarrierInfo {
    bool enabled = 1;
    string mode = 2;
    int32 shares_required = 3;
    int32 shares_total = 4;
    reserved 5;
    reserved "secret";
}

// DatabaseCompactionConfig is a database's scheduled-compaction policy.
message DatabaseCompactionConfig {
    // mode is "off" (or empty), "revision" or "period".
    string mode = 1;
    // retain_revisions is how many of the store's most recent revisions a
    // revision policy keeps (>= 1). Revision mode only.
    int64 retain_revisions = 2;
    // retain_period is how much history, by age, a period policy keeps: a Go
    // duration of at least 1s. Period mode only.
    string retain_period = 3;
}

// SetNodeCompactionRequest sets the platform's node-keyspace compaction
// policy. An unset compaction turns it off.
message SetNodeCompactionRequest {
    DatabaseCompactionConfig compaction = 1;
}

// NodeCompactionResponse is the platform's node-keyspace compaction policy;
// unset means none.
message NodeCompactionResponse {
    DatabaseCompactionConfig compaction = 1;
}

// GetStateHashesRequest selects the shards whose replica state hashes the
// answering node reports. Empty selects every shard; an ID the node does not
// replicate selects nothing.
message GetStateHashesRequest {
    repeated uint64 shard_ids = 1;
}

// ReplicaStateHash is the SHA-256 state digest of one of the answering node's
// replicas at its applied index.
message ReplicaStateHash {
    // tenant_id is "" for a shard of the node's own (system) host, otherwise
    // the isolated tenant whose host runs the shard.
    string tenant_id = 1;
    uint64 shard_id = 2;
    uint64 replica_id = 3;
    // applied_index is the applied index the digest was computed at.
    uint64 applied_index = 4;
    // records is how many records the digest covers.
    uint64 records = 5;
    // hash is the digest, 64 lowercase hex digits.
    string hash = 6;
    // error is empty on success; otherwise why this replica has no digest,
    // with applied_index, records and hash zero.
    string error = 7;
}

// GetStateHashesResponse is one node's replica state hashes, ordered by
// tenant_id, then shard_id.
message GetStateHashesResponse {
    string node_id = 1;
    repeated ReplicaStateHash replicas = 2;
}

// DatabaseSQLConfig holds a database's SQL settings.
message DatabaseSQLConfig {
    // concurrency is "optimistic" (the default when empty) or "pessimistic".
    string concurrency = 1;
}

// DatabaseProtocolConfig holds wire protocol settings for a database.
message DatabaseProtocolConfig {
    bool mysql = 1;
    bool postgresql = 2;
    DatabaseEtcdConfig etcd = 3;
}

// DatabaseEtcdConfig holds etcd wire protocol settings.
message DatabaseEtcdConfig {
    bool enabled = 1;
    string listen_addr = 2;
    repeated string advertise_client_urls = 3;
}

// DatabaseRaftConfig holds Raft consensus settings for a database.
message DatabaseRaftConfig {
    string cluster_mode = 1;
    // Field 2 was shard_id. A shard ID is issued by the cluster at create and
    // is the database's identity: no request may name one, and it is reported
    // only as DatabaseInfo.shard_id.
    reserved 2;
    reserved "shard_id";
    uint64 replica_id = 3;
    string raft_address = 4;
    repeated string peers = 5;
    int32 local_node_count = 6;
    string discovery = 7;
    DatabaseStaticDiscovery static = 8;
    DatabaseMulticastDiscovery multicast = 9;
    DatabaseDNSDiscovery dns = 10;
    DatabaseTokenDiscovery token = 11;
}

// DatabaseStaticDiscovery holds static peer discovery configuration.
message DatabaseStaticDiscovery {
    repeated string peers = 1;
    string shared_secret = 2;
}

// DatabaseMulticastDiscovery holds multicast peer discovery configuration.
message DatabaseMulticastDiscovery {
    string shared_secret = 1;
    string multicast_group = 2;
    string iface = 3 [json_name = "interface"];
    int32 min_peers = 4;
    string announce_interval = 5;
    string discover_timeout = 6;
}

// DatabaseDNSDiscovery holds DNS SRV record peer discovery configuration.
message DatabaseDNSDiscovery {
    string service = 1;
    string proto = 2;
    string domain = 3;
    string lookup_timeout = 4;
}

// DatabaseTokenDiscovery holds token-based discovery configuration.
message DatabaseTokenDiscovery {
    string endpoint = 1;
    string token = 2;
    int32 cluster_size = 3;
    string timeout = 4;
}

// DatabaseBarrierConfig holds encryption barrier settings.
// secret, mode, shares_required, and shares_total are only meaningful on
// DatabaseCreateRequest (initial barrier bootstrap); they are ignored by
// DatabaseUpdateBarrierRequest, which only toggles enabled. secret is never
// persisted server-side and is zeroed as soon as it is copied into the
// seal.Credentials passed to EnsureBarrier.
message DatabaseBarrierConfig {
    bool enabled = 1;
    // mode is the target keyed strategy: "passphrase" or "shamir".
    string mode = 2;
    // shares_required is the Shamir threshold (M of N).
    int32 shares_required = 3;
    // shares_total is the total Shamir share count (N).
    int32 shares_total = 4;
    // secret is the barrier passphrase/credential for the initial
    // Initialize call. Create-time only; never echoed back.
    string secret = 5;
}

// DatabaseConnectionConfig holds remote connection settings.
message DatabaseConnectionConfig {
    string remote_address = 1;
    bool use_tls = 2;
    string transport = 3;
    string ca_file = 4;
    string cert_file = 5;
    string key_file = 6;
}

// DatabaseUpdateProtocolRequest updates the wire protocol configuration.
message DatabaseUpdateProtocolRequest {
    string name = 1;
    bool mysql = 2;
    bool postgresql = 3;
}

// DatabaseUpdateEtcdRequest updates the etcd wire protocol configuration.
message DatabaseUpdateEtcdRequest {
    string name = 1;
    bool enabled = 2;
    string listen_addr = 3;
    repeated string advertise_client_urls = 4;
}

// DatabaseUpdateRaftRequest updates the Raft consensus configuration.
message DatabaseUpdateRaftRequest {
    string name = 1;
    DatabaseRaftConfig raft = 2;
}

// DatabaseScaleRequest changes the replication factor of an existing
// dedicated-raft database.
message DatabaseScaleRequest {
    string name = 1;
    int32 target_replicas = 2;
}

// DatabaseUpdateBarrierRequest updates the encryption barrier configuration.
message DatabaseUpdateBarrierRequest {
    string name = 1;
    DatabaseBarrierConfig barrier = 2;
}

// DatabaseUpdateConnectionRequest updates the remote connection configuration.
message DatabaseUpdateConnectionRequest {
    string name = 1;
    DatabaseConnectionConfig connection = 2;
}

// DatabaseUpdateSQLRequest updates a database's SQL settings. An unset sql
// restores the defaults.
message DatabaseUpdateSQLRequest {
    string name = 1;
    DatabaseSQLConfig sql = 2;
}

// DatabaseUpdateCompactionRequest sets a database's scheduled-compaction
// policy. An unset compaction turns it off.
message DatabaseUpdateCompactionRequest {
    string name = 1;
    DatabaseCompactionConfig compaction = 2;
}

// ===========================================================================
// Barrier messages
// ===========================================================================

// BarrierInitializeRequest initializes the barrier with a single master key.
//
// secret is the strategy wrapping passphrase. so_pin and user_pin, when
// supplied, are routed to the canonical pin.PINBackend on the server.
// They are independent of and complementary to secret: secret protects
// the wrapping key; the PINs gate two-PIN authorization on administrative
// operations.
//
// secret is `bytes`, not `string`, so the generated Go field is a []byte the
// caller can zeroize after the call. proto3 encodes string and bytes
// identically (length-delimited), so this is a source-level change only and
// the wire format is unchanged.
message BarrierInitializeRequest {
    bytes secret = 1;
    string so_pin = 2;
    string user_pin = 3;
}

// BarrierUnsealRequest unseals the barrier with a master key. secret is
// `bytes` so callers can zeroize it; see BarrierInitializeRequest.
message BarrierUnsealRequest {
    bytes secret = 1;
}

// BarrierChangePassphraseRequest carries the current and the next passphrase
// of the system barrier. Both are secrets the server wipes once the call
// returns. so_pin is the Security Officer PIN the SO gate requires of a
// seal:rekey call over QUIC, which has no header section; gRPC reads the
// x-qrdb-so-pin metadata entry instead.
message BarrierChangePassphraseRequest {
    bytes current = 1;
    bytes next = 2;
    string so_pin = 3;
}

// BarrierStatusResponse describes the current barrier state.
// shamir_threshold and shamir_total carry the configured M-of-N quorum
// when the barrier uses the Shamir strategy and are zero otherwise.
message BarrierStatusResponse {
    bool sealed = 1;
    string strategy = 2;
    bool hardware_backed = 3;
    string initialized_at = 4;
    int32 shamir_threshold = 5;
    int32 shamir_total = 6;
    // cluster_seal is the node barrier's cluster seal state.
    ClusterSealState cluster_seal = 7;
    // initialized is true once the barrier has been initialized. A sealed
    // node reports only sealed and initialized; every other field is empty
    // until it is unsealed.
    bool initialized = 8;
    // cluster_migration is the node barrier's cluster-wide encryption
    // migration in progress; absent when none is, and on a sealed node.
    ClusterMigrationState cluster_migration = 9;
}

// ClusterMigrationState is a barrier's cluster-wide encryption migration in
// progress, read from the replicated record so every node answers the same.
message ClusterMigrationState {
    // unconfirmed is true when the record could not be read just now; every
    // other field is then empty.
    bool unconfirmed = 1;
    // target is the strategy every owner converges to.
    string target = 2;
    // generation is the request the nodes below report against.
    uint64 generation = 3;
    // acked of total owners have confirmed the target.
    int32 acked = 4;
    int32 total = 5;
    // nodes is every owner, in rolling order when the request has steps.
    repeated ClusterMigrationNode nodes = 6;
}

// ClusterMigrationNode is one owner's place in a cluster migration.
message ClusterMigrationNode {
    string node_id = 1;
    // step is the owner's turn: pending, recycling or serving; empty for a
    // request where every owner recycles at once.
    string step = 2;
    // phase, attempts and detail are the owner's own report; phase is empty
    // until it reports.
    string phase = 3;
    int32 attempts = 4;
    string detail = 5;
}

// ClusterSealState is one barrier's cluster seal state as the receiving node
// sees it (docs/barrier-seal/api.md, "The cluster_seal status object"). It
// carries no key material.
message ClusterSealState {
    // active is true once the cluster has activated cluster-seal; when false
    // every seal is node-local and the other fields are empty.
    bool active = 1;
    // sealed and epoch are the barrier's record; epoch 0 means none exists.
    bool sealed = 2;
    uint64 epoch = 3;
    // principal, principal_tenant, node and at say who wrote the record, from
    // which tenant, through which node, and when (RFC 3339, UTC).
    string principal = 4;
    string principal_tenant = 5;
    string node = 6;
    string at = 7;
    // local is this node's own state: serving, sealed, held, cut_off or
    // unconfirmed.
    string local = 8;
}

// BarrierClusterUnsealRequest clears a cluster-wide seal of the node barrier.
// It has no fields.
message BarrierClusterUnsealRequest {}

// BarrierEnableEncryptionRequest migrates a barrier from none to a keyed
// strategy. tenant_id, when set, scopes the migration to that tenant's
// dedicated barrier; empty means the system barrier (admin scope).
// passphrase is `bytes` so callers can zeroize it.
message BarrierEnableEncryptionRequest {
    string tenant_id = 1;
    string strategy = 2;      // "passphrase" or "shamir"
    string mechanism = 3;     // "swap" (default) or "in-place"
    string availability = 4;  // "quiesced" (default) or "online"
    bytes passphrase = 5;
    int32 shamir_threshold = 6;
    int32 shamir_total = 7;
}

// BarrierEnableEncryptionResponse acknowledges that the migration has started.
message BarrierEnableEncryptionResponse {
    string status = 1; // e.g. "migration_started"
    string scope = 2;  // "system" or "tenant"
}

// BarrierShamirInitializeRequest initializes the barrier under Shamir custody:
// the unseal key is split threshold-of-total_shares to the enrolled share
// holders. so_pin and user_pin, when supplied, are provisioned (or verified)
// through the server's pin.PINBackend.
message BarrierShamirInitializeRequest {
    reserved 1;
    reserved "secret";
    int32 threshold = 2;
    int32 total_shares = 3;
    string so_pin = 4;
    string user_pin = 5;
    // policy is the factor policy of the share set: "designated" (default)
    // or "any-enrolled".
    string policy = 6;
}

// BarrierShamirOperationResponse is the share-free result of a Shamir
// initialization or rekey. Raw share bytes are never returned; shares are
// distributed directly to enrolled Security Officers via the claim flow.
message BarrierShamirOperationResponse {
    reserved 1;
    reserved "shares";
    int32 threshold   = 2;
    int32 total_shares = 3;
    int32 share_count  = 4;
}

// BarrierRecoveryGenerateRequest generates recovery keys.
//
// so_pin is the optional Security Officer PIN required for the recovery
// key generation administrative operation when the server has a
// pin.PINBackend configured with a SO PIN set.
message BarrierRecoveryGenerateRequest {
    reserved 2;
    reserved "total";
    int32 threshold = 1;
    string so_pin = 3;
    // policy is the factor policy of the recovery share set.
    string policy = 4;
}

// BarrierSealRequest seals the node barrier. It replaced google.protobuf.Empty
// so the request can carry the barrier SO PIN, which REST and MCP already
// verified against the configured PIN backend and gRPC, the Unix socket and
// QUIC could not carry. An empty message encodes exactly as Empty did, so the
// change is wire-compatible.
message BarrierSealRequest {
    string so_pin = 1;
}

// BarrierRecoveryDeleteRequest deletes all stored recovery keys. It replaced
// google.protobuf.Empty so the operation can carry the SO PIN in the request
// itself, which is the only per-request carrier the QUIC frame has: the SO
// dual-factor gate reads so_pin there. On gRPC and the Unix socket the gate
// reads the x-qrdb-so-pin metadata entry instead. An empty message encodes
// exactly as Empty did, so the change is wire-compatible.
message BarrierRecoveryDeleteRequest {
    string so_pin = 1;
}

// BarrierRecoveryKeysResponse is the share-free result of recovery key
// generation. Raw share bytes are never returned; shares are distributed
// directly to enrolled recovery Security Officers via the claim flow.
message BarrierRecoveryKeysResponse {
    reserved 1;
    reserved "keys";
    int32 threshold   = 2;
    int32 total       = 3;
    int32 share_count = 4;
}

// BarrierOfficerRegisterRequest carries the parameters for registering a new
// Security Officer against the system barrier.
message BarrierOfficerRegisterRequest {
    reserved 3, 4;
    reserved "authenticator_type", "authenticator_ref";
    string username = 1;
    bytes  csr_pem  = 2;
    // role is "so" or "custodian"; empty means "so".
    string role = 5;
    // encryption_kem and encryption_key name an optional separate
    // share-envelope recipient key (HPKE suite name and key encoding).
    string encryption_kem = 6;
    bytes  encryption_key = 7;
    // factors are additional authentication factors to enrol.
    repeated HolderFactorEnrolment factors = 8;
    // designated names the designated factor; empty means "mtls".
    string designated = 9;
}

// HolderFactorEnrolment asks for one additional factor. params_json is the
// factor's enrolment input as a JSON object.
message HolderFactorEnrolment {
    string name        = 1;
    bytes  params_json = 2;
}

// BarrierOfficerRegisterResponse carries the signed certificate for the newly
// registered Security Officer.
message BarrierOfficerRegisterResponse {
    reserved 2;
    reserved "share_index";
    bytes  cert_pem       = 1;
    string role           = 3;
    string designated     = 4;
    string encryption_kem = 5;
    repeated string factors = 6;
}

// BarrierOfficerListResponse carries the list of registered Security Officers
// for the system barrier.
message BarrierOfficerListResponse {
    repeated OfficerStatus officers = 1;
}

// OfficerStatus is a non-secret view of an enrolled Security Officer. No share
// material is present.
message OfficerStatus {
    reserved 4;
    reserved "auth_factor";
    string username        = 1;
    string cert_thumbprint = 2;
    int32  share_index     = 3;
    string enrolled_at     = 5;  // RFC3339
    string claimed_at      = 6;  // RFC3339; empty = unclaimed
    bool   share_pending   = 7;
    string role            = 8;
    string designated      = 9;
    repeated string factors = 10;
    string encryption_kem  = 11;
}

// BarrierShareClaimBeginRequest starts the share claim handshake for the
// named Security Officer.
message BarrierShareClaimBeginRequest {
    string username = 1;
}

// BarrierShareClaimBeginResponse carries the challenge nonce for the SO to sign.
message BarrierShareClaimBeginResponse {
    string nonce_hex  = 1;
    string expires_at = 2;  // RFC3339
}

// BarrierShareClaimCompleteRequest carries the signed nonce to complete the
// share claim handshake.
message BarrierShareClaimCompleteRequest {
    string username  = 1;
    string nonce_hex = 2;
    bytes  signature = 3;
}

// BarrierShareClaimCompleteResponse carries the holder's share envelope,
// HPKE-sealed to the holder's enrolled key. It is the only message that
// carries share material on the wire, and never in plaintext.
message BarrierShareClaimCompleteResponse {
    reserved 2;
    reserved "share_bytes";
    int32 share_index = 1;
    bytes envelope    = 3;
}

// BarrierQuorumBeginRequest asks for a quorum challenge. domain is "unseal"
// or "recovery"; op is "unseal", "seal", "root-token", "rekey" or
// "recover"; factor is empty for the holder's designated factor.
message BarrierQuorumBeginRequest {
    string domain   = 1;
    string op       = 2;
    string username = 3;
    string factor   = 4;
}

// BarrierQuorumChallenge is the challenge a holder answers.
message BarrierQuorumChallenge {
    string challenge_id = 1;
    string domain       = 2;
    string op           = 3;
    string username     = 4;
    string factor       = 5;
    bytes  nonce        = 6;
    map<string, string> method_data = 7;
    string expires_at   = 8;  // RFC3339
}

// BarrierQuorumSubmitRequest is one holder's share with its factor response.
// share is the base64 share value from the holder's opened envelope.
message BarrierQuorumSubmitRequest {
    string domain       = 1;
    string op           = 2;
    string username     = 3;
    string challenge_id = 4;
    string factor       = 5;
    bytes  response     = 6;
    map<string, string> response_metadata = 7;
    bytes  share        = 8;
}

// BarrierQuorumOutcome reports a submission's effect.
message BarrierQuorumOutcome {
    string domain     = 1;
    string op         = 2;
    int32  required   = 3;
    int32  submitted  = 4;
    bool   complete   = 5;
    // root_token is set when a root-token round completed.
    string root_token = 6;
    string root_token_created_at = 7;
    // threshold/total_shares/share_count are set when a rekey completed.
    int32  threshold    = 8;
    int32  total_shares = 9;
    int32  share_count  = 10;
}

// BarrierRekeyStartRequest opens a rekey round. threshold 0 keeps the current
// threshold; policy empty keeps the current policy.
message BarrierRekeyStartRequest {
    string domain    = 1;
    int32  threshold = 2;
    string policy    = 3;
    string so_pin    = 4;
}

// BarrierOfficerRevokeRequest revokes a holder of domain.
message BarrierOfficerRevokeRequest {
    string domain    = 1;
    string username  = 2;
    int32  threshold = 3;
    string so_pin    = 4;
}

// BarrierQuorumRound is the public state of an open round.
message BarrierQuorumRound {
    string domain        = 1;
    string op            = 2;
    int32  required      = 3;
    int32  submitted     = 4;
    string expires_at    = 5;  // RFC3339
    int32  new_threshold = 6;
    string policy        = 7;
    repeated string remove = 8;
}

// BarrierRecoveryStatusResponse indicates whether recovery keys exist.
message BarrierRecoveryStatusResponse {
    bool has_recovery_keys = 1;
}

// ===========================================================================
// Ceremony messages
// ===========================================================================

// CeremonyOfficer describes a single officer for M-of-N initialization.
// CeremonyOfficer names one initial share holder. `qrdb init` is the ONLY
// system bootstrap, so it carries the same fields
// BarrierOfficerRegisterRequest does (go-qrdb#4578 review item 1): it is
// also the only place Shamir custody over the system barrier is ever
// established, and a holder who needs a separate envelope key, an extra
// factor, or a designated factor has no other registration path.
message CeremonyOfficer {
    string username = 1;
    string csr_pem = 2;
    // role is "so" or "custodian"; empty means "so".
    string role = 3;
    // encryption_kem and encryption_key name an optional separate
    // share-envelope recipient key (HPKE suite name and key encoding).
    string encryption_kem = 4;
    bytes  encryption_key = 5;
    // factors are additional authentication factors to enrol.
    repeated HolderFactorEnrolment factors = 6;
    // designated names the designated factor; empty means "mtls".
    string designated = 7;
}

// CeremonyHolderCert is one enrolled holder's issued certificate.
message CeremonyHolderCert {
    string username = 1;
    string role     = 2;
    bytes  cert_pem = 3;
}

// CeremonyInitializeRequest starts the initialization ceremony.
//
// admin_csr_pem, admin_cert_pem and admin_generate select the bootstrap
// admin's credential path: CSR-sign, bring-your-own-certificate, or
// generate -- the dev/test/evaluation only path, NOT suitable for
// production. Exactly one must be set; a request selecting none is refused,
// there is no credential-less default. secret is the passphrase the system
// barrier is initialized with, required when the barrier's configured
// strategy needs one.
message CeremonyInitializeRequest {
    string so_pin = 1;
    string user_pin = 2;
    int32 threshold = 3;
    string credential_seal_strategy = 4;
    repeated CeremonyOfficer officers = 5;
    string hostname = 6;
    repeated string sans = 7;
    // policy is the factor policy of the initial share set.
    string policy = 8;
    string admin_csr_pem = 9;
    string admin_cert_pem = 10;
    string admin_cert_pool_pem = 11;
    bool admin_generate = 12;
    // secret is bytes, not string: it is the plaintext system-barrier
    // passphrase, and a Go string is immutable and can never be wiped from
    // memory after use the way a []byte can (go-qrdb#560 review item 7).
    bytes secret = 13;
}

// CeremonyInitializeResponse returns the result of ceremony initialization.
//
// admin_key_pem is present ONLY when admin_credential_source is
// "generated"; it is returned exactly once and the server retains no copy.
message CeremonyInitializeResponse {
    string spki_pin = 1;
    string ca_cert_pem = 2;
    string tls_cert_pem = 3;
    reserved 4, 5;
    reserved "so_cert_pem", "so_key_pem";
    string state = 6;
    int32 share_count = 7;
    repeated CeremonyHolderCert holders = 8;
    string admin_cert_pem = 9;
    // admin_key_pem is bytes, not string: it is the generated bootstrap
    // admin's private key, and a Go string is immutable and can never be
    // wiped from memory after use the way a []byte can (go-qrdb#560 review
    // item 7).
    bytes admin_key_pem = 10;
    string admin_credential_source = 11;
}

// CeremonyStatusResponse describes the current ceremony state.
message CeremonyStatusResponse {
    string state = 1;
    string spki_pin = 2;
}

// CeremonySignCSRRequest submits a CSR for signing during the ceremony.
message CeremonySignCSRRequest {
    string username = 1;
    string so_pin = 2;
    string csr_pem = 3;
    string role = 4;
}

// CeremonySignCSRResponse returns the signed certificate.
message CeremonySignCSRResponse {
    string cert_pem = 1;
}

// ===========================================================================
// Tenant messages
// ===========================================================================

// TenantQuotas holds per-tenant resource limits. -1 means unlimited, 0 means
// use the system default.
message TenantQuotas {
    int64 max_databases     = 1;
    int64 max_raft_groups   = 2;
    int64 max_collections   = 3;
    int64 max_keys          = 4;
    int64 max_storage_bytes = 5;
    int64 max_users         = 6;
    int64 max_roles         = 7;
    int64 max_certificates  = 8;
    int64 max_backups       = 9;
    int64 max_vector_dims   = 10;
    int64 max_ts_metrics    = 11;
    int64 max_database_size_bytes = 12;
    // max_replicas_per_group caps the replication factor of any single
    // dedicated-raft database. max_total_replicas caps the aggregate replicas a
    // tenant may hold across all of its raft groups. -1 = unlimited; 0 = default.
    int64 max_replicas_per_group = 13;
    int64 max_total_replicas = 14;
    // system_barrier_quota governs an isolated tenant's use of the shared system
    // barrier (bytes): 0 makes the option unavailable, -1 unlimited, >0 a cap.
    int64 system_barrier_quota = 15;
    // max_dedicated_wal_groups caps the number of dedicated-raft groups a tenant
    // may grant a dedicated WAL. -1 = unlimited; 0 = default (no dedicated WAL).
    int64 max_dedicated_wal_groups = 16;
}

// TenantEntitlements describes which isolation tiers and dedicated-storage
// features a tenant's plan permits.
message TenantEntitlements {
    repeated string allowed_isolation_modes = 1;
    bool allow_dedicated_raft               = 2;
    bool allow_volume_storage               = 3;
    // allow_system_managed_barrier permits a tenant to opt into the
    // system-managed auto-unseal key-management mode for its dedicated barrier.
    bool allow_system_managed_barrier       = 4;
    // allowed_barrier_modes lists the dedicated-barrier sealing strategies the
    // isolated tenant may select (none/passphrase/shamir or an xkms hardware id).
    repeated string allowed_barrier_modes   = 5;
    // allow_dedicated_wal permits a tenant to opt a dedicated-raft database into
    // a dedicated WAL group (requires the allow_dedicated_raft entitlement).
    bool allow_dedicated_wal                = 6;
    // allowed_volume_pools lists the named volume pools (pkg/volume's
    // catalog) a volume/raft tenant may be placed on. The first entry is
    // the tenant's default pool. Fail-closed: empty entitles no pool.
    repeated string allowed_volume_pools    = 7;
}

// TenantRefusal is the answering node's own view of why it will not serve
// a tenant's dedicated-isolation data: its catalog Assignment or volume
// pool did not resolve on this node. Another node may still serve the
// tenant; a caller that needs the cluster view reads the pool's per-node
// health (VolumePoolGet) instead.
message TenantRefusal {
    // code is stable: pool_unavailable | provider_missing.
    string code    = 1;
    // message is the typed error's text; for display, never parsed.
    string message = 2;
}

// TenantResponse is the shared response shape for tenant CRUD operations.
message TenantResponse {
    string       id             = 1;
    string       name           = 2;
    string       isolation_type = 3;
    TenantQuotas quotas         = 4;
    string       created_at     = 5;
    string       updated_at     = 6;
    TenantEntitlements entitlements = 7;
    // data_root was removed (docs/volume-pools/api.md): the dedicated
    // filesystem root is never named on the wire, only resolved locally.
    reserved 8;
    reserved "data_root";
    // volume_pool is the named volume pool an IsolationVolume/IsolationRaft
    // tenant is placed on, or the pool the registry placed an IsolationBarrier
    // tenant's barrier on. Empty for prefix tenants.
    string volume_pool = 9;
    // refusal is set when the answering node will not serve this tenant's
    // data; absent otherwise.
    TenantRefusal refusal = 10;
    // description is the tenant's free-text description; empty when unset.
    string description = 11;
    // metadata is the tenant's caller-defined string map; empty when unset.
    map<string, string> metadata = 12;
    // status is the tenant's operational status: "active", "suspended" or
    // "disabled". A principal of a tenant that is not active is refused.
    string status = 13;
}

// TenantCreateRequest creates a new tenant.
message TenantCreateRequest {
    string id             = 1;
    string name           = 2;
    string isolation_type = 3;
    // barrier_auto_unseal opts a dedicated-isolation tenant (barrier/volume)
    // into the system-managed auto-unseal key-management mode. The default
    // (false) is the secure self-managed mode. Entitlement-gated.
    bool barrier_auto_unseal = 4;
    // data_root was removed (docs/volume-pools/api.md): an operator-pinned
    // filesystem path is no longer accepted; a tenant is always placed on
    // a named volume pool.
    reserved 5;
    reserved "data_root";
    // volume_pool names the pool a volume/raft tenant is placed on. Empty
    // (the default) uses the tenant's default pool, the first entry of its
    // allowed_volume_pools; with none entitled, creation is refused
    // (PERMISSION_DENIED, volume_pool:<none>). Refused for prefix/barrier.
    string volume_pool = 6;
    // admin_username is the tenant's first admin. Required: a tenant is
    // created with its first admin's login credential, or not at all.
    string admin_username = 7;
    // admin_csr_pem is the admin's CSR, signed by the tenant's own Key B CA;
    // the admin keeps its key. Exactly one of this and admin_cert_pem.
    string admin_csr_pem = 8;
    // admin_cert_pem is the admin's own certificate, leaf first; it must
    // chain to one of trust_anchors_pem.
    string admin_cert_pem = 9;
    // admin_chain_pem holds intermediates for admin_cert_pem.
    string admin_chain_pem = 10;
    // trust_anchors_pem registers the tenant's trust anchors with it.
    string trust_anchors_pem = 11;
    // so_username is the tenant's security officer, optional: a second
    // principal, distinct from the admin by name and by key, holding the
    // tenant's so role alone. so_username, exactly one of so_csr_pem and
    // so_cert_pem, and so_pin are given together or not at all.
    string so_username = 12;
    // so_csr_pem is the SO's CSR, signed as admin_csr_pem is.
    string so_csr_pem = 13;
    // so_cert_pem is the SO's own certificate, leaf first; it must chain to
    // one of trust_anchors_pem.
    string so_cert_pem = 14;
    // so_chain_pem holds intermediates for so_cert_pem.
    string so_chain_pem = 15;
    // so_pin is the SO's second factor (auth.so_dual_factor), the PIN the
    // SO gate asks the SO for.
    string so_pin = 16;
}

// TenantCreateResponse is the created tenant and its first admin's
// credential, and its SO's when the request named one. There is never a
// private key.
message TenantCreateResponse {
    TenantResponse tenant = 1;
    TenantAdminCredential admin = 2;
    TenantAdminCredential so = 3;
}

// TenantAdminCredential is a tenant's first admin, or its SO, as onboarding
// left it.
message TenantAdminCredential {
    // user_id is 0 while awaits_barrier_init.
    uint64 user_id = 1;
    string username = 2;
    string cert_pem = 3;
    // serial is empty for a bring-your-own certificate.
    string serial = 4;
    string thumbprint = 5;
    // awaits_barrier_init: the tenant keeps its identity records behind its
    // own barrier, so the admin's account is created when the admin
    // initializes it -- which only this certificate may do.
    bool awaits_barrier_init = 6;
}

// TenantGetRequest retrieves a tenant by ID.
message TenantGetRequest {
    string id = 1;
}

// TenantListResponse returns all tenants.
message TenantListResponse {
    repeated TenantResponse tenants = 1;
}

// TenantListDeletedRequest pages through retired tenant ids. page_size 0 means
// the server default; a size above the server maximum is served at the
// maximum. page_token is the previous response's next_page_token.
message TenantListDeletedRequest {
    int32  page_size  = 1;
    string page_token = 2;
}

// DeletedTenant is one retired tenant id and its deletion record. Timestamps
// are RFC 3339; created_at is empty when the record did not carry it.
message DeletedTenant {
    string id             = 1;
    string name           = 2;
    string isolation_type = 3;
    // data_root was removed (docs/volume-pools/api.md).
    reserved 4;
    reserved "data_root";
    string created_at     = 5;
    string deleted_at     = 6;
    // volume_pool is the named volume pool the deleted tenant was placed
    // on; empty for prefix tenants.
    string volume_pool = 7;
}

// TenantListDeletedResponse is one page of retired tenant ids.
message TenantListDeletedResponse {
    repeated DeletedTenant tenants         = 1;
    string                 next_page_token = 2;
}

// TenantResiduePath is one directory the deleted-tenant reconcile removed or
// left in place. reason is set only for a path left in place; path is empty
// when the whole id was left alone.
message TenantResiduePath {
    string tenant_id = 1;
    string path      = 2;
    string reason    = 3;
}

// TenantResidueFailure is one retired id the reconcile could not fully
// reclaim: the step that failed, the path it failed on (empty when the step
// is not about one path), and the error's message. The id keeps its records,
// so the next pass retries it.
message TenantResidueFailure {
    string tenant_id = 1;
    string op        = 2;
    string path      = 3;
    string error     = 4;
}

// TenantReconcileDeletedResponse reports one reconcile pass on one node. A
// pass that failed for some ids still answers with this response, listing
// them in failed beside what it did for the rest; only a failure to read the
// tombstones or the live tenant set is an error status.
message TenantReconcileDeletedResponse {
    int32                         inspected = 1;
    repeated TenantResiduePath    reclaimed = 2;
    repeated TenantResiduePath    skipped   = 3;
    repeated TenantResidueFailure failed    = 4;
}

// ---------------------------------------------------------------------------
// Volume pool messages (docs/volume-pools/api.md)
// ---------------------------------------------------------------------------

// VolumePoolNodeCounts tallies a pool's per-node health: how many of the
// nodes that have reported it are ready, locked, unavailable, or (always 0
// in this release -- see pkg/volume.NodeHealthCounts) unmapped.
message VolumePoolNodeCounts {
    int32 ready       = 1;
    int32 locked      = 2;
    int32 unavailable = 3;
    int32 unmapped    = 4;
}

// VolumePool is one pool's catalog record plus the aggregate view every
// list/get response reports: measured usage, assigned-tenant count, and a
// per-node health tally.
message VolumePool {
    string name                    = 1;
    string provider                = 2;
    string description             = 3;
    int64  capacity_bytes          = 4;
    int64  reserved_bytes          = 5;
    int64  used_bytes              = 6;
    int32  tenant_count            = 7;
    VolumePoolNodeCounts nodes     = 8;
    double overcommit              = 9;
    string created_at              = 10;
    string updated_at              = 11;
}

// VolumePoolNodeReport is one node's report, scoped to a single pool.
// state is "ready", "locked", "unavailable", "unmapped" (the node's last
// report said it does not map the pool) or "no_report" (the report is
// older than the catalog's lease TTL; size_bytes, free_bytes and detail
// are zeroed rather than shown stale).
message VolumePoolNodeReport {
    string node_id     = 1;
    string state       = 2;
    int64  size_bytes  = 3;
    int64  free_bytes  = 4;
    string detail      = 5;
    string reported_at = 6;
}

// VolumePoolDetail is VolumePoolGet's response: a VolumePool plus one row
// per node that has reported it.
message VolumePoolDetail {
    VolumePool pool                           = 1;
    repeated VolumePoolNodeReport node_reports = 2;
}

// VolumePoolListResponse lists every pool in the catalog. Not paginated.
message VolumePoolListResponse {
    repeated VolumePool pools = 1;
}

// VolumePoolGetRequest inspects one pool.
message VolumePoolGetRequest {
    string name = 1;
}

// VolumePoolCreateRequest adds a pool to the catalog.
message VolumePoolCreateRequest {
    string name            = 1;
    // provider defaults to "dir" when empty.
    string provider        = 2;
    string description     = 3;
    // capacity_bytes of 0 means derived from health reports.
    int64  capacity_bytes  = 4;
    // overcommit defaults to 1.0 when 0; must be >= 1.0 otherwise.
    double overcommit      = 5;
}

// VolumePoolUpdateRequest changes a pool's description, capacity or
// overcommit. The provider is immutable. Wrapper types distinguish
// "absent, leave unchanged" from "explicitly set to the zero value":
// capacity_bytes of a present, zero wrapper returns the pool to the
// derived capacity.
message VolumePoolUpdateRequest {
    string                        name           = 1;
    google.protobuf.StringValue   description    = 2;
    google.protobuf.Int64Value    capacity_bytes = 3;
    google.protobuf.DoubleValue   overcommit     = 4;
}

// VolumePoolDeleteRequest removes a pool from the catalog. Refused while
// any tenant is assigned to it.
message VolumePoolDeleteRequest {
    string name = 1;
}

// VolumePoolListTenantsRequest pages through the tenants assigned to a
// pool. page_size 0 means the server default; page_token is the previous
// response's next_page_token.
message VolumePoolListTenantsRequest {
    string pool       = 1;
    string page_token = 2;
    int32  page_size  = 3;
}

// VolumePoolTenant is one row of VolumePoolListTenantsResponse: an
// assigned tenant's reservation and measured use on the pool.
message VolumePoolTenant {
    string tenant_id      = 1;
    int64  reserved_bytes = 2;
    int64  used_bytes     = 3;
}

// VolumePoolListTenantsResponse is one page of a pool's assigned tenants.
message VolumePoolListTenantsResponse {
    repeated VolumePoolTenant tenants = 1;
    string next_page_token            = 2;
}

// TenantUpdateRequest applies a partial update to an existing tenant.
message TenantUpdateRequest {
    string id             = 1;
    string name           = 2;
    string isolation_type = 3;
    // description, when present, replaces the tenant's description; an
    // empty string clears it. Absent leaves it unchanged.
    optional string description = 4;
    // metadata, when present, replaces the tenant's whole metadata map; an
    // empty entries map clears it. Absent leaves it unchanged. A bare proto
    // map cannot tell "clear" from "unchanged", hence the wrapper message.
    TenantMetadata metadata = 5;
    // status, when present, moves the tenant to that status ("active",
    // "suspended" or "disabled"), along the allowed transitions; it needs
    // tenants:set_status. Absent leaves it unchanged.
    optional string status = 6;
}

// TenantMetadata carries a tenant's caller-defined string map on an update.
message TenantMetadata {
    map<string, string> entries = 1;
}

// TenantDeleteRequest removes a tenant by ID.
message TenantDeleteRequest {
    string id = 1;
}

// TenantUpdateQuotasRequest sets the resource quotas for a tenant.
message TenantUpdateQuotasRequest {
    string       id     = 1;
    TenantQuotas quotas = 2;
}

// TenantUpdateEntitlementsRequest sets the feature entitlements for a tenant.
message TenantUpdateEntitlementsRequest {
    string             id           = 1;
    TenantEntitlements entitlements = 2;
}

// ===========================================================================
// Tenant DEK keyring messages
// ===========================================================================

// TenantDEKRequest names the tenant a keyring call acts on. Empty means the
// caller's own tenant, which is also the only tenant accepted.
message TenantDEKRequest {
    string tenant_id = 1;
}

// TenantDEKRetireRequest names the key version to retire.
message TenantDEKRetireRequest {
    string tenant_id = 1;
    uint64 version   = 2;
}

// TenantDEKVersion describes one keyring version. retired_at_unix is 0 while
// the version is live. provider_id and key_ref name the KEK (pkg/keywrap)
// that wrapped this version's key, for audit -- never the key itself. Both
// are empty once the version is retired.
message TenantDEKVersion {
    uint64 version         = 1;
    int64  created_at_unix = 2;
    int64  retired_at_unix = 3;
    string provider_id     = 4;
    string key_ref         = 5;
}

// TenantDEKStatusResponse describes a tenant's keyring. current_version 0
// means the tenant has no keyring yet.
message TenantDEKStatusResponse {
    string                    tenant_id       = 1;
    string                    algorithm       = 2;
    uint64                    current_version = 3;
    repeated TenantDEKVersion versions        = 4;
}

// TenantDEKEncryptRequest carries data to seal and its associated data.
message TenantDEKEncryptRequest {
    string tenant_id = 1;
    bytes  plaintext = 2;
    bytes  aad       = 3;
}

// TenantDEKEncryptResponse carries the opaque ciphertext and its version.
message TenantDEKEncryptResponse {
    bytes  ciphertext = 1;
    uint64 version    = 2;
}

// TenantDEKDecryptRequest carries a ciphertext and its associated data.
message TenantDEKDecryptRequest {
    string tenant_id  = 1;
    bytes  ciphertext = 2;
    bytes  aad        = 3;
}

// TenantDEKDecryptResponse carries the plaintext and the version it was
// sealed under.
message TenantDEKDecryptResponse {
    bytes  plaintext = 1;
    uint64 version   = 2;
}

// TenantDEKRewrapRequest carries a ciphertext to move to the current version.
message TenantDEKRewrapRequest {
    string tenant_id  = 1;
    bytes  ciphertext = 2;
    bytes  aad        = 3;
}

// TenantDEKRewrapResponse carries the re-sealed ciphertext.
message TenantDEKRewrapResponse {
    bytes  ciphertext   = 1;
    uint64 from_version = 2;
    uint64 to_version   = 3;
}

// ABACPolicy is one ABAC policy document, field for field the document the
// policy_dir files hold (pkg/auth/abac.Policy).
message ABACPolicy {
    string             api_version = 1;
    string             kind        = 2;
    ABACPolicyMetadata metadata    = 3;
    ABACPolicySpec     spec        = 4;
}

message ABACPolicyMetadata {
    string              name        = 1;
    // tenant is optional on a write and, when set, must name the caller's
    // tenant. A read always carries it.
    string              tenant      = 2;
    string              description = 3;
    map<string, string> labels      = 4;
    int64               priority    = 5;
    // created and updated are RFC 3339 timestamps the server sets; a value
    // sent on a write is ignored.
    string              created     = 6;
    string              updated     = 7;
}

message ABACPolicySpec {
    // enabled is presence-tracked: unset means the document does not set it
    // (enabled), false disables the policy. A read returns it exactly as it
    // was written, set or unset.
    optional bool          enabled   = 1;
    ABACSubjectSelector    subjects  = 2;
    map<string, string>    variables = 3;
    repeated ABACRule      rules     = 4;
}

message ABACSubjectSelector {
    repeated string        users         = 1;
    repeated string        groups        = 2;
    repeated string        roles         = 3;
    repeated string        services      = 4;
    // match holds the attribute criteria, a JSON object (RFC 8259) of
    // attribute names to values or operator objects such as {"gte": 3}.
    // Empty means none.
    string                 match_json    = 5;
    bool                   authenticated = 6;
    bool                   any           = 7;
}

message ABACRule {
    string                 name      = 1;
    // effect is "allow" or "deny".
    string                 effect    = 2;
    int64                  priority  = 3;
    repeated string        actions   = 4;
    repeated string        resources = 5;
    repeated ABACCondition when      = 6;
    repeated ABACCondition unless    = 7;
}

message ABACCondition {
    string expression = 1;
}

// ABACPolicyRequest names one policy of the caller's tenant. tenant_id is
// optional and, when set, must name that tenant.
message ABACPolicyRequest {
    string tenant_id = 1;
    string name      = 2;
}

message ABACPolicyListRequest {
    string tenant_id = 1;
}

message ABACPolicyListResponse {
    repeated ABACPolicy policies = 1;
}

// ===========================================================================
// Credential messages
// ===========================================================================

// CredentialSubmitRequest carries the named credential value to store. The
// value is bytes (not string) because credentials routinely carry non-UTF-8
// content (private keys, certificates, random tokens); proto3 string fields
// reject non-UTF-8 during marshal.
message CredentialSubmitRequest {
    string name  = 1;
    bytes  value = 2;
}

// CredentialStoreRequest carries the named credential value to persist. See
// CredentialSubmitRequest for why value is bytes.
message CredentialStoreRequest {
    string name  = 1;
    bytes  value = 2;
}

// CredentialRetrieveRequest identifies a credential to read by name.
message CredentialRetrieveRequest {
    string name = 1;
}

// CredentialRetrieveResponse carries the credential value for the named
// credential. value is bytes to preserve arbitrary binary content.
message CredentialRetrieveResponse {
    bytes value = 1;
}

// CredentialStrategyResponse describes the active credential management
// strategy.
message CredentialStrategyResponse {
    string strategy = 1;
}

// CredentialDeleteRequest identifies a credential to delete by name.
message CredentialDeleteRequest {
    string name = 1;
}

// CredentialListRequest is the request shape for credential enumeration.
// Currently empty; reserved for future filter fields (tenant, prefix, label).
message CredentialListRequest {}

// CredentialListResponse returns the sorted list of credential names.
message CredentialListResponse {
    repeated string names = 1;
}

// CredentialRotateRequest captures all inputs to a CredentialRotate call.
// grace_period_seconds == 0 means "no grace" — the previous value is wiped
// immediately.
message CredentialRotateRequest {
    string name                  = 1;
    bytes  new_value             = 2;
    int64  grace_period_seconds  = 3;
}

// CredentialRotateResponse describes the outcome of a rotation.
// grace_until_unix is zero when no previous version existed or when the
// caller specified grace_period_seconds == 0.
message CredentialRotateResponse {
    string name             = 1;
    uint64 previous_version = 2;
    uint64 new_version      = 3;
    int64  grace_until_unix = 4;
}

// CredentialRetrieveVersionRequest selects a specific version of a
// credential to retrieve. version == 0 means "current version".
message CredentialRetrieveVersionRequest {
    string name    = 1;
    uint64 version = 2;
}

// CredentialRetrieveVersionResponse carries the credential value for the
// requested version. value is bytes to preserve arbitrary binary content.
message CredentialRetrieveVersionResponse {
    bytes value = 1;
}

// CredentialListVersionsRequest identifies the credential whose version
// history is being requested.
message CredentialListVersionsRequest {
    string name = 1;
}

// CredentialVersionInfo is the wire-format version metadata entry. The
// value bytes are intentionally absent — use CredentialRetrieveVersion to
// read the bytes for a specific version.
message CredentialVersionInfo {
    uint64 version           = 1;
    bool   is_current        = 2;
    int64  created_at_unix   = 3;
    int64  grace_until_unix  = 4;
}

// CredentialListVersionsResponse returns one entry per non-expired version
// (current + grace history).
message CredentialListVersionsResponse {
    string                         name     = 1;
    repeated CredentialVersionInfo versions = 2;
}

// CredentialGCRequest names the credential whose expired grace versions
// should be reaped.
message CredentialGCRequest {
    string name = 1;
}

// CredentialGCResponse reports how many historical versions were reaped.
message CredentialGCResponse {
    int32 reaped = 1;
}

// ===========================================================================
// Backup messages
//
// compression is one of "none", "zstd", "snappy"; encryption is one of
// "none", "aes256"; status is one of "pending", "running", "complete",
// "failed". These mirror the string-typed service enums.
// ===========================================================================

// BackupCreateRequest describes a backup to capture. An empty shard_ids list
// backs up every shard on the host.
//
// field 4 (encryption_key) carried the retired inline-raw-key escape hatch
// and is permanently reserved: every KEK is referenced through a
// keywrap.Provider now (key_provider_id/key_ref), never passed as bytes.
message BackupCreateRequest {
    reserved 4;
    reserved "encryption_key";
    string              destination     = 1;
    string              compression     = 2;
    string              encryption      = 3;
    map<string, string> metadata        = 5;
    repeated uint64     shard_ids       = 6;
    // key_provider_id names the registered keywrap.Provider to wrap this
    // backup's DEK with. Empty defaults to "software" when key_ref is set.
    string              key_provider_id = 7;
    // key_ref is the key reference the named provider resolves -- the
    // bare NAME of a key file inside the server's configured key
    // directory for "software", never a path.
    string              key_ref         = 8;
}

// BackupInfo is the metadata describing a stored backup artifact.
message BackupInfo {
    string              id              = 1;
    int64               timestamp_ns    = 2;
    int64               size            = 3;
    int32               shard_count     = 4;
    string              status          = 5;
    string              checksum        = 6;
    string              destination     = 7;
    string              compression     = 8;
    string              encryption      = 9;
    map<string, string> metadata        = 10;
    int64               duration_ns     = 11;
    string              error_message   = 12;
    // key_provider_id is the keywrap.Provider that wrapped this backup's
    // DEK. Empty for a "none" backup.
    string              key_provider_id = 13;
}

// BackupListResponse enumerates stored backups. Artifact contents are never
// returned.
message BackupListResponse {
    repeated BackupInfo backups = 1;
}

// BackupGetRequest names a backup by ID.
message BackupGetRequest {
    string id = 1;
}

// BackupDeleteRequest names a backup to remove.
message BackupDeleteRequest {
    string id = 1;
}

// BackupRestoreRequest restores shards from a stored backup. An empty
// target_shards list restores every shard captured in the backup.
//
// field 4 (decryption_key) carried the retired inline-raw-key escape hatch
// and is permanently reserved; see BackupCreateRequest.
message BackupRestoreRequest {
    reserved 4;
    reserved "decryption_key";
    string          backup_id          = 1;
    repeated uint64 target_shards      = 2;
    bool            validate_first     = 3;
    // decryption_key_ref overrides the key reference stored in the
    // backup's own envelope -- useful when restoring on a different node,
    // or after the key file has moved. Left empty, the stored reference is
    // used. The provider actually used to unwrap is always whichever one
    // the backup was created under; this field never selects a different
    // provider than that.
    string          decryption_key_ref = 5;
    // allow_plaintext is the caller's explicit opt-in to restore a
    // backup whose stored state is plaintext. Left false (the
    // default), the server refuses with a typed error before touching
    // any shard -- never inferred from the backup's own stored
    // metadata, which an attacker who also deletes the backup's
    // envelope can make internally consistent.
    bool            allow_plaintext    = 6;
}

// ShardError reports a per-shard failure during restore.
message ShardError {
    uint64 shard_id = 1;
    string message  = 2;
}

// BackupRestoreResponse reports the outcome of a restore.
message BackupRestoreResponse {
    string              backup_id       = 1;
    int32               shards_restored = 2;
    int64               duration_ns     = 3;
    repeated ShardError errors          = 4;
}

// BackupVerifyRequest names a backup to verify.
message BackupVerifyRequest {
    string id = 1;
}

// BackupVerifyResponse reports backup integrity-check results.
message BackupVerifyResponse {
    bool            valid             = 1;
    bool            checksum_match    = 2;
    string          expected_checksum = 3;
    string          actual_checksum   = 4;
    repeated string errors            = 5;
}

// ===========================================================================
// Rebalance messages
// ===========================================================================

// RebalanceShardStatsRequest names a shard to inspect.
message RebalanceShardStatsRequest {
    uint64 shard_id = 1;
}

// ShardStats contains statistics for a single shard.
message ShardStats {
    uint64 shard_id      = 1;
    uint64 key_count     = 2;
    uint64 byte_count    = 3;
    uint64 leader_id     = 4;
    int32  replica_count = 5;
}

// RebalancePlanRequest parameterizes plan generation. max_moves == 0 means no
// limit; target_balance is a percentage (0-100).
message RebalancePlanRequest {
    int32  max_moves      = 1;
    bool   dry_run        = 2;
    double target_balance = 3;
}

// RebalanceMove describes a single planned shard move.
message RebalanceMove {
    uint64 shard_id        = 1;
    string from_node       = 2;
    string to_node         = 3;
    uint64 estimated_bytes = 4;
}

// RebalancePlan is the generated set of moves and its metadata. It is both the
// result of RebalanceCreatePlan and the input to RebalanceExecute.
message RebalancePlan {
    repeated RebalanceMove moves                 = 1;
    int64                  estimated_duration_ns = 2;
    double                 current_imbalance     = 3;
}

// RebalanceExecutionResponse reports the outcome of an executed plan.
message RebalanceExecutionResponse {
    int32  moves_completed = 1;
    int32  moves_failed    = 2;
    int64  duration_ns     = 3;
    double final_imbalance = 4;
    // failures carries one entry per failed move, in plan order.
    repeated RebalanceMoveFailure failures = 5;
}

// RebalanceMoveFailure names a move that could not be completed and why.
message RebalanceMoveFailure {
    uint64 shard_id  = 1;
    string from_node = 2;
    string to_node   = 3;
    // step is the dedicated-group move phase that failed; empty for a
    // generic shard move.
    string step      = 4;
    string error     = 5;
}

// NodeLoad describes the load distribution on a single node.
message NodeLoad {
    string node_id      = 1;
    string address      = 2;
    int32  shard_count  = 3;
    uint64 total_keys   = 4;
    uint64 total_bytes  = 5;
    int32  leader_count = 6;
}

// ImbalanceReport describes the cluster's current load distribution.
message ImbalanceReport {
    repeated NodeLoad nodes           = 1;
    double            imbalance_score = 2;
    repeated string   hotspots        = 3;
}

// ===========================================================================
// Embedding messages
// ===========================================================================

// EmbeddingVector wraps a single embedding vector so a repeated field can
// model a [][]float matrix.
message EmbeddingVector {
    repeated float values = 1;
}

// EmbeddingUsage reports token consumption for an embedding request.
message EmbeddingUsage {
    int32 prompt_tokens = 1;
    int32 total_tokens  = 2;
}

// EmbeddingModelInfo describes a single embedding model.
message EmbeddingModelInfo {
    string name       = 1;
    int32  dimensions = 2;
    int32  max_tokens = 3;
}

// EmbedRequest embeds one or more texts. An empty provider/model selects the
// service default.
message EmbedRequest {
    repeated string texts    = 1;
    string          model    = 2;
    string          provider = 3;
}

// EmbedResponse returns one vector per input text, in input order.
message EmbedResponse {
    repeated EmbeddingVector embeddings = 1;
    string                   model      = 2;
    EmbeddingUsage           usage      = 3;
    bool                     cached     = 4;
}

// BatchEmbedRequest embeds a large set of texts. batch_size == 0 lets the
// service pick a default.
message BatchEmbedRequest {
    repeated string texts      = 1;
    string          model      = 2;
    string          provider   = 3;
    int32           batch_size = 4;
}

// BatchEmbedResponse returns one vector per input text, in input order.
message BatchEmbedResponse {
    repeated EmbeddingVector embeddings  = 1;
    string                   model       = 2;
    EmbeddingUsage           total_usage = 3;
}

// ListEmbeddingModelsRequest names a provider to query (empty = default).
message ListEmbeddingModelsRequest {
    string provider = 1;
}

// ListEmbeddingModelsResponse enumerates a provider's models.
message ListEmbeddingModelsResponse {
    repeated EmbeddingModelInfo models = 1;
}

// ===========================================================================
// RAG (retrieval-augmented generation) messages
// ===========================================================================

// ChunkConfig overrides the document chunking configuration.
message ChunkConfig {
    string strategy   = 1;
    int32  chunk_size = 2;
    int32  overlap    = 3;
    int32  min_size   = 4;
}

// RAGIngestDocumentRequest chunks, embeds, and stores a document.
message RAGIngestDocumentRequest {
    string              document_id  = 1;
    string              text         = 2;
    string              namespace    = 3;
    string              model        = 4;
    string              provider     = 5;
    ChunkConfig         chunk_config = 6;
    map<string, string> metadata     = 7;
}

// RAGIngestDocumentResponse reports the outcome of ingestion.
message RAGIngestDocumentResponse {
    string document_id = 1;
    int32  chunk_count = 2;
    string namespace   = 3;
}

// RAGQueryRequest searches a namespace for semantically similar passages.
message RAGQueryRequest {
    string              query     = 1;
    string              namespace = 2;
    int32               top_k     = 3;
    string              model     = 4;
    string              provider  = 5;
    map<string, string> filter    = 6;
}

// RAGQueryResult is a single retrieved passage.
message RAGQueryResult {
    string              chunk_text  = 1;
    float               score       = 2;
    string              document_id = 3;
    int32               chunk_index = 4;
    map<string, string> metadata    = 5;
}

// RAGQueryResponse returns retrieved passages ordered by relevance.
message RAGQueryResponse {
    repeated RAGQueryResult results = 1;
}

// RAGDeleteDocumentRequest names a document to remove from a namespace.
message RAGDeleteDocumentRequest {
    string document_id = 1;
    string namespace   = 2;
}

// RAGDeleteDocumentResponse reports how many chunks were removed.
message RAGDeleteDocumentResponse {
    string document_id   = 1;
    int32  chunks_removed = 2;
}

// RAGListDocumentsRequest pages through documents in a namespace. limit == 0
// means no limit.
message RAGListDocumentsRequest {
    string namespace = 1;
    int32  limit     = 2;
    int32  offset    = 3;
}

// RAGDocumentInfo describes an ingested document.
message RAGDocumentInfo {
    string              id          = 1;
    string              namespace   = 2;
    int32               chunk_count = 3;
    map<string, string> metadata    = 4;
}

// RAGListDocumentsResponse returns a page of documents and the namespace total.
message RAGListDocumentsResponse {
    repeated RAGDocumentInfo documents = 1;
    int32                    total     = 2;
}

// ===========================================================================
// Database encryption-barrier messages
// ===========================================================================

// DatabaseSealRequest names the database whose barrier should be sealed.
message DatabaseSealRequest {
    string name = 1;
}

// DatabaseUnsealRequest carries the unseal secret for a database barrier.
message DatabaseUnsealRequest {
    string name   = 1;
    string secret = 2;
}

// DatabaseBarrierStatusRequest names the database to query.
message DatabaseBarrierStatusRequest {
    string name = 1;
}

// DatabaseBarrierOfficerRegisterRequest enrols a holder of database's barrier.
message DatabaseBarrierOfficerRegisterRequest {
    string database = 1;
    BarrierOfficerRegisterRequest officer = 2;
}

// DatabaseBarrierOfficerListRequest names the database whose holders to list.
message DatabaseBarrierOfficerListRequest {
    string database = 1;
}

// DatabaseBarrierShamirInitializeRequest initializes a database barrier's
// custody at the M-of-N the database was created with, under policy.
message DatabaseBarrierShamirInitializeRequest {
    string database = 1;
    string policy   = 2;
}

// DatabaseBarrierShareClaimBeginRequest opens a database holder's claim.
message DatabaseBarrierShareClaimBeginRequest {
    string database = 1;
    BarrierShareClaimBeginRequest claim = 2;
}

// DatabaseBarrierShareClaimCompleteRequest completes a database holder's claim.
message DatabaseBarrierShareClaimCompleteRequest {
    string database = 1;
    BarrierShareClaimCompleteRequest claim = 2;
}

// DatabaseBarrierQuorumBeginRequest asks for a database holder's challenge.
message DatabaseBarrierQuorumBeginRequest {
    string database = 1;
    BarrierQuorumBeginRequest begin = 2;
}

// DatabaseBarrierQuorumSubmitRequest submits a database holder's share.
message DatabaseBarrierQuorumSubmitRequest {
    string database = 1;
    BarrierQuorumSubmitRequest submit = 2;
}

// DatabaseBarrierRekeyStartRequest opens a rekey round on a database barrier.
message DatabaseBarrierRekeyStartRequest {
    string database  = 1;
    int32  threshold = 2;
    string policy    = 3;
}

// DatabaseBarrierOfficerRevokeRequest revokes a database holder.
message DatabaseBarrierOfficerRevokeRequest {
    string database  = 1;
    string username  = 2;
    int32  threshold = 3;
}

// DatabaseBarrierOfficerUnenrolRequest removes a database holder before its
// custody is initialized.
message DatabaseBarrierOfficerUnenrolRequest {
    string database = 1;
    string username = 2;
}

// DatabaseBarrierStatusResponse reports a database barrier's sealed state and
// active strategy metadata.
message DatabaseBarrierStatusResponse {
    bool   sealed              = 1;
    string strategy            = 2;
    bool   hardware_backed     = 3;
    int64  initialized_at_unix = 4;
    // cluster_seal is the database barrier's cluster seal state.
    ClusterSealState cluster_seal = 5;
}

// ===========================================================================
// SQL messages
// ===========================================================================

// SQLQueryRequest executes an ad-hoc SQL query against a named database.
message SQLQueryRequest {
    string query = 1;
    string database = 2;
    // consistency is an optional read-consistency level ("linearizable",
    // "sequential", "eventual"); empty defaults to the server's default.
    string consistency = 3;
}

// SQLRow is a single result row, keyed by column name. All cell values are
// pre-formatted as strings, mirroring service.SQLQueryResult.Rows.
message SQLRow {
    map<string, string> values = 1;
}

// SQLQueryResponse is the result of a SQL query execution.
message SQLQueryResponse {
    repeated string columns = 1;
    repeated SQLRow rows = 2;
    int64 row_count = 3;
    // duration is the human-readable query execution duration.
    string duration = 4;
}

// ===========================================================================
// TenantBarrierService — per-tenant barrier lifecycle (none/passphrase/shamir)
//
// Each tenant barrier is independent of the system barrier and may use a
// different strategy. Service-layer authorization (caller must be a tenant
// admin of the target tenant; the system tenant is denied) is enforced by the
// interceptors; the handlers delegate to pkg/tenant.TenantServicer.
// ===========================================================================
service TenantBarrierService {
    // InitBegin is the first half of tenant barrier initialization: it issues
    // a single-use nonce bound to this connection's TLS exporter, which
    // InitComplete must sign with the first admin's key.
    //
    // identity:gated at the interceptor because a self-managed tenant's IAM
    // is encrypted BEHIND the barrier being initialized: no role able to
    // satisfy tenant_barrier:init can exist before the first init. The
    // handler runs the full RBAC check with the shared trust-on-first-init
    // fallback (middleware.BeginTenantBarrierInit), identical to every other
    // transport.
    rpc InitBegin(TenantBarrierInitBeginRequest) returns (TenantBarrierInitBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // InitComplete initializes a tenant barrier with the selected strategy,
    // given proof of possession of the first admin's key over this
    // connection (nonce, public_key, signature). For the Shamir strategy the
    // share_count field indicates how many officer shares were sealed; shares
    // are never returned in the response. identity:gated for InitBegin's
    // reason; the handler authorizes through
    // middleware.AuthorizeTenantBarrierInitProof.
    rpc InitComplete(TenantBarrierInitRequest) returns (TenantBarrierInitResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // SignedInitBegin is the first half of a two-phase signed initialization,
    // for a client whose first admin signs away from the connection: it
    // prepares the barrier's epoch-1 init statement naming public_key and
    // returns the exact message to sign with a single-use reference. A Shamir
    // init prepares its split here. identity:gated for InitBegin's reason; the
    // handler authorizes through middleware.AuthorizeTenantBarrierInit. The
    // signed statement, anchored to the tenant's first admin, is the proof of
    // possession, so no channel-bound nonce is needed.
    rpc SignedInitBegin(TenantBarrierSignedInitBeginRequest) returns (TenantBarrierSignedInitBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // SignedInitComplete redeems SignedInitBegin's reference with the detached
    // signature over its statement and initializes the barrier under it.
    // identity:gated for InitBegin's reason; authorized as SignedInitBegin.
    rpc SignedInitComplete(TenantBarrierSignedInitCompleteRequest) returns (TenantBarrierInitResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // Unseal unseals a tenant barrier using a single key (passphrase strategy).
    //
    // identity:gated at the interceptor: unseal must remain reachable while
    // the tenant's IAM is unreachable (sealed window). The handler runs the
    // full RBAC check with the shared sealed-window fallback
    // (middleware.AuthorizeTenantBarrierSealedOp).
    rpc Unseal(TenantBarrierUnsealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // Seal seals a tenant barrier.
    rpc Seal(TenantBarrierSealRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "tenant_barrier:seal";
    }

    // Status reports a tenant barrier's sealed/initialized state and strategy.
    // identity:gated for the same sealed-window reason as Unseal: polling
    // status is how a tenant admin drives the unseal flow.
    rpc Status(TenantBarrierStatusRequest) returns (TenantBarrierStatusResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // OfficerRegister enrolls a Security Officer for this tenant's barrier.
    // Only valid for Shamir-strategy tenant barriers.
    rpc OfficerRegister(TenantBarrierOfficerRegisterRequest) returns (TenantBarrierOfficerRegisterResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_register";
    }

    // OfficerList returns the enrolled officers for this tenant's barrier.
    rpc OfficerList(TenantBarrierOfficerListRequest) returns (TenantBarrierOfficerListResponse) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_list";
    }

    // QuorumBegin issues the factor challenge a tenant share holder answers
    // to submit a share (unseal, seal or rekey). identity:gated for the
    // sealed-window reason Unseal is; the handler authorizes.
    rpc QuorumBegin(TenantBarrierQuorumBeginRequest) returns (BarrierQuorumChallenge) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // QuorumSubmit submits one authenticated tenant holder's share.
    rpc QuorumSubmit(TenantBarrierQuorumSubmitRequest) returns (BarrierQuorumOutcome) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // RekeyStart opens a rekey round on the tenant barrier.
    rpc RekeyStart(TenantBarrierRekeyStartRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "tenant_barrier:rekey";
    }

    // OfficerRevoke revokes a tenant share holder through a quorum-gated
    // rekey that excludes them.
    rpc OfficerRevoke(TenantBarrierOfficerRevokeRequest) returns (BarrierQuorumRound) {
        option (qrdb.v1.permission) = "tenant_barrier:officer_revoke";
    }

    // ShareClaimBegin issues a challenge nonce to the named officer as the
    // first step of the two-phase share claim flow.
    rpc ShareClaimBegin(TenantBarrierShareClaimBeginRequest) returns (TenantBarrierShareClaimBeginResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

    // ShareClaimComplete verifies the signed nonce and returns the share bytes
    // exactly once, then destroys the enclave.
    rpc ShareClaimComplete(TenantBarrierShareClaimCompleteRequest) returns (TenantBarrierShareClaimCompleteResponse) {
        option (qrdb.v1.permission) = "identity:gated";
    }

}

// TenantBarrierInitBeginRequest asks for an init nonce for tenant_id.
message TenantBarrierInitBeginRequest {
    string tenant_id = 1;
}

// TenantBarrierInitBeginResponse carries the init nonce and its expiry (Unix
// seconds). The nonce is valid only on the connection that requested it.
message TenantBarrierInitBeginResponse {
    bytes nonce   = 1;
    int64 expires = 2;
}

// TenantBarrierInitRequest initializes the barrier for tenant_id
// (InitComplete). passphrase is `bytes` so callers can zeroize it. officers,
// when non-empty, is the inline Shamir share-holder roster to validate and
// register atomically with initialization (shamir strategy only; refused on
// any other); policy is the factor policy those officers enrol under ("" =
// designated). nonce is InitBegin's, public_key the DER SubjectPublicKeyInfo
// of the first admin's key, and signature that key's signature over the
// tenant id, the nonce and this connection's TLS exporter (pkg/initproof).
// init_statement is the first admin's signed epoch-1 init statement for the
// barrier (barrierinit.InitStatement), from which every other node serving
// it initializes its own key.
message TenantBarrierInitRequest {
    string tenant_id  = 1;
    bytes  passphrase = 2;
    int32  threshold  = 3;
    int32  shares     = 4;
    string strategy   = 5;
    repeated CeremonyOfficer officers = 6;
    string policy = 7;
    bytes  nonce      = 8;
    bytes  public_key = 9;
    bytes  signature  = 10;
    bytes  init_statement = 11;
    // roster and unseal_key_check mark a Shamir init's second request: they
    // echo the split the first request prepared, which this one completes.
    bytes  roster           = 12;
    bytes  unseal_key_check = 13;
}

// TenantBarrierInitResponse carries the init outcome. For the Shamir strategy
// share_count indicates how many officer shares were sealed into enclaves;
// share bytes are never returned in the wire response. holders carries the
// certificate issued to each officer in an inline roster (request.officers),
// in roster order; empty when no roster was supplied. A Shamir init is two
// requests: the first returns the encoded holder roster and the unseal key's
// check value with the barrier still sealed, the owner signs them into the
// init statement, and the second, echoing them, keys the barrier.
message TenantBarrierInitResponse {
    string tenant_id    = 1;
    string strategy     = 2;
    reserved 3;
    reserved "shares";
    int32  threshold    = 4;
    int32  total_shares = 5;
    int32  share_count  = 6;
    repeated CeremonyHolderCert holders = 7;
    bytes  roster           = 8;
    bytes  unseal_key_check = 9;
    // admin_pending reports a committed Shamir init whose tenant first admin
    // waits on the tenant's home group: holders unseal the other nodes with
    // the certificates above, and the admin completes once the group elects.
    bool   admin_pending    = 10;
}

// TenantBarrierSignedInitBeginRequest asks for tenant_id's init statement,
// naming public_key -- the DER SubjectPublicKeyInfo of the tenant's pending
// first admin's key -- as its signer. key_ref is the strategy's reference to
// the tenant's key; threshold, shares, officers and policy are a Shamir
// init's, as on TenantBarrierInitRequest.
message TenantBarrierSignedInitBeginRequest {
    string tenant_id  = 1;
    string strategy   = 2;
    string key_ref    = 3;
    int32  threshold  = 4;
    int32  shares     = 5;
    repeated CeremonyOfficer officers = 6;
    string policy     = 7;
    bytes  public_key = 8;
}

// TenantBarrierSignedInitBeginResponse carries the statement to sign and the
// reference SignedInitComplete redeems. statement is the exact message the
// key signs, detached: ECDSA over its SHA-256 digest in ASN.1 form, RSA PKCS #1
// v1.5 over its SHA-256 digest, or pure Ed25519 over the bytes. expires is
// when the reference lapses (Unix seconds). threshold through holders report
// a Shamir init's prepared split; zero for every other strategy.
message TenantBarrierSignedInitBeginResponse {
    string tenant_id    = 1;
    string strategy     = 2;
    bytes  reference    = 3;
    bytes  statement    = 4;
    int64  expires      = 5;
    int32  threshold    = 6;
    int32  total_shares = 7;
    int32  share_count  = 8;
    repeated CeremonyHolderCert holders = 9;
}

// TenantBarrierSignedInitCompleteRequest redeems reference with signature,
// the detached signature over SignedInitBegin's statement. passphrase is the
// passphrase strategy's credential, `bytes` so callers can zeroize it.
message TenantBarrierSignedInitCompleteRequest {
    string tenant_id  = 1;
    bytes  reference  = 2;
    bytes  signature  = 3;
    bytes  passphrase = 4;
}

// TenantBarrierUnsealRequest carries single-key unseal material.
message TenantBarrierUnsealRequest {
    string tenant_id = 1;
    bytes  key       = 2;
}

// TenantBarrierSealRequest seals the barrier for tenant_id.
message TenantBarrierSealRequest {
    string tenant_id = 1;
}

// TenantBarrierStatusRequest queries the barrier state for tenant_id.
message TenantBarrierStatusRequest {
    string tenant_id = 1;
}

// TenantBarrierStatusResponse reports the per-tenant barrier state.
message TenantBarrierStatusResponse {
    string tenant_id        = 1;
    bool   sealed           = 2;
    bool   initialized      = 3;
    string strategy         = 4;
    bool   hardware_backed  = 5;
    int32  shamir_threshold = 6;
    int32  shamir_total     = 7;
    // cluster_seal is the tenant barrier's cluster seal state.
    ClusterSealState cluster_seal = 8;
    // key_fingerprint names this node's own key of the barrier without
    // revealing it; every node serving the barrier reports a different one.
    string key_fingerprint = 9;
    // nodes are the nodes serving the barrier, each with its own key, for a
    // client fanning a barrier init out to every one.
    repeated TenantBarrierNode nodes = 10;
}

// TenantBarrierNode is one node serving a tenant barrier: its Raft address
// and the address it serves each client API protocol on ("rest", "grpc",
// "quic", "mcp").
message TenantBarrierNode {
    string              node      = 1;
    map<string, string> endpoints = 2;
}

// TenantBarrierOfficerRegisterRequest enrolls a Security Officer for a
// Shamir-strategy tenant barrier.
message TenantBarrierOfficerRegisterRequest {
    reserved 4;
    reserved "authenticator_type";
    string tenant_id = 1;
    string username  = 2;
    bytes  csr_pem   = 3;
    string role           = 5;
    string encryption_kem = 6;
    bytes  encryption_key = 7;
    repeated HolderFactorEnrolment factors = 8;
    string designated     = 9;
}

// TenantBarrierOfficerRegisterResponse carries the signed officer certificate
// and the share index assigned to the new officer.
message TenantBarrierOfficerRegisterResponse {
    reserved 2;
    reserved "share_index";
    bytes  cert_pem       = 1;
    string role           = 3;
    string designated     = 4;
    string encryption_kem = 5;
    repeated string factors = 6;
}

// TenantBarrierOfficerListRequest selects the tenant whose officers to list.
message TenantBarrierOfficerListRequest {
    string tenant_id = 1;
}

// TenantBarrierOfficerListResponse carries the per-officer status snapshots.
message TenantBarrierOfficerListResponse {
    repeated OfficerStatus officers = 1;
}

// TenantBarrierShareClaimBeginRequest initiates the two-phase share claim for
// a Security Officer on a Shamir-strategy tenant barrier.
message TenantBarrierShareClaimBeginRequest {
    string tenant_id              = 1;
    string username               = 2;
    string caller_cert_thumbprint = 3;
}

// TenantBarrierShareClaimBeginResponse carries the challenge nonce.
message TenantBarrierShareClaimBeginResponse {
    string nonce_hex = 1;
    int64  expires   = 2;
}

// TenantBarrierShareClaimCompleteRequest completes the two-phase share claim
// by presenting the signed nonce.
message TenantBarrierShareClaimCompleteRequest {
    string tenant_id              = 1;
    string username               = 2;
    string nonce_hex              = 3;
    bytes  signature              = 4;
    string caller_cert_thumbprint = 5;
}

// TenantBarrierShareClaimCompleteResponse carries the share bytes for the
// claiming officer. The enclave is destroyed after this response is sent.
message TenantBarrierShareClaimCompleteResponse {
    reserved 1;
    reserved "share_bytes";
    int32 share_index = 2;
    bytes envelope    = 3;
}

// TenantBarrierQuorumBeginRequest asks for a quorum challenge on a tenant
// barrier; op is "unseal", "seal" or "rekey".
message TenantBarrierQuorumBeginRequest {
    string tenant_id = 1;
    string op        = 2;
    string username  = 3;
    string factor    = 4;
}

// TenantBarrierQuorumSubmitRequest is one tenant holder's share.
message TenantBarrierQuorumSubmitRequest {
    string tenant_id    = 1;
    string op           = 2;
    string username     = 3;
    string challenge_id = 4;
    string factor       = 5;
    bytes  response     = 6;
    map<string, string> response_metadata = 7;
    bytes  share        = 8;
}

// TenantBarrierRekeyStartRequest opens a rekey round on a tenant barrier.
message TenantBarrierRekeyStartRequest {
    string tenant_id = 1;
    int32  threshold = 2;
    string policy    = 3;
}

// TenantBarrierOfficerRevokeRequest revokes a tenant holder.
message TenantBarrierOfficerRevokeRequest {
    string tenant_id = 1;
    string username  = 2;
    int32  threshold = 3;
}

// ===========================================================================
// AuditService — compliance-grade audit query (qrdb.v1.AuditService)
//
// Query returns a paginated page of audit events matching a filter.
// Authorization: requires "audit:query" permission.
// ===========================================================================
service AuditService {
    // Query returns audit events matching the supplied filter.
    rpc Query(AuditQueryRequest) returns (AuditQueryResponse) {
        option (qrdb.v1.permission) = "audit:query";
    }

    // VerifyChain verifies the audit log's tamper-evidence hash chain across
    // the active file and every rotation archive, and reports what the walk
    // covered. Verified=false with a Reason is a TAMPER VERDICT, not an RPC
    // failure; a non-nil gRPC error means the verification could not be
    // performed at all (unsupported backend, unreadable file, or a rotation
    // race -- see pkg/audit.Verify).
    rpc VerifyChain(AuditVerifyChainRequest) returns (AuditVerifyChainResponse) {
        option (qrdb.v1.permission) = "audit:verify";
    }

    // VerifyReplicatedChain verifies the hash-chain continuity of the
    // cluster-wide REPLICATED audit chain (docs/audit/architecture.md
    // #cluster-wide-replicated-trail) for one tenant -- a different trail
    // from the node-local one VerifyChain above checks, with no files or
    // rotation concepts: it has one authority per tenant, replicated by
    // Raft rather than written by one process. Verified=false with a
    // Reason is a TAMPER VERDICT; a non-nil error means verification could
    // not be performed (no replicated audit configured) or the tenant is
    // not entitled to the replicated chain at all.
    rpc VerifyReplicatedChain(AuditVerifyReplicatedChainRequest) returns (AuditVerifyReplicatedChainResponse) {
        option (qrdb.v1.permission) = "audit:verify_replicated";
    }
}

// AuditQueryRequest carries the filter criteria for an audit query.
message AuditQueryRequest {
    // from_rfc3339 and to_rfc3339 bound the query time range (RFC3339, optional).
    string from_rfc3339 = 1;
    string to_rfc3339   = 2;

    // actor filters to events by a specific actor identity.
    string actor     = 3;
    // resource filters to events on a specific resource.
    string resource  = 4;
    // action filters to a specific action.
    string action    = 5;
    // outcome filters to a result prefix ("success", "failure").
    string outcome   = 6;
    // tenant_id filters to events for a specific tenant.
    string tenant_id = 7;
    // limit caps the number of events returned (default 100, max 1000).
    int32  limit     = 8;
    // cursor is an opaque pagination token from a previous AuditQueryResponse.
    string cursor    = 9;
    // replicated, when true, reads the cluster-wide replicated audit chain
    // (docs/audit/architecture.md#cluster-wide-replicated-trail) instead of
    // the node-local trail. A tenant not entitled to it answers an empty
    // page (total -1), never an error.
    bool replicated  = 10;
}

// AuditQueryResponse carries a paginated page of audit events.
message AuditQueryResponse {
    // events contains the matching audit events in chronological order.
    repeated AuditEvent events = 1;
    // next is an opaque cursor for the next page; empty when exhausted.
    string next  = 2;
    // total is the total count of matching events, or -1 if unknown.
    int32  total = 3;
}

// AuditEvent is a single compliance-grade structured audit record.
message AuditEvent {
    // timestamp_rfc3339 is the UTC time of the event (RFC3339).
    string timestamp_rfc3339            = 1;
    string actor                        = 2;
    string tenant_id                    = 3;
    string role                         = 4;
    string resource                     = 5;
    string action                       = 6;
    string outcome                      = 7;
    map<string, string> attributes      = 8;
    string client_ip                    = 9;
    string request_id                   = 10;
    string prev_hash                    = 11;
}

// AuditVerifyChainRequest carries no parameters today; the verified target
// is always the server's own configured audit trail. The message exists so
// the RPC can grow parameters (e.g. a specific archive) without breaking
// wire compatibility.
message AuditVerifyChainRequest {}

// AuditVerifyChainResponse reports the outcome of a hash-chain verification.
message AuditVerifyChainResponse {
    // verified is true only when every linked file's chain checked out.
    bool verified = 1;
    // reason is a human-readable description of the break; empty when verified.
    string reason = 2;
    // files is the number of rotation-set files that carry records and were linked.
    int32 files = 3;
    // records is the number of audit records verified, anchors excluded.
    // int64: an audit trail's record count is unbounded over its retention
    // window, and int32 would wrap on a long-lived, high-volume trail.
    int64 records = 4;
    // order lists the linked files in chain order, head first.
    repeated string order = 5;
    // genesis reports whether the walk reached the chain's origin.
    bool genesis = 6;
    // seed is the hex digest the head claims to continue from, empty at genesis.
    string seed = 7;
    // handoff is the hex digest the tail ends on.
    string handoff = 8;
}

// AuditVerifyReplicatedChainRequest names which tenant's replicated chain to
// verify. tenant_id is optional; empty means the caller's own tenant. Any
// other value is refused with PERMISSION_DENIED, exactly as Query confines
// tenant_id.
message AuditVerifyReplicatedChainRequest {
    string tenant_id = 1;
}

// AuditVerifyReplicatedChainResponse reports the outcome of verifying the
// cluster-wide replicated audit chain's hash continuity for one tenant.
message AuditVerifyReplicatedChainResponse {
    // verified is true only if every surviving event folds into the
    // chain's own authoritative head digest.
    bool verified = 1;
    // reason is a human-readable description of the break; empty when verified.
    string reason = 2;
    // records is the number of surviving events folded.
    int64 records = 3;
    // head_seq is the highest surviving sequence number.
    uint64 head_seq = 4;
    // low_seq is the lowest surviving sequence number.
    uint64 low_seq = 5;
    // genesis is true when low_seq == 1: the walk reached the chain's true
    // origin rather than a retention-pruned tail.
    bool genesis = 6;
}

// ===========================================================================
// AuthFactorService — custodian hardware-factor enrollment/challenge/verify
// (qrdb.v1.AuthFactorService)
//
// This service manages the lifecycle of hardware auth factors (FIDO2, PIV,
// PKCS#11) for ceremony custodians. Authorization is per-method; see the
// permission constants in pkg/permission.
// ===========================================================================
service AuthFactorService {
    // EnrollFactor enrolls a custodian in the given auth factor type.
    rpc EnrollFactor(EnrollFactorRequest) returns (EnrollFactorResponse) {
        option (qrdb.v1.permission) = "authfactor:enroll";
    }

    // ChallengeFactor issues a challenge for a previously enrolled factor.
    rpc ChallengeFactor(ChallengeFactorRequest) returns (ChallengeFactorResponse) {
        option (qrdb.v1.permission) = "authfactor:challenge";
    }

    // VerifyFactor verifies the custodian's challenge response.
    rpc VerifyFactor(VerifyFactorRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "authfactor:verify";
    }

    // ListFactors lists enrolled auth factors, optionally filtered by subject.
    rpc ListFactors(ListFactorsRequest) returns (ListFactorsResponse) {
        option (qrdb.v1.permission) = "authfactor:list";
    }

    // RevokeFactor permanently revokes an enrollment.
    rpc RevokeFactor(RevokeFactorRequest) returns (google.protobuf.Empty) {
        option (qrdb.v1.permission) = "authfactor:revoke";
    }
}

// EnrollFactorRequest carries the enrollment parameters.
message EnrollFactorRequest {
    string              factor_name   = 1;
    string              subject       = 2;
    string              tenant_id     = 3;
    map<string, string> method_params = 4;
}

// EnrollFactorResponse carries the enrollment result.
message EnrollFactorResponse {
    string              enrollment_id = 1;
    string              factor_name   = 2;
    string              user_id       = 3;
    string              tenant_id     = 4;
    map<string, string> metadata      = 5;
    // enrolled_at is an RFC3339 timestamp.
    string              enrolled_at   = 6;
}

// ChallengeFactorRequest carries the enrollment ID to challenge.
message ChallengeFactorRequest {
    string enrollment_id = 1;
}

// ChallengeFactorResponse carries the challenge payload.
message ChallengeFactorResponse {
    string challenge_id  = 1;
    string enrollment_id = 2;
    bytes  nonce         = 3;
    // expires_at is an RFC3339 timestamp.
    string expires_at    = 4;
    // method_data carries algorithm-specific challenge context.
    map<string, string> method_data = 5;
}

// VerifyFactorRequest carries the challenge response.
message VerifyFactorRequest {
    string              factor_name  = 1;
    string              challenge_id = 2;
    bytes               value        = 3;
    map<string, string> metadata     = 4;
}

// ListFactorsRequest optionally filters by subject.
message ListFactorsRequest {
    string subject = 1;
}

// EnrollmentEntry is a single enrollment list entry.
message EnrollmentEntry {
    string              enrollment_id = 1;
    string              factor_name   = 2;
    string              user_id       = 3;
    string              tenant_id     = 4;
    map<string, string> metadata      = 5;
    // enrolled_at and revoked_at are RFC3339 timestamps.
    string              enrolled_at   = 6;
    string              revoked_at    = 7;
}

// ListFactorsResponse carries the enrollments list.
message ListFactorsResponse {
    repeated EnrollmentEntry enrollments = 1;
    int32                    total       = 2;
}

// RevokeFactorRequest carries the enrollment ID to revoke.
message RevokeFactorRequest {
    string enrollment_id = 1;
}

// ===========================================================================
// UserAuthFactorService — user-side auth factor management (M14)
// (qrdb.v1.UserAuthFactorService)
//
// This service manages auth factors stored in the QRDB auth layer
// (TOTP, passkey, etc.) for end-users. Authorization is per-method.
// ===========================================================================
service UserAuthFactorService {
    // Add registers a new auth factor for a user.
    rpc Add(UserAuthFactorAddRequest) returns (UserAuthFactorAddResponse) {
        option (qrdb.v1.permission) = "user_authfactors:add";
    }

    // List returns all auth factors for a user.
    rpc List(UserAuthFactorListRequest) returns (UserAuthFactorListResponse) {
        option (qrdb.v1.permission) = "user_authfactors:list";
    }

    // Get retrieves a single auth factor by ID.
    rpc Get(UserAuthFactorGetRequest) returns (UserAuthFactorGetResponse) {
        option (qrdb.v1.permission) = "user_authfactors:get";
    }

    // Remove deletes an auth factor.
    rpc Remove(UserAuthFactorRemoveRequest) returns (UserAuthFactorRemoveResponse) {
        option (qrdb.v1.permission) = "user_authfactors:remove";
    }

    // Delete hard-deletes an auth factor and frees its credential and SPKI
    // indexes, so a rolled-back add can bind the same credential again. It
    // carries the add permission because it undoes an add; a revoked factor
    // is refused.
    rpc Delete(UserAuthFactorDeleteRequest) returns (UserAuthFactorDeleteResponse) {
        option (qrdb.v1.permission) = "user_authfactors:add";
    }

    // Rotate atomically replaces one factor with another.
    rpc Rotate(UserAuthFactorRotateRequest) returns (UserAuthFactorRotateResponse) {
        option (qrdb.v1.permission) = "user_authfactors:rotate";
    }

    // Relabel updates the human-readable label of a factor.
    rpc Relabel(UserAuthFactorRelabelRequest) returns (UserAuthFactorRelabelResponse) {
        option (qrdb.v1.permission) = "user_authfactors:relabel";
    }

    // Login looks up the auth factor matching a credential key and returns
    // the associated user identity.
    rpc Login(UserAuthFactorLoginRequest) returns (UserAuthFactorLoginResponse) {
        option (qrdb.v1.permission) = "user_authfactors:login";
    }
}

// UserAuthFactorRecord is the wire shape for a single auth factor.
message UserAuthFactorRecord {
    string              id            = 1;
    uint64              user_id       = 2;
    string              type          = 3;
    string              label         = 4;
    bytes               credential    = 5;
    map<string, string> metadata      = 6;
    // Timestamps are RFC3339 strings; last_used_at and revoked_at are empty
    // when not set.
    string              registered_at = 7;
    string              last_used_at  = 8;
    string              revoked_at    = 9;
    string              created_by    = 10;
    // Optional renewal-stable secondary lookup key: SHA-256 of the
    // certificate's SubjectPublicKeyInfo for mtls / piv factors.
    bytes               spki_credential = 11;
}

// UserAuthFactorAddRequest carries the registration parameters.
message UserAuthFactorAddRequest {
    uint64              user_id    = 1;
    string              type       = 2;
    string              label      = 3;
    bytes               credential = 4;
    map<string, string> metadata   = 5;
    string              created_by = 6;
    // Optional renewal-stable secondary lookup key (mtls / piv).
    bytes               spki_credential = 7;
    // if_no_active_type makes the add conditional: it is refused with
    // ALREADY_EXISTS and a FACTOR_CONDITION_FAILED ErrorInfo when the user
    // already holds an active factor of type.
    bool                if_no_active_type = 8;
    // expected_factor_set_version makes the add conditional: it is refused
    // the same way unless the user's factor-set version -- the one
    // UserAuthFactorListResponse reports -- still equals it.
    optional uint64     expected_factor_set_version = 9;
}

// UserAuthFactorAddResponse carries the newly registered factor.
message UserAuthFactorAddResponse {
    UserAuthFactorRecord factor = 1;
    // factor_set_version is the version a conditional add committed; zero
    // for an unconditional add.
    uint64               factor_set_version = 2;
}

// UserAuthFactorListRequest carries the user ID to list factors for.
message UserAuthFactorListRequest {
    uint64 user_id = 1;
}

// UserAuthFactorListResponse carries the factors list.
message UserAuthFactorListResponse {
    repeated UserAuthFactorRecord factors = 1;
    int32                         total   = 2;
    // factor_set_version is the user's factor-set version, read before the
    // factors were listed.
    uint64                        factor_set_version = 3;
}

// UserAuthFactorGetRequest carries the factor ID to retrieve.
message UserAuthFactorGetRequest {
    string factor_id = 1;
}

// UserAuthFactorGetResponse carries the retrieved factor.
message UserAuthFactorGetResponse {
    UserAuthFactorRecord factor = 1;
}

// UserAuthFactorRemoveRequest carries the factor ID to remove.
message UserAuthFactorRemoveRequest {
    string factor_id = 1;
    bool   force     = 2;
}

// UserAuthFactorRemoveResponse reports the removal outcome.
message UserAuthFactorRemoveResponse {
    string status = 1;
}

// UserAuthFactorDeleteRequest carries the factor ID to hard-delete. force
// permits deleting the user's last active factor.
message UserAuthFactorDeleteRequest {
    string factor_id = 1;
    bool   force     = 2;
}

// UserAuthFactorDeleteResponse reports the deletion outcome.
message UserAuthFactorDeleteResponse {
    string status = 1;
}

// UserAuthFactorNewFactor carries the registration parameters for Rotate.
message UserAuthFactorNewFactor {
    uint64              user_id    = 1;
    string              type       = 2;
    string              label      = 3;
    bytes               credential = 4;
    map<string, string> metadata   = 5;
    string              created_by = 6;
    // Optional renewal-stable secondary lookup key (mtls / piv).
    bytes               spki_credential = 7;
}

// UserAuthFactorRotateRequest atomically replaces one factor with another.
message UserAuthFactorRotateRequest {
    string               old_factor_id = 1;
    UserAuthFactorNewFactor new_factor = 2;
}

// UserAuthFactorRotateResponse carries the new factor after rotation.
message UserAuthFactorRotateResponse {
    UserAuthFactorRecord new_factor = 1;
}

// UserAuthFactorRelabelRequest carries the factor ID and new label.
message UserAuthFactorRelabelRequest {
    string factor_id = 1;
    string label     = 2;
}

// UserAuthFactorRelabelResponse carries the updated factor.
message UserAuthFactorRelabelResponse {
    UserAuthFactorRecord factor = 1;
}

// UserAuthFactorLoginRequest carries the factor type and credential lookup key.
message UserAuthFactorLoginRequest {
    string type       = 1;
    bytes  lookup_key = 2;
}

// UserAuthFactorLoginResponse carries the authenticated user identity.
message UserAuthFactorLoginResponse {
    uint64               user_id   = 1;
    string               username  = 2;
    string               email     = 3;
    string               tenant_id = 4;
    repeated string      roles     = 5;
    bool                 active    = 6;
    UserAuthFactorRecord factor    = 7;
}

// RemoveCertBindingRequest withdraws an mTLS certificate's SPKI thumbprint from
// a user. It carries no expiry: withdrawal is unconditional, and it is the
// counterpart of AddCertBinding rather than a variant of it.
message RemoveCertBindingRequest {
    uint64 user_id = 1;
    string thumbprint = 2;
}
