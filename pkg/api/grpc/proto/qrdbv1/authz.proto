syntax = "proto3";

package qrdb.v1;

option go_package = "github.com/jeremyhahn/go-qrdb/pkg/api/grpc/proto/qrdbv1";

import "google/protobuf/descriptor.proto";

// The permission method option declares the authorization permission a
// caller must hold to invoke the annotated RPC. It is the single source
// of truth for gRPC authorization: the auth middleware resolves it via
// protobuf reflection (LookupGRPCFromDescriptor) and enforces it in the
// unary/stream interceptors. An RPC without this option is DEFAULT-DENY —
// it is rejected before reaching the service handler unless it belongs to
// an infrastructure service (health checking, server reflection).
//
// The value is a permission string from pkg/permission (e.g. "kv:put").
// The sentinel "identity:gated" marks endpoints whose authorization is
// enforced at the handler layer; the middleware then only requires an
// authenticated identity (see permission.IdentityGated).
extend google.protobuf.MethodOptions {
    string permission = 51000;
}
