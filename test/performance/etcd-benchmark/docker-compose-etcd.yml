version: "3.9"
services:
  cert-gen:
    image: alpine:3.19
    volumes:
      - ./scripts:/scripts:ro
      - etcd_bench_certs:/certs
    entrypoint: /scripts/gen-certs.sh

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    depends_on:
      cert-gen:
        condition: service_completed_successfully
    network_mode: host
    volumes:
      - etcd_bench_certs:/certs:ro
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/tmp/etcd-data
      - --listen-client-urls=https://0.0.0.0:2379
      - --advertise-client-urls=https://127.0.0.1:2379
      - --listen-peer-urls=https://0.0.0.0:2380
      - --initial-advertise-peer-urls=https://127.0.0.1:2380
      - --initial-cluster=etcd0=https://127.0.0.1:2380
      - --cert-file=/certs/server.pem
      - --key-file=/certs/server-key.pem
      - --trusted-ca-file=/certs/ca.pem
      - --client-cert-auth=true
      - --peer-cert-file=/certs/server.pem
      - --peer-key-file=/certs/server-key.pem
      - --peer-trusted-ca-file=/certs/ca.pem
      - --peer-client-cert-auth=true
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=https://127.0.0.1:2379", "--cacert=/certs/ca.pem", "--cert=/certs/client.pem", "--key=/certs/client-key.pem", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  etcd_bench_certs:
