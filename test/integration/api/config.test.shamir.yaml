# Integration test configuration for the dedicated Shamir-seal qrdbd server.
# Mirrors config.test.yaml but selects the Shamir M-of-N seal strategy and
# uses a DISTINCT port set + data dir + unix socket so it can run side by
# side with the software-seal "qrdbd" server without colliding.

server:
  host: "0.0.0.0"
  admin_port: 64002
  grpc_port: 64003
  quic_port: 64004

# Enable ALL protocols for complete integration testing
protocols:
  rest: true
  grpc: true
  quic: true
  unix: true
  mcp: true

logging:
  level: "debug"
  format: "json"

# Raft configuration for single-node test cluster (distinct ports + data dir
# from the software-seal server).
raft:
  data_dir: "/data/raft"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:64001"
  listen_address: "0.0.0.0:64001"
  peers: "1=127.0.0.1:64001"
  sm_type: "mvcc"

# Discovery configuration for single-node cluster
discovery:
  method: "static"

# TLS: omitted so the server auto-generates CA + node cert + admin client
# cert via resolveTLS Path 3 (single-node mode). The admin client cert is
# written to {data_dir}/admin-cert.pem and admin-key.pem.

# Authentication enabled for mTLS integration testing.
auth:
  enabled: true

# Seal configuration for barrier encryption integration testing.
# Uses the Shamir M-of-N strategy: the root key is split into shamir_total
# shares of which shamir_threshold are required to unseal.
seal:
  enabled: true
  strategy: "shamir"
  shamir_threshold: 2
  shamir_total: 3
  root_key_path: "__sys:seal/root_key"
  credential_strategy: "barrier"

# Codec disabled: the MVCC state machine manages its own serialization.
# Enabling a codec creates a mismatch between KV and MVCC code paths.
codec:
  storage_codec: ""
  wire_codec: ""

# Unix socket (distinct path from the software-seal server).
unix:
  socket_path: /var/run/qrdbd-shamir/qrdbd.sock

# MCP configuration
mcp:
  port: 64005
  endpoint: /mcp
