# Embedding overlay for the go-qrdb integration test suite.
#
# The Ollama embedding sidecar is resource-heavy (it loads an inference model
# into memory), so it is deliberately kept OUT of the default integration
# stack — the standalone and cluster suites never touch embeddings, and the
# embedding/RAG logic is covered by mocked unit tests (`make test`,
# `make test-embedding`, `make test-rag`). This overlay layers Ollama back on
# for the dedicated, opt-in embedding/RAG end-to-end suite:
#
#   docker compose -f docker-compose.yml -f docker-compose.embedding.yml up
#
# It is driven by `make integration-test-embedding` and
# `make integration-test-rag-ollama`, which scope the run via INTEGRATION_RUN and
# compile the ollama-gated e2e tests via INTEGRATION_TAGS=integration,ollama.
#
# The e2e suite lives in test/integration/api/cli_embedding_rag_test.go behind
# the `//go:build integration && ollama` constraint, so it never compiles into
# the default fast run.

services:
  # Ollama pulls its model at run time, so this overlay is the one stack that
  # needs egress. It gives the namespace holder ONE bridge attachment (Docker's
  # default bridge): one veth for the whole stack, never one per service. Every
  # service, ollama included, still shares the holder's namespace.
  netns:
    network_mode: bridge

  # Ollama sidecar: OpenAI-compatible /v1/embeddings endpoint for the
  # embedding and RAG end-to-end suites. The entrypoint starts the server,
  # pulls the embedding model, then hands control back to the server process.
  # The healthcheck only passes once the model is present, so the test runner
  # (depends_on ollama: service_healthy) does not start until embeddings work.
  ollama:
    image: ollama/ollama:latest
    # Listens on 127.0.0.1:11434 (ollama's default OLLAMA_HOST) in the
    # stack's namespace.
    network_mode: "service:netns"
    environment:
      # Model pulled on startup and used by the e2e suite (768-dim embeddings).
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        echo "Waiting for ollama server to accept connections..."
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "Pulling embedding model $$OLLAMA_EMBED_MODEL..."
        ollama pull "$$OLLAMA_EMBED_MODEL"
        echo "Model ready; ollama serving."
        wait $$server_pid
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      # Pass only once the embedding model has been pulled and is listed.
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      # Generous: first run downloads the model (~270MB) before it is listed.
      start_period: 300s

  integration-tests:
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_URL=http://127.0.0.1:11434/v1
      # The model the e2e suite expects the server's provider to use.
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      # Scope the run to the embedding/RAG e2e suites only.
      - INTEGRATION_RUN=${INTEGRATION_RUN:-Embedding|RAG}
      # Compile in the ollama-gated e2e tests.
      - INTEGRATION_TAGS=integration,ollama

volumes:
  ollama-data:
    driver: local
