# Integration test configuration for qrdbd server
# Enables ALL protocols for comprehensive testing

server:
  host: "0.0.0.0"
  admin_port: 63002
  grpc_port: 63003
  quic_port: 63004

# Enable ALL protocols for complete integration testing
protocols:
  rest: true
  grpc: true
  quic: true
  unix: true
  mcp: true

logging:
  level: "debug"
  format: "json"

# Raft configuration for single-node test cluster
raft:
  data_dir: "/data/raft"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:63001"
  listen_address: "0.0.0.0:63001"
  peers: "1=127.0.0.1:63001"
  sm_type: "mvcc"

# Discovery configuration for single-node cluster
discovery:
  method: "static"

# TLS: omitted so the server auto-generates its CA and node certificate via
# resolveTLS Path 3 (single-node mode). It writes no admin credential: the
# compose bootstrap issues one with `qrdb init --admin-csr`.

# Authentication enabled for mTLS integration testing.
auth:
  enabled: true

# Seal configuration for barrier encryption integration testing.
# Uses the passphrase strategy with deployment-ID-derived passphrase.
seal:
  enabled: true
  strategy: "passphrase"
  root_key_path: "__sys:seal/root_key"
  credential_strategy: "barrier"

# A volume pool is required for ANY dedicated per-tenant barrier (not only
# volume/raft isolation -- a plain "tenant barrier-init" on a prefix tenant
# needs one too, see InitializeTenantBarrier's doc comment): without one,
# RegisterTenant fails closed with "volume pool not configured on barrier
# registry" rather than silently falling back to a non-durable backend.
# "default" is the pool self-service tenant registration reads.
storage:
  volume_pools:
    - name: default
      path: /data/volumes/default

# Isolation and barrier-mode entitlements for tenants created without an
# explicit --allowed-isolation-modes override (TestCLIMultiProtocol
# TenantIdentityBarrierFlow drives a full tenant create -> barrier-init
# round trip and needs all four isolation modes and every barrier strategy
# reachable from their defaults).
tenant:
  default_entitlements:
    allowed_isolation_modes:
      - prefix
      - barrier
      - volume
      - raft
    allowed_barrier_modes:
      - none
      - passphrase
      - shamir

# Codec disabled: the MVCC state machine manages its own serialization.
# Enabling a codec creates a mismatch between KV and MVCC code paths.
codec:
  storage_codec: ""
  wire_codec: ""

# Unix socket
unix:
  socket_path: /var/run/qrdbd/qrdbd.sock

# MCP configuration
mcp:
  port: 63005
  endpoint: /mcp

# Embedding configuration. The OpenAI-compatible provider points at the Ollama
# sidecar supplied by the docker-compose.embedding.yml overlay. Providers are
# constructed lazily (no connection at startup), so this block is harmless in
# the default stack where Ollama is absent — the embedding endpoints simply go
# unused. The ollama-backed e2e suite (make integration-test-embedding) brings
# the sidecar up and exercises them.
embedding:
  default_provider: "ollama"
  cache_capacity: 1000
  providers:
    - name: "ollama"
      base_url: "http://ollama:11434/v1"
      model: "nomic-embed-text"
      timeout: "60s"
      max_retries: 3

# RAG configuration: chunking + retrieval defaults for the ingest/query pipeline
# which embeds via the provider above and stores vectors in the HNSW index.
rag:
  default_chunk_strategy: "fixed"
  default_chunk_size: 512
  default_overlap: 50
  max_document_size: 0
  default_top_k: 5
