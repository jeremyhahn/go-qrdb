# Integration test configuration for qrdbd server
# Enables ALL protocols for comprehensive testing

server:
  host: "0.0.0.0"
  admin_port: 63002
  grpc_port: 63003
  quic_port: 63004

# Enable ALL protocols for complete integration testing
protocols:
  rest: true
  grpc: true
  quic: true
  unix: true
  mcp: true

logging:
  level: "debug"
  format: "json"

# Raft configuration for single-node test cluster
raft:
  data_dir: "/data/raft"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:63001"
  listen_address: "0.0.0.0:63001"
  peers: "1=127.0.0.1:63001"
  sm_type: "mvcc"

# Discovery configuration for single-node cluster
discovery:
  method: "static"

# TLS: omitted so the server auto-generates CA + node cert + admin client
# cert via resolveTLS Path 3 (single-node mode). The admin client cert is
# written to {data_dir}/admin-cert.pem and admin-key.pem.

# Authentication enabled for mTLS integration testing.
auth:
  enabled: true

# Seal configuration for barrier encryption integration testing.
# Uses software strategy with deployment-ID-derived passphrase.
seal:
  enabled: true
  strategy: "software"
  root_key_path: "__sys:seal/root_key"
  credential_strategy: "barrier"

# Codec disabled: the MVCC state machine manages its own serialization.
# Enabling a codec creates a mismatch between KV and MVCC code paths.
codec:
  storage_codec: ""
  wire_codec: ""

# Unix socket
unix:
  socket_path: /var/run/qrdbd/qrdbd.sock

# MCP configuration
mcp:
  port: 63005
  endpoint: /mcp
