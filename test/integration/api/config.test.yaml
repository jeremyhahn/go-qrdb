# Integration test configuration for qrdbd server
# Enables ALL protocols for comprehensive testing

server:
  host: "0.0.0.0"
  admin_port: 63002
  grpc_port: 63003

# Enable ALL protocols for complete integration testing
protocols:
  rest: true
  grpc: true

logging:
  level: "debug"
  format: "json"

# Raft configuration for single-node test cluster
raft:
  data_dir: "/data/raft"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:63001"
  listen_address: "0.0.0.0:63001"
  peers: "1=127.0.0.1:63001"
  sm_type: "memory"

# TLS configuration
tls:
  enabled: true
  cert_file: /etc/qrdb/certs/server.crt
  key_file: /etc/qrdb/certs/server.key
  ca_file: /etc/qrdb/certs/ca.crt
  min_version: TLS1.3
  client_auth: none

# Unix socket
unix:
  socket_path: /var/run/qrdbd/qrdbd.sock
  socket_mode: "0660"

# MCP configuration
mcp:
  port: 63005
  endpoint: /mcp
