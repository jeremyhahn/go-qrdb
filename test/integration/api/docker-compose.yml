# Nothing here bind-mounts a host path — not the repository, not the siblings,
# and not the two test configs. compose talks to the HOST daemon, so a relative
# path is resolved there, and on a runner the job's checkout does not exist on
# the host: `mkdir /workspace: file exists` is what a config mount produced
# there, having worked on every developer machine. The image already carries
# both configs via `COPY . .`, so the servers read them in place.
#
# No service declares container_name. A container name is global to the host, so
# a second `docker compose up` claims the same names and SIGKILLs the first
# run's containers — exit 137, truncated log, no failing test, which reads as
# OOM and is not. Docker does not refuse the collision the way it refuses a
# port. Nothing referenced those names: the tests address the servers by compose
# SERVICE name (https://qrdbd:63002). The Makefile supplies a per-run project
# name so containers, networks and volumes are namespaced together.
services:
  # QRDB server with all protocols enabled.
  # Uses the devcontainer image and mounts source + sibling repos so the
  # server binary can be built with access to replace-directive dependencies.
  qrdbd:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    hostname: qrdbd
    expose:
      - "63001/udp"  # Raft/QUIC (UDP)
      - "63001/tcp"  # Raft fallback (TCP)
      - "63002"      # REST API
      - "63003"      # gRPC
      - "63004/udp"  # QUIC API
      - "63005"      # MCP
    # Required for QUIC UDP buffer settings
    privileged: true
    volumes:
      - qrdb-data:/data
      - qrdb-socket:/var/run/qrdbd
    environment:
      - QRDB_CONFIG=/workspace/go-qrdb/test/integration/api/config.test.yaml
      - QRDB_LOG_LEVEL=debug
      - CGO_ENABLED=1
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--insecure", "https://localhost:63002/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 180s
    networks:
      - qrdb-integration
    user: root
    working_dir: /workspace/go-qrdb
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        # Ensure directories exist
        mkdir -p /var/run/qrdbd /data /app/build/bin
        # qrdbd is built into the image; container start is a server start.
        echo "Starting qrdbd server..."
        /app/build/bin/qrdbd start --config /workspace/go-qrdb/test/integration/api/config.test.yaml &
        QRDBD_PID=$!
        # Wait for the admin endpoint to come up so we can initialize the barrier.
        # Wait for the admin-client certificate (written alongside the node
        # cert by qrdbd's single-node auto-TLS path) before attempting the
        # mTLS-authenticated barrier init. auth.enabled=true requires a client
        # cert on every admin request; /health is the only exempt endpoint.
        echo "Waiting for admin client cert..."
        for i in $$(seq 1 60); do
          if [ -f /data/raft/admin-cert.pem ] && [ -f /data/raft/admin-key.pem ]; then
            echo "Admin client cert ready"
            break
          fi
          sleep 1
        done
        AUTH="--cacert /data/raft/ca.pem --cert /data/raft/admin-cert.pem --key /data/raft/admin-key.pem"
        # Wait for the pre-host sealed-window admin listener to accept
        # authenticated requests. /v1/barrier/status is on the sealed-window
        # allowlist and returns 200 (with the admin client cert) while the
        # barrier is still sealed, so it is the correct readiness probe for
        # driving init. The public /health endpoint cannot be used here: it is
        # registered only in the full-boot path (needs the admin service) and
        # stays 503 until the barrier is unsealed -- gating init on /health
        # would deadlock (init is what produces the unseal that makes /health
        # return 200).
        echo "Waiting for sealed-window admin listener..."
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' $$AUTH https://localhost:63002/v1/barrier/status | grep -q 200; then
            echo "Sealed-window admin listener ready"
            break
          fi
          sleep 1
        done
        # Auto-initialize the seal barrier so first boot is non-interactive.
        # During the sealed window POST /v1/barrier/initialize is allowlisted;
        # it creates + seals the root key and unseals the barrier, after which
        # qrdbd tears down the sealed-window listener and continues the full
        # boot. Idempotent: re-init on an already-initialized barrier is
        # tolerated via || true.
        echo "Initializing barrier..."
        curl -ks --max-time 10 -X POST $$AUTH \
          -H 'Content-Type: application/json' \
          --data-binary '{"secret":"integration-test-secret"}' \
          https://localhost:63002/v1/barrier/initialize || true
        # Wait for the full-boot admin endpoint: after unseal the data plane
        # opens, the host elects a leader, and /health flips to 200. Gating
        # "Bootstrap complete" on /health keeps the log an accurate signal
        # that the full server is up rather than racing the sealed-window
        # teardown.
        echo "Waiting for admin endpoint (post-unseal full boot)..."
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' https://localhost:63002/health | grep -q 200; then
            echo "Admin endpoint ready"
            break
          fi
          sleep 1
        done
        echo "Bootstrap complete"
        # Hand control back to qrdbd.
        wait $$QRDBD_PID

  # Dedicated QRDB server configured with the Shamir M-of-N seal strategy.
  # Runs side by side with the software-seal "qrdbd" server above on a
  # DISTINCT port set (64001-64005), data volume, and unix socket so the
  # Shamir CLI tests exercise a real Shamir-sealed barrier without disturbing
  # the software-seal coverage. The entrypoint mirrors qrdbd's bootstrap but
  # drives the Security Officer share-distribution flow
  # (docs/seal/so-share-distribution-design.md): officers are registered
  # with CSRs during the sealed window, POST /v1/barrier/shamir/initialize
  # returns a share-free response (INV-1), and each officer claims their
  # share exactly once over their own mTLS session (INV-11). The claimed
  # share values are written to a file on a shared volume.
  qrdbd-shamir:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    hostname: qrdbd-shamir
    expose:
      - "64001/udp"  # Raft/QUIC (UDP)
      - "64001/tcp"  # Raft fallback (TCP)
      - "64002"      # REST API
      - "64003"      # gRPC
      - "64004/udp"  # QUIC API
      - "64005"      # MCP
    # Required for QUIC UDP buffer settings
    privileged: true
    volumes:
      - qrdb-shamir-data:/data
      - qrdb-shamir-socket:/var/run/qrdbd-shamir
    environment:
      - QRDB_CONFIG=/workspace/go-qrdb/test/integration/api/config.test.shamir.yaml
      - QRDB_LOG_LEVEL=debug
      - CGO_ENABLED=1
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--insecure", "https://localhost:64002/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 180s
    networks:
      - qrdb-integration
    user: root
    working_dir: /workspace/go-qrdb
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        # Ensure directories exist
        mkdir -p /var/run/qrdbd-shamir /data /app/build/bin
        # qrdbd is built into the image; container start is a server start.
        echo "Starting qrdbd (shamir) server..."
        /app/build/bin/qrdbd start --config /workspace/go-qrdb/test/integration/api/config.test.shamir.yaml &
        QRDBD_PID=$!
        # Wait for the admin-client certificate (written alongside the node
        # cert by qrdbd's single-node auto-TLS path) before attempting the
        # mTLS-authenticated barrier init.
        echo "Waiting for admin client cert..."
        for i in $$(seq 1 60); do
          if [ -f /data/raft/admin-cert.pem ] && [ -f /data/raft/admin-key.pem ]; then
            echo "Admin client cert ready"
            break
          fi
          sleep 1
        done
        AUTH="--cacert /data/raft/ca.pem --cert /data/raft/admin-cert.pem --key /data/raft/admin-key.pem"
        # Wait for the pre-host sealed-window admin listener. /v1/barrier/status
        # is on the sealed-window allowlist and returns 200 while sealed.
        echo "Waiting for sealed-window admin listener..."
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' $$AUTH https://localhost:64002/v1/barrier/status | grep -q 200; then
            echo "Sealed-window admin listener ready"
            break
          fi
          sleep 1
        done
        # Bootstrap the Shamir barrier through the Security Officer claim
        # flow (docs/seal/so-share-distribution-design.md). Shares are never
        # returned by shamir/initialize (INV-1); instead three officers are
        # registered with CSRs while the barrier is still sealed (officer
        # registration routes are on the sealed-window allowlist), then
        # initialization distributes one share per officer into server-side
        # memguard enclaves. Officer count must EQUAL total_shares, and
        # registration must happen BEFORE initialize. Guarded on the shares
        # file so a container restart against a persisted volume does not
        # re-run the one-time flow.
        OFFDIR=/data/raft/officers
        if [ ! -s /data/raft/shamir-init.json ]; then
          mkdir -p $$OFFDIR
          echo "Generating Security Officer keys and CSRs..."
          for n in 1 2 3; do
            [ -f $$OFFDIR/so-$$n.key ] || openssl ecparam -name prime256v1 -genkey -noout -out $$OFFDIR/so-$$n.key
            openssl req -new -key $$OFFDIR/so-$$n.key -subj "/CN=so-$$n" -out $$OFFDIR/so-$$n.csr
          done
          echo "Registering Security Officers..."
          for n in 1 2 3; do
            jq -n --arg u "so-$$n" --rawfile csr $$OFFDIR/so-$$n.csr '{username: $$u, csr_pem: $$csr}' \
              | curl -ks --max-time 10 -X POST $$AUTH \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  -o $$OFFDIR/so-$$n.register.json \
                  https://localhost:64002/v1/barrier/officers || true
            jq -r .cert_pem $$OFFDIR/so-$$n.register.json > $$OFFDIR/so-$$n.crt 2>/dev/null || true
            if ! grep -q 'BEGIN CERTIFICATE' $$OFFDIR/so-$$n.crt 2>/dev/null; then
              echo "Officer so-$$n registration failed:"
              cat $$OFFDIR/so-$$n.register.json || true
            fi
          done
          # Initialize the Shamir barrier (share-free response). This splits
          # the root key into one enclave-held share per registered officer
          # and unseals the barrier in direct mode, after which qrdbd tears
          # down the sealed-window listener and continues the full boot.
          echo "Initializing Shamir barrier..."
          curl -ks --max-time 10 -X POST $$AUTH \
            -H 'Content-Type: application/json' \
            --data-binary '{"secret":"integration-test-shamir-secret","threshold":2,"total_shares":3}' \
            -o /data/raft/shamir-init-response.json \
            https://localhost:64002/v1/barrier/shamir/initialize || true
          echo "Shamir init response:"
          cat /data/raft/shamir-init-response.json || true
        fi
        # Wait for the full-boot admin endpoint: after unseal the data plane
        # opens, the host elects a leader, and /health flips to 200.
        echo "Waiting for admin endpoint (post-unseal full boot)..."
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' https://localhost:64002/health | grep -q 200; then
            echo "Admin endpoint ready"
            break
          fi
          sleep 1
        done
        # Claim each officer's share over the officer's own mTLS session
        # (INV-11: share bytes only ever appear in the claiming officer's
        # response). The handshake is begin (returns a hex nonce) -> sign
        # SHA-256(nonce) with the officer key (ECDSA ASN.1-DER, exactly what
        # `openssl dgst -sha256 -sign` produces) -> complete (returns the
        # base64 JSON-encoded shamir share, one time only — the server-side
        # enclave is destroyed on claim). The combinable share VALUE strings
        # are extracted and written to /data/raft/shamir-init.json so the
        # integration-test runner can replay them for share-based unseal and
        # seal-vote quorum tests.
        if [ ! -s /data/raft/shamir-init.json ]; then
          echo "Claiming Security Officer shares..."
          : > $$OFFDIR/share-values.txt
          for n in 1 2 3; do
            SOAUTH="--cacert /data/raft/ca.pem --cert $$OFFDIR/so-$$n.crt --key $$OFFDIR/so-$$n.key"
            curl -ks --max-time 10 -X POST $$SOAUTH \
              -o $$OFFDIR/so-$$n.begin.json \
              https://localhost:64002/v1/barrier/officers/so-$$n/claim/begin || true
            NONCE=$$(jq -r '.nonce_hex // empty' $$OFFDIR/so-$$n.begin.json 2>/dev/null)
            if [ -z "$$NONCE" ]; then
              echo "Claim begin failed for so-$$n:"
              cat $$OFFDIR/so-$$n.begin.json || true
              continue
            fi
            printf '%s' "$$NONCE" | xxd -r -p > $$OFFDIR/so-$$n.nonce
            SIG=$$(openssl dgst -sha256 -sign $$OFFDIR/so-$$n.key $$OFFDIR/so-$$n.nonce | base64 -w0)
            jq -n --arg nonce "$$NONCE" --arg sig "$$SIG" '{nonce_hex: $$nonce, signature: $$sig}' \
              | curl -ks --max-time 10 -X POST $$SOAUTH \
                  -H 'Content-Type: application/json' \
                  --data-binary @- \
                  -o $$OFFDIR/so-$$n.complete.json \
                  https://localhost:64002/v1/barrier/officers/so-$$n/claim/complete || true
            SHARE=$$(jq -r '.share_bytes // empty' $$OFFDIR/so-$$n.complete.json 2>/dev/null | base64 -d 2>/dev/null | jq -r '.value // empty' 2>/dev/null)
            if [ -z "$$SHARE" ]; then
              echo "Claim complete failed for so-$$n:"
              cat $$OFFDIR/so-$$n.complete.json || true
              continue
            fi
            echo "$$SHARE" >> $$OFFDIR/share-values.txt
            # Scrub claim artifacts; the share now lives only in the shares
            # file consumed by the test runner.
            rm -f $$OFFDIR/so-$$n.complete.json $$OFFDIR/so-$$n.nonce
            echo "Officer so-$$n share claimed"
          done
          jq -Rn '{threshold: 2, total_shares: 3, shares: [inputs]}' \
            < $$OFFDIR/share-values.txt > /data/raft/shamir-init.json
          rm -f $$OFFDIR/share-values.txt
          echo "Shamir shares file written:"
          jq '{threshold, total_shares, share_count: (.shares | length)}' /data/raft/shamir-init.json || true
        fi
        echo "Bootstrap complete"
        # Hand control back to qrdbd.
        wait $$QRDBD_PID

  # NOTE: the resource-heavy Ollama embedding sidecar is NOT part of the
  # default integration stack — no test in test/integration uses it (the
  # embedding/RAG suites are mocked unit tests run by `make test`). It lives in
  # the opt-in docker-compose.embedding.yml overlay so the main standalone and
  # cluster suites stay fast and light. See `make integration-test-embedding`.

  # Integration test runner
  integration-tests:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    privileged: true
    user: root
    depends_on:
      qrdbd:
        condition: service_healthy
      qrdbd-shamir:
        condition: service_healthy
    volumes:
      - qrdb-socket:/var/run/qrdbd
      - qrdb-data:/data:ro
      - qrdb-shamir-socket:/var/run/qrdbd-shamir
      - qrdb-shamir-data:/data-shamir:ro
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - QRDB_UNIX_SOCKET=/var/run/qrdbd/qrdbd.sock
      - QRDB_REST_URL=https://qrdbd:63002
      - QRDB_GRPC_ADDR=qrdbd:63003
      - QRDB_MCP_ADDR=qrdbd:63005
      - QRDB_QUIC_ADDR=qrdbd:63004
      - QRDB_CLI_BIN=/app/build/bin/qrdb
      - QRDB_TLS_CA=/data/raft/ca.pem
      - QRDB_TLS_CERT=/data/raft/admin-cert.pem
      - QRDB_TLS_KEY=/data/raft/admin-key.pem
      # Dedicated Shamir-seal server connection (mounted read-only at /data-shamir).
      - QRDB_SHAMIR_REST_URL=https://qrdbd-shamir:64002
      - QRDB_SHAMIR_GRPC_ADDR=qrdbd-shamir:64003
      - QRDB_SHAMIR_MCP_ADDR=qrdbd-shamir:64005
      - QRDB_SHAMIR_QUIC_ADDR=qrdbd-shamir:64004
      - QRDB_SHAMIR_UNIX_SOCKET=/var/run/qrdbd-shamir/qrdbd.sock
      - QRDB_SHAMIR_TLS_CA=/data-shamir/raft/ca.pem
      - QRDB_SHAMIR_TLS_CERT=/data-shamir/raft/admin-cert.pem
      - QRDB_SHAMIR_TLS_KEY=/data-shamir/raft/admin-key.pem
      - QRDB_SHAMIR_SHARES_FILE=/data-shamir/raft/shamir-init.json
      - INTEGRATION_TIMEOUT=60s
      # Which Go packages the runner tests. Defaults to everything; the
      # Makefile sets it to ./test/integration/api/... (standalone, against
      # these servers) or ./test/integration/ (cluster + self-spawned nodes)
      # so the two suites run in isolated stages and never contend for host CPU.
      - INTEGRATION_TEST_PKGS=${INTEGRATION_TEST_PKGS:-./test/integration/...}
      # Optional -run regexp passed to `go test`. Empty (default) runs every
      # test in the selected packages; overlays (e.g. docker-compose.embedding.yml)
      # set it to scope the run to a specific suite.
      - INTEGRATION_RUN=${INTEGRATION_RUN:-}
      # Build tags for the test compilation. Defaults to just "integration";
      # overlays add tags (e.g. "integration,ollama") to compile in suites
      # gated behind extra build constraints, keeping them out of the fast run.
      - INTEGRATION_TAGS=${INTEGRATION_TAGS:-integration}
    working_dir: /workspace/go-qrdb
    networks:
      - qrdb-integration
    command: >
      sh -c "
      echo 'Configuring UDP buffers for QUIC...' &&
      echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo 'Warning: Could not set rmem_max' &&
      echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo 'Warning: Could not set wmem_max' &&
      echo 'Waiting for server to be ready...' &&
      sleep 5 &&
      echo 'Checking Unix socket...' &&
      ls -la /var/run/qrdbd/ || true &&
      echo 'Checking TLS certificates...' &&
      ls -la /data/raft/*.pem || true &&
      echo \"Running integration tests ($$INTEGRATION_TEST_PKGS, tags='$$INTEGRATION_TAGS', run='$$INTEGRATION_RUN')...\" &&
      go test -p 1 -v -tags=$$INTEGRATION_TAGS $$INTEGRATION_TEST_PKGS -run \"$$INTEGRATION_RUN\" -timeout 45m
      "

volumes:
  qrdb-data:
    driver: local
  qrdb-socket:
    driver: local
  qrdb-shamir-data:
    driver: local
  qrdb-shamir-socket:
    driver: local
  go-build-cache:
    driver: local

networks:
  qrdb-integration:
    driver: bridge

# The BuildKit secret that carries the internal Gitea module credentials into
# `go mod download`. Every service above that builds .devcontainer/Dockerfile
# declares it, so the compose entrypoints authenticate exactly the way
# `make integration-image`'s `docker build --secret` does -- before #302 they
# did not, and `make ci` therefore died inside the image build with an
# `unknown revision` that read like a gate failure.
#
# GOMODAUTH_FILE is staged by the Makefile's $(stage-gomodauth) prelude. The
# /dev/null default is the unprovisioned path and is deliberate, not a
# fallback added here: it mounts an EMPTY secret, which is byte-for-byte what
# the Dockerfile already saw when no secret was supplied at all, so a bare
# `docker compose build` and the VS Code devcontainer behave exactly as they
# did. A GOMODAUTH_FILE naming a file that does not exist fails the build
# loudly, which is the right answer for a caller that meant to provision one.
secrets:
  gomodauth:
    file: ${GOMODAUTH_FILE:-/dev/null}
