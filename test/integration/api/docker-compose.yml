# Nothing here bind-mounts a host path — not the repository, not the siblings,
# and not the two test configs. compose talks to the HOST daemon, so a relative
# path is resolved there, and on a runner the job's checkout does not exist on
# the host: `mkdir /workspace: file exists` is what a config mount produced
# there, having worked on every developer machine. The image already carries
# both configs via `COPY . .`, so the servers read them in place.
#
# No service declares container_name. A container name is global to the host, so
# a second `docker compose up` claims the same names and SIGKILLs the first
# run's containers — exit 137, truncated log, no failing test, which reads as
# OOM and is not. Docker does not refuse the collision the way it refuses a
# port. Nothing referenced those names: the tests address the servers by compose
# SERVICE name (https://qrdbd:63002). The Makefile supplies a per-run project
# name so containers, networks and volumes are namespaced together.
# The analyser pins .devcontainer/Dockerfile bakes in (#322), plus
# QRDB_BUILD_TAGS (go-qrdb#555), the feature-tag set its qrdbd/qrdb builds
# compile with. These three services build that same Dockerfile into the
# same `go-qrdb-dev:latest` tag the devcontainer uses, so they take the same
# args, or an integration build and a gate build would bake different
# analysers -- or different CLI/server feature sets -- into one tag.
#
# THE KEYS CARRY NO VALUE ON PURPOSE -- compose's environment-passthrough form,
# which takes the value from the environment when set and OMITS the arg when it
# is not, letting the Dockerfile's ARG default apply. `${VAR}` would pass an
# empty string instead and trip the Dockerfile's guard (QRDB_BUILD_TAGS has
# none, but an empty string would still build qrdbd/qrdb with no feature tags
# at all, which is just as wrong). The reasoning, and the measurement behind
# it, is in .devcontainer/docker-compose.yml next to the same block; the
# Makefile `export`s the variables so `make` builds win.
x-scanner-pins: &scanner-pins
  GOLANGCI_LINT_VERSION:
  GOSEC_VERSION:
  GOVULNCHECK_VERSION:
  TRIVY_VERSION:
  QRDB_BUILD_TAGS:

services:
  # QRDB server with all protocols enabled.
  # Uses the devcontainer image and mounts source + sibling repos so the
  # server binary can be built with access to replace-directive dependencies.
  qrdbd:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    hostname: qrdbd
    expose:
      - "63001/udp"  # Raft/QUIC (UDP)
      - "63001/tcp"  # Raft fallback (TCP)
      - "63002"      # REST API
      - "63003"      # gRPC
      - "63004/udp"  # QUIC API
      - "63005"      # MCP
    # Required for QUIC UDP buffer settings
    privileged: true
    # privileged already grants IPC_LOCK; the memlock ulimit is stated so the
    # locked-memory requirement is explicit rather than a side effect (see
    # docs/deployment/).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - qrdb-data:/data
      - qrdb-socket:/var/run/qrdbd
    environment:
      - QRDB_CONFIG=/workspace/go-qrdb/test/integration/api/config.test.yaml
      - QRDB_LOG_LEVEL=debug
      - CGO_ENABLED=1
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--insecure", "https://localhost:63002/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 180s
    networks:
      - qrdb-integration
    user: root
    working_dir: /workspace/go-qrdb
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        # Ensure directories exist
        mkdir -p /var/run/qrdbd /data /app/build/bin
        # qrdbd is built into the image; container start is a server start.
        echo "Starting qrdbd server..."
        /app/build/bin/qrdbd start --config /workspace/go-qrdb/test/integration/api/config.test.yaml &
        QRDBD_PID=$!
        # Wait for the admin endpoint to come up so we can bootstrap the node.
        #
        # `qrdb init` is the only system bootstrap: in one call against the
        # pre-host sealed-window listener it brings the system barrier up
        # (passphrase strategy), provisions the SO and user PINs, and binds
        # the bootstrap admin's certificate. qrdbd writes no admin credential
        # of its own; the admin's key pair is generated HERE and only the CSR
        # leaves this shell (--admin-csr), so the key never reaches the
        # server. The credential lives under /data/admin, which the test
        # runner mounts read-only (QRDB_TLS_CERT/QRDB_TLS_KEY).
        #
        # Every step fails hard: a node that did not bootstrap must not pass
        # its health check. (Comments go HERE, not between the continuation
        # lines below: a backslash-continued command is one logical line, so a
        # `#` inside it comments out the remainder of the command.)
        fail() { echo "bootstrap failed: $$1"; kill $$QRDBD_PID; exit 1; }
        QRDB="/app/build/bin/qrdb --server https://localhost:63002 --transport rest --ca-file /data/raft/ca.pem --timeout 30s"
        ADMIN=/data/admin
        mkdir -p $$ADMIN
        echo "Waiting for the CA certificate..."
        for i in $$(seq 1 60); do
          [ -s /data/raft/ca.pem ] && break
          sleep 1
        done
        [ -s /data/raft/ca.pem ] || fail "no CA certificate at /data/raft/ca.pem"
        # The sealed-window listener answers GET /v1/barrier/status (on its
        # allowlist) with no client certificate. The public /health endpoint
        # cannot be used here: it stays 503 until the barrier is unsealed, and
        # bootstrapping is what unseals it.
        echo "Waiting for sealed-window admin listener..."
        READY=""
        for i in $$(seq 1 60); do
          if $$QRDB barrier status > /dev/null 2>&1; then READY=1; break; fi
          sleep 1
        done
        [ -n "$$READY" ] || fail "sealed-window admin listener never answered"
        if [ -s $$ADMIN/admin.crt ]; then
          # A restart against the persisted volume: the node is bootstrapped,
          # and its passphrase barrier comes back sealed.
          echo "Unsealing the barrier..."
          $$QRDB --cert-file $$ADMIN/admin.crt --key-file $$ADMIN/admin.key \
            barrier unseal --passphrase integration-test-secret || fail "barrier unseal"
        else
          echo "Bootstrapping with qrdb init..."
          openssl ecparam -name prime256v1 -genkey -noout -out $$ADMIN/admin.key || fail "admin key"
          openssl req -new -key $$ADMIN/admin.key -subj "/CN=admin" -out $$ADMIN/admin.csr || fail "admin CSR"
          $$QRDB --output json init \
            --so-pin integration-so-pin --user-pin integration-user-pin \
            --barrier-strategy passphrase --passphrase integration-test-secret \
            --admin-csr $$ADMIN/admin.csr > $$ADMIN/init.json || fail "qrdb init: $$(cat $$ADMIN/init.json)"
          jq -er .admin_cert_pem $$ADMIN/init.json > $$ADMIN/admin.crt || fail "qrdb init returned no admin certificate"
        fi
        # Wait for the full-boot admin endpoint: after unseal the data plane
        # opens, the host elects a leader, and /health flips to 200. Gating
        # "Bootstrap complete" on /health keeps the log an accurate signal
        # that the full server is up rather than racing the sealed-window
        # teardown.
        echo "Waiting for admin endpoint (post-unseal full boot)..."
        HEALTHY=""
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' https://localhost:63002/health | grep -q 200; then
            HEALTHY=1
            echo "Admin endpoint ready"
            break
          fi
          sleep 1
        done
        [ -n "$$HEALTHY" ] || fail "full boot never reported healthy"
        echo "Bootstrap complete"
        # Hand control back to qrdbd.
        wait $$QRDBD_PID

  # Dedicated QRDB server configured with the Shamir M-of-N seal strategy.
  # Runs side by side with the software-seal "qrdbd" server above on a
  # DISTINCT port set (64001-64005), data volume, and unix socket so the
  # Shamir CLI tests exercise a real Shamir-sealed barrier without disturbing
  # the software-seal coverage. The entrypoint mirrors qrdbd's bootstrap but
  # bootstraps through `qrdb init` with three share holders named by their
  # CSRs: init splits the unseal key to them (no share material in the
  # response), and each holder claims its sealed envelope exactly once over
  # its own certificate. The holders file the runner reads is written to a
  # shared volume.
  qrdbd-shamir:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    hostname: qrdbd-shamir
    expose:
      - "64001/udp"  # Raft/QUIC (UDP)
      - "64001/tcp"  # Raft fallback (TCP)
      - "64002"      # REST API
      - "64003"      # gRPC
      - "64004/udp"  # QUIC API
      - "64005"      # MCP
    # Required for QUIC UDP buffer settings
    privileged: true
    # privileged already grants IPC_LOCK; the memlock ulimit is stated so the
    # locked-memory requirement is explicit rather than a side effect (see
    # docs/deployment/).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - qrdb-shamir-data:/data
      - qrdb-shamir-socket:/var/run/qrdbd-shamir
    environment:
      - QRDB_CONFIG=/workspace/go-qrdb/test/integration/api/config.test.shamir.yaml
      - QRDB_LOG_LEVEL=debug
      - CGO_ENABLED=1
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "--insecure", "https://localhost:64002/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 180s
    networks:
      - qrdb-integration
    user: root
    working_dir: /workspace/go-qrdb
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Set UDP buffer sizes for QUIC
        echo "Configuring UDP buffers for QUIC..."
        echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo "Warning: Could not set rmem_max"
        echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo "Warning: Could not set wmem_max"
        # Ensure directories exist
        mkdir -p /var/run/qrdbd-shamir /data /app/build/bin
        # qrdbd is built into the image; container start is a server start.
        echo "Starting qrdbd (shamir) server..."
        /app/build/bin/qrdbd start --config /workspace/go-qrdb/test/integration/api/config.test.shamir.yaml &
        QRDBD_PID=$!
        # Bootstrap the Shamir barrier with `qrdb init`, the only system
        # bootstrap (docs/shamir-custody/): one call against the sealed-window
        # listener names the three share holders by their CSRs (--officers),
        # splits the unseal key to them, provisions the PINs and binds the
        # bootstrap admin's certificate (--admin-csr; the admin's key never
        # leaves this shell). Each holder then claims its sealed envelope over
        # its own certificate. The holders file lists each holder's
        # certificate, key and envelope, relative to /data/raft, so the
        # integration-test runner can drive the authenticated quorum with
        # them. Guarded on the holders file so a container restart against a
        # persisted volume does not re-run the one-time flow. Every step fails
        # hard: a node that did not bootstrap must not pass its health check.
        fail() { echo "bootstrap failed: $$1"; kill $$QRDBD_PID; exit 1; }
        QRDB="/app/build/bin/qrdb --server https://localhost:64002 --transport rest --ca-file /data/raft/ca.pem --timeout 30s"
        ADMIN=/data/admin
        OFFDIR=/data/raft/officers
        echo "Waiting for the CA certificate..."
        for i in $$(seq 1 60); do
          [ -s /data/raft/ca.pem ] && break
          sleep 1
        done
        [ -s /data/raft/ca.pem ] || fail "no CA certificate at /data/raft/ca.pem"
        echo "Waiting for sealed-window admin listener..."
        READY=""
        for i in $$(seq 1 60); do
          if $$QRDB barrier status > /dev/null 2>&1; then READY=1; break; fi
          sleep 1
        done
        [ -n "$$READY" ] || fail "sealed-window admin listener never answered"
        if [ ! -s /data/raft/shamir-init.json ]; then
          mkdir -p $$ADMIN $$OFFDIR
          echo "Generating the admin and share-holder keys and CSRs..."
          openssl ecparam -name prime256v1 -genkey -noout -out $$ADMIN/admin.key || fail "admin key"
          openssl req -new -key $$ADMIN/admin.key -subj "/CN=admin" -out $$ADMIN/admin.csr || fail "admin CSR"
          HOLDERS=""
          for n in 1 2 3; do
            openssl ecparam -name prime256v1 -genkey -noout -out $$OFFDIR/so-$$n.key || fail "so-$$n key"
            openssl req -new -key $$OFFDIR/so-$$n.key -subj "/CN=so-$$n" -out $$OFFDIR/so-$$n.csr || fail "so-$$n CSR"
            HOLDERS="$$HOLDERS --officers so-$$n=$$OFFDIR/so-$$n.csr"
          done
          echo "Bootstrapping with qrdb init (2-of-3 Shamir)..."
          $$QRDB --output json init \
            --so-pin integration-so-pin --user-pin integration-user-pin \
            --barrier-strategy shamir --threshold 2 --shares 3 $$HOLDERS \
            --admin-csr $$ADMIN/admin.csr > $$ADMIN/init.json || fail "qrdb init: $$(cat $$ADMIN/init.json)"
          jq -er .admin_cert_pem $$ADMIN/init.json > $$ADMIN/admin.crt || fail "qrdb init returned no admin certificate"
          for n in 1 2 3; do
            jq -er --arg u "so-$$n" '.holders[] | select(.username == $$u) | .cert_pem' $$ADMIN/init.json \
              > $$OFFDIR/so-$$n.crt || fail "qrdb init issued no certificate for so-$$n"
          done
        fi
        # Wait for the full-boot admin endpoint: after unseal the data plane
        # opens, the host elects a leader, and /health flips to 200.
        echo "Waiting for admin endpoint (post-unseal full boot)..."
        HEALTHY=""
        for i in $$(seq 1 60); do
          if curl -ks --max-time 2 -o /dev/null -w '%{http_code}' https://localhost:64002/health | grep -q 200; then
            HEALTHY=1
            echo "Admin endpoint ready"
            break
          fi
          sleep 1
        done
        [ -n "$$HEALTHY" ] || fail "full boot never reported healthy"
        # Claim each holder's envelope over the holder's own certificate,
        # through the real `qrdb barrier officer claim` CLI command rather
        # than a hand-rolled curl/openssl handshake: the envelope is
        # delivered once, sealed to the holder's key. The CLI signs the
        # SAME domain-separated message the server verifies
        # (ceremony.ShareClaimMessage, via barrier_holders.go's
        # claimSignMessage: "qrdb/share-claim/v1" NUL the scope label NUL
        # the holder's own username NUL the raw nonce bytes -- never the
        # bare nonce), so this is the canonical path, not a shortcut around
        # it. The holders file lists each holder's certificate, key and
        # envelope, relative to /data/raft, so the integration-test runner
        # can drive the authenticated quorum with them.
        if [ ! -s /data/raft/shamir-init.json ]; then
          echo "Claiming share-holder envelopes..."
          : > $$OFFDIR/holders.jsonl
          for n in 1 2 3; do
            $$QRDB --cert-file $$OFFDIR/so-$$n.crt --key-file $$OFFDIR/so-$$n.key \
              barrier officer claim --username so-$$n --key $$OFFDIR/so-$$n.key --out $$OFFDIR/so-$$n.env \
              || fail "claim for so-$$n"
            [ -s $$OFFDIR/so-$$n.env ] || fail "claim for so-$$n wrote no envelope"
            jq -cn --arg u "so-$$n" '{username: $$u, cert: ("officers/" + $$u + ".crt"), key: ("officers/" + $$u + ".key"), envelope: ("officers/" + $$u + ".env")}' \
              >> $$OFFDIR/holders.jsonl || fail "holders file"
            echo "Holder so-$$n envelope claimed"
          done
          jq -s '{threshold: 2, total_shares: 3, holders: .}' < $$OFFDIR/holders.jsonl > /data/raft/shamir-init.json \
            || fail "holders file"
          rm -f $$OFFDIR/holders.jsonl
          echo "Shamir holders file written:"
          jq '{threshold, total_shares, holder_count: (.holders | length)}' /data/raft/shamir-init.json
        fi
        echo "Bootstrap complete"
        # Hand control back to qrdbd.
        wait $$QRDBD_PID

  # NOTE: the resource-heavy Ollama embedding sidecar is NOT part of the
  # default integration stack — no test in test/integration uses it (the
  # embedding/RAG suites are mocked unit tests run by `make test`). It lives in
  # the opt-in docker-compose.embedding.yml overlay so the main standalone and
  # cluster suites stay fast and light. See `make integration-test-embedding`.

  # Integration test runner
  integration-tests:
    build:
      context: ../../..
      dockerfile: .devcontainer/Dockerfile
      target: integration
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    privileged: true
    # privileged already grants IPC_LOCK; the memlock ulimit is stated so the
    # locked-memory requirement is explicit rather than a side effect (see
    # docs/deployment/).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    user: root
    depends_on:
      qrdbd:
        condition: service_healthy
      qrdbd-shamir:
        condition: service_healthy
    volumes:
      - qrdb-socket:/var/run/qrdbd
      - qrdb-data:/data:ro
      - qrdb-shamir-socket:/var/run/qrdbd-shamir
      - qrdb-shamir-data:/data-shamir:ro
      - go-build-cache:/root/.cache/go-build
    environment:
      - CGO_ENABLED=1
      - QRDB_UNIX_SOCKET=/var/run/qrdbd/qrdbd.sock
      - QRDB_REST_URL=https://qrdbd:63002
      - QRDB_GRPC_ADDR=qrdbd:63003
      - QRDB_MCP_ADDR=qrdbd:63005
      - QRDB_QUIC_ADDR=qrdbd:63004
      - QRDB_CLI_BIN=/app/build/bin/qrdb
      - QRDB_TLS_CA=/data/raft/ca.pem
      - QRDB_TLS_CERT=/data/admin/admin.crt
      - QRDB_TLS_KEY=/data/admin/admin.key
      # Dedicated Shamir-seal server connection (mounted read-only at /data-shamir).
      - QRDB_SHAMIR_REST_URL=https://qrdbd-shamir:64002
      - QRDB_SHAMIR_GRPC_ADDR=qrdbd-shamir:64003
      - QRDB_SHAMIR_MCP_ADDR=qrdbd-shamir:64005
      - QRDB_SHAMIR_QUIC_ADDR=qrdbd-shamir:64004
      - QRDB_SHAMIR_UNIX_SOCKET=/var/run/qrdbd-shamir/qrdbd.sock
      - QRDB_SHAMIR_TLS_CA=/data-shamir/raft/ca.pem
      - QRDB_SHAMIR_TLS_CERT=/data-shamir/admin/admin.crt
      - QRDB_SHAMIR_TLS_KEY=/data-shamir/admin/admin.key
      - QRDB_SHAMIR_SHARES_FILE=/data-shamir/raft/shamir-init.json
      - INTEGRATION_TIMEOUT=60s
      # Which Go packages the runner tests. Defaults to everything; the
      # Makefile sets it to ./test/integration/api/... (standalone, against
      # these servers) or ./test/integration/ (cluster + self-spawned nodes)
      # so the two suites run in isolated stages and never contend for host CPU.
      - INTEGRATION_TEST_PKGS=${INTEGRATION_TEST_PKGS:-./test/integration/...}
      # Optional -run regexp passed to `go test`. Empty (default) runs every
      # test in the selected packages; overlays (e.g. docker-compose.embedding.yml)
      # set it to scope the run to a specific suite.
      - INTEGRATION_RUN=${INTEGRATION_RUN:-}
      # Build tags for the test compilation. Defaults to just "integration";
      # overlays add tags (e.g. "integration,ollama") to compile in suites
      # gated behind extra build constraints, keeping them out of the fast run.
      - INTEGRATION_TAGS=${INTEGRATION_TAGS:-integration}
    working_dir: /workspace/go-qrdb
    networks:
      - qrdb-integration
    command: >
      sh -c "
      echo 'Configuring UDP buffers for QUIC...' &&
      echo 2500000 > /proc/sys/net/core/rmem_max 2>/dev/null || echo 'Warning: Could not set rmem_max' &&
      echo 2500000 > /proc/sys/net/core/wmem_max 2>/dev/null || echo 'Warning: Could not set wmem_max' &&
      echo 'Waiting for server to be ready...' &&
      sleep 5 &&
      echo 'Checking Unix socket and admin credential...' &&
      test -S /var/run/qrdbd/qrdbd.sock &&
      test -s /data/admin/admin.crt &&
      echo \"Running integration tests ($$INTEGRATION_TEST_PKGS, tags='$$INTEGRATION_TAGS', run='$$INTEGRATION_RUN')...\" &&
      go test -p 1 -v -tags=$$INTEGRATION_TAGS $$INTEGRATION_TEST_PKGS -run \"$$INTEGRATION_RUN\" -timeout 45m
      "

volumes:
  qrdb-data:
    driver: local
  qrdb-socket:
    driver: local
  qrdb-shamir-data:
    driver: local
  qrdb-shamir-socket:
    driver: local
  go-build-cache:
    driver: local

networks:
  qrdb-integration:
    driver: bridge

# The BuildKit secret that carries the internal Gitea module credentials into
# `go mod download`. Every service above that builds .devcontainer/Dockerfile
# declares it, so the compose entrypoints authenticate exactly the way
# `make integration-image`'s `docker build --secret` does -- before #302 they
# did not, and `make ci` therefore died inside the image build with an
# `unknown revision` that read like a gate failure.
#
# GOMODAUTH is exported by the Makefile's $(stage-gomodauth) prelude and read
# straight out of the environment -- there is no file (#326).
#
# The previous form was `file: ${GOMODAUTH_FILE:-/dev/null}`, staging the live
# token into /tmp behind an EXIT trap that a SIGKILL does not run; a twelve-hour-old
# copy was found on disk. An environment source writes nothing, so there is
# nothing to leave behind.
#
# The unprovisioned path is preserved and is what makes a bare
# `docker compose build` and the VS Code devcontainer work: an UNSET or EMPTY
# GOMODAUTH mounts an empty secret rather than failing, which is byte-for-byte
# what the Dockerfile saw when no secret was supplied at all. Measured both
# ways on compose 2.40.3 before this replaced the /dev/null default.
secrets:
  gomodauth:
    environment: GOMODAUTH
