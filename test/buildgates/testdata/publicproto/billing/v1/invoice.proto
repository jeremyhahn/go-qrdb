// A service defined outside go-qrdb, annotated with the public permission
// option. `make check-public-proto` compiles it with only the sdk/go module's
// proto/ directory added to the include path.
syntax = "proto3";

package billing.v1;

option go_package = "example.com/billing/gen/billing/v1;billingv1";

import "google/protobuf/empty.proto";
import "qrdb/v1/permission.proto";

service InvoiceService {
  rpc Issue(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (qrdb.v1.permission) = "billing:issue";
  }
}
