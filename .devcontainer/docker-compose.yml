# The analyser pins this image bakes in (#322). `make ci` runs the whole gate
# INSIDE the devcontainer, so these four binaries are what judge a developer's
# tree, and `.github/workflows/ci.yml`'s env block declares what judges CI's.
# They were allowed to differ: gosec and govulncheck installed at `@latest` and
# golangci-lint at v2.7.2 against ci.yml's v2.13.2, so one commit could be
# analysed by two different analysers with nothing in either result saying so.
#
# THE KEYS BELOW CARRY NO VALUE ON PURPOSE. That is compose's
# environment-passthrough form: the arg is taken from the environment if the
# variable is set, and OMITTED ENTIRELY if it is not, so the Dockerfile's ARG
# default applies. Writing `GOSEC_VERSION: ${GOSEC_VERSION}` instead would pass
# an EMPTY STRING when the variable is unset, and an explicitly empty build arg
# overrides a default and trips the Dockerfile's guard.
#
# Measured 2026-09-05 on a two-service probe, because the two forms are one
# character apart in appearance and opposite in effect:
#
#   args: {FOO: }          FOO unset -> RUN sees FOO=[defaultvalue]
#   args: {FOO: ${FOO}}    FOO unset -> RUN sees FOO=[]
#
# So this form is what keeps VS Code "Reopen in Container" and a bare
# `docker compose build` working (#302, ruled 2026-09-05), while `make`
# entrypoints still win: the Makefile `export`s the four variables, so a build
# through make uses the Makefile's values and a build around it falls back to
# the Dockerfile defaults, which #323 asserts are the same numbers.
#
# Do not "fix" these into `${VAR}`. It looks more explicit and it silently
# removes the fallback.
x-go-scanner-pins: &go-scanner-pins
  GOLANGCI_LINT_VERSION:
  GOSEC_VERSION:
  GOVULNCHECK_VERSION:

# devcontainer-gpu builds Dockerfile.gpu, which runs no security suite and
# therefore bakes no trivy; passing it TRIVY_VERSION would declare a build arg
# that file does not consume.
x-scanner-pins: &scanner-pins
  <<: *go-scanner-pins
  TRIVY_VERSION:

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN

  client-build:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    environment:
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@${GITEA_HOST:-git.example.internal}/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
    command: ["make", "_build-client"]

  e2e:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-e2e:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    environment:
      - CI=true
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@${GITEA_HOST:-git.example.internal}/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
    command: ["make", "_test-e2e"]

  devcontainer-gpu:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.gpu
      args: *go-scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-gpu-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  benchmark:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args: *scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN

# The BuildKit secret that carries the internal Gitea module credentials into
# `go mod download`. Every service above that builds .devcontainer/Dockerfile
# OR .devcontainer/Dockerfile.gpu declares it, so the compose entrypoints
# authenticate exactly the way `make integration-image`'s `docker build
# --secret` does -- before #302 they did not, and `make ci` therefore died
# inside the image build with an `unknown revision` that read like a gate
# failure. devcontainer-gpu was added to that set by #305, which gave
# Dockerfile.gpu the same secret mount the other Dockerfile already had.
#
# GOMODAUTH_FILE is staged by the Makefile's $(stage-gomodauth) prelude. The
# /dev/null default is the unprovisioned path and is deliberate, not a
# fallback added here: it mounts an EMPTY secret, which is byte-for-byte what
# the Dockerfile already saw when no secret was supplied at all, so a bare
# `docker compose build` and the VS Code devcontainer behave exactly as they
# did. A GOMODAUTH_FILE naming a file that does not exist fails the build
# loudly, which is the right answer for a caller that meant to provision one.
secrets:
  gomodauth:
    file: ${GOMODAUTH_FILE:-/dev/null}
