services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN

  client-build:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    environment:
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
    command: ["make", "_build-client"]

  e2e:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: go-qrdb-e2e:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    environment:
      - CI=true
      - GOPRIVATE=github.com/jeremyhahn/*
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=url.http://x:${GITEA_GO_TOKEN}@198.51.100.91:3001/jeremyhahn/.insteadOf
      - GIT_CONFIG_VALUE_0=https://github.com/jeremyhahn/
    command: ["make", "_test-e2e"]

  devcontainer-gpu:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.gpu
    image: go-qrdb-gpu-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  benchmark:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: go-qrdb-dev:latest
    volumes:
      - ..:/workspace/go-qrdb
      - ../../go-quicraft:/workspace/go-quicraft
      - ../../go-truststrap:/workspace/go-truststrap
      - ../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    cap_add:
      - NET_ADMIN
