# golangci-lint v2 configuration for go-qrdb
# Derived from the shared stack baseline (conventions/project-scaffold.md).
version: "2"

run:
  # The single declaration of the lint time budget: `make lint` deliberately
  # passes no --timeout, because a flag would override this file (#60).
  #
  # Sized for a cold, contended CI runner, not a warm workstation. Measured on
  # 2026-08-21: the tagged ./... run takes 25s here with a warm golangci-lint
  # cache and 5m29s in CI, where every container starts with an empty one —
  # which is how the previous 5m budget failed a run that had already printed
  # "0 issues.". This is a ceiling that stops a hung run from holding a runner,
  # not a performance target; do not tighten it toward the observed CI time.
  timeout: 20m
  tests: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jeremyhahn/go-qrdb

linters:
  # devops.md §8 requires the umbrella to actually carry the security linters:
  # staticcheck (which subsumes gosimple), errcheck, unused, ineffassign,
  # misspell and gocritic. Installing golangci-lint with them switched off does
  # not satisfy that section.
  enable:
    - errcheck
    - gocritic
    - govet
    - misspell
    - bodyclose
    - whitespace
    - copyloopvar
    - errname
    - errorlint
    - forbidigo
    - godot
    - gosec
    - staticcheck
    - unused
    - ineffassign
  disable:
    - unconvert   # Style preference
    - unparam     # Too noisy for production code
    - goconst     # Too aggressive, better handled in code review
    - gocyclo     # Complexity handled in code review
    - goprintffuncname # Style preference
    - revive      # Too aggressive, covered by other linters
    - nilerr      # Many false positives
    - noctx       # Context handled explicitly
    - predeclared # Style preference
    - thelper     # Test helper hints, not critical
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - fmt.Printf
        - fmt.Println
        - fmt.Print
        - fmt.Scanln
        - (io.Closer).Close
        - (*os.File).Close
        - io.Copy
        - io.WriteString
        - os.Setenv
        - os.Unsetenv
        - os.Remove
        - os.RemoveAll
        - os.Mkdir
        - os.MkdirAll
        - (*bytes.Buffer).WriteString
        - (*bytes.Buffer).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).Write
        - encoding/binary.Write
        - encoding/binary.Read
    goconst:
      min-len: 3
      min-occurrences: 5
    gocritic:
      # Bug-finding only. The style, opinionated, experimental and performance
      # groups are taste, and on a codebase this size they would bury the
      # diagnostics that matter — a noisy gate is a gate people learn to ignore.
      enabled-tags:
        - diagnostic
      disabled-checks:
        - appendAssign
        - commentFormatting
    gocyclo:
      min-complexity: 30
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: package-comments
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: increment-decrement
          severity: warning
    gosec:
      # MEASURED, NOT INHERITED (#295). Every entry below was re-run with the
      # rule ARMED, on both modules this file lints, and kept only where that
      # changed the finding count. Measured 2026-09-10, with the build tags
      # `make lint` passes and with golangci-lint's default issue caps
      # disabled -- `--max-issues-per-linter=0 --max-same-issues=0`, without
      # which gosec's output stops at 50 and this table would have been wrong:
      #
      #   rule   make lint   make lint-sdk
      #   ----   ---------   -------------
      #   G115      324           142
      #   G602       15             4
      #   G704        2             0
      #
      # G117, G204 and G122 used to be here and report NOTHING on either module
      # at this version. They are DELETED rather than rescoped, because an
      # exclusion that fires on nothing is worse than an unexamined one: it
      # reads as "the lint gate considered this class and cleared it", and
      # re-running the tool cannot tell you otherwise -- a suppression and an
      # inert rule are indistinguishable in the output. That is exactly how
      # this file's G703 entry survived while suppressing nothing (#181).
      #
      # A COUNT IS ONLY MEANINGFUL AGAINST A SCANNER VERSION, and this leg's is
      # pinned nowhere: golangci-lint v2.13.2 bundles gosec v2.28.0, chosen by
      # its own go.mod. GOLANGCI_GOSEC_VERSION in the Makefile records it, and
      # `make check-bundled-gosec` reads it back off the binary and fails when
      # it moves -- which is the signal to re-measure this block, not to widen
      # it.
      #
      # THAT IS A DIFFERENT GOSEC FROM THE ONE `make gosec` RUNS (v2.29.0), and
      # they differ in soundness rather than strictness, so these two exclusion
      # lists are NOT copies of each other and must not be made into copies.
      # GOSEC_EXCLUDE in the Makefile carries its own measurements and they do
      # not agree with these.
      #
      # G602 IS THE ONE TO UNDERSTAND BEFORE CHANGING EITHER LIST, because TWO
      # separate things keep it off the other leg and fixing one changes
      # nothing (#395). `make gosec` passes no -tests, so it does not build the
      # test variant's SSA and never REACHES these 15 root / 4 sdk sites; and it
      # runs at -severity=medium while gosec grades G602 LOW/HIGH, so it would
      # not PRINT them if it did. Deleting this entry therefore reddens THIS leg
      # alone and arms nothing over there. Both halves are measured beside
      # GOSEC_EXCLUDE in the Makefile, along with why -tests is still off.
      #
      # G304 and G703 are NOT here. G304 is suppressed per-path under
      # `exclusions.rules` below, at the files an audit actually enumerated, so
      # it stays ARMED everywhere else -- including every request-facing
      # package. G703 is armed across this entire repository, full stop. See
      # that block for the predicate, the enumeration and what the narrowing is
      # protecting.
      excludes:
        - G115  # 324 root / 142 sdk. Integer overflow in conversions: protocol-spec bounded IDs and length prefixes.
        - G602  # 15 root / 4 sdk. Slice bounds, every site index-guarded on the line above; pkg/tenant/key.go:49 is the shape.
        - G704  # 2 root / 0 sdk. SSRF taint: the leader-forwarding client, whose URL comes from the internal peer registry.
    forbidigo:
      forbid:
        - pattern: ^print.*$
        - pattern: fmt\.Print.*
      exclude-godoc-examples: true
    godot:
      scope: declarations
      capital: false
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # ---------------------------------------------------------------------
      # gosec G304 / G703 -- path traversal. NARROWED FROM A REPO-WIDE
      # SUPPRESSION AFTER A REPO-WIDE AUDIT (#181, measured 2026-09-04).
      #
      # THE PREDICATE, so a reader can re-derive this rather than trust a list:
      #
      #   A G304/G703 finding here is a REAL containment defect iff a value an
      #   unprivileged remote caller can choose -- one entering the process
      #   through an API request (r.PathValue, r.URL.Path/Query, r.FormValue,
      #   r.Header.Get, any field decoded from a REST/gRPC/QUIC/unix/MCP
      #   request body, a KV key, or SQL text) rather than through
      #   operator-controlled config, a CLI flag, or the process environment --
      #   can reach the path argument of a filesystem operation (os.Open,
      #   OpenFile, ReadFile, WriteFile, Stat, Create, Remove, RemoveAll,
      #   Mkdir(All), ReadDir, Rename, http.ServeFile, or a filepath.Join
      #   feeding one) WITHOUT a separator-aware containment check against a
      #   fixed root.
      #
      # NO SITE IN THIS REPOSITORY SATISFIES THAT PREDICATE TODAY. Every
      # request-derived value that gets near a path is either mapped through a
      # total encoder or stopped by a containment check at the sink:
      #
      #   - KV keys -> pkg/storage/file: encodeKeyToPath percent-encodes a
      #     leading "." of every segment, so no segment can be "." or "..".
      #   - tenant ids -> pkg/seal.containedTenantPath: filepath.Rel against
      #     the pool root, rejecting ".", "..", a "../" prefix AND any
      #     remaining separator, so the id is exactly one component.
      #   - database names -> pkg/database.Manager.dbDir is reached only after
      #     a sync.Map hit on a name that passed namePattern (^[a-zA-Z0-9_-]+$)
      #     at create; Manager.Open, the one unguarded dbDir caller, has no
      #     caller in this repository.
      #   - the SPA handler -> its fs.FS is an embed.FS (cmd/qrdbd), never
      #     os.DirFS; the repository contains no os.DirFS at all.
      #
      # WHY THE SUPPRESSION IS NOT SIMPLY DELETED: the sites below are real and
      # were checked one at a time. WHY IT IS NO LONGER REPO-WIDE: the previous
      # blanket entry read "paths constructed from validated config" -- a claim
      # about code nobody had enumerated, which silenced the rule in packages
      # where the claim was never examined. That is exactly how a sibling repo
      # shipped a reproduced containment failure under a green lint leg. Scoped
      # by file, a new file-open site anywhere else goes RED and gets audited.
      #
      # G703 IS NOT SUPPRESSED HERE AT ALL, and the reason is the second finding
      # of that audit. The entry this replaces was INERT: golangci-lint v2.13.2
      # bundles gosec v2.28.0, whose G703 treats filepath.Clean as a sanitizer,
      # so it reports nothing at pkg/system/openssl.go:126 -- while `make gosec`
      # on the pinned gosec v2.29.0 reports it HIGH/HIGH. Reproduced on a
      # two-file probe, not inferred from version numbers, and since confirmed
      # in the analyser's own source: v2.29.0's pathtraversal.go drops Clean,
      # Abs and url.PathEscape from its sanitizer list, noting that Clean
      # "evaluates '..' elements instead of rejecting them, so the traversal
      # succeeds" (securego/gosec#1721). Across the two directories that decide
      # what gets reported -- rules/ and analyzers/ -- it is the ONLY
      # behavioural difference between the versions: three files differ, and
      # the other two (rules/rsa.go, analyzers/util.go) change `(int64)(x)` to
      # `int64(x)` and nothing else.
      #
      # An exclusion that fires on nothing is worse than an unexamined one: it
      # reads as "the lint gate considered path traversal and cleared it" and
      # nothing you can run will tell you otherwise. So it is deleted rather
      # than rescoped, and the one real site carries an inline `#nosec G703`
      # that both scanners honour. G703 is now ARMED across this entire
      # repository on this leg, and stays armed when the bundled gosec moves.
      #
      # WHY THE TWO SCANNERS DISAGREED ABOUT THIS TREE, settled by measurement
      # (#295). The disagreement recorded here was 49 G304 + 1 G703 under gosec
      # v2.29.0 against 18 G304 + 0 G703 on this leg, and only the G703 column
      # was ever a VERSION difference. The rest was invocation:
      #
      #   - `make gosec` passed its build tags space-joined into a flag gosec
      #     splits on commas, so that leg was scanning the UNTAGGED tree: 1044
      #     files where the same command with the tags spelled correctly scans
      #     1147. Fixed in the Makefile.
      #   - `make gosec` passes no -tests, and the analyzer rules build less of
      #     a package's SSA without the test variant, so it loses findings in
      #     PRODUCTION files that this leg reaches. STILL OFF, and #395 closed
      #     the question rather than the gap: gosec's -tests hands go/packages a
      #     file list, so an external `_test` package cannot see what an
      #     `export_test.go` exports, and the run exits 1 on loader errors with
      #     zero findings. pkg/seal and sdk/go both hit it. Measured in the
      #     Makefile above the `gosec` target; carried by #408.
      #
      # With the tags corrected and -tests supplied, gosec v2.29.0 reaches
      # exactly this leg's G304 and G602 sets. The residue is G703 and it is the
      # soundness difference above, not a count.
      #
      # THIS LEG DROPS gosec ENTIRELY IN `_test\.go` (see the test-file rule
      # under `exclusions.rules`), so it reports nothing there and is not the
      # authority on test files; arming it costs 295 findings, 237 of them G104
      # from the audit mode golangci-lint's gosec runs by default (measured
      # 2026-09-10). What #395 DID land is the other half of that: every finding
      # a `gosec -tests` run raises in a _test.go file is now fixed at the site
      # (39 directory and file modes tightened to 0750/0600) or carries an
      # inline `#nosec <RULE> -- reason` that BOTH scanner versions honour.
      #
      # EACH RULE BELOW IS LOAD-BEARING, measured 2026-09-10 by removing all six
      # and counting what came back: 18 findings, distributed as the per-entry
      # counts record. None of them is inert.
      - path: ^pkg/system/openssl\.go$
        text: "G304"
        linters:
          - gosec
        # 1 finding. parseOpenSSLConfig opens a path that findOpenSSLConfig
        # resolved from OPENSSL_CONF or a compiled-in standard location. G703 is
        # NOT listed here: its one site carries an inline `#nosec G703` with the
        # reasoning next to the code, which BOTH gosec and golangci-lint honour,
        # so the justification exists once and this file makes no claim about it.
      - path: ^pkg/clustertls/clustertls\.go$
        text: "G304"
        linters:
          - gosec
        # 9 findings. CA/cert/key PEM paths, all from TLS config or a
        # caller-owned data directory. No transport handler reaches these with a
        # request value.
      - path: ^pkg/database/(manager|reencrypt)\.go$
        text: "G304"
        linters:
          - gosec
        # 4 findings. Internal catalog paths: filepath.Join(dataDir,
        # "databases", name) for a name already validated by namePattern, plus
        # the re-encrypt copy which walks paths the manager produced.
      - path: ^pkg/audit/chain_file_logger\.go$
        text: "G304"
        linters:
          - gosec
        # 2 findings. Audit log and rotated-archive paths under the
        # operator-configured audit directory; scanFile/verifyChainFile only
        # ever receive names this logger itself emitted.
      - path: ^pkg/storage/file/iterator\.go$
        text: "G304"
        linters:
          - gosec
        # 1 finding. Reads back a path produced by filepath.Walk over the
        # engine's own directory, whose leaves encodeKeyToPath wrote.
      - path: ^pkg/vector/ivf/index\.go$
        text: "G304"
        linters:
          - gosec
        # 1 finding, and the one that reads as a version divergence but is not:
        # this file is behind `//go:build qrdb_vector`, so `make gosec` could
        # not see it at all while its -tags flag was mis-spelled. ivfIndex
        # Save/Load take an explicit path from the embedding caller. No
        # transport handler and no in-repository caller reaches them; see the PR
        # for the guard proposed if one is ever added.
      # Exclude deprecated grpc.DialContext warnings (still supported in 1.x)
      - text: "SA1019.*grpc\\.DialContext.*deprecated"
        linters:
          - staticcheck
      # Exclude S1017 should replace if with TrimPrefix (style preference)
      - text: "S1017.*TrimPrefix"
        linters:
          - staticcheck
      # Exclude QF1012 quickfix suggestions (style preference, not a bug)
      - text: "QF1012"
        linters:
          - staticcheck
      # QF1008 and QF1011 join QF1012 above on the same ground, and #333 --
      # which first put sdk/go under a linter at all -- is where they surfaced.
      # Both would make the code WORSE at every site in this tree:
      #
      #   QF1008 "could remove embedded field from selector" fires on
      #   dialector.Config.X where the line above it is `dialector.Config !=
      #   nil`. Dropping the field promotes X through the very pointer being
      #   nil-checked and hides the connection between the two lines.
      #
      #   QF1011 "could omit type from declaration" fires on
      #   `var svc service.XServicer = ctor()` whose address is then stored in
      #   an atomic.Pointer[service.XServicer]. The annotation states the
      #   pointer's element type at the site instead of sending the reader to
      #   the constructor.
      #
      # These are the "quickfix" tier: staticcheck's own suggestions tier, not
      # its correctness (SA) tier. Nothing here suppresses an SA check.
      - text: "QF1008"
        linters:
          - staticcheck
      - text: "QF1011"
        linters:
          - staticcheck
      # Exclude govet structtag warnings in test files with nolint
      - text: "structtag.*has json tag but is not exported"
        linters:
          - govet
      # Test files - exclude common linters that have many false positives
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
          - funlen
          - goconst
          - unused
          - unparam
          - staticcheck
          - gocritic
          - ineffassign
          - nilerr
          - noctx
          - thelper
          - unconvert
          - revive
          - errorlint
          - godot
      # Test helper files - exclude linters similar to test files
      - path: test_helpers\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unused
          - unparam
          - staticcheck
          - gocritic
          - ineffassign
          - nilerr
          - revive
      # Testable implementations for testing
      - path: testable\.go
        linters:
          - gocyclo
          - errcheck
          - gosec
          - goconst
          - unused
          - unparam
          - staticcheck
          - gocritic
          - ineffassign
          - nilerr
          - revive
      # Specific errcheck exclusions for common acceptable patterns
      - text: "Close` is not checked"
        linters:
          - errcheck
      - text: "\\.Set` is not checked"
        linters:
          - errcheck
      - text: "\\.Put` is not checked"
        linters:
          - errcheck
      - text: "\\.Update` is not checked"
        linters:
          - errcheck
      - text: "Shutdown` is not checked"
        linters:
          - errcheck
      - text: "viper\\.BindEnv` is not checked"
        linters:
          - errcheck
      - text: "MarkFlagRequired` is not checked"
        linters:
          - errcheck
      - text: "\\.ReadFrom` is not checked"
        linters:
          - errcheck
      - text: "\\.Rollback` is not checked"
        linters:
          - errcheck
      - text: "\\.Delete` is not checked"
        linters:
          - errcheck
      - text: "\\.Store` is not checked"
        linters:
          - errcheck
      - text: "\\.Load` is not checked"
        linters:
          - errcheck
      - text: "\\.Write` is not checked"
        linters:
          - errcheck
      - text: "\\.Sync` is not checked"
        linters:
          - errcheck
      - text: "viper\\.BindPFlag` is not checked"
        linters:
          - errcheck
      - text: "\\.Encode` is not checked"
        linters:
          - errcheck
      - text: "rand\\.Read` is not checked"
        linters:
          - errcheck
      - text: "SetReadDeadline` is not checked"
        linters:
          - errcheck
      - text: "Sscanf` is not checked"
        linters:
          - errcheck
      - text: "IndexEntityWithType` is not checked"
        linters:
          - errcheck
      - text: "DeleteEntity` is not checked"
        linters:
          - errcheck
      - text: "FormatError` is not checked"
        linters:
          - errcheck
      - text: "UpdateUser` is not checked"
        linters:
          - errcheck
      # Exclude examples from most linters
      - path: examples/
        linters:
          - errcheck
          - forbidigo
          - goconst
          - gosec
          - revive
          - goprintffuncname
          - unused
          - unparam
          - gocritic
      # Exclude CLI commands from linters with acceptable patterns in CLI code
      - path: cmd/
        linters:
          - forbidigo
          - goconst
          - gosec
          - revive
          - goprintffuncname
      # Exclude REST API handlers from goconst (format strings and status values)
      - path: pkg/api/rest/
        linters:
          - goconst
      # Exclude auth bootstrap from goconst (default role names)
      - path: pkg/auth/bootstrap\.go
        linters:
          - goconst
      # Exclude KMS xkms backend from goconst (algorithm names)
      - path: pkg/kms/xkms_
        linters:
          - goconst
      # Exclude security package from goconst (algorithm names)
      - path: pkg/security/
        linters:
          - goconst
      # Exclude server health from goconst (health messages)
      - path: pkg/server/
        linters:
          - goconst
      # Exclude codec from goconst (format type names)
      - path: pkg/codec/
        linters:
          - goconst
      # Exclude operations from goconst (status strings)
      - path: pkg/operations/
        linters:
          - goconst
      # Exclude statemachine from goconst (operation names)
      - path: pkg/raft/statemachine/
        linters:
          - goconst
      # Exclude discovery from goconst (namespace strings)
      - path: pkg/discovery/
        linters:
          - goconst
      # Exclude service from goconst (default values)
      - path: pkg/service/
        linters:
          - goconst
      # Exclude logger from goconst (output type names)
      - path: pkg/logger/
        linters:
          - goconst
      # Exclude storage from goconst (status strings)
      - path: pkg/storage/
        linters:
          - goconst
      # Exclude test performance from forbidigo
      - path: test/performance/
        linters:
          - forbidigo
      # Exclude testutil from errcheck (type assertions on mock return values)
      - path: pkg/testutil/
        linters:
          - errcheck
      # Exclude FIPS informational output from forbidigo
      - path: pkg/fips/
        linters:
          - forbidigo

severity:
  default: warning
