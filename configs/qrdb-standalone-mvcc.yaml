# Standalone daemon, MVCC state machine.
#
# Run mode:      standalone (single-replica Raft group — quorum of one; see
#                docs/GLOSSARY.md "Single-node Raft")
# State machine: mvcc — REQUIRED for every MVCC feature: revisions,
#                `kv get --at-revision`, watch replay, transactions with
#                revision semantics, and `kv restore` (PITR-lite). The
#                default `pebble` SM is durable but revision-less.
# Storage:       pebble (production backend, encrypted at rest when the
#                seal barrier is enabled)

server:
  admin_port: 63002
  grpc_port: 63003
  host: "0.0.0.0"

protocols:
  rest: true
  grpc: true

raft:
  data_dir: "./data"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:63001"
  listen_address: "0.0.0.0:63001"
  peers: "1=127.0.0.1:63001"
  join: false
  sm_type: "mvcc"
  lease_read: true
  check_quorum: true

storage:
  backend: "pebble"

tls:
  enabled: true
  cert_file: ""
  key_file: ""
  client_auth: "require_and_verify"
  min_version: "TLS1.3"

logging:
  level: "info"
  format: "text"

discovery:
  method: "static"
