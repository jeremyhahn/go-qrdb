server:
  admin_port: 63002
  grpc_port: 63003
  host: "0.0.0.0"

protocols:
  rest: true
  grpc: true

raft:
  data_dir: "./data"
  deployment_id: 1
  shard_id: 1
  replica_id: 1
  raft_address: "127.0.0.1:63001"
  listen_address: "0.0.0.0:63001"
  peers: "1=127.0.0.1:63001"
  join: false
  snapshot_entries: 0
  compaction_overhead: 0
  max_in_mem_log_size: 0
  max_total_in_mem_log_size: 0
  sm_type: "pebble"
  lease_read: true
  check_quorum: true

storage:
  backend: "pebble"
  cache_size: 0
  wal_dir: ""
  max_open_files: 0

tls:
  enabled: true
  cert_file: ""
  key_file: ""
  client_auth: "require_and_verify"
  min_version: "TLS1.3"

logging:
  level: "info"
  format: "text"

discovery:
  method: "multicast"
  multicast_secret: "quicraft"
  dns_domain: ""
