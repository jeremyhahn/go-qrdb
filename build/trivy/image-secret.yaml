# Secret-scanner configuration for `make trivy-image` (--secret-config), and
# for nothing else: `make trivy` and `make trivy-report` scan the checkout and
# do not read it.
#
# It narrows the SECRET scanner only. The vulnerability scanner reads no part
# of this file, so every module in the image is still judged against the
# advisory database exactly as before.
#
# Trivy matches an allow rule's `path` against the file's path in the image,
# with a leading "/".
allow-rules:
  # /gomodcache is the Go module cache the Dockerfile's `modules` stage fills
  # with `go mod download` and checks with `go mod verify`: every byte of it is
  # a third-party module release, fixed by go.sum. Releases ship their own doc
  # comment examples and test fixtures -- a SAS-token example in
  # aws-sdk-go's datasync docs, a TLS test key in echo's _fixture/certs (run
  # 55673) -- and they are not secrets of this project: no credential of ours
  # can reach the module cache, which holds only what the module proxy served.
  # The checkout copied to /src stays in the secret scan.
  - id: go-module-cache
    description: Third-party Go module releases in the image's module cache, fixed by go.sum
    path: ^/?gomodcache/
