# go-qrdb CI image: one service per shipped stage of the Dockerfile
# beside this file (handbook devcontainer.md §3, §6).
#
#   integration  `make integration-test`: the integration suites, without -race, in
#                the integration image, which carries the source. The Makefile
#                builds that image (with the forge credentials as a BuildKit
#                secret), names it in QRDB_IT_IMAGE and runs this file
#                under its own project name, so two runs on one daemon never
#                share a container, network or volume.
#   toolchain    `make docker-run CMD='make lint'`: a command in the toolchain
#                image, as the invoking user, with the checkout bind-mounted.
#                For a workstation: on a CI runner the bind mount would resolve
#                on the daemon's host, so CI copies the checkout in instead
#                (scripts/in-toolchain-image.sh).
#
# SECURITY POSTURE (x-posture, both services):
#
#   cap_drop ALL, no cap_add: the suites bind loopback ports above 1024, write
#     only their own temp directories and need no privilege.
#   no-new-privileges: nothing can gain privilege through a setuid binary.
#   Docker's default seccomp and AppArmor profiles stay on.
#   user: never root, so no test passes only because root bypasses a check.
#   read_only: the root filesystem, the baked source and the module cache
#     cannot be written. Writable: /tmp and the build-cache volume.
#   /tmp (HOME, go's $WORK, the test binaries and every t.TempDir) is an
#     anonymous volume, on the daemon's disk as on a host, removed with the
#     container by `run --rm` and `down --volumes`. Not a tmpfs: a size-capped
#     one fills under a parallel cluster selection (run 54973, about 400 MB per
#     three-node cluster: each node preallocates a 64 MiB WAL segment), and its
#     pages count against mem_limit. Without nosuid and nodev, cap_drop ALL
#     still leaves no CAP_MKNOD to make a device node and no-new-privileges
#     still stops a setuid binary gaining privilege.
#   network_mode none: the clusters talk QUIC over loopback only, and the
#     modules are baked into the image with GOPROXY=off.
#   init: a real PID 1 reaps children and forwards signals.
#   pids_limit / mem_limit: bounds, so a runaway test cannot starve a shared
#     runner host. No cpus cap: the clusters are CPU-bound and their
#     election timeouts are tuned for an unthrottled host.
#
# ULIMITS:
#   memlock 64 MiB soft = hard: finite and the same on every daemon, so the
#     go-enclave locked memory the sealed replicas use has one ceiling
#     everywhere rather than the daemon's default.
#   core 1 MiB, non-zero: go-enclave lowers RLIMIT_CORE itself; a container
#     that started at 0 would hide whether it did.
#   nofile: explicit; a five-node cluster holds many sockets and WAL files.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 65536
      hard: 65536
  working_dir: /src

services:
  integration:
    <<: *posture
    image: ${QRDB_IT_IMAGE:-qrdb-it:local}
    pull_policy: never
    user: "10001:10001"
    volumes:
      - /tmp
      - gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      # Empty is Go's default, the container's CPU limit; the Makefile's
      # IT_GOMAXPROCS pins a count (#682 tuned the cluster suites on 8).
      GOMAXPROCS: ${QRDB_IT_GOMAXPROCS:-}
      HOME: /tmp

  toolchain:
    <<: *posture
    image: qrdb-toolchain:${QRDB_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${QRDB_UID:-10001}:${QRDB_GID:-10001}"
    volumes:
      - /tmp
      - ../../..:/src
      - toolchain-gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      HOME: /tmp

volumes:
  gocache:
  toolchain-gocache:
