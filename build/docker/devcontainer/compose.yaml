# go-qrdb CI image: one service per shipped stage of the Dockerfile beside this file.

x-posture: &posture
  init: true
  read_only: true
  network_mode: none
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 4096
  mem_limit: 8g
  memswap_limit: 8g
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 1048576
      hard: 1048576
    nofile:
      soft: 65536
      hard: 65536
  working_dir: /src

# The analyser pins this image bakes in.
x-go-scanner-pins: &go-scanner-pins
  GOLANGCI_LINT_VERSION:
  GOSEC_VERSION:
  GOVULNCHECK_VERSION:
  # Every service needs GO_IMAGE and TRIVY_IMAGE for the Dockerfile's global FROMs.
  GO_IMAGE:
  TRIVY_IMAGE:

# The gpu stage bakes no trivy, so TRIVY_VERSION is withheld from it.
x-scanner-pins: &scanner-pins
  <<: *go-scanner-pins
  TRIVY_VERSION:

# Optional dev-cache passthrough.
x-devcache-build-args: &devcache-build-args
  DEVCACHE_APT_PROXY: ${DEVCACHE_APT_PROXY:-}
  DEVCACHE_NPM_REGISTRY: ${DEVCACHE_NPM_REGISTRY:-}

# GOPRIVATE keeps first-party modules off any proxy.
x-devcache-env: &devcache-env
  - DEVCACHE_APT_PROXY=${DEVCACHE_APT_PROXY:-}
  - DEVCACHE_NPM_REGISTRY=${DEVCACHE_NPM_REGISTRY:-}
  - DEVCACHE_GOPROXY=${DEVCACHE_GOPROXY:-}
  - DEVCACHE_GOPRIVATE=${DEVCACHE_GOPRIVATE:-}
  - DEVCACHE_DOCKER_MIRROR=${DEVCACHE_DOCKER_MIRROR:-}
  - DEVCACHE_MCR_MIRROR=${DEVCACHE_MCR_MIRROR:-}
  - DEVCACHE_GHCR_MIRROR=${DEVCACHE_GHCR_MIRROR:-}
  - DEVCACHE_PLAYWRIGHT_HOST=${DEVCACHE_PLAYWRIGHT_HOST:-}
  - GOPROXY=${DEVCACHE_GOPROXY:+${DEVCACHE_GOPROXY}|}https://proxy.golang.org

# These services bind-mount the worktree over /workspace/go-qrdb.
services:
  integration:
    <<: *posture
    image: ${QRDB_IT_IMAGE:-qrdb-it:local}
    pull_policy: never
    user: "10001:10001"
    volumes:
      - /tmp
      - gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      # Empty is Go's default; the Makefile's IT_GOMAXPROCS pins a count.
      GOMAXPROCS: ${QRDB_IT_GOMAXPROCS:-}
      HOME: /tmp

  toolchain:
    <<: *posture
    image: qrdb-toolchain:${QRDB_TOOLCHAIN_TAG:-latest}
    pull_policy: never
    user: "${QRDB_UID:-10001}:${QRDB_GID:-10001}"
    volumes:
      - /tmp
      - ../../..:/src
      - toolchain-gocache:/gocache
    environment:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      GOPROXY: "off"
      HOME: /tmp

  devcontainer:
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: dev-deps
      args:
        <<: [*scanner-pins, *devcache-build-args]
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ../../..:/workspace/go-qrdb
      - ../../../../go-quicraft:/workspace/go-quicraft
      - ../../../../go-truststrap:/workspace/go-truststrap
      - ../../../../go-objstore:/workspace/go-objstore
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace/go-qrdb
    environment: *devcache-env
    # No runtime module credentials: dev-deps bakes the module cache into the image.
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1

  client-build:
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: dev-deps
      args:
        <<: [*scanner-pins, *devcache-build-args]
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ../../..:/workspace/go-qrdb
      - ../../../../go-quicraft:/workspace/go-quicraft
      - ../../../../go-truststrap:/workspace/go-truststrap
      - ../../../../go-objstore:/workspace/go-objstore
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace/go-qrdb
    environment:
      # Optional dev-cache passthrough.
      - DEVCACHE_APT_PROXY=${DEVCACHE_APT_PROXY:-}
      - DEVCACHE_NPM_REGISTRY=${DEVCACHE_NPM_REGISTRY:-}
      - DEVCACHE_GOPROXY=${DEVCACHE_GOPROXY:-}
      - DEVCACHE_GOPRIVATE=${DEVCACHE_GOPRIVATE:-}
      - DEVCACHE_DOCKER_MIRROR=${DEVCACHE_DOCKER_MIRROR:-}
      - DEVCACHE_MCR_MIRROR=${DEVCACHE_MCR_MIRROR:-}
      - DEVCACHE_GHCR_MIRROR=${DEVCACHE_GHCR_MIRROR:-}
      - DEVCACHE_PLAYWRIGHT_HOST=${DEVCACHE_PLAYWRIGHT_HOST:-}
      - GOPROXY=${DEVCACHE_GOPROXY:+${DEVCACHE_GOPROXY}|}https://proxy.golang.org
    command: ["make", "_build-client"]

  e2e:
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: dev-deps
      args:
        <<: [*scanner-pins, *devcache-build-args]
      secrets:
        - gomodauth
    image: go-qrdb-e2e:latest
    volumes:
      - ../../..:/workspace/go-qrdb
      - ../../../../go-quicraft:/workspace/go-quicraft
      - ../../../../go-truststrap:/workspace/go-truststrap
      - ../../../../go-objstore:/workspace/go-objstore
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace/go-qrdb
    environment:
      - CI=true
      # Optional dev-cache passthrough.
      - DEVCACHE_APT_PROXY=${DEVCACHE_APT_PROXY:-}
      - DEVCACHE_NPM_REGISTRY=${DEVCACHE_NPM_REGISTRY:-}
      - DEVCACHE_GOPROXY=${DEVCACHE_GOPROXY:-}
      - DEVCACHE_GOPRIVATE=${DEVCACHE_GOPRIVATE:-}
      - DEVCACHE_DOCKER_MIRROR=${DEVCACHE_DOCKER_MIRROR:-}
      - DEVCACHE_MCR_MIRROR=${DEVCACHE_MCR_MIRROR:-}
      - DEVCACHE_GHCR_MIRROR=${DEVCACHE_GHCR_MIRROR:-}
      - DEVCACHE_PLAYWRIGHT_HOST=${DEVCACHE_PLAYWRIGHT_HOST:-}
      - GOPROXY=${DEVCACHE_GOPROXY:+${DEVCACHE_GOPROXY}|}https://proxy.golang.org
    command: ["make", "_test-e2e"]
    # The e2e suite starts qrdbd; same locked-memory caps as devcontainer.
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1

  devcontainer-gpu:
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: gpu
      args: *go-scanner-pins
      secrets:
        - gomodauth
    image: go-qrdb-gpu-dev:latest
    volumes:
      - ../../..:/workspace/go-qrdb
      - ../../../../go-quicraft:/workspace/go-quicraft
      - ../../../../go-truststrap:/workspace/go-truststrap
      - ../../../../go-objstore:/workspace/go-objstore
    working_dir: /workspace/go-qrdb
    # qrdbd mlocks its protected memory.
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  benchmark:
    build:
      context: ../../..
      dockerfile: build/docker/devcontainer/Dockerfile
      target: dev-deps
      args:
        <<: [*scanner-pins, *devcache-build-args]
      secrets:
        - gomodauth
    image: go-qrdb-dev:latest
    volumes:
      - ../../..:/workspace/go-qrdb
      - ../../../../go-quicraft:/workspace/go-quicraft
      - ../../../../go-truststrap:/workspace/go-truststrap
      - ../../../../go-objstore:/workspace/go-objstore
      - go-build-cache:/root/.cache/go-build
    working_dir: /workspace/go-qrdb
    environment: *devcache-env
    # Module credentials for go test at run time; qrdbd mlocks its protected memory.
    cap_add:
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1

# The BuildKit secret that carries module credentials into `go mod download`.
secrets:
  gomodauth:
    environment: GOMODAUTH

# go-build-cache backs the dev-deps services' /root/.cache/go-build.
volumes:
  gocache:
  toolchain-gocache:
  go-build-cache:
