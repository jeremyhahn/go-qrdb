# claude-review: v1.1 — DISABLED at the trigger (owner ruling 2026-08-24:
# Codex is the sole designated peer reviewer; codex-review.yml reviews every
# PR). This workflow is kept, not deleted, so it can be re-enabled by restoring
# the `pull_request` trigger if Claude peer review is ever wanted again.
#
# DO NOT disable this with `if: false` on the job — actionlint rejects a
# constant expression in a job condition ("constant expression in condition
# [if-cond]") and fails the workflow-lint step in any repo that lints workflows
# (measured: go-netmon run 6512, go-sysmon run 6520, 2026-08-25). Disable at the
# TRIGGER instead, as below: no `pull_request` trigger means the job never fires,
# with no constant condition anywhere.
#
# `runs-on: claude` is restricted: only this workflow may use it — the label
# mounts the live Claude session credential. Gitea-only. Source of truth:
# software/templates/github-actions/ in the company repo.
name: Claude Review

on:
  # Manual dispatch only — the pull_request trigger is intentionally absent so
  # this review does not run automatically. Restore it here to re-enable.
  workflow_dispatch:

jobs:
  review:
    name: Claude Review
    # Guard the credential-mounting job off github.com regardless of trigger.
    if: github.server_url != 'https://github.com'
    runs-on: claude
    timeout-minutes: 40
    env:
      REPO: ${{ github.event.repository.name }}
      PR_NUM: ${{ github.event.pull_request.number }}
      GITEA_CLAUDE_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
    steps:
      - name: Run Claude review
        run: /opt/claude-worker/claude-review.sh
