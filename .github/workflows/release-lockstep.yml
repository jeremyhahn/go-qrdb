name: Release Lockstep

# release-versioning.md P2: the nested sdk/go module is tagged in lockstep with
# the root module. A root vX.Y.Z tag published without sdk/go/vX.Y.Z leaves the
# two modules' latest versions mutually unbuildable for every consumer that
# takes both at latest (go-qrdb#6).
#
# This workflow DETECTS a skewed release; it does not prevent one. Gitea accepts
# a tag push and exposes the ref before any workflow starts, so by the time the
# tag leg runs, `go get` can already resolve the skew. What it buys is latency:
# the report lands within a minute of publication instead of days later in a
# downstream consumer's dependency bump, which is how go-qrdb#6 surfaced and
# what it cost. Prevention needs a server-side pre-receive policy, or a rule
# that only a release workflow may create version tags — release policy and
# infrastructure this repository does not own. Filed as go-qrdb#13.
#
# Its own workflow rather than a job in ci.yml, because it is the only check
# that has to run on a version-tag push, and putting that trigger on ci.yml
# would run the whole suite — build, race tests, the compose integration stack —
# a second time for every release.
#
# Until go-qrdb#13 is decided, the preventive step is local and manual:
#
#     make check-tag-lockstep && git push --atomic origin vX.Y.Z sdk/go/vX.Y.Z
#
# --atomic is load bearing and not a synonym for listing both refs: it makes the
# server apply both ref updates or neither. Without it a push of two refs can be
# accepted in part, publishing the skew, and nothing downstream can retract a
# tag consumers have already resolved.
#
# The main and pull_request legs re-audit the whole published tag set, so an
# out-of-band tag change — a tag deleted, moved, or pushed with the workflow
# disabled — still surfaces on the next merge.
on:
  push:
    branches: [main]
    tags: ["v*"]                        # root tags only; sdk/go/v* never matches
  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

permissions:
  contents: read

jobs:
  lockstep:
    name: Root and sdk/go tags in lockstep
    runs-on: ubuntu-latest
    steps:
      # The check reads this clone's tags and the default checkout fetches none
      # of them. A tagless clone is the vacuous-green failure mode, so the full
      # history is fetched here and the script refuses to run without tags.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The rejection branches cannot be exercised against this repository's own
      # tag set, which is permanently valid — the fixtures cover them, and they
      # run first so a broken check cannot pass the audit by never failing.
      - name: Lockstep check fixtures
        run: make test-tag-lockstep

      - name: Audit published tags
        run: make check-tag-lockstep
