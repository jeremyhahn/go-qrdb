name: Release Lockstep

# The nested modules are tagged in lockstep with the root module.
on:
  push:
    branches: [main]
    # Every release-tag namespace.
    tags: ["v*", "sdk/go/v*", "sdk/**/v*"]

  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

# One group per ref; a newer PR run cancels the older, a push to main never cancels a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lockstep:
    name: Root and sdk/go tags in lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The check reads this clone's tags, which the default checkout does not fetch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The fixtures exercise the rejection branches first.
      - name: Lockstep check fixtures
        run: make test-tag-lockstep

      - name: Audit published tags
        run: make check-tag-lockstep

      # Fixtures for the VERSION, CHANGELOG and tag reconciliation.
      - name: Version reconciliation fixtures
        run: make test-version-reconciled

      # RELEASE_TAG is set only on the tag leg.
      - name: Reconcile VERSION, CHANGELOG and tag
        run: make check-version-reconciled RELEASE_TAG="${RELEASE_TAG}"
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
