# deps-bump-template: v1.0.0 — the dependency bump PR (ruling 640).
# v1.0.0 (2026-11-14, ruling 640, owner decision 222 (a)): ci-template v1.39's
# deps-check fails a library behind its latest release only when a change
# adds or bumps it, so a lag nobody touches no longer reddens a PR. This
# workflow carries those lags instead. On workflow_dispatch (go-qrdb allows
# no scheduler but ci.yml's nightly, rulings 135, 216(1) and 633: ci.yml's
# deps-bump-dispatch job dispatches it from the nightly schedule run on
# main, and a person may dispatch it by hand), it runs the shared depscheck's `make deps-bump` in the
# toolchain image,
# verifies with `make deps-check DEPS_CHECK_BASE=HEAD` (every vulnerability
# check, and the lag rule on the requirements the bump moved: HEAD is the
# pre-bump commit, so a requirement the bump skipped, because upgrading it
# would raise a documented hold, stays behind without failing the run and
# discarding the independent upgrades) and `make build-server
# build-cli-headless` (the native targets CI's build job runs in the image;
# the plain build target needs docker compose through build-client),
# and lands the go.mod and go.sum changes as ONE commit on the fixed branch
# ci/deps-bump, with ONE pull request into main labelled `code-review` and
# `task:ready`, so the normal review and auto-merge land it.
#
#   - The commit is made by the GraphQL createCommitOnBranch mutation with
#     GITHUB_TOKEN, on the expected head (expectedHeadOid), so GitHub signs
#     it as a verified `web-flow` commit for the Signatures check; the job
#     checks verification.verified before it opens the PR. (A commit POSTed
#     to the git data API is unsigned and the Signatures check rejects it.)
#   - With an open PR on the branch, the job first calls
#     PUT pulls/N/update-branch and builds on the PR's new tip; only a 422
#     "already up to date" counts as current, any other failure or a head
#     that never moves fails the job, and the tip must contain main
#     (git merge-base --is-ancestor) before anything is built. It never
#     force-updates a ref: a ref update is a fast-forward, and a branch left
#     behind by an unmerged closed PR fails the job, for a person to close.
#     A branch whose tip is the head of the last merged PR, or already in
#     main, is deleted and re-created from main, which loses nothing; any
#     other tip is kept and fails the job.
#   - A govulncheck finding on the standard library, the toolchain or an
#     indirect-only module is reported, not failed, by deps-check, so it does
#     not stop the verify: the portfolio-wide toolchain pass carries stdlib.
#   - A PR or push made with GITHUB_TOKEN starts no pull_request run, so the
#     job dispatches ci.yml on ci/deps-bump; ci-template v1.39 runs that
#     dispatch as the PR tier and its CI Gate check attaches to the head.
#   - OPEN OWNER QUESTION: code-review.yml runs on pull_request_target, which
#     a GITHUB_TOKEN PR or label change does not start either, so the review
#     does not begin on its own. code-review.yml is unchanged here; until the
#     owner rules, a person or agent with its own token re-applies the
#     `code-review` label to start it.
#
# GitHub only (the REST and GraphQL calls are GitHub's). Copy to
# .github/workflows/deps-bump.yml. The Makefile needs `deps-bump`, `deps-check`
# and `build` (handbook templates/deps/depscheck/README.md).

name: Deps Bump

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

# One bump at a time per repository; a newer run waits, never cancels one
# halfway through its ref update.
concurrency:
  group: deps-bump-${{ github.repository }}
  cancel-in-progress: false

env:
  BRANCH: ci/deps-bump
  PR_TITLE: 'deps: bump dependencies to latest (ruling 640)'

jobs:
  bump:
    name: Deps bump
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: pr
      CI_IMAGE_NAMESPACE: ${{ vars.CI_IMAGE_NAMESPACE }}
    steps:
      # The commit to build on: the open PR's tip after update-branch, or
      # main's tip when there is no open PR.
      - name: Find the base commit
        id: base
        run: |
          set -euo pipefail
          owner=${REPO%%/*}
          pr=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$BRANCH&base=main" --jq '.[0].number // empty')
          # main as the branch is brought up to it: the next step proves
          # the commit it builds on contains it.
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ -n "$pr" ]; then
            head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            # 202 starts the merge of main into the branch: wait for the
            # head to move. A 422 saying the branch is already up to date
            # leaves it as it is. Anything else, or a head that never
            # moves, stops the job rather than bump a stale branch.
            if out=$(gh api -X PUT "repos/$REPO/pulls/$pr/update-branch" -f expected_head_sha="$head" 2>&1); then
              moved=
              for _ in $(seq 1 24); do
                read -r -t 5 < /dev/zero || true
                now=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
                if [ "$now" != "$head" ]; then moved=1; break; fi
              done
              if [ -z "$moved" ]; then
                echo "::error::update-branch on #$pr was accepted but its head is still $head after 120 s"
                exit 1
              fi
            else
              case $out in
                *"HTTP 422"*) up=$(grep -ci 'already up.to.date' <<<"$out" || true) ;;
                *) up=0 ;;
              esac
              if [ "$up" = 0 ]; then
                printf '%s\n' "$out" >&2
                echo "::error::update-branch on #$pr failed; the branch cannot be brought up to main"
                exit 1
              fi
              echo "#$pr is already up to date with main"
            fi
            sha=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            echo "open PR #$pr on $BRANCH; building on its tip $sha"
          else
            sha=$main
            if tip=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null); then
              # Delete the branch only when its CURRENT tip is proven merged:
              # the most recently merged bump PR's head is the tip, or the
              # tip is already in main (compare status behind or identical).
              # A merged_at on some older PR proves nothing about commits
              # pushed to the branch after that PR landed.
              merged_head=$(gh api "repos/$REPO/pulls?state=closed&head=$owner:$BRANCH&base=main&sort=updated&direction=desc&per_page=100" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty')
              status=$(gh api "repos/$REPO/compare/main...$tip" --jq .status 2>/dev/null || true)
              if [ "$merged_head" != "$tip" ] && [ "$status" != behind ] && [ "$status" != identical ]; then
                echo "::error::$BRANCH tip $tip is not the head of a merged PR (last merged head: ${merged_head:-none}) and not in main (compare: ${status:-unknown}); refusing to delete it, close or delete it by hand (this job never force-updates a ref)"
                exit 1
              fi
              gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null
              echo "$BRANCH tip $tip was merged: deleted, re-created from main"
            fi
            echo "no open PR on $BRANCH; building on main $sha"
          fi
          {
            echo "pr=$pr"
            echo "sha=$sha"
            echo "main=$main"
          } >> "$GITHUB_OUTPUT"

      # Full history, so the next step can test ancestry.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.base.outputs.sha }}
          fetch-depth: 0

      # The bump must build on main: an update-branch that silently left
      # the branch behind would land stale requirements over newer ones.
      - name: Verify the base contains main
        env:
          MAIN_SHA: ${{ steps.base.outputs.main }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "::error::$(git rev-parse HEAD) does not contain origin/main $MAIN_SHA; the branch was not brought up to main"
            exit 1
          fi
          echo "base $(git rev-parse HEAD) contains origin/main $MAIN_SHA"

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # in-toolchain-image.sh runs on a copy of the checkout, so the bump,
      # the full deps-check and the build run in one container, their output
      # on stderr, and the go.mod and go.sum diff comes back on stdout. The
      # container's sh has no pipefail, so the diff goes to a file and its
      # own status fails the step: a failed diff piped to base64 would come
      # back empty and pass as "nothing moved". deps-check runs against
      # HEAD, the commit before the bump: the bump edits only the work tree,
      # so a requirement it skipped for a hold is untouched and does not
      # fail the run, while every vulnerability check still does.
      - name: make deps-bump, then make deps-check and make build-server build-cli-headless
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # expands in the container
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            '{ make deps-bump && make deps-check DEPS_CHECK_BASE=HEAD && make build-server build-cli-headless; } >&2 && patch=$(mktemp) && git -c safe.directory="*" diff --binary -- ":(glob)**/go.mod" ":(glob)**/go.sum" > "$patch" && base64 -w0 "$patch"' \
            > "$RUNNER_TEMP/bump.b64"
          base64 -d "$RUNNER_TEMP/bump.b64" > "$RUNNER_TEMP/bump.patch"
          if [ ! -s "$RUNNER_TEMP/bump.patch" ]; then
            echo "deps-bump: nothing moved"
            echo "CHANGED=" >> "$GITHUB_ENV"
            exit 0
          fi
          git apply --index "$RUNNER_TEMP/bump.patch"
          git diff --cached --stat
          echo "CHANGED=$(git diff --cached --name-only | tr '\n' ' ')" >> "$GITHUB_ENV"

      # One commit made by GraphQL createCommitOnBranch: GitHub signs it as a
      # verified web-flow commit (CI's Signatures job rejects the unsigned
      # commit POST /git/commits makes). expectedHeadOid is the commit the
      # bump was built on, so a branch that moved meanwhile refuses the
      # commit. A missing branch is first created at that commit, and
      # deleted again if the mutation or the verification check fails (an
      # EXIT trap covers every command), so no PR-less branch is left.
      - name: Commit to ci/deps-bump
        if: ${{ env.CHANGED != '' }}
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # One JSON object per line, read back with --slurpfile: a go.sum in
          # base64 can pass the 128 KiB limit on a single argv string.
          add="$RUNNER_TEMP/bump-add.jsonl"
          del="$RUNNER_TEMP/bump-del.jsonl"
          : > "$add"
          : > "$del"
          for f in $CHANGED; do
            if [ -f "$f" ]; then
              base64 -w0 "$f" | jq -Rsc --arg p "$f" '{path: $p, contents: .}' >> "$add"
            else
              jq -nc --arg p "$f" '{path: $p}' >> "$del"
            fi
          done
          created=
          # Any failure from here on (set -e included) deletes a branch this
          # run created, so no PR-less ci/deps-bump strands the next daily run.
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ -n "$created" ]; then gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true; fi' EXIT
          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api "repos/$REPO/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
            created=1
            # The PR step deletes a branch only this run created, should its
            # PR create fail.
            echo "BUMP_BRANCH_CREATED=1" >> "$GITHUB_ENV"
          fi
          stat=$(git diff --cached --stat)
          # shellcheck disable=SC2016 # $in is a GraphQL variable
          query='mutation($in: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $in) { commit { oid } } }'
          if ! commit=$(jq -n --arg q "$query" --arg r "$REPO" --arg b "$BRANCH" --arg h "$BASE_SHA" \
                --arg s "$stat" --slurpfile add "$add" --slurpfile del "$del" \
                '{query: $q, variables: {in: {branch: {repositoryNameWithOwner: $r, branchName: $b}, expectedHeadOid: $h, message: {headline: "deps: bump dependencies to latest (ruling 640)", body: $s}, fileChanges: {additions: $add, deletions: $del}}}}' \
              | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid // empty') || [ -z "$commit" ]; then
            echo "::error::createCommitOnBranch on $BRANCH (expected head $BASE_SHA) made no commit"
            exit 1
          fi
          # Verification can lag the commit: look it up to 3 times, and treat
          # a failed lookup like an unverified commit (the EXIT trap cleans up).
          verified=
          for attempt in 1 2 3; do
            if verified=$(gh api "repos/$REPO/commits/$commit" --jq .commit.verification.verified) && [ "$verified" = true ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          if [ "$verified" != true ]; then
            echo "::error::$commit on $BRANCH is not a verified (signed) commit; CI's Signatures job would reject it"
            exit 1
          fi
          echo "deps-bump: signed $commit on $BRANCH"

      - name: Open the PR and label it
        id: pr
        if: ${{ env.CHANGED != '' || steps.base.outputs.pr != '' }}
        env:
          PR: ${{ steps.base.outputs.pr }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            # shellcheck disable=SC2016 # backquotes are markdown, not a command
            body=$(printf '%s\n\n%s\n' \
              'The daily dependency bump (deps-bump.yml, ruling 640): every go.mod requirement behind its latest release, with no reason comment and past the 7-day window, moved to latest unless the move would raise a documented hold, then `make deps-check DEPS_CHECK_BASE=HEAD` (against the pre-bump commit) and `make build-server build-cli-headless` passed.' \
              "Changed: $CHANGED")
            if PR=$(jq -n --arg t "$PR_TITLE" --arg h "$BRANCH" --arg b "$body" '{title: $t, head: $h, base: "main", body: $b}' | gh api "repos/$REPO/pulls" --input - --jq .number); then
              echo "opened #$PR"
            else
              # A failed PR create would leave a branch with no open PR, which
              # the base step refuses on every later run. Take a PR that does
              # exist for the branch; else delete the branch only if this run
              # created it, so the next daily run starts from main. Never
              # delete a branch this run did not create, never force a ref.
              owner=${REPO%%/*}
              PR=$(gh api "repos/$REPO/pulls?state=open&head=$owner:$BRANCH&base=main" --jq '.[0].number // empty' || true)
              if [ -z "$PR" ]; then
                if [ "${BUMP_BRANCH_CREATED:-}" = 1 ]; then
                  gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" >/dev/null || true
                fi
                echo "::error::opening the PR for $BRANCH failed and no open PR has it as head"
                exit 1
              fi
              echo "found #$PR"
            fi
          fi
          gh api "repos/$REPO/issues/$PR/labels" -f 'labels[]=code-review' -f 'labels[]=task:ready' >/dev/null
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push or PR starts no pull_request run.
      - name: Dispatch CI on ci/deps-bump
        if: ${{ steps.pr.outputs.number != '' }}
        run: gh api "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref="$BRANCH"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/bump.b64" "$RUNNER_TEMP/bump.patch" "$RUNNER_TEMP/bump-add.jsonl" "$RUNNER_TEMP/bump-del.jsonl"
