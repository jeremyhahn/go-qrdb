# Nightly: the long-horizon jobs, off the push path.

# Scheduled and manual runs only.

name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '45 4 * * *'

permissions:
  contents: read
  security-events: write

env:
  # Kept equal to ci.yml's Go version.
  GO_VERSION: "1.27.4"
  # Builds never resolve through a workspace.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # A fresh source-scoped scan is uploaded to code scanning on every run.
      - name: Trivy scan (SARIF for code scanning)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,cmd/qrdbd/data

      - name: Upload Trivy SARIF
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # The CLI is installed directly so the gate below runs the Makefile's pinned version.
      - name: Install Trivy CLI (pinned)
        run: |
          . scripts/tool-pins.sh
          v=$(make -s print-trivy-version)
          id=$(docker create "${TRIVY_IMAGE}")
          docker cp "${id}:/usr/local/bin/trivy" /usr/local/bin/trivy
          docker rm "${id}"
          ./scripts/check-trivy-version.sh /usr/local/bin/trivy "${v}"

      # The gate runs through the Makefile.
      - name: Trivy gate (fail on CRITICAL/HIGH)
        run: make trivy

      # The sub-threshold report.
      - name: Trivy sub-threshold report (MEDIUM/LOW; blocks no merge)
        run: make trivy-report

  # Reports the nightly verdict as a tracking issue.
  signal:
    name: Signal
    needs: [trivy]
    # Runs whether or not the watched jobs passed.
    if: always() && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Every watched job is listed explicitly and must match this file's jobs.
      - name: Open, update or close the tracking issue
        env:
          # The project's agent token.
          NIGHTLY_SIGNAL_TOKEN: ${{ secrets.AGENT_TOKEN }}
          RESULT_TRIVY: ${{ needs.trivy.result }}
        run: |
          set -euo pipefail

          # Fail closed, naming the secret.
          [ -n "${NIGHTLY_SIGNAL_TOKEN:-}" ] || {
            echo "::error::AGENT_TOKEN is not set on this repository."
            echo "::error::Without it the nightly's verdict reaches nobody, which is #478."
            exit 1; }

          go run ./test/tools/nightlysignal \
            -mode apply \
            -self signal \
            -job "trivy=Trivy=${RESULT_TRIVY}"
