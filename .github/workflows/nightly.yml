# Nightly — the known-red and long-horizon jobs, off the push path.
#
# Adopted from the company ci-template v1.9 (software/templates/github-actions/
# nightly.yml), owner ruling 2026-08-20: a job that is known-red with a tracked
# issue, or that verifies a slow-moving property, does NOT run per push. It
# produces information we already have, and it does it while holding a runner.
#
# The cost here was not theoretical. `fips` has `timeout-minutes: 90` and runs
# the RACE-enabled suite under GODEBUG=fips140=only, so it took ~50 minutes per
# pull request and then failed, exactly as its tracked issues say it will —
# while go-qrdb#60's one-line CI fix waited over an hour for a free runner
# behind it, on a run whose every gating job was already green (measured
# 2026-08-21, run 4401).
#
# Neither job gates anything. `fips` was already absent from ci-gate's `needs`
# for the reasons below; `trivy` was in it and is removed by this change, per
# go-qrdb#48.
#
# WHEN THEIR REASON FOR BEING HERE ENDS, moving a job back to ci.yml is a
# deliberate act, not an automatic one: add it to ci.yml, add it to ci-gate's
# `needs`, and add a `check` call to the gate loop. A job that can pass and is
# not required is a fail-open gate, and `fips` and `trivy` are now BOTH in
# exactly that state — a cost being carried deliberately, with a stated
# condition for ending it, rather than an oversight. Read the per-job notes
# below for what each is waiting on; they are not waiting on the same thing,
# and `signal` is waiting on nothing because it is not that kind of job: it
# reports this workflow's verdict and is never a candidate for ci.yml.
#
#   * fips — go-qrdb#18 and #20. This line read "two upstream findings keep it
#     red" until go-qrdb#523; both are closed, and on 2026-09-12 run 17302
#     became the FIRST green scheduled run on main in the workflow's retained
#     history — the twenty-two scheduled runs before it, back to 2026-08-22,
#     all failed. So it is no longer a known-red job and it stays here anyway,
#     on a DIFFERENT reason that is written down rather than assumed: arming it
#     waits on a stability record of fourteen consecutive green scheduled runs
#     on main, because one pass is not a track record and a required check that
#     is bypassed the first time it fails is worth less than no check. The
#     other half is shape: required checks gate pull requests, this is a
#     nightly, and its five green runs took 17m54s to 34m57s — a required check
#     is paid at the worst of those on EVERY push. The reasoning, the numbers
#     and the four moves that arm it are in docs/seal/fips140-mode.md
#     §"Arming the gate", which is the authority; this comment is a pointer.
#     What is forbidden meanwhile is unchanged and now matters more, because a
#     green job is easier to keep green dishonestly than a red one: no setting
#     it back to fips140=on, no continue-on-error, no tag-gating a failing
#     package out, no trimming the package list.
#   * trivy — go-qrdb#48, and the reason is the PHASE, not a known-red job.
#     This line read "go-qrdb#42" until #451; #42 is the golangci-lint panic
#     that reddened Lint, closed long ago, and it never had anything to do with
#     trivy. The governing rule is devops.md §8a: while a repo is alpha and
#     nothing is published to the github.com mirror, `trivy fs` runs here and
#     does not block a merge; from the first published release it moves into
#     ci.yml and into ci-gate's `needs`. The cost is stated there and is real —
#     a CVE published today surfaces at the next nightly rather than at the
#     push that introduces it, which is how #451's grpc advisory sat in three
#     go.mod files while every pull request stayed green.

name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Kept in lockstep with ci.yml, including the reason: Go 1.27.0 is forced by
  # go-enclave v0.5.0-alpha's `go` directive through go-quicraft v0.11.0-alpha
  # (#540). setup-go 'stable' is prohibited as a spec.
  GO_VERSION: "1.27.0"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  fips:
    name: FIPS 140-3
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone, and build health is ci.yml's job.
    # In ci.yml this staged behind build so a broken tree did not burn the slot,
    # and it deliberately did NOT stage behind lint (#143): a linter tooling
    # outage must never stop tests from EXECUTING. Neither concern survives the
    # move, because there is nothing here to stage behind.
    #
    # timeout-minutes stays at 90 rather than the template's 30: this job runs
    # the RACE-enabled suite under fips140=only, which is what takes the time.
    # Unattended and gating nothing, a generous ceiling costs nothing; on the
    # push path it cost a runner slot per pull request, which is why it moved.
    timeout-minutes: 90
    # GOFIPS140 selects the Go Cryptographic Module at BUILD time; GODEBUG
    # selects the enforcement level at RUN time, and both are needed.
    #
    # "only" rather than "on": "on" loads the module but still PERMITS
    # non-approved algorithms, so a regulated path using MD5, SHA-1 or GCM with
    # a caller-chosen IV passes silently and the gate reports green on exactly
    # the thing it exists to catch. "only" makes those operations error or
    # panic. Ratified by the owner 2026-08-17; see automatethethings
    # software/conventions/configuration.md §5 and docs/seal/fips140-mode.md.
    #
    # If this job goes red, the failure IS the finding: something on a tested
    # path is using non-approved cryptography. Fix the call site, or -- when an
    # external format mandates the primitive -- isolate it and record a cited
    # exemption in docs/seal/fips140-mode.md. Do NOT set this back to "on", add
    # a build tag that skips the job, or narrow the package list.
    #
    # It is GREEN as of 2026-09-12 and still deliberately not part of ci-gate
    # -- this line said "It IS red today, on three tracked findings" until
    # go-qrdb#523, and all three are closed. What keeps it out is now the
    # stability record in the header comment, not a finding.
    #
    # The sentence that does NOT change with the colour: nothing in this
    # repository claims the module operates under fips140=only until this job
    # passes AND joins ci-gate. It passes. It has not joined. A measurement is
    # not an enforceable property, and the gap between the two is exactly what
    # docs/seal/fips140-mode.md §"Arming the gate" is carrying deliberately.
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # GODEBUG is a runtime setting and cannot fail a compile, but building
      # against the module first keeps a genuine build break from being
      # reported as a test failure.
      - name: Build all packages against the FIPS module
        run: go build ./...

      # The same target the Test job runs, with the same build tags. The scope
      # is deliberately identical: a FIPS job over a subset of the suite
      # cannot tell you the product is FIPS-clean.
      #
      # GOTEST_TIMEOUT is go test's PER-PACKAGE budget and is raised only here.
      # FIPS mode swaps the KDF from Argon2id to PBKDF2-HMAC-SHA256 at 600,000
      # iterations, which measured 2.6x on pkg/seal; against a runner already
      # ~4x slower than a development box that leaves no margin under 30m, and
      # on 2026-08-26 pkg/seal was killed at exactly 30m having already passed
      # 17,787 tests (go-qrdb#147). The job ceiling above is 90 minutes, so a
      # 60m package budget still cannot outlive the job.
      #
      # This raises a runaway guard. It does not skip a package, weaken an
      # assertion, or narrow the scope -- all of which are forbidden here for
      # the reasons in the header comment.
      #
      # pipefail matters: without it tee's exit status hides a failing suite.
      - name: Unit tests (race, FIPS 140-only)
        run: |
          set -o pipefail
          make test GOTEST_TIMEOUT=60m 2>&1 | tee fips-test.log

      # `sdk/go` IS A SEPARATE GO MODULE (#142). `make test` is
      # `./pkg/... ./cmd/...`, so it has never reached one line of the SDK, and
      # this job had silently become the "FIPS job over a subset of the suite"
      # its own comment above rules out. go-qrdb#132 added `make test-sdk` to
      # ci.yml so the gate covers both modules; this job was not updated and the
      # two scopes diverged. The uncovered surface was the whole SDK — every
      # transport, sdk/go/node, the driver, the DAO layer and the conformance
      # matrix (go-qrdb#121). It is covered now, and MEASURED: 18 packages, 0
      # failures, 0 rejections of any class, run 17302 on 2026-09-12. This line
      # said "still unknown" until go-qrdb#523.
      #
      # `if: always()` IS LOAD-BEARING AND IS NOT BOILERPLATE. It is what got
      # that first SDK number at all: the root module was known-red (#18, #20)
      # for the whole of the period this step was added in, so a plain
      # sequential step would never have executed — the root suite fails, the
      # job stops, and sdk/go stays exactly as unexercised as it was, satisfying
      # the words of #142 while delivering none of it. KEEP IT NOW THAT BOTH
      # ARE GREEN. Its value is unchanged and only becomes visible again at the
      # next root-module regression, which is precisely when removing it would
      # cost a measurement. Both suites run; either failing fails the job.
      #
      # Its own log file, because the reporting step below parses these by
      # package and a single file could not say which module a `FAIL` came from
      # when both modules define a package of the same name.
      #
      # Same GOTEST_TIMEOUT=60m as the root suite, for the same reason and with
      # more force: sdk/go/node boots real nodes including raft groups, whose
      # leader election alone costs ~2.4s per shard under -race before FIPS
      # swaps the KDF to PBKDF2-HMAC-SHA256 at 600,000 iterations. Budget for
      # it: the job ceiling is 90 minutes and the root suite already takes ~50.
      # If the pair does not fit, the answer is to raise the ceiling — NOT to
      # trim a package list, which the header comment forbids for exactly the
      # reason this step exists.
      - name: Unit tests (race, FIPS 140-only, sdk/go module)
        if: always()
        run: |
          set -o pipefail
          make test-sdk GOTEST_TIMEOUT=60m 2>&1 | tee fips-test-sdk.log

      # A per-package timeout panic names whichever test was running when the
      # alarm fired, NOT the test that consumed the budget -- on 2026-08-26 it
      # accused a 3-second test while two tests holding 948s of the 1800s had
      # already finished and were named nowhere. Anyone reading the panic alone
      # is sent to the wrong file. This step is the antidote, and it runs on
      # success too so the trend is visible before the cliff is reached.
      #
      # It reports BOTH modules since #142. A missing log is reported rather
      # than passed over in silence: with two suites, "fips-test-sdk.log is
      # absent" means the sdk step never ran, which is precisely the condition
      # #142 exists to make visible and would otherwise look identical to a
      # clean sdk run in a log nobody reads to the end.
      - name: Package results and slowest tests
        if: always()
        run: |
          report() { # report <label> <logfile>
            label="$1"
            log="$2"
            echo "######## ${label} ########"
            if [ ! -f "$log" ]; then
              echo "no ${log}: this suite never started -- see the step above" >&2
              echo
              return 0
            fi
            # Captured into variables rather than piped straight to stdout so
            # the "nothing parsed" case can actually be reported. A `grep ...
            # | sort || echo fallback` cannot do that: the pipeline's status is
            # sort's, which is 0 on empty input, so the fallback is unreachable.
            pkgs=$(grep -aE '^(ok|FAIL|\?)[[:space:]]+github\.com/jeremyhahn/go-qrdb/' \
              "$log" | sort -u || true)
            slow=$(grep -aoE '^--- (PASS|FAIL): [A-Za-z0-9_/]+ \([0-9.]+s\)' "$log" \
              | sed -E 's/^--- (PASS|FAIL): ([A-Za-z0-9_/]+) \(([0-9.]+)s\)/\3 \1 \2/' \
              | sort -rn | head -25 || true)

            echo "== package results =="
            if [ -n "$pkgs" ]; then
              echo "$pkgs"
              echo "-- counts: $(printf '%s\n' "$pkgs" | grep -c '^ok') ok, $(printf '%s\n' "$pkgs" | grep -c '^FAIL') FAIL"
            else
              echo "(no package result lines parsed -- the suite may have died before any package finished)"
            fi

            echo
            echo "== 25 slowest tests that COMPLETED =="
            echo "A timeout panic names the test holding the alarm, not the one"
            echo "that spent the budget. These are the candidates that did."
            if [ -n "$slow" ]; then
              echo "$slow"
            else
              echo "(no completed top-level tests parsed)"
            fi
            echo
          }

          report "root module (./pkg/... ./cmd/...)" fips-test.log
          report "sdk/go module" fips-test-sdk.log

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # GitHub leg: a fresh source-scoped scan is uploaded to code scanning on
      # every run so the dashboard never reflects a stale analysis. The gate
      # and the report are the two `make` steps further down, on both hosts.
      # test/ holds benchmark harnesses that ship in no release.
      #
      # trivy-action was `@master` here until #367 -- not a mutable TAG but a
      # moving BRANCH, re-resolved on every nightly, so this job ran whatever
      # aquasecurity had merged that day. Pinning a branch has to choose a
      # version, and the choice is the latest RELEASE (v0.36.0) rather than
      # master's head: a release tag is a reviewed artifact and it gives the
      # trailing comment something a human can bump against. Master's head at
      # the time of pinning was d2a0b607, ahead of v0.36.0; that difference is
      # the deliberate part of this change and not a transcription error.
      #
      # ONLY this SARIF scan and its upload are gated on
      # `github.server_url == 'https://github.com'`, so on this Gitea they do
      # not execute at all. The CLI gate (`make trivy`) and the report
      # (`make trivy-report`) below carry no host guard and run on BOTH hosts;
      # test/buildgates/trivy_severity_test.go fails if either acquires one.
      # Pinned regardless: an action that runs nowhere today is exactly the
      # one whose ref nobody notices moving.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,cmd/qrdbd/data

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # trivy-action's setup step cannot authenticate to github.com from a
      # Gitea runner, so the CLI is installed directly. NO `if:` — it is
      # installed on BOTH hosts now, because the gate below is one step for
      # both rather than two steps that have to be kept in step.
      #
      # Retried: raw.githubusercontent.com intermittently answers the Gitea
      # runner with transient HTTP errors (curl exit 22), which failed the
      # whole job on a fetch that succeeds seconds later. Backoff keeps one
      # network blip from reading as a security-gate failure.
      # PINNED to the Makefile's TRIVY_VERSION, matching ci.yml's blocking trivy
      # job (#479). This used to fetch install.sh from trivy's `main` branch
      # with no version argument, so it ran whatever trivy was newest that
      # night: a moving ref in a repository that SHA-pins every action because
      # refs move (#367), and a nightly verdict that could change with no change
      # to this tree.
      - name: Install Trivy CLI (pinned)
        run: |
          v=$(make -s print-trivy-version)
          for i in 1 2 3 4 5; do
            curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${v}/contrib/install.sh" \
              | sh -s -- -b /usr/local/bin "${v}" && exit 0
            echo "trivy install attempt $i failed; retrying in $((i*10))s"
            sleep $((i*10))
          done
          echo "trivy ${v} install failed after 5 attempts" >&2
          exit 1

      # ONE gate, on both hosts, through the Makefile (devops.md §4, #451).
      #
      # This was two steps guarded on `github.server_url` — a trivy-action leg
      # and a shell leg — each carrying its own copy of the scanner flags, and
      # a third copy lived in the Makefile as `make trivy`. The Makefile's own
      # comment claimed the skip-dirs list was "kept identical to the list in
      # .github/workflows/ci.yml", which had not been true since #48 moved the
      # job into this file: three command lines, one of them describing a
      # fourth that no longer existed.
      #
      # `make trivy` is the contract, so the gate calls it. What that buys
      # beyond removing the copies is the database-age guard it now carries: it
      # refreshes, refuses to certify anything with a database older than
      # TRIVY_DB_MAX_AGE_HOURS, and only then scans, with --skip-db-update so
      # the database checked is the database used. Before this, a green Trivy
      # job said a scan ran and nothing about what it knew.
      #
      # The SARIF step above deliberately stays on trivy-action: it uploads to
      # GitHub code scanning, is explicitly non-gating (exit-code: 0), and is
      # not the thing that decides this job.
      - name: Trivy gate (fail on CRITICAL/HIGH)
        run: make trivy

      # The sub-threshold report (#522). Everything below the gate's floor was
      # reported by NOTHING until this step existed, so a green Trivy job could
      # not distinguish "there are no MEDIUMs" from "nothing looked" — and two
      # real advisories sat under it for the whole of this repository's history,
      # surfacing only because someone widened the severity list by hand for an
      # unrelated demonstration.
      #
      # It is SECOND, and that ordering is the disambiguation. A step's
      # conclusion is what a reader of a red nightly sees first, and these two
      # mean very different things: the gate red is a CRITICAL/HIGH and blocks a
      # release; this red is a MEDIUM to disposition. Because the gate runs
      # first, a failure there skips this one entirely — so "gate green, report
      # red" is unambiguous from the step list, with no second job and no second
      # copy of the install-with-retry block above.
      #
      # It fails the step rather than printing at exit 0, and that is not a
      # gate: this job is not in `ci-gate`'s `needs` while the repo is alpha
      # (devops.md §8a), so nothing here blocks a merge. An exit-0 step in a
      # nightly is indistinguishable from no step at all, which is the state
      # #522 is about; a signal that can transition to red is the only kind
      # anyone reads (#478). What is dispositioned how is written on the target
      # in the Makefile.
      - name: Trivy sub-threshold report (MEDIUM/LOW; blocks no merge)
        run: make trivy-report

  # ==========================================================================
  # THE VERDICT HAS TO REACH SOMEBODY (#478).
  #
  # Measured 2026-09-12: the API retained 22 runs of this workflow, back to
  # 2026-08-22, and EVERY ONE WAS RED. Run 16597 had correctly caught
  # CVE-2026-84445 against google.golang.org/grpc in all three go.mod files, on
  # a database downloaded that morning, and nobody saw it -- the advisory
  # reached this repository a day later only because an agent happened to run
  # `make security` on a workstation (#451). devops.md §8a accepts a window in
  # alpha, where a CVE surfaces at the next nightly rather than at the push that
  # introduces it; that bargain assumes the nightly's verdict is READ.
  #
  # A PLAIN NOTIFIER WOULD HAVE REPRODUCED THE DEFECT. One that fired on each of
  # twenty-two consecutive failures trains its reader to ignore it inside a
  # week, and then the mechanism is intact while the property is gone. So this
  # job signals a STATE: it opens ONE tracking issue on the transition to red,
  # REWRITES that issue in place (no comment, no bell) while the job stays red,
  # and CLOSES it on the first green run. A new issue in the queue means
  # something broke; an old open one means it is still broken.
  #
  # An issue rather than a channel because AGENTS.md already names this
  # repository's open issues as the inbound work queue -- it is read at session
  # start -- so nothing has to subscribe to anything, and there is no external
  # service and no second credential. The full rationale, including why a job
  # that has NEVER been green is treated as louder than one that just broke,
  # is in test/tools/nightlysignal/main.go.
  #
  # IT GATES NOTHING. It is absent from ci-gate's `needs` because it is not in
  # ci.yml at all, it does not make this workflow a required check, and it does
  # not move `trivy fs` onto the push path -- both are separate decisions
  # (devops.md §8a, docs/seal/fips140-mode.md "Arming the gate").
  #
  # ITS OWN RED MEANS ITS OWN FAILURE, never the nightly's. The tool exits 0
  # when every job was decided and every decision applied, INCLUDING when the
  # answer was "both jobs are on fire". It exits non-zero only when it could not
  # do its job -- which is the only way a silent notifier can be told apart from
  # a quiet night.
  signal:
    name: Signal
    needs: [fips, trivy]
    # `always()` IS LOAD-BEARING. Without it this job is skipped on exactly the
    # runs it exists for, and the workflow would look complete while signalling
    # nothing.
    #
    # The github.com guard: the issue queue this writes to is the Gitea one,
    # and AGENT_TOKEN is a Gitea credential. On github.com the job does not
    # run rather than failing on a secret that host does not have (devops.md
    # §6). The orchestration workflows this guard was copied from (automerge,
    # the review workflows) are gone -- QuicBaaS owns orchestration and a
    # project's workflows run CI only -- so this is now the guard's one home.
    if: always() && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # EVERY WATCHED JOB IS LISTED EXPLICITLY, and the tool refuses to run
      # unless this list matches nightly.yml's own `jobs:` block minus `-self`.
      #
      # devops.md §1: `join(needs.*.result)` is a GitHub extension that
      # evaluates to the EMPTY STRING on Gitea, so a gate built on it passes
      # while jobs fail -- list every job explicitly and fail closed when the
      # results cannot be read. This is that list; the coverage assertion in
      # test/tools/nightlysignal/workflow.go is the "fail closed". Adding a job
      # above without adding a `-job` line here turns this job red, which is the
      # cost that keeps a new job from being unwatched.
      - name: Open, update or close the tracking issue
        env:
          # The PROJECT AGENT's token. The issues this opens are the project
          # agent's own, filed on its own repository, which is what §0/§1 of
          # conventions/sdlc.md describe.
          NIGHTLY_SIGNAL_TOKEN: ${{ secrets.AGENT_TOKEN }}
          RESULT_FIPS: ${{ needs.fips.result }}
          RESULT_TRIVY: ${{ needs.trivy.result }}
        run: |
          set -euo pipefail

          # Fail closed, naming the secret. A blank token would send
          # `Authorization: token ` and Gitea would answer as an anonymous
          # caller -- on a private repository that is a 404, which reads as "no
          # tracking issue exists" and opens a duplicate every night. The tool
          # refuses an empty token for the same reason; this says so earlier and
          # in the workflow's own words.
          [ -n "${NIGHTLY_SIGNAL_TOKEN:-}" ] || {
            echo "::error::AGENT_TOKEN is not set on this repository."
            echo "::error::Without it the nightly's verdict reaches nobody, which is #478."
            exit 1; }

          go run ./test/tools/nightlysignal \
            -mode apply \
            -self signal \
            -job "fips=FIPS 140-3=${RESULT_FIPS}" \
            -job "trivy=Trivy=${RESULT_TRIVY}"
