name: CI

# One workflow, both hosts. Gitea Actions is GitHub-Actions-compatible, so the
# GitHub-only mechanics (SARIF upload to code scanning, and actions whose setup
# cannot authenticate to github.com from a Gitea runner) are guarded on
# `github.server_url`, and the Gitea leg installs the equivalent CLI instead.
# See automatethethings software/conventions/devops.md §1 and §8.
#
# This is the PUSH path, and it holds only jobs that can pass and do gate.
# ci-template v1.9 moved the known-red and long-horizon jobs — fips and trivy —
# to nightly.yml (owner ruling 2026-08-20, go-qrdb#48).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

permissions:
  contents: read
  security-events: write

env:
  # Latest 1.26 patch (owner ruling 2026-08-20). 1.27.0 is BLOCKED: cockroachdb/swiss
  # fails to compile under it (undefined fastrand64/hashFn), and this module pulls
  # swiss in transitively through pebble. Bump within 1.26 as patches ship; move to
  # 1.27 only in the company #121 wave, after the swiss/pebble chain is bumped.
  # setup-go 'stable' is prohibited as a spec — it flipped to 1.27.0 mid-campaign.
  GO_VERSION: "1.26.7"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # devops.md §9: tools installed in CI take @latest, never a pin.
      - name: Install golangci-lint
        # PINNED (devops.md §9 documented-pin clause; #42, 2026-08-19):
        # @latest moved to v2.13.0, which panics under Go 1.26 ("nilness:
        # internal error: unhandled builtin recover" in honnef.co/go/tools
        # v0.8.0-rc.1, while analysing the third-party sentry package) and took
        # the whole gate down — and with it every job that needed lint.
        # Bisected on this tree: v2.12.2 reports "0 issues", v2.13.0 panics.
        # Unpin when an upstream release passes on the portfolio (#42).
        # RETRIED (2026-08-20): sum.golang.org tile fetches during this
        # install flake with HTTP/2 INTERNAL_ERROR (2/2 runs observed on
        # go-qrdb), and under staged fail-fast a linter-INSTALL flake blocks
        # the whole pipeline. Bounded retry, full sumdb verification kept —
        # do NOT "fix" this with GOSUMDB=off, which trades a flake for a
        # supply-chain hole. Durable fix: bake the pinned linter into the
        # runner image (infra).
        run: |
          for i in 1 2 3; do
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 && exit 0
            echo "install attempt $i failed; retrying"; sleep 10
          done
          echo "golangci-lint install failed after 3 attempts"; exit 1

      # devops.md §4: CI runs the same targets a developer runs. `make fmt` is
      # the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Compile-check every package with the default (untagged) build, then the
      # real server binary with the Makefile's default feature tag set — this
      # repository is build-tag driven, so an untagged build alone compiles very
      # little of it.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint (#42, 2026-08-19): a linter tooling
    # outage must never stop tests from EXECUTING. The ci-gate job still
    # requires both, so nothing merges on red lint — but test results keep
    # existing while lint is down, instead of CI reporting failure while
    # silently verifying less than it appears to.
    needs: [lint, build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test` = `go test -race -count=1 -v -tags "$(BUILD_TAGS)"
      # ./pkg/... ./cmd/...`. The tags matter: without them the codec registry
      # is empty and packages such as pkg/invite fail at run time while
      # pkg/api/mcp, pkg/api/unix and pkg/server fail to build at all.
      - name: Unit tests (race)
        run: make test

  test-sdk:
    name: Test (sdk/go module)
    runs-on: ubuntu-latest
    # `sdk/go` is a SEPARATE Go module, so `./pkg/... ./cmd/...` in the `test`
    # job above never reaches it and this repository shipped the SDK untested by
    # CI: `build` compiled it, nothing ran it (go-qrdb#132). The whole guarded-
    # verb transport plane v0.12 rests on — the GuardedKVClient capability and
    # its embedded implementation (#119/#122) and the gRPC one (#123) — merged
    # on green CI that never executed a line of its tests. This is the standing
    # multi-module hazard exactly as written: a nested module's tests that CI
    # never runs can stop compiling, or start racing, without turning anything
    # red. Running the suite once by hand immediately turned up a data race
    # (#131).
    #
    # A separate job rather than another step in `test`: `test` already runs the
    # whole root module under -race and is the long pole, so appending this
    # would serialise them, and a distinct job makes the gate say WHICH module
    # broke.
    needs: [lint, build]
    # sdk/go/node boots real nodes, including single-replica raft groups whose
    # leader election alone costs ~2.4s per shard and more under -race. This is
    # not a pure unit suite and must not inherit a timeout tuned for one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test-sdk` = `cd sdk/go && go test -race -count=1 -v -timeout=30m
      # -tags "$(BUILD_TAGS)" ./...`. The tags are the same set the root `test`
      # job uses and matter for the same reason: without them the codec registry
      # is empty and several packages fail to build outright.
      - name: Unit tests (race, sdk/go module)
        run: make test-sdk

  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint (#42, 2026-08-19): a linter tooling
    # outage must never stop tests from EXECUTING. The ci-gate job still
    # requires both, so nothing merges on red lint — but test results keep
    # existing while lint is down, instead of CI reporting failure while
    # silently verifying less than it appears to.
    needs: [lint, build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The multi-protocol CLI suites against two real qrdbd servers in a
      # compose stack. The image bakes the source: a bind mount cannot work
      # here, because compose reaches the HOST daemon through the mounted
      # socket and this checkout's path does not exist on the runner host.
      #
      # The variables are read straight from the shell environment, NOT
      # through ${{ env.X }} -- that expression reads this workflow's own
      # env: block, which does not define them, and would silently write
      # blanks. The runner injects them into the job's process environment
      # (dependency-resolution.md section 6). `make integration-image` does
      # the staging and passes the file as a BuildKit secret; it writes an
      # empty file when the variables are absent, which is what happens on
      # GitHub, where these modules resolve from the public proxy instead.
      # INT_PROJECT namespaces the containers, networks and volumes. Its
      # default is per-HOST, which is not enough here: a runner with capacity 4
      # can land two go-qrdb jobs on the same daemon, and compose would then
      # evict the other run's containers by name. The run id makes it per-run.
      #
      # Read from the shell rather than through a ${{ }} expression: that
      # context has resolved empty before and would hand compose a bare
      # "qrdb-int-" shared by every job, which is the collision this avoids.
      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      # The server logs are dumped by the make target itself, which is the only
      # place that runs before its own teardown -- a workflow step here fires
      # after the containers are already gone and prints nothing, which is what
      # the first attempt did.

      # Compose leaks containers and volumes when a run is interrupted, and a
      # leftover stack makes the NEXT run fail while attaching. Always tear
      # down, and do not let the teardown itself fail the job.
      - name: Tear down the stack
        if: always()
        run: |
          cd test/integration/api
          docker compose -p "qrdb-int-${GITHUB_RUN_ID:-local}" down -v || true

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [lint, build]
    # ci-template v1.9 staged fail-fast (owner ruling 2026-08-20): Gitea has no
    # cancel API, so ORDERING is the only fail-fast available. lint+build run in
    # minutes and gate the expensive tier, so a broken push reports fast and burns
    # nothing downstream. This supersedes the lint-decoupling of #42, whose
    # silent-skip hazard is closed by the golangci-lint pin.
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        # PINNED to v2.29.0 (devops.md §9 documented-pin clause; owner-ruled
        # fleet-wide 2026-08-26, go-qrdb#154). gosec joins the discipline
        # golangci-lint has carried since #42, for a reason measured today:
        # @latest self-updated mid-day and introduced G703, which reddened the
        # Security job on every branch — including main — on code nobody had
        # touched since 2026-04-10. Run 6862 on main was green at 08:04Z and
        # run 6885 red at 08:47Z with the offending file identical in both.
        # Upgrade deliberately, one issue per bump — never by drifting.
        #
        # What this pin does NOT do: fix that finding. v2.29.0 still raises
        # G703 (checked, not assumed) — the Makefile's GOSEC_EXCLUDE entry is
        # what clears it, and it carries its own three-legged justification.
        # The pin buys reproducibility, not a green gate.
        #
        # Note `gosec --version` prints "dev" whatever version is selected:
        # `go install` builds it without the release ldflags. So the reported
        # version is NOT evidence of which gosec ran, and this line is the
        # only record of it — do not read "dev" in a log as "unpinned".
        #
        # RETRIED (2026-08-20): same sum.golang.org flake class as the lint
        # install — a tool-install network failure must not fail a job that
        # never ran its analysis. Full sumdb verification kept.
        run: |
          for i in 1 2 3; do
            go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0 && exit 0
            echo "install attempt $i failed; retrying"; sleep 10
          done
          echo "tool install failed after 3 attempts"; exit 1

      # gosec type-loads every package, so the full module graph must be in
      # the local cache BEFORE it runs: on a cold cache its loader surfaces
      # each missing module as `could not import ... (invalid package name)`
      # and fails the job with zero actual findings. `go build` warms the
      # cache as a side effect on the build job, but each job runs in its
      # own container — download explicitly here.
      - name: Download modules
        run: go mod download all

      # `make gosec` carries GOSEC_EXCLUDE and its written justifications in the
      # Makefile, so the exclusion list is single-sourced rather than copied
      # into this file (devops.md §8).
      - name: gosec
        run: make gosec

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report — `|| true` keeps a SARIF-writing failure from double-failing a
      # build the gate step has already judged.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Install govulncheck
        # RETRIED (2026-08-20): same sum.golang.org flake class as the lint
        # install — a tool-install network failure must not fail a job that
        # never ran its analysis. Full sumdb verification kept.
        run: |
          for i in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@latest && exit 0
            echo "install attempt $i failed; retrying"; sleep 10
          done
          echo "tool install failed after 3 attempts"; exit 1

      # Blocking, in both modules. This is also the §9 forcing function for
      # toolchain currency — it fails on a known-vulnerable stdlib.
      - name: govulncheck (root module)
        run: govulncheck ./...

      - name: govulncheck (sdk/go module)
        working-directory: sdk/go
        run: govulncheck ./...

      - name: go mod verify
        run: make mod-verify

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # devops.md §1: one gate for branch protection to require, with every job
    # listed explicitly. `join(needs.*.result)` is a GitHub extension that
    # evaluates to an empty string on Gitea, so a gate built on it reports
    # success while jobs fail. Adding a job means adding it to `needs` AND to
    # the env block and the loop below.
    #
    # `fips` and `trivy` are not here because they are not in this workflow at
    # all any more: ci-template v1.9 moved both to nightly.yml (owner ruling
    # 2026-08-20, go-qrdb#48). Both are known-red with tracked issues — fips on
    # #18 and #20, trivy on #42 — so running them per push produced information
    # we already had while holding a runner for up to 90 minutes.
    #
    # `trivy` was previously REQUIRED here, which meant the gate was red on
    # every push from a known-red job. That is not a gate; it is a gate nobody
    # can read. Removing it is the point of #48, not an incidental side effect
    # of the move.
    #
    # ARMING EITHER ONE AGAIN is a deliberate act, and the whole act: move the
    # job back into this file, add it to `needs`, add its RESULT_ env var, and
    # add a `check` call below. A job that can pass and is not required is a
    # fail-open gate; a job that is required and cannot pass freezes the
    # repository without closing a single finding. Neither is acceptable, which
    # is why the two halves must move together.
    needs: [lint, build, test, test-sdk, integration-standalone, security]
    steps:
      - name: Verify every job succeeded
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_TEST_SDK: ${{ needs.test-sdk.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
        run: |
          status=0
          # skipped is not the same as failed, and BOTH fail the gate. A
          # skipped job means an upstream stage failed (test, integration and
          # security all stage behind lint and build), so naming it prevents
          # the go-qrdb#42 class: a red that reads like a test failure while
          # the tests never ran at all.
          check() {
            name="$1"
            result="$2"
            case "$result" in
              success)  echo "ok:   $name = success" ;;
              skipped)  echo "SKIP: $name (an upstream stage failed - see its job)"; status=1 ;;
              "")       echo "FAIL: $name result is unreadable - failing closed"; status=1 ;;
              *)        echo "FAIL: $name = $result"; status=1 ;;
            esac
          }
          check lint "$RESULT_LINT"
          check build "$RESULT_BUILD"
          check test "$RESULT_TEST"
          check test-sdk "$RESULT_TEST_SDK"
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE"
          check security "$RESULT_SECURITY"
          exit $status
