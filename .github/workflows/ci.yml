name: CI

# One workflow, both hosts. Gitea Actions is GitHub-Actions-compatible, so the
# GitHub-only mechanics (SARIF upload to code scanning, aquasecurity/trivy-action,
# whose setup cannot authenticate to github.com from a Gitea runner) are guarded
# on `github.server_url` and the Gitea leg installs the Trivy CLI instead.
# See automatethethings software/conventions/devops.md §1 and §8.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.26.6"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # devops.md §9: tools installed in CI take @latest, never a pin.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      # devops.md §4: CI runs the same targets a developer runs. `make fmt` is
      # the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Compile-check every package with the default (untagged) build, then the
      # real server binary with the Makefile's default feature tag set — this
      # repository is build-tag driven, so an untagged build alone compiles very
      # little of it.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test` = `go test -race -count=1 -v -tags "$(BUILD_TAGS)"
      # ./pkg/... ./cmd/...`. The tags matter: without them the codec registry
      # is empty and packages such as pkg/invite fail at run time while
      # pkg/api/mcp, pkg/api/unix and pkg/server fail to build at all.
      - name: Unit tests (race)
        run: make test

  fips:
    name: FIPS 140-3
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 90
    # GOFIPS140 selects the Go Cryptographic Module at BUILD time; GODEBUG
    # selects the enforcement level at RUN time, and both are needed.
    #
    # "only" rather than "on": "on" loads the module but still PERMITS
    # non-approved algorithms, so a regulated path using MD5, SHA-1 or GCM with
    # a caller-chosen IV passes silently and the gate reports green on exactly
    # the thing it exists to catch. "only" makes those operations error or
    # panic. Ratified by the owner 2026-08-17; see automatethethings
    # software/conventions/configuration.md §5 and docs/seal/fips140-mode.md.
    #
    # If this job goes red, the failure IS the finding: something on a tested
    # path is using non-approved cryptography. Fix the call site, or -- when an
    # external format mandates the primitive -- isolate it and record a cited
    # exemption in docs/seal/fips140-mode.md. Do NOT set this back to "on", add
    # a build tag that skips the job, or narrow the package list.
    #
    # It IS red today, on three tracked findings, and it is deliberately not
    # part of ci-gate while that is true -- see the comment on ci-gate below
    # and the "Open blockers" section of docs/seal/fips140-mode.md. Nothing in
    # this repository claims the module operates under fips140=only until this
    # job passes and joins ci-gate.
    env:
      GOFIPS140: latest
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # GODEBUG is a runtime setting and cannot fail a compile, but building
      # against the module first keeps a genuine build break from being
      # reported as a test failure.
      - name: Build all packages against the FIPS module
        run: go build ./...

      # The same target the Test job runs, with the same build tags. The scope
      # is deliberately identical: a FIPS job over a subset of the suite
      # cannot tell you the product is FIPS-clean.
      - name: Unit tests (race, FIPS 140-only)
        run: make test

  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ubuntu-latest
    needs: [lint, build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The multi-protocol CLI suites against two real qrdbd servers in a
      # compose stack. The image bakes the source: a bind mount cannot work
      # here, because compose reaches the HOST daemon through the mounted
      # socket and this checkout's path does not exist on the runner host.
      #
      # The variables are read straight from the shell environment, NOT
      # through ${{ env.X }} -- that expression reads this workflow's own
      # env: block, which does not define them, and would silently write
      # blanks. The runner injects them into the job's process environment
      # (dependency-resolution.md section 6). `make integration-image` does
      # the staging and passes the file as a BuildKit secret; it writes an
      # empty file when the variables are absent, which is what happens on
      # GitHub, where these modules resolve from the public proxy instead.
      # INT_PROJECT namespaces the containers, networks and volumes. Its
      # default is per-HOST, which is not enough here: a runner with capacity 4
      # can land two go-qrdb jobs on the same daemon, and compose would then
      # evict the other run's containers by name. The run id makes it per-run.
      #
      # Read from the shell rather than through a ${{ }} expression: that
      # context has resolved empty before and would hand compose a bare
      # "qrdb-int-" shared by every job, which is the collision this avoids.
      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      # The server logs are dumped by the make target itself, which is the only
      # place that runs before its own teardown -- a workflow step here fires
      # after the containers are already gone and prints nothing, which is what
      # the first attempt did.

      # Compose leaks containers and volumes when a run is interrupted, and a
      # leftover stack makes the NEXT run fail while attaching. Always tear
      # down, and do not let the teardown itself fail the job.
      - name: Tear down the stack
        if: always()
        run: |
          cd test/integration/api
          docker compose -p "qrdb-int-${GITHUB_RUN_ID:-local}" down -v || true

  security:
    name: Security
    runs-on: ubuntu-latest
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      # gosec type-loads every package, so the full module graph must be in
      # the local cache BEFORE it runs: on a cold cache its loader surfaces
      # each missing module as `could not import ... (invalid package name)`
      # and fails the job with zero actual findings. `go build` warms the
      # cache as a side effect on the build job, but each job runs in its
      # own container — download explicitly here.
      - name: Download modules
        run: go mod download all

      # `make gosec` carries GOSEC_EXCLUDE and its written justifications in the
      # Makefile, so the exclusion list is single-sourced rather than copied
      # into this file (devops.md §8).
      - name: gosec
        run: make gosec

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report — `|| true` keeps a SARIF-writing failure from double-failing a
      # build the gate step has already judged.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Blocking, in both modules. This is also the §9 forcing function for
      # toolchain currency — it fails on a known-vulnerable stdlib.
      - name: govulncheck (root module)
        run: govulncheck ./...

      - name: govulncheck (sdk/go module)
        working-directory: sdk/go
        run: govulncheck ./...

      - name: go mod verify
        run: make mod-verify

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # GitHub leg: a fresh source-scoped scan is uploaded to code scanning on
      # every run so the dashboard never reflects a stale analysis, then a
      # second pass gates on CRITICAL/HIGH. test/ holds benchmark harnesses
      # that ship in no release.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          skip-dirs: test,cmd/qrdbd/data

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
          skip-dirs: test,cmd/qrdbd/data

      # Gitea leg: trivy-action's setup step cannot authenticate to github.com
      # from a Gitea runner, so install the CLI and run the identical gate.
      # Retried: raw.githubusercontent.com intermittently answers the Gitea
      # runner with transient HTTP errors (curl exit 22), which failed the
      # whole job on a fetch that succeeds seconds later. Backoff keeps one
      # network blip from reading as a security-gate failure.
      - name: Install Trivy CLI
        if: github.server_url != 'https://github.com'
        run: |
          for i in 1 2 3 4 5; do
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin && exit 0
            echo "trivy install attempt $i failed; retrying in $((i*10))s"
            sleep $((i*10))
          done
          echo "trivy install failed after 5 attempts" >&2
          exit 1

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 1 --skip-dirs test,cmd/qrdbd/data .

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # devops.md §1: one gate for branch protection to require, with every job
    # listed explicitly. `join(needs.*.result)` is a GitHub extension that
    # evaluates to an empty string on Gitea, so a gate built on it reports
    # success while jobs fail. Adding a job means adding it to `needs` AND to
    # the env block and the loop below.
    #
    # `fips` is ABSENT from this list because it does not pass yet, and while
    # that is true it is NOT presented as an enforceable compliance gate: this
    # module does not currently operate under GODEBUG=fips140=only and nothing
    # in this repository claims it does (docs/seal/fips140-mode.md states so in
    # its opening paragraph). The job runs on every PR to measure the remaining
    # distance at the enforcement level the policy requires; a required check
    # that cannot pass would only freeze the repository without closing a
    # single finding.
    #
    # Three findings keep it red, all tracked, none closable from a change to
    # this workflow:
    #
    #   * pkg/role and pkg/custodian derive deterministic IDs with uuid.NewSHA1
    #     (#8, #10). Re-deriving them with an approved hash rewrites persisted
    #     identity data and needs a dual-read compatibility path, which is in
    #     review on its own issue.
    #   * go-quicraft pkg/seal builds its barrier AEAD with cipher.NewGCM
    #     (jeremyhahn/go-quicraft#5), which fails every sealed-storage test.
    #   * go-truststrap pkg/noiseproto performs the Noise handshake over
    #     X25519 (jeremyhahn/go-truststrap#5), which fails pkg/clusterenroll.
    #
    # ARM IT IN THE CHANGE THAT CLOSES THE LAST ONE, not later: add `fips`
    # here, add RESULT_FIPS to the env block, and add a `check fips` call to the
    # loop. A FIPS job that can pass and is not required IS a fail-open gate.
    # What is forbidden meanwhile is making it green dishonestly -- setting it
    # back to fips140=on, adding continue-on-error, tag-gating a failing
    # package out, or trimming the package list.
    needs: [lint, build, test, integration-standalone, security, trivy]
    steps:
      - name: Verify every job succeeded
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_TRIVY: ${{ needs.trivy.result }}
        run: |
          status=0
          check() {
            name="$1"
            result="$2"
            if [ -z "$result" ]; then
              echo "FAIL: $name result is unreadable - failing closed"
              status=1
            elif [ "$result" != "success" ]; then
              echo "FAIL: $name = $result"
              status=1
            else
              echo "ok:   $name = success"
            fi
          }
          check lint "$RESULT_LINT"
          check build "$RESULT_BUILD"
          check test "$RESULT_TEST"
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE"
          check security "$RESULT_SECURITY"
          check trivy "$RESULT_TRIVY"
          exit $status
