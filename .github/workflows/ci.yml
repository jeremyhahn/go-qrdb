# ci-template: v1.34.1 — canonical CI for all first-party Go repos.
# go-qrdb deviations from v1.34.1, one line each (the CUSTOMIZE blocks below
# give each one's reason):
#   - every job runs on GitHub-hosted ubuntu-latest (DS-7377), except the
#     Docker-free jobs (preflight, coverage-merge, test-clusterproof,
#     coverage-fts, ci-gate), which run on the self-hosted bigdisk pool for a
#     push to main and a same-repository PR (DS-8233, m2479); no registry,
#     cache volume, reaper or schedule guard remains
#   - the Docker jobs run on the bigdisk-docker pool, a throwaway guest per
#     job, for the same events (ruling 442); their disk cleanup runs on the
#     hosted runner only
#   - no schedule guard, so preflight merges changes and arch-gates only
#     (DS-7377)
#   - preflight's timeout is 15 minutes against the template's 10, because it
#     runs the diff and every full-tree architecture gate
#   - a changes-gated `code` tier beside pr, full and nightly (DS-3160)
#   - a docker-build job builds both images once and hands them on as run
#     artifacts (scripts/ci-image.sh); on a push to main it also pushes them
#     to GHCR by digest
#   - lint and image are two jobs, lint-gates a third (#1046)
#   - the unit suites are code-tier jobs, not image steps (ruling 211); the
#     coverage profile is measured in matrix legs and gated by coverage-merge
#   - release-cross linux/arm64 runs on the full tier only (ruling 211)
#   - integration is integration-standalone and integration-features (#674)
#   - a fips job runs both unit suites under FIPS 140-3 mode, full tier
#   - test-typescript is a job of its own
#   - no revert-red-main.yml beside this file
#
# Runners (DS-7377). A GitHub-hosted ubuntu-latest runner is an ephemeral VM
# with 4 vCPUs, 16 GB of memory and about 14 GB of free disk, exclusive to one
# job, with a 6-hour job limit. So:
#   - nothing a job builds survives into another job: docker-build saves each
#     image it builds and uploads it as an artifact, and every consumer
#     downloads and loads it, checking its image ID (scripts/ci-image.sh);
#   - the Go build and golangci-lint caches are actions/cache entries under
#     $RUNNER_TEMP/ci-cache, which scripts/in-toolchain-image.sh bind-mounts
#     (CI_CACHE_DIR). A job restores main's newest entry; only a push to main
#     saves one (CI_PUBLISH), so a pull request never writes main's cache;
#   - every job that loads an image first frees the runner's disk (the
#     preinstalled SDKs it never uses);
#   - the stage's CPU and memory bounds, GOMAXPROCS and go's -p are derived
#     from the runner by scripts/in-toolchain-image.sh, never written here;
#   - the long suites run as matrix legs sized for a 4x slowdown against the
#     measured times, each job's estimate at most 150 minutes and every
#     timeout-minutes at most 350 (test/buildgates/ci_runners_test.go).
#
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Never add `GOPROXY: direct` / `GOSUMDB: off` to the env block: GOPRIVATE
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency.
name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk.
    branches: [main]
  pull_request:
    branches: [main]
    # CUSTOMIZE (go-qrdb): no `labeled` (#853). A label change would start a
    # run that the `concurrency` block lets cancel the PR's run in progress,
    # and a run whose jobs an `if:` skips would post `skipped` over the real
    # run's `CI / *` contexts, CI Gate included. The cost: adding `ci:full`
    # waits for the PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`. test/buildgates/ci_tiers_test.go holds this line.
    types: [opened, synchronize, reopened]
  workflow_dispatch:                    # re-fire a whole workflow
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. The one scheduler (ruling 135, ruling
  # 216(1)); test/buildgates/ci_tiers_test.go allows a `schedule:` here
  # alone.
  schedule:
    - cron: '0 4 * * *'

# v1.26.2 (ruling 145; go-qrdb's since DS-3465): on main the group is the
# workflow, the event and the commit, so main runs never cancel each other and
# every merge keeps a completed run. Every other ref is one group, so a PR's
# newer run cancels the older. v1.29.3: a schedule run's group is
# `schedule-{repository}`, so a repository has one schedule run at a time.
# cancel-in-progress stays a literal `true` (Company Agent m695, m701).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE (go-qrdb): COVER_MIN, the repo-wide floor `make coverage-merge`
  # enforces beside the per-package baseline in test/coverage-baseline.txt (#500).
  COVERAGE_THRESHOLD: 91      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Every analysis step derives its own form from this ONE
  # value; never write the tag list twice.
  # CUSTOMIZE (go-qrdb): exactly `make -s print-build-tags`, the default feature
  # set the coverage baseline was measured under (its `# build-tags:` line), in
  # the same order; the Makefile adopts it as BUILD_TAGS when it is set.
  GO_BUILD_TAGS: "codec_json raft qrdb_ts qrdb_vector qrdb_vlog qrdb_sql qrdb_mysql qrdb_pgsql qrdb_etcd qrdb_embedded codec_msgpack codec_yaml codec_bson codec_protobuf"
  # DS-8233 (bigdisk): Go for the jobs that run natively on the self-hosted
  # pool (coverage-merge, test-clusterproof, coverage-fts). The toolchain
  # image's Go: scripts/tool-pins.sh GO_IMAGE=golang:1.27.3-alpine3.24, which
  # build/docker/devcontainer/Dockerfile takes as ARG GO_IMAGE. Keep the two
  # equal; an exact patch release, never "stable".
  GO_VERSION: '1.27.3'
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch on main), and a PR labelled
  # ci:full. Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read
  # env, so each full-tier job repeats this expression. Keep them equal
  # (test/buildgates/ci_tiers_test.go).
  CI_FULL_TIER: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # CUSTOMIZE (go-qrdb): the one event that publishes, a push to main. It
  # alone pushes the CI images to GHCR and saves the Go caches; every other
  # event, a fork's pull request included, writes neither
  # (test/buildgates/ci_image_digest_test.go, ci_runners_test.go).
  CI_PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # v1.24 (CA m749, m751 (a)): the files a docs-only PR may touch. Nothing
  # embeds or generates from docs/ or markdown. The gates that read docs/ are
  # lint-class and run in `make lint-gates`, which a docs-only PR still runs.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'

jobs:
  # v1.24: a PR whose every changed file matches DOCS_ONLY_PATTERN runs lint
  # only. Off pull_request, or on a ci:full PR, docs_only is always false. Any
  # doubt (a failed diff, an empty list) reads as false, so the tier fails
  # toward running the tests.
  #
  # CUSTOMIZE (go-qrdb, DS-3160): docs_only also selects the `code` tier, the
  # jobs that run on every event but a docs-only PR. Each carries exactly
  # `if: needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != ''`
  # (and the draft test) and lists preflight and docker-build in needs; CI Gate
  # excuses its skip only when DOCS_ONLY is true. v1.29.2 (ruling 239(8)): the
  # `if:` also tests docker-build's it_image, empty on a docs-only PR.
  #
  # v1.34: preflight is the changed-file diff and the architecture gates in
  # one job (go-qrdb has no schedule guard, DS-7377).
  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt.
  # CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of the paths that may import
  # go-objstore. A source check with grep, not a stage: it runs on the
  # runner's shell. v1.23: a lint-class check, so it stays on the PR tier.
  # CUSTOMIZE (go-qrdb, DS-3160): make check-public-releasable scans the whole
  # tracked tree, docs included, so a docs-only PR runs these steps; the
  # code-only step skips there.
  preflight:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Preflight
    # m2479: the entry job every other job waits on. git, grep and sh only;
    # no Go, no Docker (the compose-target check, which runs the docker CLI,
    # is a docker-build step). On the self-hosted bigdisk pool for a push to
    # main and a same-repository PR; hosted otherwise, a fork's PR included.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    timeout-minutes: 15   # CUSTOMIZE (go-qrdb): the template's 10, plus the full-tree gates
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    env:
      # go-qrdb: the objstore storage backend, and the embedded transport's
      # volume pool, which is go-objstore's pool type.
      OBJSTORE_SEAMS: 'pkg/storage/objstore/|sdk/go/transport/embedded/'      # CUSTOMIZE
    steps:
      # v1.34: the changed-file diff needs the PR's base, and the
      # architecture gates scan the whole tree, so one full checkout serves both.
      # No credential is left in the checkout: nothing after it fetches or pushes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: No direct go-objstore import outside the storage seam
        if: steps.diff.outputs.docs_only != 'true'
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

      # CUSTOMIZE (go-qrdb): no tracked file carries a fleet value (AGENTS.md,
      # "The whole tracked tree is publicly releasable"). The patterns are a
      # repository secret, written to a file outside the checkout, read, and
      # removed; they never enter the tree or a log. A repository or a fork
      # without the secret cannot run the scan: the step says so in a warning
      # rather than pass it silently (DS-7377).
      - name: make check-public-releasable
        env:
          PUBLIC_RELEASE_PATTERNS: ${{ secrets.PUBLIC_RELEASE_PATTERNS }}
        run: |
          if [ -z "$PUBLIC_RELEASE_PATTERNS" ]; then
            echo "::warning::PUBLIC_RELEASE_PATTERNS is not set for this run: make check-public-releasable did not run"
            exit 0
          fi
          umask 077
          printf '%s\n' "$PUBLIC_RELEASE_PATTERNS" > "$RUNNER_TEMP/public-release-patterns"
          PUBLIC_RELEASE_PATTERNS_FILE="$RUNNER_TEMP/public-release-patterns" make check-public-releasable
          rm -f "$RUNNER_TEMP/public-release-patterns"
  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). This job builds the images
  # once from build/docker/devcontainer/Dockerfile at this commit and hands
  # them on (DS-7377, scripts/ci-image.sh):
  #   - each image is saved and uploaded as a run artifact, `toolchain-image`
  #     and, off a docs-only PR, `it-image`, kept for a day; its tag and image
  #     ID are this job's outputs, and every consumer loads the artifact and
  #     refuses an image whose ID is not this one. The artifact path needs no
  #     registry credential, so a fork's pull request runs it the same way;
  #   - on a push to main (CI_PUBLISH) both are also pushed to GHCR under the
  #     repository owner with the run's own GITHUB_TOKEN, tagged
  #     <content-hash>-main, and their digest references are toolchain_ref
  #     and it_ref, for developers and the release workflow. No consumer in
  #     this run pulls them.
  # A consumer never rebuilds: the integration stage upgrades its Alpine
  # packages at build time, so a rebuild of the same commit can differ.
  #
  # The forge credentials reach the image build only as the gomodauth BuildKit
  # secret, from a file outside the context that the job removes. No step and
  # no make target prints that file, the job environment (`env`, `printenv`,
  # `set -x`) or a matched line (ci-standard.md §5, Company Agent m605 item 8).
  docker-build:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer images
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: [preflight]
    timeout-minutes: 90
    # CUSTOMIZE (go-qrdb): on a push to main this job alone pushes the images
    # to GHCR, so it alone may write packages.
    permissions:
      contents: read
      packages: write
    outputs:
      toolchain_image: ${{ steps.build.outputs.toolchain_image }}
      toolchain_id: ${{ steps.save.outputs.toolchain_id }}
      # v1.29.2 (ruling 239(8)): the code-tier jobs' `if:` reads it, empty on
      # a docs-only PR.
      it_image: ${{ steps.build.outputs.it_image }}
      it_id: ${{ steps.save.outputs.it_id }}
      toolchain_ref: ${{ steps.push.outputs.toolchain_ref }}
      it_ref: ${{ steps.push.outputs.it_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. A runner that injects them as plain environment
      # (dependency-resolution.md §6) does not mask them in the log by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well. On a runner that injects none the step does nothing.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb): every compose service that names a build target
      # names a stage its Dockerfile declares, with each overlay resolved by
      # `docker compose config` (client-side, no daemon). The toolchain image
      # carries no Docker CLI, so the check runs on the runner's. A docker-build
      # step since m2479: preflight runs on the bigdisk pool, which has no
      # Docker, and this job is hosted and runs on every event preflight does.
      - name: make check-compose-targets test-compose-targets
        if: needs.preflight.outputs.docs_only != 'true'
        run: make check-compose-targets test-compose-targets

      # CUSTOMIZE (go-qrdb, DS-7377): the preinstalled SDKs no stage uses take
      # most of a hosted runner's disk; the two images and their tars need it.
      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # v1.29 (ruling 220(5)): the Alpine package index checksum joins the
      # integration image's tag hash (scripts/apk-index-sum.sh). A base image
      # the script cannot read fails the step. Every caller runs
      # `make -s apk-index-sum`, which gives the script the GO_IMAGE pin from
      # scripts/tool-pins.sh. A docs-only PR builds no integration image and
      # reads none. The consumers take the image's tag from this job's
      # outputs, so no other job reads the sum.
      - name: Read the Alpine package index
        if: ${{ needs.preflight.outputs.docs_only != 'true' }}
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Build the devcontainer images
        id: build
        env:
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          if [ "$DOCS_ONLY" = true ]; then
            make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
            it_image=
          else
            make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
            it_image=$(make -s it-image)
          fi
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "toolchain_image=$(make -s toolchain-image)" >> "$GITHUB_OUTPUT"
          echo "it_image=$it_image" >> "$GITHUB_OUTPUT"

      - name: Save the devcontainer images
        id: save
        env:
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          id=$(scripts/ci-image.sh save "$TOOLCHAIN_IMAGE" "$RUNNER_TEMP/toolchain-image")
          echo "toolchain_id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$IT_IMAGE" ]; then
            id=$(scripts/ci-image.sh save "$IT_IMAGE" "$RUNNER_TEMP/it-image")
            echo "it_id=$id" >> "$GITHUB_OUTPUT"
          fi

      # compression-level 1: an image tar is mostly compressed layers already,
      # and the default level spends minutes for little.
      - name: Upload the toolchain image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image/image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Upload the integration image
        if: ${{ steps.build.outputs.it_image != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image/image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      # CUSTOMIZE (go-qrdb): on a push to main alone, push each image once per
      # run, tagged <content-hash>-main, and output its digest reference.
      # scripts/ci-image.sh feeds the login to docker on stdin, into a private
      # DOCKER_CONFIG it deletes, and validates every reference it prints
      # (check-ref: a digest reference under the repository owner in GHCR).
      # A refused login or push fails the job. Every other event skips it.
      - name: Push the devcontainer images to GHCR
        id: push
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          toolchain_ref=$(scripts/ci-image.sh push "$TOOLCHAIN_IMAGE" go-qrdb-toolchain)
          it_ref=
          if [ -n "$IT_IMAGE" ]; then
            it_ref=$(scripts/ci-image.sh push "$IT_IMAGE" go-qrdb-ci-it)
          fi
          echo "toolchain_ref=$toolchain_ref" >> "$GITHUB_OUTPUT"
          echo "it_ref=$it_ref" >> "$GITHUB_OUTPUT"

      - name: Tear down
        if: always()
        run: rm -rf "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/toolchain-image" "$RUNNER_TEMP/it-image"

  # Every stage below runs its `make` target in the toolchain image as its own
  # step, through scripts/in-toolchain-image.sh, which copies the checkout
  # into the container. A failed step names its stage; `if: !cancelled()` runs
  # every stage after a failed one, so one run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (scripts/tool-pins.sh) decides every version, and the Makefile carries
  # every flag set. GO_BUILD_TAGS reaches every target as a make variable.
  # build, test and lint run with no network, on the image's module cache;
  # security and deps-check get one (IN_IMAGE_NETWORK=bridge).
  #
  # CUSTOMIZE (go-qrdb, #1046, Company Agent m1001): the stages run in jobs
  # side by side, lint (make lint, make gosec on the PR tier, make
  # deps-check), lint-gates, and image (the tag assertion, build, the release
  # cross-build, security, trivy image), each with its own limit. lint and
  # lint-gates are the PR tier and are all a docs-only PR runs of the stages;
  # image is the code tier (DS-3160).
  lint:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer image [lint, gosec, deps-check]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: [preflight, docker-build]
    timeout-minutes: 120
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, DS-7377): the build and golangci-lint caches,
      # restored from main's newest entry and saved on a push to main alone.
      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ hashFiles('**/go.sum') }}-
            go-lint-

      - name: Point the stages at the Go caches
        run: echo "CI_CACHE_DIR=$RUNNER_TEMP/ci-cache" >> "$GITHUB_ENV"

      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.28 (ruling 219(3)): a lint-class gate on the PR tier, on every
      # event, a docs-only PR included; bridge for the module proxy.
      - name: make deps-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # ci-template v1.30: gosec on the PR tier; the full tier runs it inside
      # `make security` in the image job.
      - name: make gosec (PR tier)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER != 'true' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make gosec GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # ci-template v1.30: vet-tags and the secure analyzer, on the nightly
      # schedule alone.
      - name: make lint-sweeps (nightly schedule)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && github.event_name == 'schedule' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-sweeps GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_PUBLISH == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # v1.27.0 (ruling 211): `make lint-gates` beside `make lint`, on the PR tier.
  lint-gates:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Lint Gates [toolchain image]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: [preflight, docker-build]
    timeout-minutes: 90
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free the runner's disk
        if: ${{ steps.probe.outputs.has_target == 'true' && runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-gates-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-gates-${{ hashFiles('**/go.sum') }}-
            go-lint-gates-

      - name: Point the stages at the Go caches
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: echo "CI_CACHE_DIR=$RUNNER_TEMP/ci-cache" >> "$GITHUB_ENV"

      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.CI_PUBLISH == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-gates-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  image:
    name: Devcontainer image [build, security, trivy image]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 90
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # The full tier's trivy step scans the integration image docker-build
      # built, so the full tier loads it too.
      - name: Download the integration image
        if: ${{ env.CI_FULL_TIER == 'true' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image

      - name: Load the integration image
        if: ${{ env.CI_FULL_TIER == 'true' }}
        env:
          IMAGE: ${{ needs.docker-build.outputs.it_image }}
          ID: ${{ needs.docker-build.outputs.it_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/it-image" "$IMAGE" "$ID"
          echo "IT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-image-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-image-${{ hashFiles('**/go.sum') }}-
            go-image-

      - name: Point the stages at the Go caches
        run: echo "CI_CACHE_DIR=$RUNNER_TEMP/ci-cache" >> "$GITHUB_ENV"

      # v1.9.2: a tag that selects no code is a typo that silently analyses
      # nothing.
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "GO_BUILD_TAGS='$GO_BUILD_TAGS' sh scripts/assert-build-tags.sh"

      - name: make build-server build-cli-headless
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go build ./... && (cd sdk/go && go build ./...) && make build-server build-cli-headless GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # ruling 211: the linux/arm64 release cross-build, plain and FIPS, on the
      # full tier only.
      - name: make release-cross (linux/arm64, plain and FIPS)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make release-cross PLATFORM=linux/arm64 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: make security
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # The integration image is gated before any push to either registry
      # (devops.md §8): --ignore-unfixed (v1.19) and --skip-dirs /opt/go/mod
      # (v1.20). trivy fs and make security never take --ignore-unfixed.
      # CUSTOMIZE (go-qrdb): `make trivy-image` carries both flags, skips
      # this image's module cache (/gomodcache, not the template's
      # /opt/go/mod), and certifies the database's age before it scans with
      # --skip-db-update, so a stale database fails rather than passes. The
      # scan is full tier (v1.23), of the image every integration leg loads.
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            make trivy-image TRIVY_IMAGE_INPUT=it-image.tar

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_PUBLISH == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-image-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      - name: Tear down
        if: always()
        run: rm -f it-image.tar

  # CUSTOMIZE (go-qrdb, ruling 211, DS-7377): `make coverage` is ONE
  # repo-wide gate, measured in legs. Each leg is
  # `make coverage-leg COVER_LEG=<leg>` on a runner of its own, which writes
  # coverage/leg-<leg>.out and uploads it; coverage-merge downloads every
  # leg's profile and runs `make coverage-merge`, the threshold and the
  # per-package baseline over their concatenation. The Makefile's COVER_LEGS
  # is the one list of legs; test/buildgates/coverage_legs_test.go fails when
  # this matrix is not COVER_LEGS, when a leg's go test budget is not the
  # job's limit less 5 minutes, or when the merge does not need this job.
  # The whole measured 84.8 minutes (run 76127); in twelve legs, at a 4x
  # slowdown, the slowest fits the 180-minute limit.
  coverage:
    name: Unit [make coverage-leg ${{ matrix.leg }}]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg:
          - tenant-lifecycle
          - tenant
          - seal-barrier
          - seal
          - server-raft
          - server
          - auth
          - service
          - api-keys
          - rest
          - sdk-transport
          - sdk
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-
            go-coverage-${{ matrix.leg }}-

      - name: Point the stages at the Go caches
        run: echo "CI_CACHE_DIR=$RUNNER_TEMP/ci-cache" >> "$GITHUB_ENV"

      # GOTEST_TIMEOUT is go test's per-package budget, the job's limit less 5
      # minutes, so a hung package reports its goroutines before the runner
      # kills the leg. IN_IMAGE_COPY_OUT copies the leg's profile out of the
      # stage's container once it exits; a failed leg writes none.
      - name: make coverage-leg ${{ matrix.leg }}
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          COVER_LEG: ${{ matrix.leg }}
          IN_IMAGE_COPY_OUT: coverage/leg-${{ matrix.leg }}.out
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage-leg COVER_LEG='$COVER_LEG' GOTEST_TIMEOUT=175m GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Upload the leg's profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-leg-${{ matrix.leg }}
          path: coverage/leg-${{ matrix.leg }}.out
          retention-days: 1
          if-no-files-found: error

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_PUBLISH == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

  # CUSTOMIZE (go-qrdb, DS-7377): the one coverage gate over every leg's
  # profile. It needs coverage, so a failed leg skips it and CI Gate fails on
  # both; `make coverage-merge` also refuses a missing or empty profile.
  coverage-merge:
    name: Unit [make coverage-merge]
    # DS-8233: shell concatenation plus a stdlib-only go run; no cgo, no Docker.
    # On the self-hosted bigdisk pool (no Docker daemon) for a push to main
    # and a same-repository PR; hosted otherwise. Hosted steps keep the
    # toolchain image; the pool runs the same target natively.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build, coverage]
    timeout-minutes: 30
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # DS-8233: the pool's Go, the toolchain image's version.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.environment == 'self-hosted'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        if: runner.environment == 'github-hosted'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        if: runner.environment == 'github-hosted'
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Download the legs' profiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-leg-*
          merge-multiple: true
          path: coverage

      - name: make coverage-merge (the threshold and the baseline)
        if: ${{ runner.environment == 'github-hosted' && !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage-merge GO_BUILD_TAGS='$GO_BUILD_TAGS' COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      - name: make coverage-merge (native, bigdisk)
        if: runner.environment == 'self-hosted'
        env:
          # The image's settings: its own Go only, modules from the public
          # proxy only (no direct), go.mod read-only, cgo on for -race.
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "1"
        run: make coverage-merge GO_BUILD_TAGS="$GO_BUILD_TAGS" COVERAGE_THRESHOLD="$COVERAGE_THRESHOLD"

  test-clusterproof:
    name: Unit [make test-clusterproof]
    # DS-8233: minimal tags (codec_json,raft,clusterproof): no go-mysql-server, so no ICU; -race needs only gcc.
    # On the self-hosted bigdisk pool (no Docker daemon) for a push to main
    # and a same-repository PR; hosted otherwise. Hosted steps keep the
    # toolchain image; the pool runs the same target natively.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 20
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # DS-8233: the pool's Go, the toolchain image's version.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.environment == 'self-hosted'
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        if: runner.environment == 'github-hosted'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        if: runner.environment == 'github-hosted'
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
