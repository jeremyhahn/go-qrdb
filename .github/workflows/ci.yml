          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/it-image" "$IMAGE" "$ID"
          echo "IT_IMAGE=$ID" >> "$GITHUB_ENV"

      - name: Integration tests (shard ${{ matrix.shard }})
        run: make integration-test-features IT_FEATURES="$IT_FEATURES" IT_FEATURES_IN=image IT_PROJECT="$IT_PROJECT" IT_PREBUILT=1

      # integration-test downs its own stack; this covers a cancelled shard.
      - name: Tear down (shard ${{ matrix.shard }})
        if: always()
        run: make docker-down-it IT_PROJECT="$IT_PROJECT"

      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  # CUSTOMIZE (go-qrdb): the multi-protocol CLI suites against two real qrdbd
  # servers in the Docker stack under test/integration/api, which builds its
  # own image from the checkout. INT_PROJECT namespaces the containers,
  # networks and volumes per run; it is read from the shell, never a ${{ }}
