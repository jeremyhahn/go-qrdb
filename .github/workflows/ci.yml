name: CI

# One workflow, both hosts. Gitea Actions is GitHub-Actions-compatible, so the
# GitHub-only mechanics (SARIF upload to code scanning, and actions whose setup
# cannot authenticate to github.com from a Gitea runner) are guarded on
# `github.server_url`, and the Gitea leg installs the equivalent CLI instead.
# See ../handbook/software/conventions/devops.md §1 and §8.
#
# This is the PUSH path, and it holds only jobs that can pass and do gate.
# ci-template v1.9 moved the known-red and long-horizon jobs — fips and trivy —
# to nightly.yml (owner ruling 2026-08-20, go-qrdb#48). trivy's CRITICAL/HIGH
# gate returned here once it was green (#479, 2026-09-22); its MEDIUM/LOW
# report and its scheduled run on a quiet tree stay in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

# Supersession control (#352). A newer head on the same ref cancels the older
# run instead of both occupying the shared runner's `capacity: 3`. MEASURED on
# Gitea 1.27.1 and proven end to end on the go-truststrap pilot (#49, 84881ef):
# the OLDER run is cancelled and the NEWEST completes, on pull_request and
# push refs alike.
#
#   - This CORRECTS the `security` job's claim below that ordering is the only
#     fail-fast available, and it does not contradict 0571424 ("ci: drop
#     concurrency from workflows"). That evidence was a DIFFERENT config: a
#     JOB-level group `task-worker-${{ github.repository }}` with no ref
#     component — one group for the whole repo, saturated by its own siblings
#     — and `cancel-in-progress: false`. Gitea cannot QUEUE, so the false path
#     cancels. It says nothing about the true path.
#   - There is still no `cancel` REST route at any path on 1.27.1, which is
#     WHY `concurrency:` is the only available mechanism, not a reason to
#     doubt it.
#   - `cancel-in-progress` does NOT evaluate expressions here — any non-empty
#     value is truthy, so a `${{ }}` rendering "false" still cancels. Write the
#     literal. (Group-key expressions DO evaluate.)
#   - The group is per-REF: a PR's runs and main's push runs never cancel each
#     other, and two PRs never cancel each other.
#   - release-lockstep.yml deliberately does NOT get this — cancelling a
#     release mid-publish risks a partial tag or publish — nor does
#     nightly.yml.
#   - ADOPTION BOUNDARY, expect it exactly once: Gitea groups a run using the
#     workflow file OF THAT RUN, so the first push after this lands cannot
#     supersede a run created before it. Check with
#     `git show <sha>:.github/workflows/ci.yml | grep -c '^concurrency:'`
#     before reading that pair as a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # Go 1.27.2, the latest release (owner ruling 2026-10-07: never pin below
  # latest). The 1.27 floor is forced by a Layer 0 dependency rather than
  # chosen (#540): go-enclave's own `go` directive is 1.27.x, go-quicraft
  # consumes it and moved with it, and this module cannot consume either and
  # stay behind. The `go` directive is 1.27.2 in the root and every nested
  # module (Go evaluates the language version from the MAIN module, so a nested
  # one left behind fails with "requires go >= 1.27.2" rather than upgrading).
  # setup-go 'stable' is prohibited as a spec — it flipped to 1.27 mid-campaign
  # and broke every repo riding it; an exact version is pinned here for the same
  # reason it always was.
  #
  # The swiss blocker that used to be recorded here was gone before the 1.27
  # move (#177, 2026-09-02): cockroachdb/swiss widened its build tag to
  # `!go1.28`, and both modules had been measured clean under 1.27 since.
  GO_VERSION: "1.27.2"

  # ANALYSIS TOOL PINS (#179, #195). These are the versions BAKED into the
  # self-hosted runner image; the steps below ASSERT the binary they got matches
  # and refuse to run otherwise. Nothing in this workflow installs them.
  #
  # Two separate defects closed here, and pinning alone fixed neither:
  #
  #   * A `go install` is a NETWORK dependency at job time. A pin fixes WHICH
  #     version you get and says nothing about whether you can reach it. Every
  #     host in this fleet resolves an AAAA record for sum.golang.org and none
  #     has a default IPv6 route; job containers use host networking, so they
  #     inherit that stack. Go's v6->v4 fallback usually saves it, which is why
  #     this was intermittent — and why this file had grown a hand-rolled
  #     3-attempt retry loop around each install, treating the symptom.
  #
  #   * A `go install` is a VERSION SUBSTITUTION. actions/setup-go prepends
  #     GOPATH/bin to PATH, so an installed binary SHADOWS /usr/local/bin. This
  #     workflow installed golangci-lint unconditionally on top of an
  #     image baking a different one — pinned on paper, running something
  #     else in fact.
  #
  # GOLANGCI_LINT_VERSION is the upstream latest (v2.14.0), moved here in step
  # with the runner image (#613) — never pinned below the latest release. The
  # earlier moves were deliberate and on evidence rather than on a version
  # number: v2.13.0 panicked under Go 1.26 ("nilness: internal error: unhandled
  # builtin recover") and took the gate down, and the pin held at v2.12.2 until
  # v2.13.2 was measured against this tree. The same measurement is the check
  # that matters for every bump, because the quiet way a linter bump goes wrong
  # is silently dropping a security linter while still exiting 0. The v2.14.0
  # binary self-reports mod sum h1:ot8QffRa4LzAAEgtvNYrVs9esxQ7xoTwoAv6uhp4ngA=,
  # identical to the image's, so it is the same artifact and not merely the
  # same version string.
  #
  # GOVULNCHECK_VERSION replaces an unpinned `@latest`. `@latest` means the same
  # commit is scanned by different analyser versions on different days, so a new
  # finding cannot be told apart from a scanner that moved underneath you.
  #
  # BUMPING ONE OF THESE IS A DELIBERATE CHANGE, one issue per bump, and the
  # runner image moves in the same breath (the image is maintained by the
  # company agent). Do NOT add a `go install` back to move a
  # version: a skew between this file and the image must fail the job, which is
  # what the require-tool.sh assertions below are for.
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # NO NETWORK INSTALL (#179, #195). golangci-lint is baked into the
      # self-hosted runner image at GOLANGCI_LINT_VERSION; this step asserts the
      # binary that will run IS that version and fails the job otherwise.
      #
      # What it replaces was a 3-attempt retry loop around
      # `go install ...@<pin>`, and the loop was the tell: the durable fix
      # named in its own comment was "bake the pinned linter into the runner
      # image", which has since happened. Retrying was treating the symptom in
      # one repo.
      #
      # FAIL CLOSED, and specifically do NOT fall back to a network install when
      # the binary is missing. The fallback would reinstate the flake at exactly
      # the moment the image is wrong, and it would do so while reporting
      # success. A failed tool install leaves a red check carrying NO verdict on
      # the code; refusing to run without the pinned binary is what makes an
      # image defect and a code defect distinguishable in the log.
      #
      # The assertion is not redundant with the pin. actions/setup-go prepends
      # GOPATH/bin to PATH, so anything installed there shadows /usr/local/bin,
      # and /etc/ci-runner-tools.txt describes the IMAGE — it says nothing about
      # what a job actually ran. require-tool.sh reads the binary's own
      # self-report, and carries its own regression suite
      # (scripts/require-tool_test.sh) because on a healthy runner only its
      # accepting branch is ever exercised.
      - name: Require golangci-lint at the pinned version
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            golangci-lint "$GOLANGCI_LINT_VERSION" \
            "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

      # The guard's own rejecting branches, which the step above never reaches
      # while the image is healthy. It runs AFTER that step deliberately: if the
      # runner image is broken, the first failure a reader should see is the
      # image, not a self-test. No network, no Go build — sub-second.
      - name: Test the tool-version guard
        run: make test-require-tool

      # The step above establishes that the golangci-lint on PATH IS the pinned
      # one. This establishes what that binary BUNDLES: golangci-lint carries a
      # gosec of its own, and it — not GOSEC_VERSION — is what the golangci-lint
      # steps below judge this tree with. It is chosen by golangci-lint's
      # go.mod, it moves when the linter moves, and until #295 it was written
      # down nowhere, while every gosec entry in .golangci.yml means whatever
      # that version says it means. v2.13.2 bundled gosec v2.28.0, whose G703
      # accepted filepath.Clean as a path-traversal sanitizer where the directly
      # pinned v2.29.0 does not — the two legs differed in soundness, not
      # strictness, and only one of them was pinned where anyone could see it.
      # v2.14.0 bundles v2.29.0, the same as the direct pin; this step is what
      # notices when that stops being true.
      #
      # It reads `go version -m` rather than a self-report, because a dependency
      # version comes from the module graph and cannot be handed in by ldflags —
      # which is exactly how gosec's own version string came to say `dev`
      # (#154, #195). Two halves of one assertion, in this order.
      - name: The gosec inside golangci-lint is the measured one
        run: make check-bundled-gosec

      # Its rejecting branches, which the step above never reaches while
      # golangci-lint stays put. Same ordering rule as every other guard here.
      - name: Test the bundled-gosec guard
        run: make test-bundled-gosec

      # The four analyser pins are written in four files and nothing but this
      # step keeps them in step (#323): a Dockerfile cannot read a make
      # variable, and THIS FILE's env block -- the authority, because it is what
      # the runner installs -- is visible to neither.
      #
      # It runs in the Lint job rather than only inside `make ci` because the
      # devcontainer image is where `make ci` executes, so a drifted pin is
      # already baked in by the time that path could complain. Here it is read
      # off the tree, before any image exists.
      #
      # #322 first closed the drift by removing the duplication outright. That
      # broke VS Code "Reopen in Container", #302 requires it keep working, and
      # the owner ruled on 2026-09-05 that a workflow regression is not a defect
      # fix -- so the ARG defaults are a deliberate second copy and this step is
      # what makes that safe.
      - name: Scanner pins agree across ci.yml, Makefile and the Dockerfiles
        run: make check-tool-versions

      # The guard's rejecting branches, which the step above never reaches while
      # the pins agree. Runs after it for the same reason the others do. The
      # cases that matter most are the discovery floor: a pattern that stops
      # matching turns the check into a comparison over empty strings, which
      # always agree -- a green gate verifying nothing, which is the shape of
      # the defect it exists to catch. No network, no Go build.
      - name: Test the scanner-pin guard
        run: make test-tool-versions

      # #451. The pins above say WHICH scanner runs; this is about the DATA it
      # rules with. trivy decides whether to refresh by reading NextUpdate out
      # of the database artifact it already holds, so a database that declares
      # itself not yet due is used however old it is -- measured on v0.74.0, a
      # June database claiming NextUpdate 2027 scanned this tree offline and
      # exited 0, with no age and no warning anywhere in its output. A green
      # verdict from a database that predates the advisory is the worst shape a
      # gate can take, because unlike a false red nobody investigates it.
      #
      # `make trivy` now refuses that, and this is the leg that demonstrates the
      # refusal rather than asserting it: the guard's rejecting branches --
      # including the exact stale-but-unexpired cache above -- run here on every
      # push, with no trivy, no network and no Go build, which is why this step
      # belongs in Lint rather than in the Security job or in nightly.yml.
      - name: Test the trivy database-age guard
        run: make test-trivy-db

      # #327: compose merges overlay keys individually, so an overlay that
      # redirects `dockerfile:` inherits the base file's `target:`. That pointed
      # the GPU lane at a stage Dockerfile.gpu did not declare, and
      # `make integration-test-gpu` could not build. Nothing caught it because
      # the GPU lane runs in no workflow and no host here has a GPU -- so the
      # check is a static read of the stage graph, needing neither.
      - name: Compose build targets resolve to real Dockerfile stages
        run: make check-compose-targets

      - name: Test the compose-target guard
        run: make test-compose-targets

      # The cluster suite runs as matrix legs, each selecting its tests by an
      # anchored -run expression built from `go test -list`. A test that no
      # leg selects would never run and never fail; this applies every leg's
      # expression to the full list and fails on a test selected by none, or
      # by more than one.
      - name: The cluster suite's CI legs partition its tests
        run: make check-cluster-shards

      - name: Test the cluster-shard partition check
        run: make test-cluster-shards

      # #367. Every `uses:` in every workflow must resolve to a 40-hex commit.
      # A tag is a ref its owner can move, and the review workflow's job held a
      # WRITE-SCOPED token while it existed -- where auto-merge was armed, a
      # moved tag ran attacker-controlled code with credentials that could
      # merge. The release and security jobs are the same shape. go-quicraft
      # has the sibling of this gate and it caught the identical line THREE
      # times, every time as an unnoticed template propagation whose real
      # payload was a model bump. Until now this repository had no gate, which
      # made it unwatched rather than safe.
      #
      # It runs in this job for the same reason check-publication-bound does:
      # the property is over the whole TREE, and a reviewer looking at one diff
      # cannot see that a fleet rollout replaced a pin two files away.
      #
      # Unlike its neighbours there is no separate self-test step. This guard's
      # rejecting branches -- both discovery floors, every YAML spelling, the
      # local-action exemption -- are Go tests in the same package, so this one
      # step runs the gate AND the gate's own suite. No network, no build.
      - name: Every workflow action is pinned to a commit SHA
        run: make check-action-pins

      # test/integration/features.mk is the one table mapping every
      # docs/<feature>/ folder to its integration-test-<feature> selection.
      # A reviewer sees one diff -- a new feature folder, or a new
      # integration test file -- and cannot see that the OTHER half of the
      # mapping (the folder list, or the file's selection) went unedited;
      # same shape as check-action-pins and check-publication-bound, a
      # property of the whole tree. No network, no Go build beyond this one
      # package, already built by the step above.
      - name: Every feature has an integration-test target, every integration test is selected
        run: make check-integration-feature-coverage

      # #478. nightly.yml's `signal` job turns that workflow's verdict into a
      # tracking issue, and it is told which jobs to watch by an explicit `-job`
      # list -- because `join(needs.*.result)` is a GitHub extension that reads
      # as the empty string on Gitea (devops.md §1), so a gate built on it
      # passes while jobs fail.
      #
      # A list has to be kept in step with what it lists. The tool refuses to
      # run when its `-job` set does not match nightly.yml's own `jobs:` block,
      # but that refusal happens at 03:00 on a night nobody is watching -- the
      # same failure the signal exists to end. THIS STEP IS THE SAME ASSERTION,
      # ON THE PUSH THAT FORGETS THE FLAG. It also runs the decision table's
      # rejecting branches, which a healthy nightly never reaches.
      #
      # No network, no token, no scanner.
      - name: The nightly signal watches every job nightly.yml declares
        run: make test-nightly-signal

      # The coverage gate's own tests (#500). The Test job runs the gate; this
      # runs every way the gate could misread a profile -- a truncated profile,
      # conflicting duplicate blocks, a missing baseline, a package that stops
      # being measured -- each with a negative control. It is here and not in
      # Test so a broken gate is reported in minutes, before the full race
      # suite, and so it cannot be mistaken for a coverage regression.
      #
      # No network, no Go build beyond this one package.
      - name: The coverage gate's own tests
        run: make test-coverratchet

      # scripts/coverage-merge-subprocess.sh's own tests (go-qrdb#114 review,
      # round 3): it was written, and had a round-2 bug fixed, without ever
      # being reached by `make test` or this workflow -- its own exact
      # five-package discovery assertions, and the discovery-floor guard that
      # exists so the pattern going stale reports LOUDLY, could regress with
      # nothing here to catch it. Same reasoning as the coverage gate's own
      # tests just above: reported in minutes, before the Test job's `make
      # coverage` run depends on this script producing a correct merged
      # profile.
      #
      # No network, no Go build beyond the small binaries `go list` needs.
      - name: The coverage-merge-subprocess script's own tests
        run: make test-coverage-merge-subprocess

      # AGENTS.md: a feature folder is publication-bound. This is a whole-TREE
      # property, so it is checked here rather than left to review: a reviewer
      # sees one diff, and a violation can be contributed by neither side of a
      # merge alone.
      #
      # WHAT THIS LEG ACTUALLY SCANS, measured rather than assumed. On a
      # pull_request event this Gitea's actions/checkout resolves the BRANCH
      # HEAD, not a merge ref -- Lint run 9735 logged
      # "HEAD is now at ff4dc99", the branch tip, and `git log -1` agreed. So a
      # PR-time run of this guard covers what the AUTHOR wrote, and cannot see
      # a violation the merge would introduce. An earlier version of this
      # comment claimed the merge ref; it was wrong, and a guard that
      # overstates its coverage is worse than one that states it accurately,
      # because the overstatement is what stops someone closing the gap.
      #
      # The gap is closed by the `push: branches: [main]` trigger at the top of
      # this file rather than by the checkout: this job runs again on the
      # merged tree the moment it lands, which catches strictly more than a
      # merge-ref checkout would -- direct pushes included. It catches them
      # AFTER the merge rather than before, which is the honest cost.
      - name: Feature folders are publishable
        run: make check-publication-bound

      # The guard's rejecting branches, which the step above never reaches
      # while the tree is clean. Runs after it, for the same reason the
      # tool-version self-test does: a real violation should be the first
      # failure a reader sees, not a self-test. No network, no Go build.
      - name: Test the publication-bound guard
        run: make test-publication-bound

      # Its sibling over the WHOLE tracked tree (#565): every tracked file
      # publishes -- the module zip is the tracked tree, and the public mirror
      # is byte-identical to the release tag -- so a lab address, a lab host, a
      # path under the owner's home or tracked agent state is scrubbed at the
      # source, before tagging. Same checkout caveat as the step above: a PR
      # run covers the branch head, and the push to main covers the merge.
      #
      # The fleet's values are NOT in this repository (owner ruling
      # 2026-10-01): the rules come from the PUBLIC_RELEASE_PATTERNS secret,
      # written to a runner temp file for this step only. An unset secret
      # leaves an empty file, and the gate refuses an empty rule set rather
      # than pass it. Not on github.com, which holds neither the secret nor
      # anything to scrub that the internal run has not already refused.
      - name: The tracked tree is publicly releasable
        if: github.server_url != 'https://github.com'
        env:
          PUBLIC_RELEASE_PATTERNS: ${{ secrets.PUBLIC_RELEASE_PATTERNS }}
        run: |
          set -eu
          umask 077
          printf '%s\n' "${PUBLIC_RELEASE_PATTERNS:-}" > "$RUNNER_TEMP/public-release-patterns"
          PUBLIC_RELEASE_PATTERNS_FILE="$RUNNER_TEMP/public-release-patterns" make check-public-releasable
          rm -f "$RUNNER_TEMP/public-release-patterns"

      - name: Test the public-releasability guard
        run: make test-public-releasable

      # go-qrdb#271. The committed test/tools/ifacesweep/findings/*.tsv are a
      # reference measurement whose entire value is being stable and diffable
      # across checkouts -- which an absolute, workstation-specific path in
      # the `file` column defeats, and is exactly what shipped once already,
      # uncaught by review and outside check-publication-bound.sh's docs/*/
      # scope (tracked separately as its own gap, not widened here).
      - name: iface-sweep findings carry no absolute paths
        run: make check-iface-sweep-findings

      - name: Test the iface-sweep findings guard
        run: make test-iface-sweep-findings

      # go-qrdb#403. The generalization of the leg above: every committed
      # generated artifact (test/coverage-baseline.txt,
      # test/tools/deadcode/baseline.txt, lockstep-baseline, and the two
      # ifacesweep findings files again) is scanned for an absolute
      # workstation path, not just the two files #271 already fixed.
      - name: Generated artifacts carry no absolute paths
        run: make check-artifact-paths

      - name: Test the artifact-paths guard
        run: make test-artifact-paths

      # The embedded transport's database-scoped adapters are generated from
      # the pkg/service interfaces; a stale file serves an interface's new
      # method unscoped or fails to compile far from the cause.
      - name: Generated database-scope adapters are current
        run: make check-generated

      # Same reasoning, for the module sweep's guard. A healthy tree exercises
      # only vet-modules.sh's ACCEPTING path, so its rejecting branches — an
      # unmapped module, an empty or rootless discovery, a partial traversal —
      # would ship untested. That target was wrong six times as an inline
      # recipe, every time by being narrower than its own claim and silent
      # about it (#221), which is precisely what an untested guard looks like.
      # No network, no Go build; the sweep itself uses a fake `go`.
      - name: Test the module-sweep guard
        run: make test-vet-modules

      # go-qrdb#160. `release-alpha` publishes tags, and a published tag is
      # immutable (release-versioning.md §3), so its failure mode is not a red
      # build — it is a release consumers have already resolved. Its regression
      # suite therefore has to be run by something other than the person who
      # wrote it.
      #
      # It lives in this job rather than in a new one because it is the same
      # shape as the guard self-test above: a few seconds of shell, no Go build,
      # no network. Adding a step is plumbing; adding a job would change the
      # gate's job set, which is not this change's call to make.
      #
      # It needs git, GNU Make and ssh-keygen and refuses to run without them —
      # the signature assertions are the point, and a signing test that passes
      # with no signer is worse than one that stops. All three are present in
      # the runner image (verified against ci-runner:latest, not assumed:
      # git 2.54.0, GNU Make 4.3, /usr/bin/ssh-keygen).
      - name: Test the release-alpha recipe
        run: make test-release-alpha

      # devops.md §4: CI runs the same targets a developer runs. `make fmt` is
      # the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      # ARMED BY #233. `make vet` asks about ONE tag combination and says
      # nothing about the others; vet-tags sweeps every combination in
      # SUPPORTED_TAG_SETS. Until now this could not run here because the
      # sdk/go/gorm/conformance leg was red, and that has been the standing
      # reason the rule was "enforced by reading".
      #
      # It has already caught what reading did not: #360, where an
      # unconstrained test file called a helper defined under `!integration`,
      # so the package stopped typechecking under +integration while `make vet`
      # stayed green and CI reported a healthy tree for a day.
      - name: go vet across every supported tag set
        run: make vet-tags

      # go-qrdb#429. pkg/secure/analyzer is a go vet plugin enforcing three
      # rules that exist because this stack handles key material, and until now
      # it ran NOWHERE -- no target, no job, no .golangci.yml entry. Its rules
      # were enforced by its own unit tests, which prove the ANALYZER works and
      # say nothing about the tree, while pkg/secure's package doc claimed the
      # memguard ban was "enforced by a custom go vet analyzer". A raw memguard
      # import sat in pkg/ceremony's share-store test the whole time, breaching
      # the containment boundary the entire pkg/secure design rests on.
      #
      # It is check-publication-bound's sibling in KIND -- a whole-TREE
      # property, invisible in a single diff, silent when violated; a reviewer
      # cannot see that a new DTO three packages away introduced a raw holder
      # for key material. It sits here rather than beside it in ORDER because
      # this one BUILDS GO, and this job front-loads the sub-second shell
      # guards so that a real violation, not a compile, is the first failure a
      # reader sees.
      #
      # It sweeps BOTH modules under EVERY combination in SUPPORTED_TAG_SETS,
      # via vet-modules.sh. Neither is decoration: `./...` stops at a module
      # boundary and sdk/go held 14 findings of its own that two separate
      # root-module runs never saw, and one root-module finding was visible
      # only under the full tag set.
      - name: pkg/secure rules hold across every module and tag set
        run: make secure-analyzer

      # The gate driven RED on planted violations. A clean tree exercises only
      # the accepting path, and a sweep whose analyzer was neutered or whose
      # -vettool never started prints exactly what a clean one prints. Runs
      # after the gate for the same reason its neighbours do: a real violation
      # should be the first failure a reader sees, not a self-test.
      - name: Test the pkg/secure gate
        run: make test-secure-analyzer

      - name: golangci-lint
        run: make lint

      # Both steps above run `./...` in the ROOT module, and `./...` does not
      # cross a module boundary — so before #333 neither reached a single
      # package of sdk/go. That is the module go-xkms and go-quicbaas import,
      # which makes it the one place a lint finding is a consumer-visible
      # defect, and it was the only module in the tree with no linter at all.
      #
      # Two steps rather than one so the log says which analyser objected.
      - name: go vet (sdk/go module)
        run: make vet-sdk

      - name: golangci-lint (sdk/go module)
        run: make lint-sdk

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Compile-check every package with the default (untagged) build, then the
      # real server binary with the Makefile's default feature tag set — this
      # repository is build-tag driven, so an untagged build alone compiles very
      # little of it.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint (#143): a linter tooling outage must
    # never stop tests from EXECUTING. `ci-gate` still requires lint DIRECTLY
    # and fails closed on `skipped`, so nothing merges on red lint — but test
    # results keep existing while lint is down, instead of CI reporting failure
    # while silently verifying less than it appears to.
    #
    # This comment used to sit above `needs: [lint, build]`, asserting an intent
    # its own dependency list defeated: a lint outage SKIPPED the tests and the
    # gate reported SKIP, producing exactly the outcome the comment says it
    # exists to prevent. The list now matches the claim (#143).
    #
    # `build` is a REAL dependency and stays: the tests cannot run against a
    # tree that does not compile.
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test` = `go test -race -count=1 -v -tags "$(BUILD_TAGS)"
      # ./pkg/... ./cmd/... ./test/buildgates/...`. The tags matter: without
      # them the codec registry is empty and packages such as pkg/invite fail
      # at run time while pkg/api/mcp, pkg/api/unix and pkg/server fail to
      # build at all.
      #
      # ./test/buildgates carries gates over the REPOSITORY rather than the
      # program (#367). The Lint job runs them too, and sooner; they are in the
      # unit target as well so that the entrypoint a developer actually runs
      # reports the same defects CI would.
      # `make coverage` runs the SAME race suite as `make test` over the same
      # packages, plus a coverage profile, and then the coverage gate (#500).
      # It replaces `make test` rather than running beside it, so the gate
      # costs instrumentation overhead and not a second full test run. Nothing
      # `make test` covered is lost: the only differences are
      # ./test/buildgates/... (run in full by the Lint job's
      # check-action-pins) and pkg/api/grpc/proto/qrdbv1 (generated code with
      # no test files, so no tests to run).
      #
      # A failure here names every package that regressed, is new and under
      # the floor, or stopped being measured -- all of them, in one pass.
      - name: Unit tests (race) + coverage gate
        run: make coverage

      # go-qrdb#610. WITH_QRDB_FTS defaults to 0, and `qrdb_fts` is excluded
      # from TEST_TAGS_SETS deliberately (that sweep is about the CLI command
      # surface, which this tag does not vary) -- so until now nothing in CI
      # ever built or ran pkg/fts's real analyzer, tokenizer and inverted
      # index; `make coverage` above measures only the stub in
      # pkg/fts/stub.go. `make coverage-fts` runs `go test -race` under
      # BUILD_TAGS plus qrdb_fts and ratchets the result against its own
      # baseline (test/coverage-baseline-fts.txt), for the reason recorded in
      # that file: a coverage profile does not record its own tags, so a
      # package whose real implementation needs a tag the repo-wide run does
      # not carry needs its own baseline rather than a second, incomparable
      # row in test/coverage-baseline.txt.
      - name: Full-text search (qrdb_fts build) coverage gate
        run: make coverage-fts

      # make test-tags RUNS (not merely vets) ./cmd/qrdbd/... and
      # ./cmd/qrdb/... under the default build plus the four reduced
      # protocol-family rungs (scripts/test-tags.sh). vet-tags (Lint job)
      # proves the tree TYPECHECKS under every declared combination; it has
      # no opinion on whether a test that compiles there also PASSES, which
      # is exactly how a hard-coded subcommand count and two tests
      # expecting a reduced-build-only subcommand to succeed went
      # undetected. Belongs in Test, not Lint: it asserts runtime behavior,
      # not static shape, and Lint already carries vet-tags's 31-sweep
      # static check.
      - name: Protocol-family build tags (runtime)
        run: make test-tags

  test-sdk:
    name: Test (sdk/go module)
    runs-on: ubuntu-latest
    # `sdk/go` is a SEPARATE Go module, so `./pkg/... ./cmd/...` in the `test`
    # job above never reaches it and this repository shipped the SDK untested by
    # CI: `build` compiled it, nothing ran it (go-qrdb#132). The whole guarded-
    # verb transport plane v0.12 rests on — the GuardedKVClient capability and
    # its embedded implementation (#119/#122) and the gRPC one (#123) — merged
    # on green CI that never executed a line of its tests. This is the standing
    # multi-module hazard exactly as written: a nested module's tests that CI
    # never runs can stop compiling, or start racing, without turning anything
    # red. Running the suite once by hand immediately turned up a data race
    # (#131).
    #
    # A separate job rather than another step in `test`: `test` already runs the
    # whole root module under -race and is the long pole, so appending this
    # would serialise them, and a distinct job makes the gate say WHICH module
    # broke.
    #
    # needs EXCLUDES lint for the same reason as `test` above (#143). This job
    # copied neither that comment nor its dependency list from anywhere — it
    # simply inherited `[lint, build]` — so it carried the defect without even
    # the contradicting comment to make it visible.
    needs: [build]
    # sdk/go/node boots real nodes, including single-replica raft groups whose
    # leader election alone costs ~2.4s per shard and more under -race. This is
    # not a pure unit suite and must not inherit a timeout tuned for one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test-sdk` = `cd sdk/go && go test -race -count=1 -v -timeout=30m
      # -tags "$(BUILD_TAGS)" ./...`. The tags are the same set the root `test`
      # job uses and matter for the same reason: without them the codec registry
      # is empty and several packages fail to build outright.
      - name: Unit tests (race, sdk/go module)
        run: make test-sdk

  test-typescript:
    name: Test (TypeScript SDK + desktop frontend)
    runs-on: ubuntu-latest
    # The TypeScript SDK and the desktop frontend had no CI at all, and they
    # rotted unseen: the SDK's DatabaseInfo read `shard_id`/`data_dir` while
    # REST sent `shardId`/`dataDir`; the SDK and UI went on calling share-holder
    # routes the server had removed; svelte-check reported errors nobody saw;
    # and a Playwright mock fell out of step with the Go bindings it stands in
    # for. `make test-typescript` runs the SDK's typecheck, its `npm test` (which
    # typechecks the tests -- the wire contract test pins the SDK's types to a
    # REST response the Go handler test TestDatabaseInfoWire_* holds to the
    # real handler output -- then runs vitest), the SDK build, svelte-check
    # over the frontend against the built SDK, and the MOCKED Playwright tier
    # (no backend).
    #
    # The real-backend and DOM Playwright tiers need a live qrdbd and the
    # headless qrdb CLI; they run through `make test-e2e`, not here.
    #
    # No Go, so no `needs`: it runs beside lint and build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # Fleet dev-cache passthrough (devops.md §2a). The client helper is
      # fetched from the dev-cache repo's own tag rather than assumed
      # pre-installed, and this step FAILS OPEN: if the fetch 404s, times
      # out, or every cache the helper probes is unreachable, nothing is
      # written to $GITHUB_ENV and the step below runs exactly as it does
      # without the cache. Gitea-only: the raw-file route it reads does not
      # exist on github.com, which has no dev-cache to reach anyway.
      - name: Load dev-cache settings (fail open)
        if: github.server_url != 'https://github.com'
        run: |
          if curl -fsS --max-time 5 -o "$RUNNER_TEMP/devcache-env" \
              "${{ github.server_url }}/jeremyhahn/dev-cache/raw/tag/v0.1.0/client/devcache-env"; then
            chmod +x "$RUNNER_TEMP/devcache-env"
            "$RUNNER_TEMP/devcache-env" env >> "$GITHUB_ENV" || true
          fi

      # `make test-typescript` is the whole job, so a developer runs exactly
      # what CI runs: the SDK's npm ci, tsc, npm test and build, then
      # svelte-check on the frontend against the built SDK, then the mocked
      # Playwright tier.
      - name: TypeScript SDK and desktop frontend
        run: make test-typescript

  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint, and now actually does (#143) — see the
    # `test` job above for the full reasoning and for what this list used to
    # say. `ci-gate` requires lint directly and fails closed on `skipped`.
    needs: [build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The multi-protocol CLI suites against two real qrdbd servers in a
      # compose stack. The image bakes the source: a bind mount cannot work
      # here, because compose reaches the HOST daemon through the mounted
      # socket and this checkout's path does not exist on the runner host.
      #
      # The variables are read straight from the shell environment, NOT
      # through ${{ env.X }} -- that expression reads this workflow's own
      # env: block, which does not define them, and would silently write
      # blanks. The runner injects them into the job's process environment
      # (dependency-resolution.md section 6). `make integration-image` does
      # the staging and passes the file as a BuildKit secret; it writes an
      # empty file when the variables are absent, which is what happens on
      # GitHub, where these modules resolve from the public proxy instead.
      # INT_PROJECT namespaces the containers, networks and volumes. Its
      # default is per-HOST, which is not enough here: a runner with capacity 4
      # can land two go-qrdb jobs on the same daemon, and compose would then
      # evict the other run's containers by name. The run id makes it per-run.
      #
      # Read from the shell rather than through a ${{ }} expression: that
      # context has resolved empty before and would hand compose a bare
      # "qrdb-int-" shared by every job, which is the collision this avoids.
      # test/integration/auth, run by no workflow until #228. It is in-memory
      # and needs no compose stack, so it runs FIRST: about two seconds, and
      # the cheapest integration failure this job can report.
      - name: Integration tests (auth, in-memory)
        run: make integration-test-auth

      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      # The server logs are dumped by the make target itself, which is the only
      # place that runs before its own teardown -- a workflow step here fires
      # after the containers are already gone and prints nothing, which is what
      # the first attempt did.

      # Compose leaks containers and volumes when a run is interrupted, and a
      # leftover stack makes the NEXT run fail while attaching. Always tear
      # down, and do not let the teardown itself fail the job.
      #
      # Through `make integration-down`, never a bare `docker compose down`:
      # the compose files require the run's own image name, QRDB_INT_IMAGE,
      # which the Makefile derives from INT_PROJECT, so a bare `down` is
      # refused before it removes anything, and `|| true` would hide that. The
      # target also removes the run's per-run image.
      - name: Tear down the stack
        if: always()
        run: make integration-down INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}" || true

  # The multi-node tenant suites, on every push (strict tenant isolation, plan
  # phase 0; owner ruling 2026-10-02). The full cluster stage runs in
  # integration-cluster below; this is the tenancy slice of it, selected by CLUSTER_TENANCY_RUN in the
  # Makefile, because every strict-isolation phase proves itself on real
  # 3-node clusters and a proof that runs only nightly does not gate the merge
  # it proves. test/buildgates/cluster_tenancy_gate_test.go keeps this job, its
  # target and its place in ci-gate's needs from drifting apart.
  #
  # #418 kept cluster tests off per-push CI because load-sensitive budgets made
  # a required check fail for reasons unrelated to the diff. This slice was
  # measured under shared-host load before it was armed; see the Makefile.
  integration-cluster-tenancy:
    name: Integration (cluster tenancy)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # INT_PROJECT is read from the shell for the same reason as the standalone
      # job above: a per-run compose project, never a shared default.
      #
      # The stage's CPU cap, memory reservation and -parallel bound (#682) are
      # the Makefile's CLUSTER_CPUS, CLUSTER_MEM_RESERVATION and
      # CLUSTER_PARALLEL, applied to the integration-tests compose service.
      # They are not `container: options:` on this job: the job starts that
      # service through the host's dockerd as a container of its own, so a
      # limit on the job would not reach the test process or the qrdbd nodes
      # it spawns.
      - name: Integration tests (cluster tenancy)
        run: |
          export INT_PROJECT="qrdb-int-tenancy-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-cluster-tenancy INT_PROJECT="$INT_PROJECT"

      - name: Tear down the stack
        if: always()
        run: make integration-down INT_PROJECT="qrdb-int-tenancy-${GITHUB_RUN_ID:-local}" || true

  # The FULL cluster suite (go-qrdb#228): every self-spawning single-node and
  # 3-node test under test/integration/, `make integration-test-cluster` with
  # no -run narrowing. It ran nightly from 2026-09-22 to keep #418's
  # load-sensitive raft tests off the push path, and in that time nine of its
  # tests went red on main and stayed red, unnoticed: each was left behind by a
  # bootstrap change (qrdb init as the only system bootstrap, the SO-PIN seal,
  # mtls_binding_policy "required") that a push gate would have refused, and
  # one was hiding a real boot defect -- a restarted node exiting after its
  # unseal. A suite that only reports after the merge does not gate the merge.
  #
  # The tenancy slice above stays as its own job: its selection floor is
  # guarded by test/buildgates/cluster_tenancy_gate_test.go, and it reports the
  # tenant suites separately when this job is red for an unrelated reason.
  #
  # The suite is serial (-p 1, -parallel 1), so its run time is the sum of its
  # tests: 36.7 min quiet and 43.1 min at 2x CPU oversubscription on a 4-CPU
  # budget, over the 45 min package timeout it had. Lowering parallelism had
  # nothing left to give, so it runs as three legs. scripts/cluster-shard.sh
  # deals the `go test -list` output round-robin into one anchored -run
  # expression per leg, and `make check-cluster-shards` (Lint) proves the legs
  # partition the suite. fail-fast is off so one red leg does not cancel the
  # others' results; ci-gate reads the job's aggregate result, which is
  # failure when any leg fails. test/buildgates/cluster_shard_gate_test.go
  # holds this matrix to the Makefile's CLUSTER_SHARDS.
  integration-cluster:
    name: Integration (cluster ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # INT_PROJECT is read from the shell for the same reason as the standalone
      # job above: a per-run compose project, never a shared default. The
      # stage's resource budget is the tenancy job's, set the same way (#682).
      # The project carries the leg: the legs can land on one host's dockerd,
      # and a shared project would tear down a sibling leg's stack.
      - name: Integration tests (cluster ${{ matrix.shard }}/3)
        run: |
          export INT_PROJECT="qrdb-int-cluster-${{ matrix.shard }}-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-cluster INT_PROJECT="$INT_PROJECT" CLUSTER_SHARD=${{ matrix.shard }}/3

      - name: Tear down the stack
        if: always()
        run: make integration-down INT_PROJECT="qrdb-int-cluster-${{ matrix.shard }}-${GITHUB_RUN_ID:-local}" || true

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [lint, build]
    # ci-template v1.9 staged fail-fast (owner ruling 2026-08-20): ORDERING is
    # the fail-fast. lint+build run in minutes and gate the expensive tier, so a
    # broken push reports fast and burns nothing downstream.
    #
    # This paragraph used to justify that with "Gitea has no cancel API, so
    # ORDERING is the only fail-fast available". The REST half is true and the
    # conclusion was not: the workflow-level `concurrency:` block at the top of
    # this file cancels from inside the workflow (#352). Ordering and
    # cancellation are COMPLEMENTARY — ordering bounds what a BROKEN head
    # burns, cancellation sheds a SUPERSEDED one — so keep both, and do not
    # drop `needs: [lint, build]`.
    #
    # This job KEEPS `lint` in needs while the three test jobs above dropped it
    # (#143), and the asymmetry is deliberate rather than an oversight. #143's
    # argument is that a test result which could have existed should exist; a
    # gosec and govulncheck pass over the whole module graph is the expensive
    # tier the owner ruling stages precisely to avoid burning, and its findings
    # keep until the lint outage is over. If that ever stops being the right
    # trade, it is a change to the staged fail-fast ruling, not to this line.
    #
    # (This paragraph previously said the arrangement "supersedes the
    # lint-decoupling of #42, whose silent-skip hazard is closed by the
    # golangci-lint pin". Both halves were wrong: #42 is long closed, the pin
    # closes nothing about skipping, and the hazard was live in this file until
    # #143 — a pinned linter still fails when its tooling or its host does,
    # which is the outage the decoupling is for.)
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # NO NETWORK INSTALL (#179, #195), same reason as the lint job: both tools
      # are baked into the runner image at the pinned versions in the env block
      # above, and the retry loops this replaces were the workaround for a live
      # ENETUNREACH failure rather than a fix for it.
      #
      # gosec stays PINNED to v2.29.0 (owner-ruled fleet-wide 2026-08-26,
      # go-qrdb#154) for the reason measured then: @latest self-updated mid-day
      # and introduced G703, which reddened the Security job on every branch —
      # including main — on code nobody had touched since 2026-04-10. Run 6862
      # on main was green at 08:04Z and run 6885 red at 08:47Z with the
      # offending file identical in both. What the pin does NOT do is fix that
      # finding: v2.29.0 still raises G703 (checked, not assumed) and the
      # Makefile's GOSEC_EXCLUDE entry with its three-legged justification is
      # what clears it. The pin buys reproducibility, not a green gate.
      #
      # THE ASSERTION IS THE DELIVERABLE HERE, NOT THE PIN, and gosec is why.
      # It takes its version string from ldflags rather than from the module
      # path, so `go install ...@v2.29.0` still self-reports `dev` — meaning
      # the job log could not attribute a scan to a scanner version AT ALL, and
      # the workflow comment was the only record of what was requested. The
      # image builds it with `-X main.Version=`, so the baked binary reports
      # v2.29.0 and require-tool.sh can check it. Do not read `dev` in an old
      # log as "unpinned"; read it as "unattributable", which is the defect.
      #
      # govulncheck moves from `@latest` to a pin in this change. Unpinned, the
      # same commit is scanned by different analyser versions on different days
      # and a new finding cannot be distinguished from a scanner that moved.
      - name: Require gosec and govulncheck at the pinned versions
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            gosec "$GOSEC_VERSION" \
            "github.com/securego/gosec/v2/cmd/gosec" \
            -ldflags "-X main.Version=${GOSEC_VERSION}"
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            govulncheck "$GOVULNCHECK_VERSION" \
            "golang.org/x/vuln/cmd/govulncheck"

      # gosec type-loads every package, so the full module graph must be in
      # the local cache BEFORE it runs: on a cold cache its loader surfaces
      # each missing module as `could not import ... (invalid package name)`
      # and fails the job with zero actual findings. `go build` warms the
      # cache as a side effect on the build job, but each job runs in its
      # own container — download explicitly here.
      - name: Download modules
        run: go mod download all

      # `make gosec` carries GOSEC_EXCLUDE and its written justifications in the
      # Makefile, so the exclusion list is single-sourced rather than copied
      # into this file (devops.md §8).
      - name: gosec
        run: make gosec

      # sdk/go is a SEPARATE module and `./...` does not cross a module
      # boundary, so the step above has never scanned one package of it (#293)
      # -- the same gap #333 found for the linter, in the module every consumer
      # actually imports. Its own step so the log says which module objected.
      - name: gosec (sdk/go module)
        run: make gosec-sdk

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report — `|| true` keeps a SARIF-writing failure from double-failing a
      # build the gate step has already judged.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Blocking, in both modules. This is also the §9 forcing function for
      # toolchain currency — it fails on a known-vulnerable stdlib.
      - name: govulncheck (root module)
        run: govulncheck ./...

      - name: govulncheck (sdk/go module)
        working-directory: sdk/go
        run: govulncheck ./...

      - name: go mod verify
        run: make mod-verify

  # Trivy, BLOCKING (go-qrdb#479, owner-ruled 2026-09-22). This reverses the
  # half of #48 that concerned trivy: it left this file because it was
  # known-red (#42), and a required job that cannot pass is "a gate nobody can
  # read". It has been green since 2026-09-20 (87682ea, 1889f2e), so that
  # reason no longer applies.
  #
  # Why it has to be HERE and not only in nightly: trivy is the leg that
  # actually caught CVE-2026-84445. govulncheck was clean on the affected grpc
  # because that advisory has no Go-curated entry in vuln.go.dev -- a COVERAGE
  # gap, not staleness, and no govulncheck setting closes it (see the `vuln`
  # target and #480). A trivy that only runs overnight lets a newly introduced
  # HIGH merge and be found the next morning.
  #
  # Only the CRITICAL/HIGH gate runs per push. The MEDIUM/LOW report stays in
  # nightly.yml, where it "blocks no merge" by design, and so does the
  # scheduled run -- which is what catches advisories published against a
  # QUIET tree that nobody pushes to.
  #
  # Same DAG position as `security` (needs lint + build) under the staged
  # fail-fast ruling, though trivy itself needs neither.
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Fleet dev-cache passthrough (devops.md §2a): the ghcr pull-through
      # mirror also fronts the trivy DB. Same fetch-and-fail-open shape as
      # the TypeScript job above -- see its comment for the reasoning.
      - name: Load dev-cache settings (fail open)
        if: github.server_url != 'https://github.com'
        run: |
          if curl -fsS --max-time 5 -o "$RUNNER_TEMP/devcache-env" \
              "${{ github.server_url }}/jeremyhahn/dev-cache/raw/tag/v0.1.0/client/devcache-env"; then
            chmod +x "$RUNNER_TEMP/devcache-env"
            "$RUNNER_TEMP/devcache-env" env >> "$GITHUB_ENV" || true
          fi

      # PINNED, both the install script and the binary, to the Makefile's
      # TRIVY_VERSION. nightly.yml fetches install.sh from trivy's `main`
      # branch with no version argument, so it runs whatever trivy is newest
      # that night -- a moving ref, in a repository that SHA-pins every action
      # because refs move (#367). A blocking gate cannot be allowed to change
      # its own scanner between two pushes of the same tree.
      - name: Install Trivy CLI (pinned)
        run: |
          v=$(make -s print-trivy-version)
          for i in 1 2 3 4 5; do
            curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${v}/contrib/install.sh" \
              | sh -s -- -b /usr/local/bin "${v}" && exit 0
            echo "trivy install attempt $i failed; retrying in $((i*10))s"
            sleep $((i*10))
          done
          echo "trivy ${v} install failed after 5 attempts" >&2
          exit 1

      # `make trivy` refreshes the database and refuses to certify one older
      # than TRIVY_DB_MAX_AGE_HOURS before scanning (#451) -- falling back from
      # the runner's cache to upstream when the cache is stale -- so a green result
      # means a current database found nothing -- not merely that a scan ran.
      - name: Trivy gate (fail on CRITICAL/HIGH)
        run: make trivy

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # devops.md §1: one gate for branch protection to require, with every job
    # listed explicitly. `join(needs.*.result)` is a GitHub extension that
    # evaluates to an empty string on Gitea, so a gate built on it reports
    # success while jobs fail. Adding a job means adding it to `needs` AND to
    # the env block and the loop below.
    #
    # `fips` is not here because it is not in this workflow: ci-template v1.9
    # moved it to nightly.yml (owner ruling 2026-08-20, go-qrdb#48), and it is
    # waiting on a stability record of fourteen consecutive green scheduled
    # runs before it is armed (#20, docs/seal/fips140-mode.md).
    #
    # `trivy` WAS removed under the same ruling and is back (#479, 2026-09-22).
    # It had been REQUIRED here while known-red (#42), which meant the gate was
    # red on every push from a job nobody could fix in that push -- "not a gate;
    # a gate nobody can read." Removing it was the point of #48. It came back
    # only once it was green, and only because the one advisory govulncheck
    # structurally cannot see (a coverage gap, #480) is one trivy caught.
    #
    # ARMING EITHER ONE AGAIN is a deliberate act, and the whole act: move the
    # job back into this file, add it to `needs`, add its RESULT_ env var, and
    # add a `check` call below. A job that can pass and is not required is a
    # fail-open gate; a job that is required and cannot pass freezes the
    # repository without closing a single finding. Neither is acceptable, which
    # is why the two halves must move together.
    needs: [lint, build, test, test-sdk, test-typescript, integration-standalone, integration-cluster-tenancy, integration-cluster, security, trivy]
    steps:
      - name: Verify every job succeeded
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_TEST_SDK: ${{ needs.test-sdk.result }}
          RESULT_TEST_TYPESCRIPT: ${{ needs.test-typescript.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_INTEGRATION_CLUSTER_TENANCY: ${{ needs.integration-cluster-tenancy.result }}
          RESULT_INTEGRATION_CLUSTER: ${{ needs.integration-cluster.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_TRIVY: ${{ needs.trivy.result }}
        run: |
          status=0
          # skipped is not the same as failed, and BOTH fail the gate. A
          # skipped job means an upstream stage failed (test, integration and
          # security all stage behind lint and build), so naming it prevents
          # the go-qrdb#42 class: a red that reads like a test failure while
          # the tests never ran at all.
          check() {
            name="$1"
            result="$2"
            case "$result" in
              success)  echo "ok:   $name = success" ;;
              skipped)  echo "SKIP: $name (an upstream stage failed - see its job)"; status=1 ;;
              "")       echo "FAIL: $name result is unreadable - failing closed"; status=1 ;;
              *)        echo "FAIL: $name = $result"; status=1 ;;
            esac
          }
          check lint "$RESULT_LINT"
          check build "$RESULT_BUILD"
          check test "$RESULT_TEST"
          check test-sdk "$RESULT_TEST_SDK"
          check test-typescript "$RESULT_TEST_TYPESCRIPT"
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE"
          check integration-cluster-tenancy "$RESULT_INTEGRATION_CLUSTER_TENANCY"
          check integration-cluster "$RESULT_INTEGRATION_CLUSTER"
          check security "$RESULT_SECURITY"
          check trivy "$RESULT_TRIVY"
          exit $status
