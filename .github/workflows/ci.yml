          def unquote(s):
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] == "'":
                  return s[1:-1].replace("''", "'")
              if len(s) >= 2 and s[0] == s[-1] == '"':
                  return json.loads(s)
              return s


          def strip_comment(s):
              q = None
              for i, c in enumerate(s):
                  if q:
                      if c == q:
                          q = None
                  elif c in "'\"":
                      q = c
                  elif c == "#" and (i == 0 or s[i - 1] in " \t"):
                      return s[:i].rstrip()
              return s.rstrip()


          def ind(line):
              return len(line) - len(line.lstrip(" "))


          def body(lines, i, inline):
              """The value text of the key on line i: the inline part plus every deeper line."""
              base, parts = ind(lines[i]), []
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or ind(lines[j]) > base):
                  if lines[j].strip() and not lines[j].lstrip().startswith("#"):
                      parts.append(strip_comment(lines[j]).strip())
                  j += 1
              inline = strip_comment(inline).strip()
              if inline[:1] in ("|", ">"):
                  return (" " if inline[0] == ">" else "\n").join(parts)
              return " ".join([inline] + parts).strip()


          def keys_under(lines, i):
              """(line, key) for each direct child key of the block opened on line i."""
              base, out, child = ind(lines[i]), [], None
              for j in range(i + 1, len(lines)):
                  s = lines[j]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  if ind(s) <= base:
                      break
                  child = ind(s) if child is None else child
                  if ind(s) == child:
                      m = re.match(r"\s*(?:-\s+)?(['\"]?)([^'\":#]+)\1\s*(?::\s*(.*))?$", s)
                      if m:
