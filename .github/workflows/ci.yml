# ci-template: v1.53 + v1.54 runner selection + go-qrdb CUSTOMIZE blocks — canonical CI for all first-party Go repos.
# Ported template steps, not the template's job structure: v1.48 to v1.53
# (Tenant Agent ruling 1087, DS-9947) and v1.54's selection step (ruling
# 1137, handbook 1ad68ab8); the handbook's template holds each version's
# note. v1.48 (ruling 1024): preflight's runner and runner_docker outputs,
# read by CI Gate and by every job that builds or runs an image. v1.54
# (ruling 1137): the preflight step `Balanced runner pool (ruling 1137)`
# sets them, balancing this repository's jobs between the GitHub-hosted and
# the Dells' self-hosted pools by the repository variables CI_HOSTED_SHARE,
# CI_SELF_HOSTED_BIGDISK and CI_SELF_HOSTED_BIGDISK_DOCKER; it replaces
# v1.48's `Hosted or overflow runner (ruling 1024)`, HOSTED_JOBS_PER_REPO
# and HOSTED_QUEUE_GRACE_SECONDS.
# v1.49 (ruling 1047 (3)): preflight runs on the bigdisk pool unless the
# repository variable CI_PREFLIGHT_RUNS_ON says otherwise. v1.50: a short
# Actions API listing is a lower bound. v1.51 and v1.52: the Runner labels
# step checks pull_request_target, and a fork's pull request stays on
# GitHub-hosted runners. v1.53: main's concurrency group is `main-{event}`.
# v1.53 also (Tenant Agent on trusted-firmware #821, handbook 88c10e76,
# DS-9961): (0) `Runner labels (ruling 633)` lets code-review.yml's API-only
# jobs take exactly [self-hosted, linux, x64, bigdisk] for a same-repository
# head under a PR event; a fork's head still takes a standard image. (1) CI
# Gate runs on !cancelled() off pull_request, so a main run cancelled by a
# newer push posts a skipped gate, not a failed one; a pull request keeps
# always(), as a skipped required check counts as passed. (2) Every job that
# builds on a pool host masks the LAN addresses (scripts/ci-mask-lan.sh,
# which also masks single-label and private-suffix host names).
# Before ruling 1087: v1.35.1 + v1.42 hermetic gate + v1.43 hosted first + v1.47.
# v1.47 runner gate (Tenant Agent ruling 1007, handbook ci-template v1.47): the step Runner labels (ruling 633) checks every workflow's runs-on label and waiver category together; codex and qwen run only in code-review.yml (codex with credential:, qwen with hardware:).
# v1.43 hosted first (Tenant Agent rulings 833 and 834, which supersede ruling
# 617's two-pool rule; the owner's 11-07 ruling that GitHub-hosted runners are
# the default): every job runs on the standard GitHub-hosted ubuntu-latest
# runner, free on this public repository. Each job fit one before (fork pull
# requests and dispatches ran every one there); the pool routing had about
# 160 of this repository's jobs queued on the fleet while the hosted slots sat
# idle. A job that cannot fit a standard runner names a pool expression with a
# `# self-hosted: <reason>` line comment naming the hardware or the measured
# hosted limit it exceeds (owner ruling 999); none does today
# (test/buildgates/ci_runners_test.go). The steps that test
# runner.environment (the disk cleanup, the LAN CI registry) keep their
# conditions, so a waived pool job still takes them.
# v1.42 hermetic gate only (owner ruling 742 (1), Tenant Agent rulings 754 and
# 794): the CI Gate's outcome depends only on the tree under test. `make
# deps-check`, `make security` (gosec, govulncheck, go mod verify, trivy fs)
# and `make trivy-image` read the module proxy and advisory databases, so
# they failed PRs and could turn main red with no change to the tree. They
# leave this workflow on every event and run in .github/workflows/scans.yml,
# on workflow_dispatch on main (no schedule: test/buildgates allows only this
# file's nightly to schedule, rulings 135, 216(1) and 633). `make gosec` reads
# only the tree and now runs in the lint job on every event but a docs-only
# PR. Nothing else of v1.36 to v1.42 is taken yet: v1.36 host-local caches
# and in-toolchain-image.sh v6, v1.37 timeouts, v1.38 release label, v1.39/
# v1.40 scoped deps-check and deps-bump, v1.41 PR/main parity and v1.35.2/
# v1.35.3's signatures.yml move are the full catch-up, still to come.
# Ruling 640 (ci-template v1.39 deltas, adopted 2026-11-15): a
# workflow_dispatch on ci/deps-bump is not refused: deps-bump.yml dispatches
# this workflow there, because the PR it opens starts no pull_request run.
# go-qrdb deviations from v1.35.1, one line each (the CUSTOMIZE blocks below
# give each one's reason):
#   - every job runs on the standard GitHub-hosted ubuntu-latest runner by
#     default (owner ruling 999, rulings 833 and 834). Since v1.48 (ruling
#     1024) the jobs that build or run images read preflight's runner_docker
#     and CI Gate its runner, so a run whose hosted pool is full overflows to
#     the Dells' bigdisk pools (a fork's pull request never does), and since
#     v1.49 preflight runs on bigdisk unless CI_PREFLIGHT_RUNS_ON overrides
#     it. Any other pool expression still needs a `# self-hosted: <reason>`
#     comment naming the hardware it needs or the measured hosted limit
#     (disk, memory, the 6-hour job limit) it exceeds, and none does; larger
#     hosted runners are not used; no cache volume, reaper or schedule guard
#     remains
#   - no schedule guard, so preflight merges changes and arch-gates only
#     (DS-7377)
#   - pull_request lists `ready_for_review`, ci-template v1.35.3's trigger,
#     taken ahead of the v1.35.2 Signatures move (DS-8544, m2586)
#   - preflight's timeout is 15 minutes against the template's 10, because it
#     runs the diff and every full-tree architecture gate
#   - a changes-gated `code` tier beside pr, full and nightly (DS-3160)
#   - a docker-build job builds both images once and hands them on as run
#     artifacts (scripts/ci-image.sh); on a push to main it also pushes them
#     to GHCR by digest
#   - lint and image are two jobs, lint-gates a third (#1046)
#   - the unit suites are code-tier jobs, not image steps (ruling 211); the
#     coverage profile is measured in matrix legs and gated by coverage-merge
#   - release-cross linux/arm64 runs on the full tier only (ruling 211)
#   - integration is integration-standalone and integration-features (#674)
#   - a fips job runs both unit suites under FIPS 140-3 mode, full tier
#   - test-typescript is a job of its own
#   - no revert-red-main.yml beside this file
#
# Runners (DS-7377, ruling 617). A GitHub-hosted ubuntu-latest runner, a
# fork's PR's and the schedule's, is an ephemeral VM with 4 vCPUs, 16 GB of
# memory and about 14 GB of free disk, exclusive to one job, with a 6-hour
# job limit, and every job of every event runs on one (owner ruling 999). So:
#   - nothing a job builds survives into another job: docker-build saves each
#     image it builds and uploads it as an artifact, and every consumer
#     downloads and loads it, checking its image ID (scripts/ci-image.sh),
#     and launches every stage by that ID, never by the content-hash tag,
#     which another run on a shared daemon can move;
#   - the Go build and golangci-lint caches live where the scripts/ci-cache-dir
#     step ("Point the stages at the Go caches") puts them (CI_CACHE_DIR, which
#     scripts/in-toolchain-image.sh bind-mounts; #1596). On a hosted runner
#     they are actions/cache entries under $RUNNER_TEMP/ci-cache: a job
#     restores main's newest entry, and only the nightly schedule on main
#     saves one (CI_CACHE_SAVE), so a pull
#     request never writes main's cache. On a
#     self-hosted pool host, whose temp dir is on the root filesystem and
#     outlives the job, they are a generation directory on /mnt/raid0 that
#     every job shares: past CI_CACHE_MAX_GB (40 GB) a new generation becomes
#     current, and an old one is deleted only once no job has used it for
#     CI_CACHE_RECLAIM_HOURS (7, longer than any job), so no running stage
#     loses its bind mount; or they are the stage's named Docker volumes when
#     /mnt/raid0 is not writable. actions/cache is skipped there, and every
#     job removes $RUNNER_TEMP/ci-cache at its end through
#     scripts/ci-cache-clean.sh, which deletes the stages' uid-10001 files as
#     root in the toolchain image and only warns when it cannot;
#   - every job that loads an image first frees a hosted runner's disk (the
#     preinstalled SDKs it never uses); the step runs on the hosted runner
#     alone (runner.environment == 'github-hosted'), never on a pool host,
#     whose images and directories other jobs share (ruling 617);
#   - the stage's CPU and memory bounds, GOMAXPROCS and go's -p are derived
#     from the runner by scripts/in-toolchain-image.sh, never written here;
#   - the long suites run as matrix legs sized for a 4x slowdown against the
#     measured times, each job's estimate at most 150 minutes and every
#     timeout-minutes at most 350 (test/buildgates/ci_runners_test.go).
#
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Never add `GOPROXY: direct` / `GOSUMDB: off` to the env block: GOPRIVATE
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency.
name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk.
    branches: [main]
  pull_request:
    branches: [main]
    # CUSTOMIZE (go-qrdb): no `labeled` (#853). A label change would start a
    # run that the `concurrency` block lets cancel the PR's run in progress,
    # and a run whose jobs an `if:` skips would post `skipped` over the real
    # run's `CI / *` contexts, CI Gate included. The cost: adding `ci:full`
    # waits for the PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`. A draft runs no CI; `ready_for_review` starts the
    # run when it is marked ready (v1.35.3, DS-8544), so no empty commit is
    # needed. test/buildgates/ci_tiers_test.go holds this line.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:                    # re-fire a whole workflow
  # v1.23: main's full tier after every merge and every night at 04:00 UTC
  # (ruling 633, owner decision 219(a): GitHub Actions schedule triggers are
  # allowed for CI soak and fuzz). Scheduled runs are on the default branch.
  # The one scheduler (ruling 135, ruling 216(1), ruling 633); host cron and
  # timers stay banned. test/buildgates/ci_tiers_test.go allows a
  # `schedule:` here alone and holds it to this one cron.
  schedule:
    - cron: '0 4 * * *'

# v1.53 (ruling 1087): on main the group is the workflow and the event,
# `main-{event}`, so a newer main run cancels the older one, queued or in
# progress, and the newest run validates every merge under it. Before v1.53
# (v1.26.2, ruling 145; go-qrdb's since DS-3465) the group also held the
# commit, so main runs never cancelled each other. Every other ref is one
# group, so a PR's newer run cancels the older. v1.29.3: a schedule run's
# group is `schedule-{repository}`, so a repository has one schedule run at a
# time. cancel-in-progress stays a literal `true` (Company Agent m695, m701).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}', github.event_name) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE (go-qrdb): COVER_MIN, the repo-wide floor `make coverage-merge`
  # enforces beside the per-package baseline in test/coverage-baseline.txt (#500).
  COVERAGE_THRESHOLD: 91      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Every analysis step derives its own form from this ONE
  # value; never write the tag list twice.
  # CUSTOMIZE (go-qrdb): exactly `make -s print-build-tags`, the default feature
  # set the coverage baseline was measured under (its `# build-tags:` line), in
  # the same order; the Makefile adopts it as BUILD_TAGS when it is set.
  GO_BUILD_TAGS: "codec_json raft qrdb_ts qrdb_vector qrdb_vlog qrdb_sql qrdb_mysql qrdb_pgsql qrdb_etcd qrdb_embedded codec_msgpack codec_yaml codec_bson codec_protobuf"
  # DS-8233 (bigdisk): Go for the jobs that run natively on the self-hosted
  # pool (coverage-merge, test-clusterproof, coverage-fts). The toolchain
  # image's Go: scripts/tool-pins.sh GO_IMAGE=golang:1.27.4-alpine3.24, which
  # build/docker/devcontainer/Dockerfile takes as ARG GO_IMAGE. Keep the two
  # equal; an exact patch release, never "stable".
  GO_VERSION: '1.27.4'
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch on main), and a PR labelled
  # ci:full. Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read
  # env, so each full-tier job repeats this expression. Keep them equal
  # (test/buildgates/ci_tiers_test.go).
  CI_FULL_TIER: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # CUSTOMIZE (go-qrdb): the one event that publishes, a push to main. It
  # alone pushes the CI images to GHCR; every other event, a fork's pull
  # request included, pushes none (test/buildgates/ci_image_digest_test.go).
  CI_PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # The one event that saves the hosted Go caches (#1597): the nightly
  # schedule on main, one entry a day, not one per push; a pull request reads its entries and never writes one
  # (test/buildgates/ci_runners_test.go).
  CI_CACHE_SAVE: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' }}
  # v1.24 (CA m749, m751 (a)): the files a docs-only PR may touch. Nothing
  # embeds or generates from docs/ or markdown. The gates that read docs/ are
  # lint-class and run in `make lint-gates`, which a docs-only PR still runs.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.54 (ruling 1137): HOSTED_JOBS_PER_REPO and HOSTED_QUEUE_GRACE_SECONDS
  # (v1.48) are removed; the limits of `Balanced runner pool (ruling 1137)`
  # are the repository variables CI_HOSTED_SHARE, CI_SELF_HOSTED_BIGDISK and
  # CI_SELF_HOSTED_BIGDISK_DOCKER.

jobs:
  # v1.24: a PR whose every changed file matches DOCS_ONLY_PATTERN runs lint
  # only. Off pull_request, or on a ci:full PR, docs_only is always false. Any
  # doubt (a failed diff, an empty list) reads as false, so the tier fails
  # toward running the tests.
  #
  # CUSTOMIZE (go-qrdb, DS-3160): docs_only also selects the `code` tier, the
  # jobs that run on every event but a docs-only PR. Each carries exactly
  # `if: needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != ''`
  # (and the draft test) and lists preflight and docker-build in needs; CI Gate
  # excuses its skip only when DOCS_ONLY is true. v1.29.2 (ruling 239(8)): the
  # `if:` also tests docker-build's it_image, empty on a docs-only PR.
  #
  # v1.34: preflight is the changed-file diff and the architecture gates in
  # one job (go-qrdb has no schedule guard, DS-7377).
  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt.
  # CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of the paths that may import
  # go-objstore. A source check with grep, not a stage: it runs on the
  # runner's shell. v1.23: a lint-class check, so it stays on the PR tier.
  # CUSTOMIZE (go-qrdb, DS-3160): make check-public-releasable scans the whole
  # tracked tree, docs included, so a docs-only PR runs these steps; the
  # code-only step skips there.
  preflight:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Preflight
    # m2479: the entry job every other job waits on. git, grep and sh only;
    # no Go, no Docker (the compose-target check, which runs the docker CLI,
    # is a docker-build step).
    # v1.49 (Tenant Agent ruling 1047 (3), (2)): on github.com the Dells'
    # bigdisk pool, so no run waits in the hosted queue for its first ten
    # seconds of work; the repository variable CI_PREFLIGHT_RUNS_ON, runs-on
    # JSON, overrides it (Fleet Ops sets `"ubuntu-latest"`, quotes included,
    # while the Dells are down). Off github.com the forge label, as before.
    # v1.52 (Tenant Agent order): a pull request from a fork (its head
    # repository is not this one) takes ubuntu-latest whatever the variable
    # holds; a fork never reaches a self-hosted runner.
    runs-on: ${{ github.server_url == 'https://github.com' && (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_PREFLIGHT_RUNS_ON || '["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}   # v1.52
    timeout-minutes: 15   # CUSTOMIZE (go-qrdb): the template's 10, plus the full-tree gates
    # v1.48 (ruling 1024): actions: read lets the selection step count this
    # repository's hosted jobs with the job token.
    permissions:
      actions: read
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      # v1.48 (ruling 1024): runs-on JSON for the two hosted-capable classes,
      # read as fromJSON(needs.preflight.outputs.runner_docker) by every job
      # that builds or runs images and fromJSON(needs.preflight.outputs.runner)
      # by CI Gate. `"ubuntu-latest"`, or the Dells' self-hosted label list
      # (v1.54: whichever pool `Balanced runner pool (ruling 1137)` picks).
      runner: ${{ steps.runner.outputs.runner }}
      runner_docker: ${{ steps.runner.outputs.runner_docker }}
    env:
      # go-qrdb: the objstore storage backend, and the embedded transport's
      # volume pool, which is go-objstore's pool type.
      OBJSTORE_SEAMS: 'pkg/storage/objstore/|sdk/go/transport/embedded/'      # CUSTOMIZE
    steps:
      # v1.54 (Tenant Agent ruling 1137, owner order; it replaces the hosted
      # first rule of rulings 999 and 1024, v1.48 to v1.53): the run goes to
      # whichever of the two pools, GitHub-hosted or the Dells' self-hosted
      # bigdisk pools, this repository uses less, so both run full. On
      # github.com this step lists every queued and in-progress run of every
      # workflow of this repository and their latest jobs, through the
      # Actions API with the job token (actions: read), and counts, from that
      # one listing, each in progress plus queued, H: hosted jobs (labels
      # naming an ubuntu-* image and not self-hosted), S1: self-hosted jobs on
      # bigdisk and not bigdisk-docker, and S2: jobs on bigdisk-docker. Jobs
      # of this run are not counted: they wait on this decision. The limits
      # are repository variables set by the Infra Department, plain decimal
      # integers: HS = vars.CI_HOSTED_SHARE (this repository's share of the
      # account's 40 hosted runners; unset, 0 or not a whole number gives a
      # ::warning and HS=12, the v1.48 limit), C1 =
      # vars.CI_SELF_HOSTED_BIGDISK and C2 = vars.CI_SELF_HOSTED_BIGDISK_DOCKER
      # (the units of each label; either unset, 0 or not a whole number: the
      # hosted default with a ::warning). Hosted use is H/HS; self-hosted use
      # is the larger of S1/C1 and S2/C2. Then:
      #   - both below their limit: the lower use wins, compared by
      #     cross-multiplication (self-hosted wins only when S1*HS < H*C1 and
      #     S2*HS < H*C2); a tie goes hosted;
      #   - one pool full (H >= HS; or S1 >= C1 or S2 >= C2): the other pool;
      #   - both full: the pool with fewer queued jobs (bigdisk and
      #     bigdisk-docker together for the Dells); a tie goes hosted.
      # The units are shared across repositories, so C1 and C2 can overstate
      # this repository's free room: when they are busy elsewhere its jobs
      # queue, S1 or S2 rises, and its runs go hosted.
      # It outputs `runner` and `runner_docker` as runs-on JSON:
      # `"ubuntu-latest"`, or `["self-hosted","linux","x64","bigdisk"]` and
      # `["self-hosted","linux","x64","bigdisk-docker"]`. A count it cannot
      # read (a reply that is not 200, a list short of its total_count, a
      # field missing) picks nothing silently: a ::warning names why and the
      # run takes the hosted default. One decision per run: every job of the
      # run takes it, in every workflow that reads these outputs. Off
      # github.com it makes no call, and each job's runs-on keeps its forge
      # label (bigdisk, ci-gate). It runs before the checkout, beside no
      # repository code.
      # v1.52 (Tenant Agent order, kept): on a pull request whose head
      # repository is not this repository (a fork, or a fork since deleted),
      # it makes no call and outputs the hosted default with a ::notice: a
      # fork never reaches a self-hosted runner. Its tests:
      # .github/workflows/testdata/runner-select-tests.py, run by the preflight step "Runner select tests".
      - name: Balanced runner pool (ruling 1137)
        id: runner
        env:
          SERVER: ${{ github.server_url }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
          RUN_ID: ${{ github.run_id }}
          JOB_TOKEN: ${{ github.token }}
          HS: ${{ vars.CI_HOSTED_SHARE }}
          C1: ${{ vars.CI_SELF_HOSTED_BIGDISK }}
          C2: ${{ vars.CI_SELF_HOSTED_BIGDISK_DOCKER }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          selfhosted() { printf '["self-hosted","linux","x64","%s"]' "$1"; }
          emit() {
            echo "runner: $1; runner_docker: $2"
            { echo "runner=$1"; echo "runner_docker=$2"; } >> "$GITHUB_OUTPUT"
          }
          # hosted <why>: no count, so the default, with the reason shown.
          hosted() {
            echo "::warning::runner selection: $1; every job of this run takes the GitHub-hosted default, ubuntu-latest, and none runs on the Dells (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
            exit 0
          }
          if [ "$SERVER" != https://github.com ]; then
            echo "not github.com: each job keeps its forge label (bigdisk, ci-gate); no selection"
            emit "$HOSTED" "$HOSTED"
            exit 0
          fi
          # v1.52: a fork's pull request runs every job on GitHub-hosted runners.
          case "$EVENT" in
            pull_request|pull_request_target)
              if [ "$HEAD_REPO" != "$REPO" ]; then
                echo "::notice::runner selection: this pull request's head repository is not this repository (a fork); every job of this run takes the GitHub-hosted default, ubuntu-latest, and none reaches a self-hosted runner (ci-template v1.52)"
                emit "$HOSTED" "$HOSTED"
                exit 0
              fi ;;
          esac
          # whole <value>: a whole number above 0, at most 6 digits.
          whole() { [[ "$1" =~ ^[0-9]{1,6}$ ]] && [ "$((10#$1))" -gt 0 ]; }
          whole "$C1" || hosted "CI_SELF_HOSTED_BIGDISK='$C1' is unset, 0 or not a whole number, so no bigdisk job can be placed (the Infra Department sets it)"
          whole "$C2" || hosted "CI_SELF_HOSTED_BIGDISK_DOCKER='$C2' is unset, 0 or not a whole number, so no bigdisk-docker job can be placed (the Infra Department sets it)"
          C1=$((10#$C1)) C2=$((10#$C2))
          if whole "$HS"; then
            HS=$((10#$HS))
          else
            echo "::warning::runner selection: CI_HOSTED_SHARE='$HS' is unset, 0 or not a whole number; HS=12 until the Infra Department sets it (ci-template v1.54, ruling 1137)"
            HS=12
          fi
          # get <url> <file>: 0 on a 200 reply, saved in <file>; the answer in
          # CODE. The token reaches curl as a header from a file descriptor.
          get() {
            CODE=$(curl -sS --max-time 30 -o "$2" -w '%{http_code}' \
              -H @<(printf 'Authorization: Bearer %s\n' "$JOB_TOKEN") \
              -H 'Accept: application/vnd.github+json' "$1") || CODE="curl exit $?"
            [ "$CODE" = 200 ]
          }
          # pages <url> <key> <out>: every page of a listing, its <key> items
          # one JSON object per line in <out>. 1, with WHY set, when a reply is
          # not 200 or the items fall short of total_count.
          pages() {
            local p=1 got=0 total n
            : > "$3"
            while :; do
              get "$1&per_page=100&page=$p" "$RUNNER_TEMP/sel-page.json" || { WHY="$1: $CODE"; return 1; }
              total=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no total_count"; return 1; }
              n=$(jq -er --arg k "$2" '.[$k] | arrays | length' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no $2 list"; return 1; }
              jq -c --arg k "$2" '.[$k][]' "$RUNNER_TEMP/sel-page.json" >> "$3"
              got=$((got + n))
              { [ "$got" -lt "$total" ] && [ "$n" -gt 0 ]; } || break
              [ "$p" -lt 10 ] || { WHY="$1: more than 1000 entries"; return 1; }
              p=$((p + 1))
            done
            [ "$got" -ge "$total" ] || { WHY="$1: $got of $total entries"; return 1; }
          }
          : > "$RUNNER_TEMP/sel-runs.jsonl"
          for st in queued in_progress; do
            pages "$API/runs?status=$st" workflow_runs "$RUNNER_TEMP/sel-r.jsonl" || hosted "the Actions API gave no complete run list ($WHY)"
            cat "$RUNNER_TEMP/sel-r.jsonl" >> "$RUNNER_TEMP/sel-runs.jsonl"
          done
          : > "$RUNNER_TEMP/sel-jobs.jsonl"
          for id in $(jq -r '.id' "$RUNNER_TEMP/sel-runs.jsonl" | sort -u); do
            [ "$id" != "$RUN_ID" ] || continue
            pages "$API/runs/$id/jobs?filter=latest" jobs "$RUNNER_TEMP/sel-j.jsonl" || hosted "the Actions API gave no complete job list ($WHY)"
            cat "$RUNNER_TEMP/sel-j.jsonl" >> "$RUNNER_TEMP/sel-jobs.jsonl"
          done
          # H, S1, S2: hosted, bigdisk (not bigdisk-docker) and bigdisk-docker
          # jobs in progress plus queued; HQ, SQ: the queued hosted and
          # self-hosted (both kinds) ones. A job of this run is not counted.
          read -r H S1 S2 HQ SQ < <(jq -rs --argjson run "$RUN_ID" '
              [.[] | select(.run_id != $run and (.status == "queued" or .status == "in_progress"))
                   | (.labels // []) as $l
                   | {q: (.status == "queued"),
                      p: (if ($l | any(. == "self-hosted")) then
                            (if ($l | any(. == "bigdisk-docker")) then "s2"
                             elif ($l | any(. == "bigdisk")) then "s1" else "x" end)
                          elif ($l | any(startswith("ubuntu-"))) then "h"
                          else "x" end)}] as $j
              | def n(f): $j | map(select(f)) | length;
              [n(.p == "h"), n(.p == "s1"), n(.p == "s2"), n(.p == "h" and .q),
               n((.p == "s1" or .p == "s2") and .q)]
              | map(tostring) | join(" ")' "$RUNNER_TEMP/sel-jobs.jsonl") || hosted "the job list could not be counted"
          [ -n "${SQ:-}" ] || hosted "the job list could not be counted"
          echo "this repository: hosted $H of CI_HOSTED_SHARE=$HS ($HQ queued); bigdisk $S1 of CI_SELF_HOSTED_BIGDISK=$C1, bigdisk-docker $S2 of CI_SELF_HOSTED_BIGDISK_DOCKER=$C2 ($SQ self-hosted queued)"
          pick=hosted hfull=0 sfull=0
          [ "$H" -lt "$HS" ] || hfull=1
          { [ "$S1" -lt "$C1" ] && [ "$S2" -lt "$C2" ]; } || sfull=1
          if [ "$hfull" = 1 ] && [ "$sfull" = 1 ]; then
            [ "$SQ" -lt "$HQ" ] && pick=self
            why="both pools full: hosted $HQ queued, self-hosted $SQ queued"
          elif [ "$hfull" = 1 ]; then
            pick=self; why="the hosted pool is full ($H of $HS)"
          elif [ "$sfull" = 1 ]; then
            why="the self-hosted pool is full (bigdisk $S1 of $C1, bigdisk-docker $S2 of $C2)"
          else
            # self-hosted use, max(S1/C1, S2/C2), below hosted use H/HS.
            [ $((S1 * HS)) -lt $((H * C1)) ] && [ $((S2 * HS)) -lt $((H * C2)) ] && pick=self
            why="use hosted $H/$HS, bigdisk $S1/$C1, bigdisk-docker $S2/$C2"
          fi
          if [ "$pick" = self ]; then
            echo "::notice::runner selection: $why; this run's jobs run on the Dells (bigdisk, bigdisk-docker) (ci-template v1.54, ruling 1137)"
            emit "$(selfhosted bigdisk)" "$(selfhosted bigdisk-docker)"
          else
            echo "::notice::runner selection: $why; this run's jobs take the GitHub-hosted default, ubuntu-latest (ci-template v1.54, ruling 1137)"
            emit "$HOSTED" "$HOSTED"
          fi

      # v1.34: the changed-file diff needs the PR's base, and the
      # architecture gates scan the whole tree, so one full checkout serves both.
      # No credential is left in the checkout: nothing after it fetches or pushes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # reads every .github/workflows/*.yml and *.yaml of the repository as
      # text, takes each job whose runs-on names `release` (plain, in a list,
      # or as a quoted string inside an expression), and evaluates its `if:`
      # under every other event: a pull_request or pull_request_target event
      # in a workflow that has that trigger (a), and the push of another
      # branch, a dispatch off main or on a tag, schedule, workflow_run,
      # merge_group, release, create, issue_comment and repository_dispatch
      # (b). A value it cannot know (vars, needs, secrets, the server) may
      # hold anything, so the `if:` must be false whatever it holds; an `if:`
      # it cannot read fails. It prints each file:job and the reason. A lint,
      # not the gate: the runner side refuses such a job as well.
      # v1.43 (ruling 833): on github.com every other job runs on a standard
      # GitHub-hosted image on every event (c), or its runs-on line says why
      # it cannot, `# self-hosted: <reason>`; a larger runner is refused (d).
      # v1.46 (ruling 999): the reason names its category, hardware: or
      # oversize: (credential: for the one Codex review job); a reason with
      # no category is (e).
      # v1.47 (ruling 1007): label and category are checked together. The
      # review-only labels codex and qwen run only in code-review.yml, codex
      # with credential: and qwen with hardware:, and credential: is only for
      # codex; each only on its own job there, codex on review and qwen on
      # review-opencode, in any letter case; a waiver does not lift it (f). A waiver does not make a fork's
      # code trusted either (go-qrdb #1642): a waived self-hosted job in a
      # workflow a pull_request or pull_request_target triggers keeps a fork's
      # PR off its runner, by a top-level `&& head.repo.full_name ==
      # github.repository` (or a non-PR event) in its if:, or a runs-on that
      # resolves hosted for it (g).
      # v1.48 (ruling 1024): in ci.yml, a runs-on that reads
      # needs.preflight.outputs.runner or runner_docker is checked with the
      # output at its default ("ubuntu-latest", which must give a standard
      # image) and at its overflow, where exactly
      # [self-hosted, linux, x64, bigdisk] or [..., bigdisk-docker] passes too.
      # v1.49 (ruling 1047 (3)): the preflight job's own runs-on, which reads
      # vars.CI_PREFLIGHT_RUNS_ON, is checked with the variable unset, where
      # exactly [self-hosted, linux, x64, bigdisk] passes too, and set to
      # `"ubuntu-latest"`, where it must give a standard image.
      # v1.52 (Tenant Agent order): a fork's head under pull_request, as under
      # pull_request_target (v1.51), gets no unset-variable exemption, and the
      # selection outputs read for it are the hosted default the step emits.
      # Its tests: testdata/runner-labels-tests.py, run by the step before it.
      - name: Runner labels tests (go-qrdb #1642)
        run: python3 -I .github/workflows/testdata/runner-labels-tests.py
      # Codex round 1 on #1671: the step "Balanced runner pool (ruling 1137)"
      # run against a stub Actions API (balance, full pools, forks,
      # unset variables, unreadable replies, off github.com); the handbook's
      # v1.54 testdata/runner-select-tests.py, verbatim.
      - name: Runner select tests (go-qrdb #1671)
        run: python3 -I .github/workflows/testdata/runner-select-tests.py
      # Codex round 1 on #1671: scripts/ci-mask-lan.sh masks an entry's
      # userinfo and classifies the host after it, and every mask step runs it.
      - name: LAN mask tests (go-qrdb #1671)
        run: python3 -I .github/workflows/testdata/ci-mask-lan-tests.py
      - name: Runner labels (ruling 633)
        run: |
          python3 -I - <<'PY'
          import glob, json, re, sys

          # Reads .github/workflows/*.yml|yaml as text (no YAML library): the
          # top-level `on:` keys, and each job's `runs-on` and `if`. A job names
          # `release` when that label appears in its runs-on, plain, in a list or as a
          # quoted string in an expression. Its `if` is evaluated under every event
          # outside the release allow-list, with every value this step cannot know
          # (vars, needs, secrets, server_url, ...) unknown; the job passes only when
          # the `if` is false in each of them whatever the unknowns hold.
          U = object()  # unknown value
          OPEN = "$" "{{"  # split, so the runner does not read it as an expression
          ALLOWED = "push to refs/heads/main or refs/tags/*, or workflow_dispatch on main"
          PR = {"pull_request", "pull_request_target"}
          CTX = [  # (event, ref) pairs a release job must never run on
              ("pull_request", "refs/pull/1/merge"), ("pull_request_target", "refs/heads/main"),
              ("push", "refs/heads/feature"), ("workflow_dispatch", "refs/heads/feature"),
              ("workflow_dispatch", "refs/tags/v1.0.0"), ("schedule", "refs/heads/main"),
              ("workflow_run", "refs/heads/main"), ("merge_group", "refs/heads/gh-readonly-queue/main/pr-1"),
              ("release", "refs/tags/v1.0.0"), ("create", "refs/tags/v1.0.0"),
              ("issue_comment", "refs/heads/main"), ("repository_dispatch", "refs/heads/main"),
          ]


          def ctx_get(ev, ref, path):
              p = path.lower()
              name = ref.split("/", 2)[-1]
              # github.event.ref is a payload field: push/create/delete carry the ref;
              # other payloads (a pull_request has no top-level ref, read as '') stay unknown.
              known = {"github.event_name": ev, "github.ref": ref,
                       "github.event.ref": ref if ev in ("push", "create", "delete") else U,
                       "github.ref_name": name,
                       "github.ref_type": "tag" if ref.startswith("refs/tags/") else "branch",
                       "github.head_ref": "feature" if ev in PR else "",
                       "github.base_ref": "main" if ev in PR else ""}
              if p in known:
                  return known[p]
              if ev not in PR and (p == "github.event.pull_request" or p.startswith("github.event.pull_request.")):
                  return None
              return U


          TOK = re.compile(r"\s*(?:(?P<s>'(?:[^']|'')*')|(?P<n>-?\d+(?:\.\d+)?)|(?P<op>&&|\|\||==|!=|<=|>=|[!<>()\[\],.])|(?P<id>[A-Za-z_][\w-]*|\*))")


          def lex(s):
              out, i = [], 0
              while i < len(s):
                  if s[i:].strip() == "":
                      break
                  m = TOK.match(s, i)
                  if not m:
                      raise ValueError(f"cannot read the expression at {s[i:i+20]!r}")
                  i = m.end()
                  if m.group("s"):
                      out.append(("s", m.group("s")[1:-1].replace("''", "'")))
                  elif m.group("n"):
                      out.append(("v", float(m.group("n"))))
                  elif m.group("op"):
                      out.append(("op", m.group("op")))
                  else:
                      out.append(("id", m.group("id")))
              return out


          def truthy(v):
              if v is U:
                  return U
              if isinstance(v, float) and v != v:
                  return False
              return v not in (None, False, 0, "", 0.0)


          def num(v):
              if v is None or v is False:
                  return 0.0
              if v is True:
                  return 1.0
              if isinstance(v, (int, float)):
                  return float(v)
              if isinstance(v, str):
                  try:
                      return float(v.strip() or 0)
                  except ValueError:
                      return float("nan")
              return float("nan")


          def eq(a, b):
              if a is U or b is U:
                  return U
              if isinstance(a, str) and isinstance(b, str):
                  return a.lower() == b.lower()
              if type(a) is type(b) and not isinstance(a, (int, float)):
                  return a == b
              return num(a) == num(b)


          class P:
              def __init__(self, toks, get):
                  self.t, self.i, self.get = toks, 0, get

              def peek(self):
                  return self.t[self.i] if self.i < len(self.t) else (None, None)

              def take(self, want=None):
                  k, v = self.peek()
                  if want is not None and v != want:
                      raise ValueError(f"expected {want!r}, found {v!r}")
                  self.i += 1
                  return k, v

              def parse(self):
                  v = self.orx()
                  if self.i != len(self.t):
                      raise ValueError(f"unexpected {self.peek()[1]!r}")
                  return v

              def orx(self):
                  a = self.andx()
                  while self.peek() == ("op", "||"):
                      self.take()
                      b = self.andx()
                      ta = truthy(a)
                      if ta is True:
                          pass
                      elif ta is False:
                          a = b
                      else:
                          a = U  # a || b returns a when a is truthy: unknown a, unknown result
                  return a

              def andx(self):
                  a = self.cmp()
                  while self.peek() == ("op", "&&"):
                      self.take()
                      b = self.cmp()
                      ta = truthy(a)
                      if ta is False:
                          pass
                      elif ta is True:
                          a = b
                      else:
                          a = U  # a && b returns a when a is falsy: unknown a, unknown result
                  return a

              def cmp(self):
                  a = self.unary()
                  while self.peek()[0] == "op" and self.peek()[1] in ("==", "!=", "<", "<=", ">", ">="):
                      op = self.take()[1]
                      b = self.unary()
                      if op == "==":
                          a = eq(a, b)
                      elif op == "!=":
                          r = eq(a, b)
                          a = U if r is U else not r
                      elif a is U or b is U:
                          a = U
                      else:
                          x, y = (a.lower(), b.lower()) if isinstance(a, str) and isinstance(b, str) else (num(a), num(b))
                          a = {"<": x < y, "<=": x <= y, ">": x > y, ">=": x >= y}[op]
                  return a

              def unary(self):
                  if self.peek() == ("op", "!"):
                      self.take()
                      t = truthy(self.unary())
                      return U if t is U else not t
                  return self.primary()

              def primary(self):
                  k, v = self.take()
                  if k == "s" or k == "v":
                      return v
                  if (k, v) == ("op", "("):
                      r = self.orx()
                      self.take(")")
                      return r
                  if k != "id":
                      raise ValueError(f"unexpected {v!r}")
                  lv = v.lower()
                  if lv in ("true", "false"):
                      return lv == "true"
                  if lv == "null":
                      return None
                  if self.peek() == ("op", "("):
                      self.take()
                      args = []
                      if self.peek() != ("op", ")"):
                          args.append(self.orx())
                          while self.peek() == ("op", ","):
                              self.take()
                              args.append(self.orx())
                      self.take(")")
                      return self.call(lv, args)
                  path, exact = v, True
                  while self.peek() in (("op", "."), ("op", "[")):
                      if self.take()[1] == ".":
                          k2, v2 = self.take()
                          if k2 != "id":
                              raise ValueError(f"unexpected {v2!r} after '.'")
                          path += "." + v2
                          exact = exact and v2 != "*"
                      else:
                          idx = self.orx()
                          self.take("]")
