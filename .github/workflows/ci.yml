          # v1.43 (ruling 833): the standard GitHub-hosted images, free on a public
          # repository; a larger runner (cores, large, xlarge, gpu) bills even there.
          STANDARD = re.compile(r"(ubuntu-(latest|24\.04|22\.04)(-arm)?|ubuntu-slim)")
          LARGER = re.compile(r"(cores|xlarge|large|gpu)", re.I)
          WAIVER = re.compile(r"#\s*self-hosted:\s*(hardware|oversize|credential)\s*:\s*\S")
          BARE = re.compile(r"#\s*self-hosted:")  # v1.46: a waiver whose reason names no category
          # v1.47 (ruling 1007): a review-only label runs only in code-review.yml, and
          # only with its own category; credential: is the codex job's alone.
          REVIEW = {"codex": "credential", "qwen": "hardware"}
          # go-qrdb #1642: each review label is its one review job's, never another
          # job's in code-review.yml; labels match case-insensitively, as on GitHub.
          REVIEW_JOBS = {"codex": "review", "qwen": "review-opencode"}
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          REVIEW_TOKEN = re.compile(r"(?<![\w.-])['\"]?(codex|qwen)['\"]?(?![\w-])", re.I)
          GH = "https://github.com"
          # v1.48 (ruling 1024): ci.yml's preflight runner selection (v1.54:
          # `Balanced runner pool (ruling 1137)`) outputs runs-on JSON,
          # "ubuntu-latest" or the Dells' self-hosted list ("overflow" below). In ci.yml only, a
          # runs-on that reads exactly these outputs is checked under both: the
          # default must be a standard image, as (c) asks of every job, and the
          # overflow may also be exactly the list its output names. Any other
          # self-hosted value still needs its waiver.
          SEL_FILES = {"ci.yml", "ci.yaml"}
          # v1.53 (Tenant Agent on trusted-firmware #821): code-review.yml's
          # API-only guard jobs may take exactly [self-hosted, linux, x64,
          # bigdisk] for a same-repository head under a PR event; a fork's
          # head and every other event still take a standard image.
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          SEL_OUT = {"needs.preflight.outputs.runner": "bigdisk",
                     "needs.preflight.outputs.runner_docker": "bigdisk-docker"}
          OVERFLOW = [["self-hosted", "linux", "x64", v] for v in SEL_OUT.values()]
          # v1.49 (ruling 1047 (3)): ci.yml's preflight job alone may read the
          # repository variable CI_PREFLIGHT_RUNS_ON. Its runs-on is checked in
          # two states of its own, in place of the selection's: unset, where
          # exactly [self-hosted, linux, x64, bigdisk] passes too, and set to the
          # fallback `"ubuntu-latest"`, where it must give a standard image on
          # every event. Another job that reads the variable reads an unknown.
          PRE_JOB = "preflight"
          PRE_VAR = "vars.ci_preflight_runs_on"
          PRE_READ = re.compile(r"(?<![\w.])vars\.CI_PREFLIGHT_RUNS_ON(?![\w-])", re.I)
          HOSTED_CTX = [  # (event, ref, head repo) on github.com; o/r is this repository
              ("push", "refs/heads/main", None), ("push", "refs/heads/feature", None),
              ("pull_request", "refs/pull/1/merge", "o/r"), ("pull_request", "refs/pull/1/merge", "fork/r"),
              ("workflow_dispatch", "refs/heads/main", None), ("schedule", "refs/heads/main", None),
              # v1.51: the base-defined PR event code-review.yml and signatures.yml run on.
              ("pull_request_target", "refs/heads/main", "o/r"), ("pull_request_target", "refs/heads/main", "fork/r"),
          ]


          def hosted_get(ev, ref, head, sel=None):
              def get(path):
                  p = path.lower()
                  if sel and p in SEL_OUT:  # v1.48: the selection output, as JSON text
                      # v1.52: the step outputs the hosted default for a fork's head under pull_request.
                      fork_pr = ev == "pull_request" and head == "fork/r"
                      return json.dumps("ubuntu-latest" if sel == "default" or fork_pr else ["self-hosted", "linux", "x64", SEL_OUT[p]])
                  if sel in ("unset", "set") and p == PRE_VAR:  # v1.49: unset, or the fallback switch
                      return None if sel == "unset" else json.dumps("ubuntu-latest")
                  if p == "github.server_url":
                      return GH
                  if p == "github.repository":
                      return "o/r"
                  if p == "github.event.pull_request.head.repo.full_name":
                      return head if ev in PR else None
                  if p == "github.event.pull_request.draft":
                      return False if ev in PR else None
                  return ctx_get(ev, ref, path)
              return get


          def labels(value):
              # A runs-on value's labels: a string, a list, or an expression's result.
              if value is U or value is None:
                  return None
              if isinstance(value, list):
                  return [str(x) for x in value]
              return [str(value)]


          def runs_on_labels(text, ev, ref, head, sel=None):
              t = text.strip()
              if t.startswith("group:") or t.startswith("labels:") or " labels:" in t:
                  m = re.search(r"labels:\s*(\[[^\]]*\]|\S+)", t)
                  t = m.group(1) if m else ""
              m = re.fullmatch(r"\$\{\{(.*)\}\}", unquote(t), re.S)
              if m:
                  return labels(P(lex(m.group(1)), hosted_get(ev, ref, head, sel)).parse())
              if t.startswith("["):
                  return [unquote(x) for x in re.split(r"\s*,\s*", t.strip("[] ")) if x]
              if t.startswith("- "):
                  return [unquote(x) for x in re.split(r"\s*-\s+", " " + t) if x.strip()]
              return [unquote(t)]


          def review_labels(text):
              # The review-only labels a runs-on names, in its text or in what an
              # expression there yields on any github.com event.
              found = {m.lower() for m in REVIEW_TOKEN.findall(text)}
              for ev, ref, head in HOSTED_CTX:
                  try:
                      got = runs_on_labels(text, ev, ref, head)
                  except ValueError:
                      continue
                  found |= {g.lower() for g in got or [] if g.lower() in REVIEW}
              return sorted(found)


          def review_finding(path, job, where, ro, ro_line):
              # v1.47 (ruling 1007): label and category together, whatever the waiver says.
              names = review_labels(ro)
              m = WAIVER.search(ro_line)
              cat = m.group(1) if m else None
              base = path.replace("\\", "/").rsplit("/", 1)[-1]
              if names and base not in REVIEW_FILES:
                  return (f"{where}: (f) names the review-only label {', '.join(names)}; ruling 1007 reserves codex and "
                          f"qwen to code-review.yml whatever the `# self-hosted:` waiver says")
              elsewhere = [n for n in names if job != REVIEW_JOBS[n]]
              if elsewhere:
                  return (f"{where}: (f) names the review-only label {', '.join(elsewhere)}, reserved to code-review.yml's "
                          f"{', '.join(REVIEW_JOBS[n] for n in elsewhere)} job; labels match case-insensitively (go-qrdb #1642)")
              if names:
                  wrong = [n for n in names if cat != REVIEW[n]]
                  if len(names) > 1 or wrong:
                      return (f"{where}: (f) runs on {', '.join(names)} with the category {cat or 'none'}; ruling 1007 pairs "
                              f"codex with `credential:` and qwen with `hardware:`, one review label per job")
                  return None
              if cat == "credential":
                  return (f"{where}: (f) uses the `credential:` category without the codex label; ruling 1007 keeps it "
                          f"for code-review.yml's Codex review job alone")
              return None


          def names_release(text):
              return re.search(r"(?<![\w.-])['\"]?release['\"]?(?![\w-])", text) is not None


          def condition(text):
              t = unquote(text) if text else ""
              m = re.fullmatch(r"\s*\$\{\{(.*)\}\}\s*", t, re.S)
              if m and OPEN not in m.group(1):
                  return m.group(1)
              if OPEN in t:
                  raise ValueError("text around the expression makes it a string, which is always true")
              return t


          # go-qrdb #1642's Codex review: a waiver does not make a fork's code
          # trusted. A fork's pull request (its event, its ref, its head).
          FORK_CTX = [("pull_request", "refs/pull/1/merge"), ("pull_request_target", "refs/heads/main")]


          def conjuncts(toks):
              # The top-level && operands; an expression with a top-level || is one.
              parts, cur, depth = [], [], 0
              for t in toks:
                  if t == ("op", "("):
                      depth += 1
                  elif t == ("op", ")"):
                      depth -= 1
                  elif depth == 0 and t == ("op", "||"):
                      return [toks]
                  elif depth == 0 and t == ("op", "&&"):
                      parts.append(cur)
                      cur = []
                      continue
                  cur.append(t)
              return parts + [cur]


          def fork_runs(ro, cond, ev, ref):
              # Whether a fork's ev can run the job on a self-hosted runner.
              try:
                  got = runs_on_labels(ro, ev, ref, "fork/r")
              except ValueError:
                  got = None
              if got is not None and len(got) == 1 and STANDARD.fullmatch(got[0]):
                  return False
              if cond is None:
                  return True
              try:
                  parts = conjuncts(lex(condition(cond)))
              except ValueError:
                  return True
              get = hosted_get(ev, ref, "fork/r")
              for c in parts:
                  try:
                      if truthy(P(c, get).parse()) is False:
                          return False
                  except ValueError:
                      pass
              return True


          def fork_finding(where, on, ro, cond):
              runs = [ev for ev, ref in FORK_CTX if ev in on and fork_runs(ro, cond, ev, ref)]
              if not runs:
                  return None
              return (f"{where}: (g) runs on a self-hosted runner and a fork's {' or '.join(runs)} can run it; a waiver "
                      f"does not make a fork's code trusted: AND `github.event.pull_request.head.repo.full_name == "
                      f"github.repository` into its `if:`")


          def check(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              on = triggers(lines)
              bad = []
              for i, s in enumerate(lines):
                  if re.match(r"jobs\s*:\s*(#.*)?$", s):
                      for j, job, _ in keys_under(lines, i):
                          ro = cond = ro_line = None
                          for k, key, inline in keys_under(lines, j):
                              if key == "runs-on":
                                  ro, ro_line = body(lines, k, inline), lines[k]
                              elif key == "if":
                                  cond = body(lines, k, inline)
                          where = f"{path}:{job}"
                          if ro is not None and not names_release(ro):
                              # v1.43 (ruling 833): hosted first.
                              if LARGER.search(ro) and re.search(r"ubuntu|windows|macos", ro):
                                  bad.append(f"{where}: (d) names a larger GitHub-hosted runner ({ro}); it bills on a public repository")
                                  continue
                              rf = review_finding(path, job, where, ro, ro_line)
                              if rf:
                                  bad.append(rf)
                                  continue
                              if WAIVER.search(ro_line):
                                  fk = fork_finding(where, on, ro, cond)
                                  if fk:
                                      bad.append(fk)
                                  continue
                              off = []
                              sels = ("default", "overflow") if path.replace("\\", "/").rsplit("/", 1)[-1] in SEL_FILES else (None,)
                              if sels[0] is not None and job == PRE_JOB and PRE_READ.search(ro):
                                  sels = ("unset", "set")  # v1.49: its own two states, no selection output
                              for ev, ref, head in HOSTED_CTX:
                                  # v1.51: under pull_request_target, a fork's head never
                                  # reaches a self-hosted runner, overflow or not.
                                  # v1.52: under pull_request too.
                                  fork_target = ev in PR and head == "fork/r" and ev in on
                                  for sel in sels:
                                      try:
                                          got = runs_on_labels(ro, ev, ref, head, sel)
                                      except ValueError as e:
                                          off.append(f"{ev} ({ref}): cannot be read ({e})")
                                          continue
                                      if got is not None and sel == "overflow" and got in OVERFLOW and not fork_target:
                                          continue
                                      if sel == "unset" and got == OVERFLOW[0] and not fork_target:
                                          continue
                                      if (sel is None and got == OVERFLOW[0] and ev in PR and head == "o/r"
                                              and path.replace("\\", "/").rsplit("/", 1)[-1] in REVIEW_FILES):
                                          continue  # v1.53: a same-repository head's review guard
                                      if got is None or len(got) != 1 or not STANDARD.fullmatch(got[0]):
                                          what = "an unknown label" if got is None else ", ".join(got)
                                          note = ", runner selection overflow" if sel == "overflow" else ""
                                          if sel in ("unset", "set"):
                                              note = ", CI_PREFLIGHT_RUNS_ON " + ("unset" if sel == "unset" else 'set to "ubuntu-latest"')
                                          if fork_target and got is not None:
                                              note += f", {ev}: a fork never reaches a self-hosted runner"
                                          off.append(f"{ev} ({ref}{', fork' if head == 'fork/r' else ''}{note}): {what}")
                              if off and BARE.search(ro_line):
                                  bad.append(f"{where}: (e) its `# self-hosted:` reason names no category; ruling 999 allows a self-hosted job "
                                             f"only as `# self-hosted: hardware: <reason>` or `# self-hosted: oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                              elif off:
                                  bad.append(f"{where}: (c) does not run on a standard GitHub-hosted image on github.com and its runs-on "
                                             f"line gives no `# self-hosted: hardware|oversize: <reason>`; it runs on " + "; ".join(dict.fromkeys(off)))
                              continue
                          if ro is None:
                              continue
                          if cond is None:
                              if on & PR:
                                  bad.append(f"{where}: (a) names `release` in a workflow with a pull_request trigger, and has no `if:`")
                              bad.append(f"{where}: (b) names `release` and has no `if:` restricting it to {ALLOWED}")
                              continue
                          try:
                              expr = condition(cond)
                              toks = lex(expr)
                              runs = []
                              for ev, ref in CTX:
                                  r = truthy(P(toks, lambda p: ctx_get(ev, ref, p)).parse())
                                  if r is not False:
                                      runs.append((ev, ref))
                          except ValueError as e:
                              bad.append(f"{where}: (b) names `release` and its `if:` cannot be read ({e})")
                              continue
                          pr = [c for c in runs if c[0] in PR and c[0] in on]
                          if pr:
                              bad.append(f"{where}: (a) names `release` and a {pr[0][0]} event can run it")
                          rest = [c for c in runs if c not in pr]
                          if rest:
                              bad.append(f"{where}: (b) names `release` and its `if:` does not restrict it to {ALLOWED}; it can run on "
                                         + ", ".join(dict.fromkeys(f"{ev} ({ref})" for ev, ref in rest)))
              return bad


          files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
          bad = []
          for f in files:
              try:
                  bad += check(f)
              except (OSError, UnicodeError) as e:
                  bad.append(f"{f}: cannot be read ({e})")
          for b in bad:
              print(f"::error::{b}")
          if bad:
              print(f"{len(bad)} runner-label finding(s) in {len(files)} workflow file(s): a `release` job runs only on {ALLOWED}, never for a pull request (ruling 633); every other job runs on a standard GitHub-hosted image, or its runs-on line names a hardware or oversize reason (rulings 833, 999); codex and qwen run only in code-review.yml, with their own category (ruling 1007); a fork's pull request never reaches a self-hosted job (go-qrdb #1642)")
              sys.exit(1)
          print(f"OK: {len(files)} workflow file(s); every job that names `release` runs only on {ALLOWED}, and every other job on a standard GitHub-hosted image or with a hardware or oversize reason")
          PY

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: No direct go-objstore import outside the storage seam
        if: steps.diff.outputs.docs_only != 'true'
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

      # CUSTOMIZE (go-qrdb): no tracked file carries a fleet value (AGENTS.md,
      # "The whole tracked tree is publicly releasable"). The patterns are a
      # repository secret, written to a file outside the checkout, read, and
      # removed; they never enter the tree or a log. A repository or a fork
      # without the secret cannot run the scan: the step says so in a warning
      # rather than pass it silently (DS-7377).
      - name: make check-public-releasable
        env:
          PUBLIC_RELEASE_PATTERNS: ${{ secrets.PUBLIC_RELEASE_PATTERNS }}
        run: |
          if [ -z "$PUBLIC_RELEASE_PATTERNS" ]; then
            echo "::warning::PUBLIC_RELEASE_PATTERNS is not set for this run: make check-public-releasable did not run"
            exit 0
          fi
          umask 077
          printf '%s\n' "$PUBLIC_RELEASE_PATTERNS" > "$RUNNER_TEMP/public-release-patterns"
          PUBLIC_RELEASE_PATTERNS_FILE="$RUNNER_TEMP/public-release-patterns" make check-public-releasable
          rm -f "$RUNNER_TEMP/public-release-patterns"
  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). This job builds the images
  # once from build/docker/devcontainer/Dockerfile at this commit and hands
  # them on (DS-7377, scripts/ci-image.sh):
  #   - each image is saved and uploaded as a run artifact, `toolchain-image`
  #     and, off a docs-only PR, `it-image`, kept for a day; its tag and image
  #     ID are this job's outputs, and every consumer loads the artifact and
  #     refuses an image whose ID is not this one. The artifact path needs no
  #     registry credential, so a fork's pull request runs it the same way;
  #   - on a push to main (CI_PUBLISH) both are also pushed to GHCR under the
  #     repository owner with the run's own GITHUB_TOKEN, by the image ID the
  #     save recorded, tagged <content-hash>-main-<run id>-<attempt>
  #     (#1597), and their digest references are toolchain_ref
  #     and it_ref, for developers and the release workflow. No consumer in
  #     this run pulls them.
  # A consumer never rebuilds: the integration stage upgrades its Alpine
  # packages at build time, so a rebuild of the same commit can differ.
  #
  # The forge credentials reach the image build only as the gomodauth BuildKit
  # secret, from a file outside the context that the job removes. No step and
  # no make target prints that file, the job environment (`env`, `printenv`,
  # `set -x`) or a matched line (ci-standard.md §5, Company Agent m605 item 8).
  docker-build:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer images
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner_docker) }}   # v1.48 (ruling 1024)
    needs: [preflight]
    timeout-minutes: 90
    # CUSTOMIZE (go-qrdb): on a push to main this job alone pushes the images
    # to GHCR, so it alone may write packages.
    permissions:
      contents: read
      packages: write
    outputs:
      toolchain_image: ${{ steps.build.outputs.toolchain_image }}
      toolchain_id: ${{ steps.save.outputs.toolchain_id }}
      # v1.29.2 (ruling 239(8)): the code-tier jobs' `if:` reads it, empty on
      # a docs-only PR.
      it_image: ${{ steps.build.outputs.it_image }}
      it_id: ${{ steps.save.outputs.it_id }}
      toolchain_ref: ${{ steps.push.outputs.toolchain_ref }}
      it_ref: ${{ steps.push.outputs.it_ref }}
      # #1593 (rulings 682/687): the tag each image carries in the LAN CI
      # registry (secrets.CI_IMAGE_REGISTRY), empty when it was not pushed there.
      # The tag alone crosses jobs: an output naming the masked registry would
      # be dropped.
      registry_toolchain_tag: ${{ steps.registry.outputs.toolchain_tag }}
      registry_it_tag: ${{ steps.registry.outputs.it_tag }}
    env:
      # #1593: the LAN CI registry, a repository secret so every log line
      # masks it; secrets cannot gate a step's if:, the job's env can.
      CI_REGISTRY: ${{ secrets.CI_IMAGE_REGISTRY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. A runner that injects them as plain environment
      # (dependency-resolution.md §6) does not mask them in the log by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well. On a runner that injects none the step does nothing.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        # v1.53: a registry a later step takes from `vars` is masked here.
        # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
        # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3). None
        # here: CI_REGISTRY comes from secrets.CI_IMAGE_REGISTRY, which the
        # runner masks, and the buildgates refuse any vars.CI_IMAGE_REGISTRY.
        run: scripts/ci-mask-lan.sh

      # CUSTOMIZE (go-qrdb): every compose service that names a build target
      # names a stage its Dockerfile declares, with each overlay resolved by
      # `docker compose config` (client-side, no daemon). The toolchain image
      # carries no Docker CLI, so the check runs on the runner's. A docker-build
      # step since m2479: preflight runs on the bigdisk pool, which has no
      # Docker, and this job has Docker (bigdisk-docker or hosted) and runs on
      # every event preflight does.
      - name: make check-compose-targets test-compose-targets
        if: needs.preflight.outputs.docs_only != 'true'
        run: make check-compose-targets test-compose-targets

      # CUSTOMIZE (go-qrdb, DS-7377): the preinstalled SDKs no stage uses take
      # most of a hosted runner's disk; the two images and their tars need it.
      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # v1.29 (ruling 220(5)): the Alpine package index checksum joins the
      # integration image's tag hash (scripts/apk-index-sum.sh). A base image
      # the script cannot read fails the step. Every caller runs
      # `make -s apk-index-sum`, which gives the script the GO_IMAGE pin from
      # scripts/tool-pins.sh. A docs-only PR builds no integration image and
      # reads none. The consumers take the image's tag from this job's
      # outputs, so no other job reads the sum.
      - name: Read the Alpine package index
        if: ${{ needs.preflight.outputs.docs_only != 'true' }}
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # #1609 (P1): scripts/image-registry.sh pulls an image from the runner's
      # CI_IMAGE_REGISTRY only by the repo digest a push recorded in
      # CI_IMAGE_DIGEST_DIR, one file per content-hash name (':' as '_'). The
      # record lives in the GitHub cache, never in the repository or the
      # registry: each self-hosted build restores the newest record for its
      # name, and a push to main alone (CI_PUBLISH) saves one, when its own
      # push wrote a new digest, so a pull request never writes a record. No
      # record is a miss, and the image is built.
      - name: Name the devcontainer images
        id: names
        if: ${{ runner.environment != 'github-hosted' }}
        env:
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }}
        run: |
          t=$(make -s toolchain-image)
          echo "toolchain_record=${t//:/_}" >> "$GITHUB_OUTPUT"
          if [ "$DOCS_ONLY" != true ]; then
            i=$(make -s it-image)
            echo "it_record=${i//:/_}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the toolchain image's digest record
        if: ${{ steps.names.outputs.toolchain_record != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-image-digests/${{ steps.names.outputs.toolchain_record }}
          key: ci-image-digest-${{ steps.names.outputs.toolchain_record }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-image-digest-${{ steps.names.outputs.toolchain_record }}-

      - name: Restore the integration image's digest record
        if: ${{ steps.names.outputs.it_record != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-image-digests/${{ steps.names.outputs.it_record }}
          key: ci-image-digest-${{ steps.names.outputs.it_record }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-image-digest-${{ steps.names.outputs.it_record }}-

      - name: Build the devcontainer images
        id: build
        env:
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }}
          # #1609: set on a self-hosted runner alone; unset, no pull is tried.
          CI_IMAGE_DIGEST_DIR: ${{ runner.environment != 'github-hosted' && format('{0}/ci-image-digests', runner.temp) || '' }}
          TOOLCHAIN_RECORD: ${{ steps.names.outputs.toolchain_record }}
          IT_RECORD: ${{ steps.names.outputs.it_record }}
        run: |
          # The digest each record holds before the build; a record the build's
          # push changed is saved to the cache below.
          record() { [ -n "$CI_IMAGE_DIGEST_DIR" ] && [ -n "$1" ] && cat "$CI_IMAGE_DIGEST_DIR/$1" 2>/dev/null || true; }
          toolchain_was=$(record "$TOOLCHAIN_RECORD")
          it_was=$(record "$IT_RECORD")
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          # Each build writes its own image ID to a file of this job's
          # (--iidfile), and pin tags that ID under a per-run tag: never a
          # lookup of the shared content-hash tag, which another job on the
          # daemon can retag between the build and the pin. save archives
          # the pin.
          iids=$(mktemp -d "$RUNNER_TEMP/iid.XXXXXX")
          if [ "$DOCS_ONLY" = true ]; then
            make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" TOOLCHAIN_IIDFILE="$iids/toolchain"
            it_image=
          else
            make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" TOOLCHAIN_IIDFILE="$iids/toolchain" IT_IIDFILE="$iids/it"
            it_image=$(make -s it-image)
          fi
          rm -f "$RUNNER_TEMP/gomodauth.env"
          scripts/ci-image.sh pin "$(make -s toolchain-image)" "$iids/toolchain" >/dev/null
          if [ -n "$it_image" ]; then scripts/ci-image.sh pin "$it_image" "$iids/it" >/dev/null; fi
          rm -rf "$iids"
          echo "toolchain_image=$(make -s toolchain-image)" >> "$GITHUB_OUTPUT"
          echo "it_image=$it_image" >> "$GITHUB_OUTPUT"
          now=$(record "$TOOLCHAIN_RECORD")
          if [ -n "$now" ] && [ "$now" != "$toolchain_was" ]; then echo "toolchain_recorded=true" >> "$GITHUB_OUTPUT"; fi
          now=$(record "$IT_RECORD")
          if [ -n "$now" ] && [ "$now" != "$it_was" ]; then echo "it_recorded=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the toolchain image's digest record
        if: ${{ env.CI_PUBLISH == 'true' && steps.build.outputs.toolchain_recorded == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-image-digests/${{ steps.names.outputs.toolchain_record }}
          key: ci-image-digest-${{ steps.names.outputs.toolchain_record }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the integration image's digest record
        if: ${{ env.CI_PUBLISH == 'true' && steps.build.outputs.it_recorded == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-image-digests/${{ steps.names.outputs.it_record }}
          key: ci-image-digest-${{ steps.names.outputs.it_record }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the devcontainer images
        id: save
        env:
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          id=$(scripts/ci-image.sh save "$TOOLCHAIN_IMAGE" "$RUNNER_TEMP/toolchain-image")
          echo "toolchain_id=$id" >> "$GITHUB_OUTPUT"
          if [ -n "$IT_IMAGE" ]; then
            id=$(scripts/ci-image.sh save "$IT_IMAGE" "$RUNNER_TEMP/it-image")
            echo "it_id=$id" >> "$GITHUB_OUTPUT"
          fi

      # compression-level 1: an image tar is mostly compressed layers already,
      # and the default level spends minutes for little.
      - name: Upload the toolchain image
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image/image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: Upload the integration image
        if: ${{ steps.build.outputs.it_image != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image/image.tar
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      # #1593 (rulings 682/687): on a self-hosted runner with
      # secrets.CI_IMAGE_REGISTRY set (CI_REGISTRY in the job's env), push both
      # images to the LAN CI registry,
      # tagged <run_id>-<run_attempt>; the consumers pull them from there and
      # fall back to the artifacts above, which stay the path on GitHub-hosted
      # runners. The address is a secret, so the runner masks it in every
      # line; no run: script names it with ${{ }}. A refused
      # push is a warning: its consumers take the artifact.
      - name: Push the devcontainer images to the LAN CI registry
        id: registry
        if: ${{ env.CI_REGISTRY != '' && runner.environment != 'github-hosted' }}
        env:
          TAG: ${{ github.run_id }}-${{ github.run_attempt }}
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          . scripts/image-registry.sh
          lan_push() {
            ref="$CI_REGISTRY/go-qrdb/$2:$TAG"
            if ! ci_registry_skip "$CI_REGISTRY" "${ref#"$CI_REGISTRY"/}" &&
               docker tag "$1" "$ref" >/dev/null 2>&1 && timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker push -q "$ref" >/dev/null 2>&1; then
              echo "$3=$TAG" >> "$GITHUB_OUTPUT"
            else
              ci_registry_outage "$CI_REGISTRY" "$?"
              echo "::warning::the push of $2 to the LAN CI registry failed; its consumers take the artifact"
            fi
            docker rmi "$ref" >/dev/null 2>&1 || true
          }
          lan_push "$TOOLCHAIN_IMAGE" toolchain-image toolchain_tag
          if [ -n "$IT_IMAGE" ]; then
            lan_push "$IT_IMAGE" it-image it_tag
          fi

      # CUSTOMIZE (go-qrdb): on a push to main alone, push each image once per
      # run and output its digest reference. #1597: the push takes the ID the
      # save step recorded and pushes a per-run tag created from it
      # (<content-hash>-main-<run id>-<attempt>), never the shared
      # content-hash tag, which another run can move on a shared daemon.
      # scripts/ci-image.sh feeds the login to docker on stdin, into a private
      # DOCKER_CONFIG it deletes, and validates every reference it prints
      # (check-ref: a digest reference under the repository owner in GHCR).
      # A refused login or push fails the job. Every other event skips it.
      - name: Push the devcontainer images to GHCR
        id: push
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
          TOOLCHAIN_ID: ${{ steps.save.outputs.toolchain_id }}
          IT_ID: ${{ steps.save.outputs.it_id }}
        run: |
          toolchain_ref=$(scripts/ci-image.sh push "$TOOLCHAIN_IMAGE" go-qrdb-toolchain "$TOOLCHAIN_ID")
          it_ref=
          if [ -n "$IT_IMAGE" ]; then
            it_ref=$(scripts/ci-image.sh push "$IT_IMAGE" go-qrdb-ci-it "$IT_ID")
          fi
          echo "toolchain_ref=$toolchain_ref" >> "$GITHUB_OUTPUT"
          echo "it_ref=$it_ref" >> "$GITHUB_OUTPUT"

      - name: Tear down
        if: always()
        env:
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          rm -rf "$RUNNER_TEMP/gomodauth.env" "$RUNNER_TEMP/toolchain-image" "$RUNNER_TEMP/it-image" "$RUNNER_TEMP/ci-image-digests"
          if [ -n "$TOOLCHAIN_IMAGE" ]; then scripts/ci-image.sh untag "$TOOLCHAIN_IMAGE" ${IT_IMAGE:+"$IT_IMAGE"}; fi

      # #1597: a pool daemon outlives the job, and each commit's integration
      # image has its own tag; drop the CI images neither built nor tagged in
      # the last 24 h, never one a running container uses.
      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  # Every stage below runs its `make` target in the toolchain image as its own
  # step, through scripts/in-toolchain-image.sh, which copies the checkout
  # into the container. A failed step names its stage; `if: !cancelled()` runs
  # every stage after a failed one, so one run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (scripts/tool-pins.sh) decides every version, and the Makefile carries
  # every flag set. GO_BUILD_TAGS reaches every target as a make variable.
  # build, test and lint run with no network, on the image's module cache;
  # security and deps-check got one (IN_IMAGE_NETWORK=bridge) until v1.42
  # moved them to scans.yml (ruling 742 (1)).
  #
  # CUSTOMIZE (go-qrdb, #1046, Company Agent m1001): the stages run in jobs
  # side by side, lint (make lint, make gosec), lint-gates, and image (the
  # tag assertion, build, the release cross-build), each with its own limit.
  # v1.42 (ruling 742 (1)): deps-check, security and trivy image left them
  # for scans.yml. lint and
  # lint-gates are the PR tier and are all a docs-only PR runs of the stages;
  # image is the code tier (DS-3160).
  lint:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer image [lint, gosec, gosec-sdk]
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner_docker) }}   # v1.48 (ruling 1024)
    needs: [preflight, docker-build]
    timeout-minutes: 120
    env:
      CI_REGISTRY: ${{ secrets.CI_IMAGE_REGISTRY }}   # #1593: the LAN CI registry
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        # v1.53: a registry a later step takes from `vars` is masked here.
        # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
        # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3). None
        # here: CI_REGISTRY comes from secrets.CI_IMAGE_REGISTRY, which the
        # runner masks, and the buildgates refuse any vars.CI_IMAGE_REGISTRY.
        run: scripts/ci-mask-lan.sh

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # #1593: the LAN CI registry first, the artifact when the pull fails.
      - name: Pull the toolchain image from the LAN CI registry
        id: pull_toolchain
        if: ${{ needs.docker-build.outputs.registry_toolchain_tag != '' && env.CI_REGISTRY != '' }}
        env:
          TAG: ${{ needs.docker-build.outputs.registry_toolchain_tag }}
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          . scripts/image-registry.sh
          REF="$CI_REGISTRY/go-qrdb/toolchain-image:$TAG"
          if ! ci_registry_skip "$CI_REGISTRY" "${REF#"$CI_REGISTRY"/}" &&
             timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker pull -q "$REF" >/dev/null 2>&1 &&
             [ "$(docker image inspect -f '{{.Id}}' "$REF" 2>/dev/null)" = "$ID" ] &&
             docker tag "$ID" "$IMAGE" >/dev/null 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            ci_registry_outage "$CI_REGISTRY" "$?"
            echo "::warning::the pull of $IMAGE from the LAN CI registry failed; loading it from the artifact"
          fi
          docker rmi "$REF" >/dev/null 2>&1 || true

      - name: Download the toolchain image
        id: download_toolchain
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Download the toolchain image (retry)
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' && steps.download_toolchain.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
          PULLED: ${{ steps.pull_toolchain.outputs.pulled }}
        run: |
          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$ID" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, DS-7377): the build and golangci-lint caches,
      # restored from main's newest entry and saved on a push to main alone.
      - name: Restore the Go caches
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-${{ hashFiles('**/go.sum') }}-
            go-lint-

      - name: Point the stages at the Go caches
        run: bash scripts/ci-cache-dir.sh >> "$GITHUB_ENV"

      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.42 (ruling 742 (1)): `make deps-check` (v1.28, ruling 219(3))
      # left this job. It reads the module proxy and the vulnerability
      # database, so its answer changes with no change to the tree;
      # scans.yml runs it on dispatch on main. The Makefile keeps the target.

      # ci-template v1.30: gosec on the PR tier. v1.42 (ruling 742 (1)):
      # `make security` left the image job, so its gosec half runs here on
      # every event but a docs-only PR: `make gosec` for the root module and
      # `make gosec-sdk` for sdk/go, which the root's ./... does not reach.
      # Both read only the tree, so the gate stays hermetic.
      - name: make gosec gosec-sdk
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make gosec gosec-sdk GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # ci-template v1.30: vet-tags and the secure analyzer, on the nightly
      # schedule alone.
      - name: make lint-sweeps (nightly schedule)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && github.event_name == 'schedule' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-sweeps GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_CACHE_SAVE == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      # CUSTOMIZE (go-qrdb, #1596): a pool host's temp dir outlives the job;
      # remove any cache an older run left there. Its files belong to the
      # stages' uid, so the helper deletes them as root in the toolchain
      # image; a failure is a ::warning::, never a failed job.
      - name: Remove the temp Go caches
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: bash scripts/ci-cache-clean.sh "$RUNNER_TEMP/ci-cache"

      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  # v1.27.0 (ruling 211): `make lint-gates` beside `make lint`, on the PR tier.
  lint-gates:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Lint Gates [toolchain image]
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner_docker) }}   # v1.48 (ruling 1024)
    needs: [preflight, docker-build]
    timeout-minutes: 90
    env:
      CI_REGISTRY: ${{ secrets.CI_IMAGE_REGISTRY }}   # #1593: the LAN CI registry
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        # v1.53: a registry a later step takes from `vars` is masked here.
        # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
        # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3). None
        # here: CI_REGISTRY comes from secrets.CI_IMAGE_REGISTRY, which the
        # runner masks, and the buildgates refuse any vars.CI_IMAGE_REGISTRY.
        run: scripts/ci-mask-lan.sh

      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free the runner's disk
        if: ${{ runner.environment == 'github-hosted' && steps.probe.outputs.has_target == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # #1593: the LAN CI registry first, the artifact when the pull fails.
      - name: Pull the toolchain image from the LAN CI registry
        id: pull_toolchain
        if: ${{ steps.probe.outputs.has_target == 'true' && needs.docker-build.outputs.registry_toolchain_tag != '' && env.CI_REGISTRY != '' }}
        env:
          TAG: ${{ needs.docker-build.outputs.registry_toolchain_tag }}
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          . scripts/image-registry.sh
          REF="$CI_REGISTRY/go-qrdb/toolchain-image:$TAG"
          if ! ci_registry_skip "$CI_REGISTRY" "${REF#"$CI_REGISTRY"/}" &&
             timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker pull -q "$REF" >/dev/null 2>&1 &&
             [ "$(docker image inspect -f '{{.Id}}' "$REF" 2>/dev/null)" = "$ID" ] &&
             docker tag "$ID" "$IMAGE" >/dev/null 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            ci_registry_outage "$CI_REGISTRY" "$?"
            echo "::warning::the pull of $IMAGE from the LAN CI registry failed; loading it from the artifact"
          fi
          docker rmi "$REF" >/dev/null 2>&1 || true

      - name: Download the toolchain image
        id: download_toolchain
        if: ${{ steps.probe.outputs.has_target == 'true' && steps.pull_toolchain.outputs.pulled != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Download the toolchain image (retry)
        if: ${{ steps.probe.outputs.has_target == 'true' && steps.pull_toolchain.outputs.pulled != 'true' && steps.download_toolchain.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
          PULLED: ${{ steps.pull_toolchain.outputs.pulled }}
        run: |
          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$ID" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        if: ${{ steps.probe.outputs.has_target == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-gates-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-lint-gates-${{ hashFiles('**/go.sum') }}-
            go-lint-gates-

      - name: Point the stages at the Go caches
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: bash scripts/ci-cache-dir.sh >> "$GITHUB_ENV"

      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.CI_CACHE_SAVE == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-lint-gates-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      # CUSTOMIZE (go-qrdb, #1596): a pool host's temp dir outlives the job;
      # remove any cache an older run left there. Its files belong to the
      # stages' uid, so the helper deletes them as root in the toolchain
      # image; a failure is a ::warning::, never a failed job.
      - name: Remove the temp Go caches
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: bash scripts/ci-cache-clean.sh "$RUNNER_TEMP/ci-cache"

      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  image:
    name: Devcontainer image [build]
    runs-on: ${{ fromJSON(needs.preflight.outputs.runner_docker) }}   # v1.48 (ruling 1024)
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 90
    env:
      CI_REGISTRY: ${{ secrets.CI_IMAGE_REGISTRY }}   # #1593: the LAN CI registry
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # Ruling 887: the LAN addresses this runner's environment names, masked
      # before any step that builds can print one.
      - name: Mask the LAN addresses
        # v1.53: a registry a later step takes from `vars` is masked here.
        # CUSTOMIZE: one VARS_<NAME> line per vars.<NAME> ending in _REGISTRY
        # that this job reads (testdata/ci-mask-lan-tests.py M1 to M3). None
        # here: CI_REGISTRY comes from secrets.CI_IMAGE_REGISTRY, which the
        # runner masks, and the buildgates refuse any vars.CI_IMAGE_REGISTRY.
        run: scripts/ci-mask-lan.sh

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # #1593: the LAN CI registry first, the artifact when the pull fails.
      - name: Pull the toolchain image from the LAN CI registry
        id: pull_toolchain
        if: ${{ needs.docker-build.outputs.registry_toolchain_tag != '' && env.CI_REGISTRY != '' }}
        env:
          TAG: ${{ needs.docker-build.outputs.registry_toolchain_tag }}
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          . scripts/image-registry.sh
          REF="$CI_REGISTRY/go-qrdb/toolchain-image:$TAG"
          if ! ci_registry_skip "$CI_REGISTRY" "${REF#"$CI_REGISTRY"/}" &&
             timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker pull -q "$REF" >/dev/null 2>&1 &&
             [ "$(docker image inspect -f '{{.Id}}' "$REF" 2>/dev/null)" = "$ID" ] &&
             docker tag "$ID" "$IMAGE" >/dev/null 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            ci_registry_outage "$CI_REGISTRY" "$?"
            echo "::warning::the pull of $IMAGE from the LAN CI registry failed; loading it from the artifact"
          fi
          docker rmi "$REF" >/dev/null 2>&1 || true

      - name: Download the toolchain image
        id: download_toolchain
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Download the toolchain image (retry)
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' && steps.download_toolchain.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
          PULLED: ${{ steps.pull_toolchain.outputs.pulled }}
        run: |
          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$ID" >> "$GITHUB_ENV"

      # The full tier's trivy step scans the integration image docker-build
      # built, so the full tier loads it too.
      - name: Pull the integration image from the LAN CI registry
        id: pull_it
        if: ${{ env.CI_FULL_TIER == 'true' && needs.docker-build.outputs.registry_it_tag != '' && env.CI_REGISTRY != '' }}
        env:
          TAG: ${{ needs.docker-build.outputs.registry_it_tag }}
          IMAGE: ${{ needs.docker-build.outputs.it_image }}
          ID: ${{ needs.docker-build.outputs.it_id }}
        run: |
          . scripts/image-registry.sh
          REF="$CI_REGISTRY/go-qrdb/it-image:$TAG"
          if ! ci_registry_skip "$CI_REGISTRY" "${REF#"$CI_REGISTRY"/}" &&
             timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker pull -q "$REF" >/dev/null 2>&1 &&
             [ "$(docker image inspect -f '{{.Id}}' "$REF" 2>/dev/null)" = "$ID" ] &&
             docker tag "$ID" "$IMAGE" >/dev/null 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            ci_registry_outage "$CI_REGISTRY" "$?"
            echo "::warning::the pull of $IMAGE from the LAN CI registry failed; loading it from the artifact"
          fi
          docker rmi "$REF" >/dev/null 2>&1 || true

      - name: Download the integration image
        id: download_it
        if: ${{ env.CI_FULL_TIER == 'true' && steps.pull_it.outputs.pulled != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image

      - name: Download the integration image (retry)
        if: ${{ env.CI_FULL_TIER == 'true' && steps.pull_it.outputs.pulled != 'true' && steps.download_it.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image

      - name: Load the integration image
        if: ${{ env.CI_FULL_TIER == 'true' }}
        env:
          IMAGE: ${{ needs.docker-build.outputs.it_image }}
          ID: ${{ needs.docker-build.outputs.it_id }}
          PULLED: ${{ steps.pull_it.outputs.pulled }}
        run: |
          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/it-image" "$IMAGE" "$ID"
          echo "IT_IMAGE=$ID" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-image-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-image-${{ hashFiles('**/go.sum') }}-
            go-image-

      - name: Point the stages at the Go caches
        run: bash scripts/ci-cache-dir.sh >> "$GITHUB_ENV"

      # v1.9.2: a tag that selects no code is a typo that silently analyses
      # nothing.
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "GO_BUILD_TAGS='$GO_BUILD_TAGS' sh scripts/assert-build-tags.sh"

      - name: make build-server build-cli-headless
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go build ./... && (cd sdk/go && go build ./...) && make build-server build-cli-headless GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # ruling 211: the linux/arm64 release cross-build, plain and FIPS, on the
      # full tier only.
      - name: make release-cross (linux/arm64, plain and FIPS)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make release-cross PLATFORM=linux/arm64 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.42 (ruling 742 (1)): `make security` (gosec, govulncheck, go mod
      # verify, trivy fs) and `trivy image (integration image)` (`make
      # trivy-image`, CUSTOMIZE go-qrdb) left this job. Both read an advisory
      # database that changes with no change to the tree. scans.yml runs them
      # on dispatch on main and opens or updates ONE issue on a finding;
      # gosec runs in the lint job on every event.

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_CACHE_SAVE == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-image-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      # CUSTOMIZE (go-qrdb, #1596): a pool host's temp dir outlives the job;
      # remove any cache an older run left there. Its files belong to the
      # stages' uid, so the helper deletes them as root in the toolchain
      # image; a failure is a ::warning::, never a failed job.
      - name: Remove the temp Go caches
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: bash scripts/ci-cache-clean.sh "$RUNNER_TEMP/ci-cache"

      - name: Tear down
        if: always()
        run: rm -f it-image.tar

      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  # CUSTOMIZE (go-qrdb, ruling 211, DS-7377): `make coverage` is ONE
  # repo-wide gate, measured in legs. Each leg is
  # `make coverage-leg COVER_LEG=<leg>` on a runner of its own, which writes
  # coverage/leg-<leg>.out and uploads it; coverage-merge downloads every
  # leg's profile and runs `make coverage-merge`, the threshold and the
  # per-package baseline over their concatenation. The Makefile's COVER_LEGS
  # is the one list of legs; test/buildgates/coverage_legs_test.go fails when
  # this matrix is not COVER_LEGS, when a leg's go test budget is not the
  # job's limit less 5 minutes, or when the merge does not need this job.
  # The whole measured 84.8 minutes (run 76127); in twelve legs, at a 4x
  # slowdown, the slowest fits the 180-minute limit.
  coverage:
    name: Unit [make coverage-leg ${{ matrix.leg }}]
    runs-on: ubuntu-latest   # CUSTOMIZE (go-qrdb): ruling 862, the coverage, test and fips legs stay hosted
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg:
          - tenant-lifecycle
          - tenant
          - seal-barrier
          - seal
          - server-raft
          - server
          - auth
          - service
          - api-keys
          - rest
          - sdk-transport
          - sdk
    env:
      CI_REGISTRY: ${{ secrets.CI_IMAGE_REGISTRY }}   # #1593: the LAN CI registry
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      # #1593: the LAN CI registry first, the artifact when the pull fails.
      - name: Pull the toolchain image from the LAN CI registry
        id: pull_toolchain
        if: ${{ needs.docker-build.outputs.registry_toolchain_tag != '' && env.CI_REGISTRY != '' }}
        env:
          TAG: ${{ needs.docker-build.outputs.registry_toolchain_tag }}
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          . scripts/image-registry.sh
          REF="$CI_REGISTRY/go-qrdb/toolchain-image:$TAG"
          if ! ci_registry_skip "$CI_REGISTRY" "${REF#"$CI_REGISTRY"/}" &&
             timeout -k 10 "${CI_IMAGE_REGISTRY_TIMEOUT:-300}" docker pull -q "$REF" >/dev/null 2>&1 &&
             [ "$(docker image inspect -f '{{.Id}}' "$REF" 2>/dev/null)" = "$ID" ] &&
             docker tag "$ID" "$IMAGE" >/dev/null 2>&1; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
          else
            ci_registry_outage "$CI_REGISTRY" "$?"
            echo "::warning::the pull of $IMAGE from the LAN CI registry failed; loading it from the artifact"
          fi
          docker rmi "$REF" >/dev/null 2>&1 || true

      - name: Download the toolchain image
        id: download_toolchain
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Download the toolchain image (retry)
        if: ${{ steps.pull_toolchain.outputs.pulled != 'true' && steps.download_toolchain.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
          PULLED: ${{ steps.pull_toolchain.outputs.pulled }}
        run: |
          [ "$PULLED" = true ] || scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$ID" >> "$GITHUB_ENV"

      - name: Restore the Go caches
        if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-
            go-coverage-${{ matrix.leg }}-

      - name: Point the stages at the Go caches
        run: bash scripts/ci-cache-dir.sh >> "$GITHUB_ENV"

      # GOTEST_TIMEOUT is go test's per-package budget, the job's limit less 5
      # minutes, so a hung package reports its goroutines before the runner
      # kills the leg. IN_IMAGE_COPY_OUT copies the leg's profile out of the
      # stage's container once it exits; a failed leg writes none.
      - name: make coverage-leg ${{ matrix.leg }}
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          COVER_LEG: ${{ matrix.leg }}
          IN_IMAGE_COPY_OUT: coverage/leg-${{ matrix.leg }}.out
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage-leg COVER_LEG='$COVER_LEG' GOTEST_TIMEOUT=175m GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Upload the leg's profile
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-leg-${{ matrix.leg }}
          path: coverage/leg-${{ matrix.leg }}.out
          retention-days: 1
          if-no-files-found: error

      - name: Save the Go caches (main)
        if: ${{ !cancelled() && env.CI_CACHE_SAVE == 'true' && runner.environment == 'github-hosted' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-cache
          key: go-coverage-${{ matrix.leg }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}

      # CUSTOMIZE (go-qrdb, #1596): a pool host's temp dir outlives the job;
      # remove any cache an older run left there. Its files belong to the
      # stages' uid, so the helper deletes them as root in the toolchain
      # image; a failure is a ::warning::, never a failed job.
      - name: Remove the temp Go caches
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: bash scripts/ci-cache-clean.sh "$RUNNER_TEMP/ci-cache"

      - name: Prune old CI images
        if: ${{ always() && runner.environment != 'github-hosted' }}
        run: scripts/ci-image.sh prune 24

  # CUSTOMIZE (go-qrdb, DS-7377): the one coverage gate over every leg's
  # profile. It needs coverage, so a failed leg skips it and CI Gate fails on
  # both; `make coverage-merge` also refuses a missing or empty profile.
  coverage-merge:
    name: Unit [make coverage-merge]
    # DS-8233: shell concatenation plus a stdlib-only go run; no cgo, no Docker.
    # On the self-hosted bigdisk pool (no Docker daemon) for a push to main
    # and a same-repository PR; hosted otherwise. Hosted steps keep the
    # toolchain image; the pool runs the same target natively.
    runs-on: ubuntu-latest   # CUSTOMIZE (go-qrdb): ruling 862, the coverage, test and fips legs stay hosted
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build, coverage]
    timeout-minutes: 30
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # DS-8233: the pool's Go, the toolchain image's version.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: runner.environment == 'self-hosted'
        with:
          cache: ${{ runner.environment != 'self-hosted' }}
          go-version: ${{ env.GO_VERSION }}

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        id: download_toolchain
        if: ${{ runner.environment == 'github-hosted' }}
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Download the toolchain image (retry)
        if: ${{ runner.environment == 'github-hosted' && steps.download_toolchain.outcome == 'failure' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        if: runner.environment == 'github-hosted'
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$ID" >> "$GITHUB_ENV"

      - name: Download the legs' profiles
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-leg-*
          merge-multiple: true
          path: coverage

      - name: make coverage-merge (the threshold and the baseline)
        if: ${{ runner.environment == 'github-hosted' && !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage-merge GO_BUILD_TAGS='$GO_BUILD_TAGS' COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      - name: make coverage-merge (native, bigdisk)
        if: runner.environment == 'self-hosted'
        env:
          # The image's settings: its own Go only, modules from the public
          # proxy only (no direct), go.mod read-only, cgo on for -race.
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=readonly
          CGO_ENABLED: "1"
        run: make coverage-merge GO_BUILD_TAGS="$GO_BUILD_TAGS" COVERAGE_THRESHOLD="$COVERAGE_THRESHOLD"

  test-clusterproof:
