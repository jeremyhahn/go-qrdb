            features: backup-restore capabilities ceremony clustering firstboot tenant-dek
          - shard: 3
            features: barrier-seal certificate-authority guarded-swap key-wrapping rag trust-anchors watch
          - shard: 4
            features: api-server auth-factors replica-forwarding run-modes secondary-indexes storage-engines volume-pools
          - shard: 5
            features: cluster-verification collections embeddings identity-rbac key-value rate-limit shamir-custody vectors
          - shard: 6
            features: coordination credentials etcd-compatibility leases row-locking sql transactions trust-bootstrap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the integration image
