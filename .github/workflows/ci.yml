        run: make docker-down-it IT_PROJECT="$IT_PROJECT"

  # CUSTOMIZE (go-qrdb): the multi-protocol CLI suites against two real qrdbd
  # servers in the Docker stack under test/integration/api, which builds its
  # own image from the checkout. INT_PROJECT namespaces the containers,
  # networks and volumes per run; it is read from the shell, never a ${{ }}
  # expression. The make target dumps the server logs before its own
  # teardown, and `make integration-down` removes the run's image.
  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ ((github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build, test-typescript, preflight]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      - name: Tear down the stack
        if: always()
        run: make integration-down INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}" || true

  # CUSTOMIZE (go-qrdb, #20): FIPS 140-3, a required gate on the full tier
  # (security-review.md §6, docs/seal/fips140-mode.md). The whole unit suite,
  # both modules, race-enabled, built against the Go Cryptographic Module and
  # run under GODEBUG=fips140=only.
  #
  # GOFIPS140 selects the module at BUILD time; GODEBUG selects the
  # enforcement level at RUN time, and both are needed. "only" rather than
  # "on": "on" loads the module but still PERMITS non-approved algorithms, so
  # a regulated path using MD5, SHA-1 or GCM with a caller-chosen IV passes
  # silently. Ratified by the owner 2026-08-17; see
  # ../handbook/software/conventions/configuration.md §5. The two settings
  # ride in each stage's command (FIPS_ENV), not in the job environment:
  # in-toolchain-image.sh forwards a fixed environment to the container.
  #
  # A red here IS the finding: something on a tested path is using
  # non-approved cryptography. Fix the call site, or -- when an external
  # format mandates the primitive -- isolate it and record a cited exemption
  # in docs/seal/fips140-mode.md. Do NOT set this back to "on", add
  # continue-on-error, add a build tag that skips a package, or narrow the
  # package list.
  #
  # The suites run as parallel legs (#1230): each leg is
  # `make test-fips-leg FIPS_LEG=<leg>`; the Makefile's FIPS_LEGS is the one
  # list of legs, and together they are exactly `make test` and
  # `make test-sdk`, each package once. test/buildgates/fips_legs_test.go
  # fails when this matrix is not FIPS_LEGS or a package is in two legs or
  # none. No cache: the FIPS module's build is the leg's own, and the
  # repository's cache storage is bounded.
  fips:
    name: FIPS 140-3 (${{ matrix.leg }})
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ ((github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build]
    strategy:
      fail-fast: false
      # DS-7377: the legs measured 7 to 14.3 minutes (run 76127) on the
      # self-hosted runners; at a 4x slowdown on a 4-vCPU runner the slowest
      # is about 57 minutes, so every leg's limit is 120. go test's
      # per-package budget is the limit less 5 minutes, so a runaway package
      # is named before the leg is killed. pkg/tenant, pkg/seal and pkg/server
      # are each split by test name over two legs (#1234).
      matrix:
        include:
          - leg: tenant-lifecycle
            minutes: 120
          - leg: tenant
            minutes: 120
          - leg: seal-barrier
            minutes: 120
          - leg: seal
            minutes: 120
          - leg: server-raft
            minutes: 120
          - leg: server
            minutes: 120
          - leg: auth
            minutes: 120
          - leg: service
            minutes: 120
          - leg: api-keys
            minutes: 120
          - leg: rest
            minutes: 120
          - leg: sdk-transport
            minutes: 120
          - leg: sdk
            minutes: 120
    timeout-minutes: ${{ matrix.minutes }}
    env:
      FIPS_ENV: GOFIPS140=latest GODEBUG=fips140=only
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the toolchain image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: toolchain-image
          path: ${{ runner.temp }}/toolchain-image

      - name: Load the toolchain image
        env:
          IMAGE: ${{ needs.docker-build.outputs.toolchain_image }}
          ID: ${{ needs.docker-build.outputs.toolchain_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/toolchain-image" "$IMAGE" "$ID"
          echo "TOOLCHAIN_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # GODEBUG is a runtime setting and cannot fail a compile, but building
      # against the module first keeps a genuine build break from being
      # reported as a test failure.
      - name: Build all packages against the FIPS module
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$FIPS_ENV go build ./..."

      # The packages the unit suites run, with the same build tags: this leg's
      # share of them, and every leg together is the whole of both. The scope
      # is deliberately identical: a FIPS job over a subset of the suite
      # cannot tell you the product is FIPS-clean.
      #
      # GOTEST_TIMEOUT is go test's PER-PACKAGE budget. FIPS mode swaps the
      # KDF from Argon2id to PBKDF2-HMAC-SHA256 at 600,000 iterations, which
      # measured 2.6x on pkg/seal (go-qrdb#147). The budget is the leg's limit
      # less 5 minutes, so it cannot outlive the leg. This raises a runaway
      # guard; it does not skip a package, weaken an assertion or narrow the
      # scope.
      #
      # pipefail matters: without it tee's exit status hides a failing suite.
      - name: Unit tests (race, FIPS 140-only)
        env:
          FIPS_LEG: ${{ matrix.leg }}
          FIPS_LEG_MINUTES: ${{ matrix.minutes }}
        run: |
          set -o pipefail
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$FIPS_ENV make test-fips-leg FIPS_LEG='$FIPS_LEG' GOTEST_TIMEOUT=$((FIPS_LEG_MINUTES - 5))m GO_BUILD_TAGS='$GO_BUILD_TAGS'" 2>&1 | tee fips-test.log

      # A per-package timeout panic names whichever test was running when the
      # alarm fired, NOT the test that consumed the budget. This step lists the
      # leg's package results, with each package's time, and its slowest
      # completed tests, on success too, so the trend is visible before the
      # cliff. A missing log is reported: it means the suite never started.
      - name: Package results and slowest tests
        if: always()
        run: |
          log=fips-test.log
          if [ ! -f "$log" ]; then
            echo "no ${log}: this leg's suite never started -- see the step above" >&2
            exit 0
          fi
          # Captured into variables rather than piped straight to stdout so
          # the "nothing parsed" case can actually be reported. A `grep ...
          # | sort || echo fallback` cannot do that: the pipeline's status is
          # sort's, which is 0 on empty input, so the fallback is unreachable.
          pkgs=$(grep -aE '^(ok|FAIL|\?)[[:space:]]+github\.com/jeremyhahn/go-qrdb/' \
            "$log" | sort -u || true)
          slow=$(grep -aoE '^--- (PASS|FAIL): [A-Za-z0-9_/]+ \([0-9.]+s\)' "$log" \
            | sed -E 's/^--- (PASS|FAIL): ([A-Za-z0-9_/]+) \(([0-9.]+)s\)/\3 \1 \2/' \
            | sort -rn | head -25 || true)

          echo "== package results =="
          if [ -n "$pkgs" ]; then
            echo "$pkgs"
            echo "-- counts: $(printf '%s\n' "$pkgs" | grep -c '^ok') ok, $(printf '%s\n' "$pkgs" | grep -c '^FAIL') FAIL"
          else
            echo "(no package result lines parsed -- the suite may have died before any package finished)"
          fi

          echo
          echo "== 25 slowest tests that COMPLETED =="
          echo "A timeout panic names the test holding the alarm, not the one"
          echo "that spent the budget. These are the candidates that did."
          if [ -n "$slow" ]; then
            echo "$slow"
          else
            echo "(no completed top-level tests parsed)"
          fi

  # CUSTOMIZE (go-qrdb): the TypeScript SDK and the desktop frontend, which
  # rotted unseen while they had no CI. `make test-typescript` runs the SDK's
  # npm ci, tsc, npm test (vitest, and the wire contract test pinning the
  # SDK's types to the REST handler's output) and build, then svelte-check on
  # the frontend against the built SDK, then the MOCKED Playwright tier. A job
  # of its own because the toolchain image carries no Node. Code tier
  # (DS-3160). It needs docker-build only for the code-tier `if:` (v1.29.2).
  test-typescript:
    name: Test (TypeScript SDK + desktop frontend)
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ (needs.preflight.outputs.docs_only != 'true' && needs.docker-build.outputs.it_image != '') && !github.event.pull_request.draft }}   # ruling 214; v1.29.2
    needs: [preflight, docker-build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step (see docker-build):
      # npm, curl and make all run here with them in the environment.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: TypeScript SDK and desktop frontend
        run: make test-typescript

  # Soak (v1.23, owner item 101): one feature's suite, SOAK_FEATURE, looped in
  # the integration image until SOAK_MINUTES have passed, each iteration its
  # own compose stack, torn down before the next; the first red iteration
  # fails the job. v1.24 (owner ruling 2026-10-19, Company Agent m751 (e)):
  # nightly and workflow_dispatch only; the Gate marks it `nightly`.
  # CUSTOMIZE (go-qrdb): clustering runs real 3-node Raft clusters, the suite
  # most sensitive to load. The soak loads docker-build's integration image
  # (IT_PREBUILT=1) and never builds one.
  soak:
    name: Soak [integration image]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft }}   # ruling 214
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: [docker-build]
    timeout-minutes: 90
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_FEATURE: clustering   # CUSTOMIZE (go-qrdb): the suite each iteration runs
      IT_PROJECT: qrdb-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Free the runner's disk
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null
          df -h /

      - name: Download the integration image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: it-image
          path: ${{ runner.temp }}/it-image

      - name: Load the integration image
        env:
          IMAGE: ${{ needs.docker-build.outputs.it_image }}
          ID: ${{ needs.docker-build.outputs.it_id }}
        run: |
          scripts/ci-image.sh load "$RUNNER_TEMP/it-image" "$IMAGE" "$ID"
          echo "IT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make integration-test IT_FEATURE="$SOAK_FEATURE" IT_PROJECT="$p" IT_PREBUILT=1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      # integration-test downs each iteration's stack; this covers a cancelled
      # iteration.
      - name: Tear down
        if: always()
        run: |
          p="$IT_PROJECT"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then read -r p < "$RUNNER_TEMP/soak-project"; fi
          make docker-down-it IT_PROJECT="$p"
          rm -f "$RUNNER_TEMP/soak-project"

  ci-gate:
    name: CI Gate
    # m2479 (m2475 h): the gate reads the jobs' results only: no checkout, no
    # Go, no Docker. On the self-hosted bigdisk pool for a push to main and a
    # same-repository PR, so it never waits in the hosted queue; hosted
    # otherwise.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: ${{ always() }}
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs.
    #
    # go-qrdb: test/buildgates/ci_tiers_test.go asserts that every job is in
    # needs AND has a check line reading its result from an env var
    # (RESULT_*: ${{ needs.<job>.result }}), tagged to match its tier: pr,
    # code (every event but a docs-only PR, DS-3160), full or nightly. A matrix
    # job is ONE entry: needs.<job>.result is the aggregate over its legs.
    needs: [preflight, docker-build, lint, lint-gates, image, coverage, coverage-merge, test-clusterproof, coverage-fts, test-tags, test-sdk, test-typescript, integration-standalone, integration-features, fips, soak]
    steps:
      - name: Fail closed on any non-success
        env:
          # ruling 214: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          RESULT_PREFLIGHT: ${{ needs.preflight.result }}
          RESULT_DOCKER_BUILD: ${{ needs.docker-build.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_LINT_GATES: ${{ needs.lint-gates.result }}
          RESULT_IMAGE: ${{ needs.image.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_COVERAGE_MERGE: ${{ needs.coverage-merge.result }}
          RESULT_TEST_CLUSTERPROOF: ${{ needs.test-clusterproof.result }}
          RESULT_COVERAGE_FTS: ${{ needs.coverage-fts.result }}
          RESULT_TEST_TAGS: ${{ needs.test-tags.result }}
          RESULT_TEST_SDK: ${{ needs.test-sdk.result }}
          RESULT_TEST_TYPESCRIPT: ${{ needs.test-typescript.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_INTEGRATION_FEATURES: ${{ needs.integration-features.result }}
          RESULT_FIPS: ${{ needs.fips.result }}
          RESULT_SOAK: ${{ needs.soak.result }}
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # CUSTOMIZE (go-qrdb, DS-3160): a `code` job runs on every event but
          # a docs-only PR (the preflight job's docs_only, false off
          # pull_request and on ci:full).
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}; docs-only pull request: ${DOCS_ONLY}"
          # CUSTOMIZE (go-qrdb): an unreadable FULL_TIER, NIGHTLY or DOCS_ONLY
          # cannot say which skips to excuse, so it fails closed. DOCS_ONLY is
          # empty only when preflight did not succeed, which fails the gate too.
          case "${DOCS_ONLY}" in
            true|false) ;;
            *) echo "FAIL: DOCS_ONLY is unreadable ('${DOCS_ONLY}')"; BAD=1;;
          esac
          case "${FULL_TIER}" in
            true|false) ;;
            *) echo "FAIL: FULL_TIER is unreadable ('${FULL_TIER}')"; BAD=1;;
          esac
          case "${NIGHTLY}" in
            true|false) ;;
            *) echo "FAIL: NIGHTLY is unreadable ('${NIGHTLY}')"; BAD=1;;
          esac
          check() { # <job> <result> <pr|code|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly, one skipped on a docs-only PR
          # (go-qrdb, DS-3160) is code; every other job is pr.
          check preflight "$RESULT_PREFLIGHT" pr
          check docker-build "$RESULT_DOCKER_BUILD" pr
          check lint "$RESULT_LINT" pr
          check lint-gates "$RESULT_LINT_GATES" pr
          check image "$RESULT_IMAGE" code
          # A matrix job's result is success only when every leg succeeded.
          check coverage "$RESULT_COVERAGE" code
          check coverage-merge "$RESULT_COVERAGE_MERGE" code
          check test-clusterproof "$RESULT_TEST_CLUSTERPROOF" code
          check coverage-fts "$RESULT_COVERAGE_FTS" code
          check test-tags "$RESULT_TEST_TAGS" code
          check test-sdk "$RESULT_TEST_SDK" code
          check test-typescript "$RESULT_TEST_TYPESCRIPT" code
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE" full
          check integration-features "$RESULT_INTEGRATION_FEATURES" full
          check fips "$RESULT_FIPS" full
          check soak "$RESULT_SOAK" nightly
          exit $BAD
