  # CUSTOMIZE (go-qrdb, #674): the self-spawned integration suites, one
  # feature list per shard; `make -s print-integration-features` is every
  # feature, each in exactly one shard (test/buildgates/feature_jobs_gate_test.go).
  # Every feature in a shard runs `make integration-test IT_FEATURE=<feature>`
  # in the hardened integration container, past a failing one. The shard
  # loads the integration image docker-build built (IT_PREBUILT=1), never
  # builds one. The longest shard measured 21.2 minutes (run 76127); at a 4x
  # slowdown it fits the 120-minute limit.
  integration-features:
    name: Integration (shard ${{ matrix.shard }})
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    if: ${{ ((github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build, test-typescript, preflight]
    timeout-minutes: 120
    env:
      IT_PROJECT: qrdb-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
