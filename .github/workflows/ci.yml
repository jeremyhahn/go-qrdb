# ci-template: v1.28.0 — canonical CI for all first-party Go repos.
# go-qrdb deviations from v1.28.0, one line each (the CUSTOMIZE block below
# gives each one's reason):
#   - a changes-gated `code` tier beside pr, full and nightly (DS-3160)
#   - a docker-build job builds both images once; the others take its output
#   - lint and image are two jobs, lint-gates a third (#1046)
#   - the unit suites are five code-tier jobs, not image steps (ruling 211)
#   - release-cross linux/arm64 runs on the full tier only (ruling 211)
#   - the integration image is held by IT_HOLD, not the lease steps (#813)
#   - integration is integration-standalone and integration-features (#674)
#   - a fips job runs both unit suites under FIPS 140-3 mode, full tier
#   - test-typescript is a job of its own
#   - no revert-red-main.yml beside this file
# v1.28.0, adopted here (ruling 220(3), DS-4015): `make deps-check` is a
# lint-class gate on the PR tier (ruling 219(3)) and runs wherever `make lint`
# runs, a docs-only PR included. The template's image job runs lint, so it
# drops the step's CI_FULL_TIER condition there; here lint is its own job
# (#1046) and the image job skips on a docs-only PR, so the step moves from
# the image job to the lint job, after `make lint`, on every event, with
# IN_IMAGE_NETWORK=bridge for the module proxy. CI Gate's lines do not change.
# v1.27.0, adopted here (ruling 211, CA m1355): the lint-gates job runs
# `make -k lint-gates` in parallel with the lint job's `make lint` (DS-3603,
# DS-3609; m1192 (6) item 27, m1207 (1)); it was adopted alone first. The
# v1.25.1 to v1.26.2 entries are reconciled here too: v1.25.1 to v1.25.3's
# lease and image-lock steps are replaced by IT_HOLD (#813), v1.25.4's
# `pull_request` types were already this file's, v1.26.1's releasability
# test on a docs-only PR is arch-gates' `make check-public-releasable`, and
# v1.26.2's per-sha main group was already this file's (DS-3465). The
# template's changelog is in ../handbook; this header keeps go-qrdb's.
# v1.25 (Company Agent m857, 2026-10-20): main has one concurrency group per
# event, so a newer push to main cancels the older in-progress main push run.
# At 20:00Z go-qrdb had three main-push runs in progress on three commits and
# 148 jobs waited fleet-wide. The main group is `main-{event}` (m774 option
# (i), on go-qrdb main since m772), not the ref alone, so a workflow_dispatch
# or schedule run on main never cancels a push run. This reverses v1.22.1 and
# v1.23 (m636, m695): an older main commit no longer keeps its own run, and
# the newest run validates every merge under it. cancel-in-progress stays a
# literal `true`. A PR ref is one group, as before. Only the group changes.
# v1.24.1 (2026-10-20): the changelog and comments cite no internal
# repository and no internal issue number, so a repository that publishes its
# workflows passes its releasability scan. One job change: the `changes`
# job's diff takes --no-renames, so a file moved from code into docs/ lists
# its old path too and the PR is not docs-only.
# v1.24 (owner ruling 2026-10-19, Company Agent m749 and m751 (a), (e)):
# a PR whose every changed file is markdown or under docs/ (DOCS_ONLY_PATTERN,
# the new `changes` job) runs lint alone: build, the build-tag assertion and
# make coverage skip. Soak moves off main pushes and ci:full to the nightly
# schedule and workflow_dispatch, a `nightly` job in the Gate (ci-standard.md
# §8, §10).
# v1.23.1 (2026-10-19): ships reap-stale-ci-stacks.sh v3, which
# ages an integration image from the later of its creation and its last tag,
# so a parallel job's reaper no longer removes an image just rebuilt from
# cache (go-quicraft main runs 57389 and 57484). No job changes.
# v1.23 (owner item 101 as approved, Company Agent m650 item 3, 2026-10-18):
# two tiers. A pull request runs the PR tier only: lint (with
# assert-build-tags and arch-gates), build, and the unit suite under -race
# (`make coverage`, so unit test and race are one step). Integration, Soak,
# security, deps-check and trivy image do not run on a PR (v1.28 puts
# deps-check on the PR tier). The full tier runs
# on main after every merge (push), nightly (a new `schedule:` trigger), on
# workflow_dispatch, and on a PR labelled ci:full (kept as the opt-in). A new
# `soak` job loops the integration suite in the integration image for
# SOAK_MINUTES. CI Gate stays the one required check; integration and soak are
# `full` in it. A red full tier on main is reverted through a PR by the new
# revert-red-main.yml (ships beside this file; ci-standard.md §8). A repo's
# CUSTOMIZE race job joins the PR tier (`pr` in CI Gate, no tier `if:`); its
# other CUSTOMIZE suites take CI_FULL_TIER's expression and are `full`.
# v1.23 also (Company Agent m674 item 3, 2026-10-18: per-run image tags filled
# a runner host's disk at 100G per 17 minutes): one image tag per family,
# keyed by content. The integration image is <repo>-ci-it:<hash> (`make -s
# it-image`, the go-qrdb #814 pattern), built once per runner and reused by
# every job and run with that tree; no job removes it, and
# reap-stale-ci-stacks.sh v2 removes one older than REAP_IMAGE_MIN_AGE that no
# container uses (ci-standard.md §9).
# v1.23 also (Company Agent m695, 2026-10-18): the concurrency block keeps
# cancel-in-progress a literal `true` and gives main one group per event and
# commit, so main runs never cancel or queue behind each other; v1.22.1's
# expression left go-qrdb main run 57063 waiting with no task.
# v1.22.2 (Company Agent m641 item 2 and m646 item 3, 2026-10-18): each stage
# runs at the job slot's CPU bound. in-toolchain-image.sh v3 reads the job
# container's cgroup cpu.max and gives the stage container that --cpus, with
# GOMAXPROCS and GOFLAGS=-p from it; golangci-lint follows the quota. No
# number is hardcoded. No job changes.
# CUSTOMIZE (go-qrdb) begin: where this file departs from v1.28.0, and why.
#   - No revert-red-main.yml beside this file: not adopted here.
#   - docker-build builds both images once per run. On a push to main on
#     github.com alone (env.CI_PUBLISH) it pushes them to GHCR with the run's
#     own token, as <owner>/qrdb-ci-toolchain and <owner>/qrdb-ci-it
#     tagged <content-hash>-main; its outputs toolchain_ref and it_ref are
#     digest references, and every consumer pulls exactly that digest with
#     scripts/ci-registry.sh and never rebuilds (DS-3516). No job is placed on
#     docker-build's host. On every other event, and on every event on the
#     forge, nothing logs in or pushes (claude-agents#329: the run's token
#     cannot log in to the registry there, and the forge publishes nothing
#     until the registry namespace is the release runner credential's own):
#     docker-build runs on bigdisk, the outputs are empty, and each consumer takes the image from
#     its own runner's daemon by content-hash tag, building it when missing
#     (`scripts/ci-registry.sh local`, ci-standard.md §9).
#     test/buildgates/ci_image_digest_test.go holds both paths.
#   - Each consumer holds the image it runs with a created, never-started
#     qrdb-ci-hold- container (#813, run 57540, DS-3516), not the template's
#     `<prefix>lease-` steps, released at its teardown: the pulled digest on a
#     push to main, the local image on every other event.
#   - Integration is two jobs, integration-standalone and the per-feature
#     integration-features matrix, both full tier.
#   - The unit suites are five code-tier jobs (ruling 211, CA m1355):
#     coverage, test-clusterproof, coverage-fts, test-tags and test-sdk run in
#     parallel with the image job, not as two serial steps in it.
#   - `make release-cross PLATFORM=linux/arm64` (plain and FIPS) is a full-tier
#     step of the image job (ruling 211), and so is the fips job.
#   - A `code` tier (DS-3160): image, the unit-suite jobs and test-typescript
#     skip on a docs-only PR by job `if:`, and CI Gate excuses that skip.
#   - docker-build builds the toolchain and integration images once (DS-3044);
#     every stage job takes its output, not its own `make docker-build`.
#   - Dropped: the concurrency deviation (main's group carried the commit,
#     DS-3465). v1.26.2's group is the same expression, so it is canonical.
# CUSTOMIZE (go-qrdb) end.
# v1.22.1 (Company Agent m636 item 2, 2026-10-18, after go-quicbaas main
# fe167500f was left with no completed run): the concurrency block is
# canonical. A newer push to a PR ref still cancels that ref's older run, but
# a push to main never cancels an in-flight main run: each main commit keeps
# its run, so every merge is validated. Every repository carried the block as
# a CUSTOMIZE copy with `cancel-in-progress: true` on every ref, main included
# (devops.md §9); the copy goes and the canonical block replaces it. Adopted
# with the v1.22 rollout.
# v1.22 (Company Agent m616 item 2, 2026-10-18, after CI job layers filled the
# runner disks): the lint and image jobs' stages keep the Go build, golangci-lint and
# module caches in named volumes on the runner's Docker host, kept across jobs
# and split by trust class (CI_CACHE_CLASS: `main` for a push to main, `pr`
# otherwise), never in a job container's writable layer or its /tmp
# (ci-standard.md §6; in-toolchain-image.sh v2). A new step,
# trim-ci-caches.sh, bounds the repo's cache volumes on the host
# (CI_CACHE_MAX_GIB, default 32).
# v1.21.1 (Company Agent m605 item 8, 2026-10-18, after a forge token printed
# in a go-xkms run): the lint, image and integration jobs mask the forge
# credentials first, and no step or make target prints an env file, the job
# environment or a matched line; lint steps and `make check-public-literals`
# report path and line only, and `make stage-gomodauth` runs silent
# (ci-standard.md §5). Every v1.21 rollout PR adopts v1.21.1 before it merges.
# v1.21 (Company Agent m598 items 1 and 2, 2026-10-18): every stage runs in
# the project's own devcontainer image (ci-standard.md §2, devcontainer.md §7).
# Through v1.20 lint, security, build and test installed Go with setup-go on
# the runner and ran their own flag sets, which §2 ("not the runner image, ...
# not a tool installed on the runner") and devops.md §4 and §8 rule out; a repo
# that also ran the stages in its image (go-quicraft a141c3c) ran each twice.
# Now one image job (m601 (a), go-quicraft's shape) builds the images once
# (`make docker-build`) and runs each stage's make target in the toolchain
# image as a step, through scripts/in-toolchain-image.sh (from go-quicraft,
# ships beside this file): lint, build, test (`make coverage` with
# COVERAGE_THRESHOLD, m601 (c)), security, deps-check (new, ci-standard.md
# §1) and trivy image on the integration image (it leaves the CUSTOMIZE note).
# The integration stage stays its own job, `make integration-test` in the
# integration image. Both run on bigdisk (ubuntu-latest on github.com).
# CUSTOMIZE (go-qrdb): DS-3044 moved the image build to its own docker-build
# job, and #1046 (Company Agent m1001) split the stages between a lint job and
# the image job, which run side by side in the one toolchain image; see the
# lint job.
# setup-go, the runner tool installs and the SARIF upload (m601 (d): CI runs
# on Gitea) are gone, and with them GO_VERSION: the image pins Go. The tag
# assertion moves to scripts/assert-build-tags.sh (ships beside this file).
# CI Gate runs on ci-gate (m386) with go-quicraft's pr/full tier, and its
# needs list and check lines are a CUSTOMIZE block (m598 item 2). The make
# variables the jobs pass are in devcontainer.md §6 (m601 (b)).
#
# v1.20 (Company Agent m270 items 1 and 9, 2026-10-16): the CUSTOMIZE image
# job's `trivy image` also takes `--skip-dirs /opt/go/mod`, so a secret match
# in a third-party module's source inside the image's Go module cache no
# longer fails the scan; a secret in the repo's own layers still does, and no
# repo carries its own trivy secret config. A new `arch-gates` job (from
# go-xkms) fails a direct go-objstore import outside the repo's storage seam,
# and CI Gate needs it.
# v1.19 (Company Agent m262 items 3 and 4, 2026-10-16): the CUSTOMIZE image
# job takes `trivy image --ignore-unfixed` (devops.md §8): a fixed CVE still
# blocks, an advisory with no fixed package does not, and no repo adds a
# .trivyignore for it. The github.com gosec install builds the latest gosec
# tag against the latest x/tools in the one form of devcontainer.md §2.
#
# v1.18 (2026-10-12): a CUSTOMIZE integration job that starts
# containers on the runner host runs scripts/reap-stale-ci-stacks.sh first
# (ships beside this file). Its `if: always()` teardown dies with the job when
# the host or the Docker daemon goes down, and nothing removed the stack after:
# 11 exited stacks, with their networks and volumes, stayed on two CI
# runner hosts after the 2026-10-11/12 restarts. See the CUSTOMIZE note above
# ci-gate.
#
# v1.17: third-party actions pinned by commit, the tag in a
# trailing comment (devops.md §9 "Actions are pinned by commit").
#
# v1.16: gosec, govulncheck and actionlint
# install only on github.com; Gitea jobs use the runner image's baked, pinned
# tools.
#
# v1.15 (2026-10-05): push runs on main
# only again. automerge.yml v7 opens each merge train as a PR from
# merge-train/* into main, so the train gets its CI from the pull_request
# trigger like any PR, and block_on_outdated_branch stays on (owner,
# 2026-10-04: "leave the block_on_outdated_branch turned on, we want to make
# sure we are requiring the latest from main in all branches before they get
# merged in"). The parallel stages of v1.14 stay.
#
# v1.14 (2026-10-04): every job starts
# at once, so a run takes as long as its slowest job. security, test and any
# CUSTOMIZE integration job no longer wait on lint + build; CI Gate, the one
# required check, still needs every job and fails closed on any result but
# success. (v1.14 also ran push on 'merge-train/**' for automerge.yml v6's
# trains; v1.15 drops that.) Owner, 2026-10-04: "yes
# lets batch the merges. make sure we are doing things efficiently!" and "use
# merge trains where possible if that helps!". Supersedes v1.9's staged
# ordering: a broken push now spends the heavy tier too, in exchange for the
# shortest wall-clock to a green gate, which is what a train waits on.
#
# v1.13 (2026-09-27): GO_VERSION 1.26.7 -> 1.27.1, in
# lockstep with nightly-template v1.6.
#
# v1.12 (2026-08-28, go-blockstore #22 round 2): refresh install-shellcheck.sh to
# the hardened version — the idempotency fast path that trusted an existing
# binary on its `--version` string alone is removed, so the extracted binary's
# SHA-256 is verified every run (an attacker who pre-seeds a matching --version
# no longer bypasses the checksum). The v1.11 copy shipped the pre-round-2
# script carrying that hole; this replaces it byte-for-byte with merged main.
#
# v1.11 (2026-08-28, go-blockstore #22): the lint job installs a PINNED,
# checksum-verified shellcheck (install-shellcheck.sh, ships beside this file)
# so actionlint's SC* rules actually run — without shellcheck on PATH actionlint
# silently disables them and exits 0, and a real SC2046 reached main that way.
# SHIPS-WITH gains install-shellcheck.sh (chmod +x, copy to scripts/).
#
# v1.10 (2026-08-27, go-blockstore #7 Codex review):
#   - actionlint runs in the lint job. devops.md §4 lists actionlint in
#     `make lint`, but through v1.9 the canonical CI never ran it — so the
#     workflow files were the one thing in every repo no CI check read, and a
#     misspelled runner label or invalid Actions YAML reached main having
#     passed a green required gate. Ships with .github/actionlint.yaml (same
#     template directory), which is what keeps self-hosted labels from
#     reading as unknown runners.
#   - the gosec SARIF upload is guarded on the PR head not being a fork.
#     GitHub downgrades the token to read-only for a pull_request from a fork
#     REGARDLESS of the `permissions:` block below, so the step failed the PR
#     for something an external contributor could not fix.
#
# v1.9 (2026-08-20, owner ruling — FAIL-FAST STAGED PIPELINE): iterate fast.
# Gitea cannot cancel in-flight jobs (no cancel route — task #90), so
# fail-fast comes from ORDERING: a fast tier (lint + build, ~minutes) gates
# the expensive tier (security, test, integration where present). A broken
# push reports in minutes and burns nothing downstream; a green push pays
# one fast-tier of extra latency. trivy and fips move to nightly.yml
# (schedule + workflow_dispatch): both were known-red on every push (fips:
# tracked per-repo fips140=only issues; trivy: undiagnosed install failure),
# and a known-red job burning 60-90 runner-minutes per push verifies
# nothing. (go-qrdb, #20: fips is back, as a required full-tier job; see the
# `fips` job.) The gate now distinguishes SKIP (upstream stage failed) from
# FAIL, both failing closed — this supersedes v1.8.1's lint-decoupling,
# whose silent-skip hazard is closed at the source (pinned linter) and in
# the gate (named skips).
#
# v1.9.1 (2026-09-01, owner ruling — devops.md 8a): the trivy move above is
# ALPHA-ONLY, and the note that it "gates nothing" is a phase, not a property.
# Every repo here is private and unreleased; from the first release published to
# the github.com mirror, that repo moves `trivy fs` BACK into ci.yml and into
# the ci-gate `needs`, blocking on CRITICAL/HIGH. Two consequences for adopters:
#   - the exposure window is real and accepted: in alpha a dependency CVE
#     surfaces at the next nightly, not at the push that introduces it;
#   - a repo where trivy is GREEN may keep it in ci.yml today and that is NOT a
#     deviation. The "undiagnosed install failure" premise above is repo-
#     specific and was measurably false in go-trusted-platform, where trivy fs
#     caught two live HIGH x/mod CVEs on 2026-08-19. Nightly is the floor.
# See conventions/devops.md 8a for the trigger and the reasoning.
#
# v1.8 (2026-08-19): gosec and govulncheck triage their own exit codes. A shell
# reports a signal death as 128+N, so an OOM kill leaves 137 — indistinguishable
# from a real finding in the job summary, which is all the Gitea API exposes
# (task #97). Found on go-quicbaas: gosec reported `Issues : 0`, govulncheck was
# SIGKILLed while four sibling repos ran heavy jobs on the same host, and the
# Makefile reported it as "reachable vulnerabilities" — a phantom CVE hunt
# waiting to happen. Both steps still exit non-zero; they only say WHICH it was.
# The same conflation exists in every repo's Makefile vuln target — fix it there
# too when adopting this version.
#
# v1.7 (2026-08-18): gosec -concurrency 4. The v1.6 GOMEMLIMIT/GOMAXPROCS
# bound was PROVEN INSUFFICIENT: gosec sizes its pool from runtime.NumCPU()
# (the host's 24 cores, GOMAXPROCS notwithstanding), so live SSA for ~24
# packages exceeded the 16 GB container cap with all three observed scans
# carrying GOMEMLIMIT=10GiB while pinned at 16/16 GiB. Live heap cannot be
# GC'd away; only lower analysis concurrency shrinks it.
#
# v1.6 (2026-08-18): GOMEMLIMIT + GOMAXPROCS on the security job. The Go
# toolchain does not see cgroup limits — inside a 16 GB container it read the
# HOST's 24 cores and 94 GB, ran 24 gosec workers, and grew the heap until the
# cgroup had to swap 10.9 GB of anonymous memory. It never OOMed (swap absorbed
# it), so instead of failing it thrashed: memory PSI 98, 43% of the host's CPU
# in iowait, every other job on the box starved. Full evidence in the job's
# comment block below. This is a TUNING fix, not a capacity one: the host had
# 56 GB free throughout.
#
# v1.5 (2026-08-18): triggers narrowed to `[main]`. The template shipped
# `[master, main, develop]` with a "CUSTOMIZE" note, so 15 of 20 repos still
# name branches that DO NOT EXIST — the template contradicted the ratified
# trunk-based standard (company CLAUDE.md: "no branches, and the trunk is
# main"), and a template that disagrees with the standard loses every time it
# is copied. Inert today, because no event can fire for a branch that is
# absent; the cost is latent, not current. Recreate `develop` in any of those
# repos and its every commit runs CI twice — one push run and one
# pull_request run for the same sha — with nothing to cancel the second
# (only a ref-keyed concurrency group would cancel it: devops.md §9b).
# Do NOT re-add a branch list "for safety": a repo that needs a second trunk
# is a decision for the owner, not a default.
#
# v1.4 (2026-08-17): `fips` job added (owner mandate, security-review.md §6)
# — build + unit tests under GOFIPS140=latest with GODEBUG=fips140=only, wired
# into ci-gate. Rolls out per repo through each project agent's own issue
# (NOT a blind template sweep): FIPS mode surfaces real incompatibilities
# (non-approved primitives) that each agent must resolve or escalate as an
# owner decision before its repo adopts v1.4.
#
# v1.3 (2026-08-14): `workflow_dispatch:` trigger added, so a phantom failure
# (runner crash, host overload; see infra lessons.md) can be retried without
# pushing an empty commit.
#
#   CORRECTION (2026-08-19): this entry originally claimed "Gitea's build
#   exposes no rerun API, so without it the only way to retry a phantom
#   failure is an empty commit." That premise is FALSE and it propagated to
#   five repos. `swagger.v1.json` on 1.27.1 publishes three re-run routes:
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun
#     /repos/{owner}/{repo}/actions/runs/{run}/rerun-failed-jobs
#     /repos/{owner}/{repo}/actions/runs/{run}/jobs/{job_id}/rerun
#   `rerun-failed-jobs` re-runs only a run's failed jobs. Note the job-level
#   route is NESTED under the run — the flat `jobs/{id}/rerun` shape does not
#   exist, and probing that shape is how two of us concluded the API was
#   missing. A 404 does not distinguish a missing route from a missing
#   resource; swagger is the authority.
#
#   Stated precisely, because the mistake is easy to make in reverse: these
#   routes are PUBLISHED IN THE SPEC — verified. They have NOT yet been
#   executed here, so do not upgrade this to "rerun works" until someone has
#   actually run one. What IS measured: there is no `cancel` route at any
#   path, and DELETE returns 400 "this workflow run is not done" on anything
#   unfinished, so no REST call can shed a queued run (task #90).
#
#   `workflow_dispatch` KEEPS its place regardless, on an independent
#   justification: re-run acts on an existing run, so it cannot help when a
#   run was never created — the lazy-creation case where a fresh head shows
#   no jobs for minutes. Removing the trigger because re-run exists would be
#   an overcorrection.
#
# v1.2 (2026-08-14): actions/checkout and actions/setup-go moved to @v6 —
# §9 already named checkout@v6 the standard and repos were shipping green on
# v6/v6 while this file still said v4/v5 (same defect class as promising a
# gate the template doesn't implement: the standard and the template must
# never disagree).
#
# v1.1 (2026-08-14): gosec findings now also print to the job log (the SARIF
# upload only exists on github.com, so on Gitea the findings were invisible).
# Also NEVER add `GOPROXY: direct` / `GOSUMDB: off` to a repo's env block:
# GOPRIVATE (injected by the runners, dependency-resolution.md §6) already
# exempts first-party modules from proxy and sumdb; the blanket override
# disables checksum-database verification for every third-party dependency
# and breaks the build when an upstream re-points a tag (go-tpm-tools v0.4.8,
# 2026-08-14). `ghcr.io` likewise does not exist on Gitea — use the Gitea
# registry (lessons.md).
# Source of truth: software/templates/github-actions/ci.yml in the
# handbook. Copied into each repo (never workflow_call: the
# template lives inside the security boundary and cannot be referenced from
# github.com). Blocks marked CUSTOMIZE are the only expected divergence;
# everything else drifting from the template is a defect (devops.md §8).
#
# Runs identically on Gitea Actions (dev) and GitHub Actions (public mirror);
# host-specific steps are guarded on github.server_url (devops.md §1).

name: CI

on:
  push:
    # trunk-based: main is the ONLY trunk. automerge.yml's merge trains are
    # PRs from merge-train/* and get CI from pull_request (v1.15).
    branches: [main]
  pull_request:
    branches: [main]
    # CUSTOMIZE (go-qrdb): no `labeled` (#853). Gitea 1.27.1 sends every label
    # add AND remove as `label_updated`, and its matcher maps that to
    # `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`. test/buildgates/ci_tiers_test.go holds this line.
    types: [opened, synchronize, reopened]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created (see v1.3 correction above)
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. Restored under Company Agent ruling 216(1)
  # (Software's typed order DS-3913): ruling 135 makes this in-template Gitea
  # schedule trigger the one scheduler, and the owner ruling of 2026-10-11 and
  # Company Agent m433 forbid host cron, timers and watchers, not this
  # trigger. test/buildgates/ci_tiers_test.go allows a `schedule:` here
  # and in automerge.yml alone.
  schedule:
    - cron: '0 4 * * *'

# v1.26.2 (ruling 145; go-qrdb's since DS-3465): on main the group is the
# workflow, the event and the commit, so main runs never cancel each other: a push to main leaves
# the in-progress run of the previous main commit to finish, and every merge
# keeps a completed run. Every other ref is one group, so a PR's newer run
# cancels the older. No expression reaches cancel-in-progress: Gitea 1.27.1
# never released go-qrdb main run 57063, the first run after v1.22.1 set it
# to an expression (Company Agent m695).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CUSTOMIZE (go-qrdb): COVER_MIN, the repo-wide floor `make coverage` enforces
  # beside the per-package baseline in test/coverage-baseline.txt (#500).
  COVERAGE_THRESHOLD: 91      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated — the go
  # tool's own form. Leave EMPTY if no package is tag-gated. Every analysis step
  # below derives its own form from this ONE value; never write the tag list
  # twice. A tag-gated package that is not named here is analysed by NOTHING
  # while the gate still reports green (one repository had eight
  # such packages, including its whole WebAuthn implementation).
  # CUSTOMIZE (go-qrdb): exactly `make -s print-build-tags`, the default feature
  # set the coverage baseline was measured under (its `# build-tags:` line), in
  # the same order; the Makefile adopts it as BUILD_TAGS when it is set.
  GO_BUILD_TAGS: "codec_json raft qrdb_ts qrdb_vector qrdb_vlog qrdb_sql qrdb_mysql qrdb_pgsql qrdb_etcd qrdb_embedded codec_msgpack codec_yaml codec_bson codec_protobuf"
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch), and a PR labelled ci:full. Steps read it as env.CI_FULL_TIER; a job-level `if:`
  # cannot read env, so each full-tier job repeats this expression. Keep them
  # equal (test/buildgates/ci_tiers_test.go).
  CI_FULL_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # CUSTOMIZE (go-qrdb, claude-agents#329): the one event that logs in to the
  # registry and pushes the CI images, a push to main on github.com. On the
  # forge no event publishes: that waits until the registry namespace the
  # images go to is the release runner credential's own, and until then
  # every job there takes the local path. Every step that logs
  # in, pushes or pulls carries `if: env.CI_PUBLISH == 'true'`; its
  # counterpart, which builds on the runner's own daemon, carries
  # `if: env.CI_PUBLISH != 'true'` (test/buildgates/ci_image_digest_test.go).
  CI_PUBLISH: ${{ github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
  # v1.24 (CA m749, m751 (a)): the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  # CUSTOMIZE (go-qrdb): kept as the template's. Nothing embeds or generates
  # from docs/ or markdown. The gates that read docs/ are lint-class and run
  # in `make lint-gates`, which a docs-only PR still runs:
  # check-publication-bound, check-integration-feature-coverage (a feature
  # folder without its features.mk entry) and check-no-alias-language.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'

jobs:
  # v1.24 (CA m749, m751 (a)): a PR whose every changed file matches DOCS_ONLY_PATTERN
  # runs lint only; build and make coverage are skipped. Off pull_request, or
  # on a ci:full PR, docs_only is always false. Any doubt (a failed diff, an
  # empty list) reads as false, so the tier fails toward running the tests.
  #
  # CUSTOMIZE (go-qrdb, DS-3160): docs_only also selects the `code` tier, the
  # jobs that run on every event but a docs-only PR. Each carries exactly
  # `if: needs.changes.outputs.docs_only != 'true'` and lists changes in
  # needs; CI Gate excuses its skip only when DOCS_ONLY is true. A docs-only
  # PR runs changes, docker-build (the toolchain image alone), lint (make
  # lint and make deps-check), lint-gates (make lint-gates), arch-gates (make check-public-releasable
  # alone) and CI Gate; image and test-typescript, the code tier, are
  # skipped.
  changes:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: ${{ github.event_name == 'pull_request' && env.CI_FULL_TIER != 'true' }}
        with:
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # CUSTOMIZE (go-qrdb, DS-3044): `make docker-build` is its own job, so the
  # integration legs wait on the two-minute image build, not on the lint and
  # image jobs' stages, and run beside them. Lint runs in the toolchain image
  # on a docs-only PR too, so every run builds that image; it needs `changes`
  # only to know whether the run is a docs-only PR (DS-3160). A docs-only PR
  # builds the toolchain image alone and outputs an empty it_ref: no job of
  # such a run uses the integration image (the image job is the code tier
  # and skips), so it builds and pushes none. Any other docs_only value builds
  # both.
  #
  # CUSTOMIZE (go-qrdb, DS-3516): the registry. This job pushes both images to
  # the Gitea registry, derived from github.server_url, under the repository
  # owner, as qrdb-ci-toolchain and qrdb-ci-it tagged <content-hash>-<trust>
  # (trust: main on a push to main, pr otherwise, the cache trust class), and
  # outputs their digest references, toolchain_ref and it_ref, validated
  # before any consumer starts. Every consumer pulls that digest, on whatever
  # runner it lands, so no job needs this one's host and none rebuilds an
  # image. One tag per content hash and trust class; the registry's cleanup
  # rule removes superseded versions.
  #
  # The hold: this job holds the integration image (IT_HOLD) from its build
  # to its push, so a concurrent reap on this host cannot remove a cache-hit
  # image whose last tag is over two hours old before it is pushed, and
  # releases it on every outcome. A reap after that costs a consumer here a
  # pull, never a wrong image. Each consumer holds what it pulls.
  docker-build:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer images
    # CUSTOMIZE (go-qrdb): on the forge this job builds on bigdisk on every
    # event and pushes nothing (CI_PUBLISH); github.com keeps ubuntu-latest
    # and the run's own token (test/buildgates/ci_image_digest_test.go).
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: [changes]
    timeout-minutes: 45       # CUSTOMIZE (DS-3044): a cold build of both images
    # CUSTOMIZE (go-qrdb): on a push to main on github.com this job alone
    # pushes the images to the registry, with the run's own token, so it alone
    # may write packages (DS-3516).
    permissions:
      contents: read
      packages: write
    # CUSTOMIZE (go-qrdb): on a push to main the outputs are digest
    # references, <registry>/<owner>/<name>@sha256:<hex>, which every consumer
    # pulls; a tag or a local image name is never handed on (DS-3516). On
    # every other event they are empty: nothing was pushed, and each consumer
    # takes the image from its own runner (claude-agents#329).
    outputs:
      toolchain_ref: ${{ steps.push.outputs.toolchain_ref }}
      it_ref: ${{ steps.push.outputs.it_ref }}
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # CUSTOMIZE (go-qrdb): the hold covers the build-to-push window only;
      # each consumer holds what it pulls (DS-3516).
      IT_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-build
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb, #813): the integration image is qrdb-ci-it:<content
      # hash> on every job, so this job also reaps under qrdb-ci-.
      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      - name: Build the devcontainer images
        id: build
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          if [ "$DOCS_ONLY" = true ]; then
            make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
            it_image=
          else
            make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
            it_image=$(make -s it-image)
          fi
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "toolchain_image=$(make -s toolchain-image)" >> "$GITHUB_OUTPUT"
          echo "it_image=$it_image" >> "$GITHUB_OUTPUT"

      # CUSTOMIZE (go-qrdb): on a push to main alone (CI_PUBLISH: on
      # github.com alone until the forge's registry namespace is the release
      # runner credential's own), push each image once per
      # run, tagged <content-hash>-main, and hand on its digest (DS-3516).
      # scripts/ci-registry.sh feeds the login to docker on stdin. On the forge
      # the push, once enabled, runs on the release runner and reads its
      # credential contract alone, the three names its runner env file
      # exports (ruling 173, claude-agents#329): RELEASE_REGISTRY, the host
      # the push goes to and the digest reference names, RELEASE_REGISTRY_USER
      # and RELEASE_REGISTRY_TOKEN. No step sets any of them: a step env entry
      # would mask the runner's. On github.com the registry is GHCR and the
      # login the run's own token, handed on under RUN_REGISTRY_* as
      # CI_REGISTRY_* and empty on the forge. A
      # refused login or push fails the job: no consumer on main has an image
      # to fall back to, by design. Every other event skips this step and the
      # next (claude-agents#329): the images stay on this runner, and the
      # consumers build or reuse their own.
      - name: Push the devcontainer images
        id: push
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          RUN_REGISTRY_USER: ${{ github.server_url == 'https://github.com' && github.actor || '' }}
          RUN_REGISTRY_TOKEN: ${{ github.server_url == 'https://github.com' && secrets.GITHUB_TOKEN || '' }}
          TRUST: main
          TOOLCHAIN_IMAGE: ${{ steps.build.outputs.toolchain_image }}
          IT_IMAGE: ${{ steps.build.outputs.it_image }}
        run: |
          if [ -n "$RUN_REGISTRY_TOKEN" ]; then
            export CI_REGISTRY_USER=$RUN_REGISTRY_USER CI_REGISTRY_TOKEN=$RUN_REGISTRY_TOKEN
          fi
          toolchain_ref=$(scripts/ci-registry.sh push "$TOOLCHAIN_IMAGE" qrdb-ci-toolchain "$TRUST")
          it_ref=
          if [ -n "$IT_IMAGE" ]; then
            it_ref=$(scripts/ci-registry.sh push "$IT_IMAGE" qrdb-ci-it "$TRUST")
          fi
          echo "toolchain_ref=$toolchain_ref" >> "$GITHUB_OUTPUT"
          echo "it_ref=$it_ref" >> "$GITHUB_OUTPUT"

      # CUSTOMIZE (go-qrdb): every output a consumer pulls is a digest
      # reference, or the job fails here rather than in forty consumers
      # (DS-3516). A docs-only run builds no integration image, so it_ref is
      # empty there and only there.
      - name: Validate the image references
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ steps.push.outputs.toolchain_ref }}
          IT_REF: ${{ steps.push.outputs.it_ref }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          re='^[^@ ]+@sha256:[0-9a-f]{64}$'
          [[ $TOOLCHAIN_REF =~ $re ]] || { echo "::error::toolchain_ref '$TOOLCHAIN_REF' is not a digest reference"; exit 1; }
          if [ "$DOCS_ONLY" != true ]; then
            [[ $IT_REF =~ $re ]] || { echo "::error::it_ref '$IT_REF' is not a digest reference"; exit 1; }
          fi

      # CUSTOMIZE (go-qrdb): the hold is released on every outcome; the
      # consumers hold their own copy, pulled or local (DS-3516).
      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          make docker-release-it
  # v1.21: every stage runs in the project's own devcontainer image and no
  # other (ci-standard.md §2, devcontainer.md §7). The docker-build job builds
  # the images once from build/docker/devcontainer/Dockerfile at this commit
  # (`make docker-build`), and the lint and image jobs run each stage's `make`
  # target in the toolchain image as its own step, through
  # scripts/in-toolchain-image.sh (ships beside this file), which copies the
  # checkout into the container: a runner reaches its daemon through a socket,
  # so a bind mount would resolve on the daemon's host. A failed step names
  # its stage; `if: !cancelled()` runs every stage after a failed one, so one
  # run reports them all.
  #
  # No job installs a Go toolchain or a tool on the runner: the image's pin file
  # (devcontainer.md §2) decides every version, and the Makefile carries every
  # flag set (devops.md §4; §8: CI runs gosec through the developers' target).
  # GO_BUILD_TAGS reaches every target as a make variable, so the tag set is
  # still written once. build, test and lint run with no network, on the
  # image's module cache; security and deps-check get one (IN_IMAGE_NETWORK=
  # bridge) for the vulnerability databases and the module proxy.
  #
  # v1.23: lint, assert-build-tags, build and coverage are the PR tier and run
  # on every event. security and trivy image are full tier only
  # (env.CI_FULL_TIER): main after every merge, dispatch, ci:full.
  # v1.28: deps-check is a lint-class gate on the PR tier and runs on every
  # event (ruling 219(3)); here it is a lint job step (#1046).
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (in-toolchain-image.sh v2, ci-standard.md §6), so a stage writes its
  # caches there and not into its container's layer.
  #
  # The forge credentials reach the image build only as the gomodauth BuildKit
  # secret, from a file outside the context that the job removes.
  # No step and no make target prints that file, the job environment (`env`,
  # `printenv`, `set -x`) or a matched line: `make stage-gomodauth` and the
  # file writes run silent, and lint steps and `make check-public-literals`
  # report path and line only (ci-standard.md §5, Company Agent m605 item 8).
  #
  # Runners: the lint, image and integration jobs run on bigdisk (Docker and
  # the disk for the image builds) and CI Gate on ci-gate; on the github.com
  # mirror all are ubuntu-latest, which has Docker (devops.md §1:
  # host-specific choices are guarded on github.server_url).
  #
  # CUSTOMIZE (go-qrdb, #1046, Company Agent m1001): this departs from the
  # template's one image job (m601 (a)). The stages run in two jobs side by
  # side, lint (make lint, make deps-check, make lint-sweeps) and image (the
  # tag assertion, build, the release cross-build, the unit suites, security,
  # trivy image), in the one toolchain image docker-build built,
  # each with its own limit: together they outlast one job's 90 minutes on a
  # loaded runner, where lint with lint-sweeps takes most of an hour and
  # coverage about half of one.
  # lint is the PR tier and, with lint-gates (below), is all a docs-only PR
  # runs of the stages; image is the code tier (DS-3160) and skips there. Each
  # job pulls the images it runs by digest and holds them to its teardown
  # (DS-3516): lint and lint-gates the toolchain image alone, image both.
  lint:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Devcontainer image [lint, deps-check, lint-sweeps]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: [changes, docker-build]
    timeout-minutes: 120      # CUSTOMIZE (#1046, DS-3575): lint-sweeps loaded average 43 min on the Dells; omega finished 0 of 4 runs inside 75
    # CUSTOMIZE (go-qrdb): the run's own token pulls the toolchain image from
    # the registry on github.com (DS-3516).
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # CUSTOMIZE (go-qrdb): this job's hold on the pulled toolchain image
      # (DS-3516).
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-lint-toolchain
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: the nightly schedule runs
      # on main and shares main's set (restored by DS-3913, m1378 (2)).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb, #813): the integration image is qrdb-ci-it:<content
      # hash> on every job, so this job also reaps under qrdb-ci-: a runner
      # that only ever runs the PR tier still drops old integration images.
      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE (go-qrdb): on a push to main, pull the toolchain image
      # docker-build pushed, by digest, and hold it until the teardown so a
      # concurrent reap or trim on this host cannot remove it under the
      # stages. A pull that fails three times fails the job; nothing on this
      # path rebuilds the image (DS-3516).
      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, claude-agents#329): on every other event nothing
      # was pushed. Take the toolchain image from this runner's daemon by its
      # content-hash tag, building it when missing, hold it by image ID and
      # run the stages on that ID; this step never logs in.
      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job, and it keeps
      # every volume a container mounts, so the image job beside it is safe.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # make lint: gofmt, vet, golangci-lint, actionlint with shellcheck
      # (devops.md §4). .golangci.yml enables staticcheck, errcheck, unused,
      # ineffassign, misspell and gocritic (devops.md §8).
      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # Fails when a library, first-party or third-party, is behind its latest
      # release without devops.md §9's documented reason (ci-standard.md §1).
      # v1.28: a lint-class gate of seconds on the PR tier, every event, a
      # docs-only PR included (ruling 219(3)); it was full tier only from v1.23.
      # CUSTOMIZE (go-qrdb, #1046): the template runs it in the image job,
      # which runs lint there; here it follows `make lint` in the lint job.
      # It reads go.mod and the module proxy only, no build output.
      - name: make deps-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # CUSTOMIZE (go-qrdb, #813): vet-tags and the secure analyzer sweep every
      # SUPPORTED_TAG_SETS combination (Makefile LINT_SWEEPS), so they run on a
      # push to main and on the daily full-tier workflow_dispatch, never on a
      # pull request, which must finish within one hour. release.yml runs both
      # again before a tag. A network for vet-tags' nested benchmark modules.
      - name: make lint-sweeps
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-sweeps GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # v1.27.0 (Company Agent m1192 (6), item 27; DS-3609): the repository's
  # `make lint-gates` (Makefile LINT_GATES: the script, workflow,
  # generated-code and module gates, `make vet` over the default tag set, the
  # secure analyzer's self-test and the sdk/go linters) runs in this job, in
  # parallel with the lint job's `make lint`, not in series after it, so
  # Lint's wall time is the longer of the two and not their sum. It runs only
  # when the Makefile (or a tracked *.mk) defines a lint-gates target. A
  # lint-class check, so it is on the PR tier and runs on a docs-only PR: the
  # gates read docs/. CUSTOMIZE (go-qrdb, DS-3516): docker-build pushed the
  # toolchain image on a push to main, so this job pulls it by digest there
  # and takes it from its own runner otherwise, as the lint job does, rather
  # than running the template's `make docker-build`. Reconciled with
  # v1.27.0's job (ruling 211): the probe, trim, `make -k lint-gates` and
  # tear-down steps are the template's; the go-qrdb differences are those
  # two image paths and the hold, the qrdb-ci- reap, IN_IMAGE_NETWORK=bridge (the gates resolve
  # nested modules through the proxy), and the draft `if:` every job carries (ruling 214).
  lint-gates:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Lint Gates [toolchain image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: [changes, docker-build]
    timeout-minutes: 45       # CUSTOMIZE: lint-gates took 6.5 warm minutes on main run 64873; headroom for a cold, loaded runner
    # CUSTOMIZE (go-qrdb): the run's own token pulls the toolchain image from
    # the registry on github.com (DS-3516).
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # CUSTOMIZE (go-qrdb): this job's hold on the pulled toolchain image
      # (DS-3516).
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-lint-gates-toolchain
      # v1.22: the cache volumes' trust class (as in the lint job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      # CUSTOMIZE (go-qrdb, #813): reaps under qrdb-ci- too (as in the lint job).
      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE (go-qrdb): as in the lint job, on a push to main pull the
      # toolchain image docker-build pushed, by digest, and hold it until the
      # teardown; nothing on this path rebuilds the image (DS-3516).
      - name: Pull the toolchain image
        if: ${{ steps.probe.outputs.has_target == 'true' && env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, claude-agents#329): on every other event, as in
      # the lint job, the runner's own image, held by image ID; no login.
      - name: Build or reuse the toolchain image on this runner
        if: ${{ steps.probe.outputs.has_target == 'true' && env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the lint job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # -k reports every failing gate in one pass. CUSTOMIZE (go-qrdb):
      # IN_IMAGE_NETWORK is bridge, as the lint job's step had it: the gates'
      # vet and sdk/go linters resolve nested modules through the proxy.
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  image:
    name: Devcontainer image [build, test, security, trivy image]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # CUSTOMIZE (go-qrdb, #1046): the code tier (DS-3160), so a docs-only PR,
    # which builds nothing, skips it; lint, above, is that PR's stage job.
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    # v1.24 (CA m749, m751 (a)). CUSTOMIZE (go-qrdb, DS-3044): and
    # docker-build, which builds the images this job's stages run in.
    needs: [changes, docker-build]
    timeout-minutes: 90       # CUSTOMIZE (#1046): the build stages plus the full tier's release-cross, security and trivy; the unit suites left for their own jobs (ruling 211), the 90 ceiling is kept
    # CUSTOMIZE (go-qrdb): the run's own token pulls the images from the Gitea
    # registry (DS-3516).
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # CUSTOMIZE (go-qrdb, run 57540, DS-3516): this job's holds on the
      # images it pulls, from the pull to this job's teardown, so another
      # job's reaper or cache trim cannot remove one before the trivy step
      # saves it. Under qrdb-ci-, so a dead job's hold is reaped.
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-image-toolchain
      IT_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-image
      # v1.22: the cache volumes' trust class (see the lint job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step (see the lint job).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb, #813): reaps under qrdb-ci- too (see the lint job).
      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE: host tuning a test needs (e.g. QUIC UDP buffers:
      # sudo sysctl -w net.core.rmem_max=7340032 net.core.wmem_max=7340032)
      # goes here; the container shares the runner's kernel.

      # CUSTOMIZE (go-qrdb): on a push to main, pull both images docker-build
      # pushed, by digest, and hold each until the teardown, so a concurrent
      # reap or trim on this host cannot remove one before the trivy step
      # saves it. A pull that fails three times fails the job; nothing on this
      # path rebuilds an image. This job skips a docs-only PR, the one run with
      # no integration image, so both references are required (DS-3516).
      - name: Pull the devcontainer images
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          IT_REF: ${{ needs.docker-build.outputs.it_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          scripts/ci-registry.sh pull "$IT_REF" "$IT_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"
          echo "IT_IMAGE=$IT_REF" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, claude-agents#329): on every other event nothing
      # was pushed. Take each image from this runner's daemon by content-hash
      # tag, building it when missing, and hold it to the teardown: the
      # toolchain image by image ID, which the stages run, the integration
      # image through docker-build-it's hold. Only the full tier's trivy step
      # reads the integration image, so a plain PR does not build it here.
      # This step never logs in.
      - name: Build or reuse the devcontainer images on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"
          if [ "$CI_FULL_TIER" = true ]; then
            image=$(scripts/ci-registry.sh local it "$IT_HOLD")
            echo "IT_IMAGE=$image" >> "$GITHUB_ENV"
          fi

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6), as the lint job does.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # v1.9.2, now in the image: the declared tag set must select code. Each
      # tag is checked by removal: if dropping it changes no selected file
      # (tests included), it is misspelled or dead. Compares files, not
      # packages, and a tag may swap files (a `!foo` stub for a `foo` body).
      - name: Assert every build tag selects code
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "GO_BUILD_TAGS='$GO_BUILD_TAGS' sh scripts/assert-build-tags.sh"

      # CUSTOMIZE: nested modules (sdk/go, xkey) and variants (FIPS) are built
      # by `make build` itself, never by an extra step here.
      # CUSTOMIZE (go-qrdb): `make build` is build-server plus build-client, and
      # build-client is the Wails desktop build in its own compose container,
      # which the toolchain image does not carry. This step compile-checks
      # every package untagged, the sdk/go module, and builds qrdbd and the
      # headless qrdb CLI under the feature set.
      - name: make build-server build-cli-headless
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "go build ./... && (cd sdk/go && go build ./...) && make build-server build-cli-headless GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): the release publishes linux/arm64 binaries
      # (release.yml), so a change that breaks the arm64 build, plain or FIPS,
      # fails on main or a ci:full PR rather than on the tag. A cgo-free
      # cross-compile: nothing runs on arm64 and nothing is emulated. Full tier
      # (CI_FULL_TIER, ruling 211): never on a plain pull request.
      - name: make release-cross (linux/arm64, plain and FIPS)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make release-cross PLATFORM=linux/arm64 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # The unit suites (make coverage, test-clusterproof, coverage-fts,
      # test-tags, test-sdk) are their own jobs below (ruling 211), in
      # parallel with this one.

      # make security: gosec, govulncheck, go mod verify (devops.md §8), with
      # trivy fs per the phase (§8a). The target owns gosec's flags and its
      # memory bounds (GOMEMLIMIT, GOMAXPROCS, -concurrency; v1.6 to v1.8) and
      # reports a kill by signal as a kill, not a finding. Nothing is uploaded
      # to code scanning (m601 (d): CI runs on Gitea).
      - name: make security
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # The integration image is gated before any push to either registry
      # (devops.md §8): --ignore-unfixed (v1.19) and --skip-dirs /opt/go/mod
      # (v1.20). trivy fs and make security never take --ignore-unfixed.
      # CUSTOMIZE (go-qrdb): `make trivy-image` carries both flags, skips
      # this image's module cache (/gomodcache, not the template's
      # /opt/go/mod), and certifies the database's age before it scans with
      # --skip-db-update, so a stale database fails rather than passes.
      # The scan is full tier (v1.23). CUSTOMIZE (go-qrdb): on a push to main
      # it saves the image this job pulled by digest, the one every
      # integration leg runs (DS-3516); on every other event the image this
      # runner holds under the tree's content-hash tag (claude-agents#329).
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            make trivy-image TRIVY_IMAGE_INPUT=it-image.tar

      # CUSTOMIZE (go-qrdb): the images stay on this daemon, pulled or built,
      # for the next job here, and the reap step removes them once no job
      # holds them (#813). This releases this job's holds (DS-3516).
      - name: Tear down
        if: always()
        run: |
          rm -f it-image.tar
          scripts/ci-registry.sh release "$TOOLCHAIN_HOLD" "$IT_HOLD"

  # CUSTOMIZE (go-qrdb, ruling 211, CA m1355): the unit suites are five jobs,
  # in parallel with the image job and with each other; they were two serial
  # steps of the image job, about 36 of its minutes. Each needs only
  # docker-build's toolchain image, runs its suite through
  # scripts/in-toolchain-image.sh exactly as the image job's step did, with
  # the same cache volumes and trust class, and masks the forge credentials
  # first. They are the code tier (DS-3160): every event but a docs-only PR.
  # test-clusterproof, coverage-fts, test-tags and test-sdk are one job each,
  # not one shared job: no per-suite time is on record (the old step ran all
  # four under one timer), so none is known to be under two minutes.
  #
  # The test stage (m601 (c)): make coverage runs the whole unit suite with
  # -race (make test's flags), the PR tier's unit test and race checks in
  # one run (v1.23), and fails when total coverage is below
  # COVERAGE_THRESHOLD (testing-guidelines.md), so the suite runs once.
  # Tags matter here too: without them tag-gated packages are neither
  # tested nor counted. CUSTOMIZE (go-qrdb, #1046): the bulk run omits make
  # test's -count=1, so a package unchanged since a passing run on this
  # host's cache replays that result and its profile, and the
  # subprocess-coverage packages run beside it, not after it.
  coverage:
    name: Unit [make coverage]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes, docker-build]
    timeout-minutes: 75       # CUSTOMIZE (ruling 211): the bulk of the ~36 warm minutes the two steps took, doubled for a loaded runner
    # CUSTOMIZE (go-qrdb): the run's own token pulls the toolchain image from
    # the registry on github.com (DS-3516), in this job and the four below.
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # CUSTOMIZE (go-qrdb): this job's hold on the toolchain image (DS-3516).
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-coverage-toolchain
      # v1.22: the cache volumes' trust class (as in the lint job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb, #813): reaps under qrdb-ci- too (as in the lint job).
      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE (go-qrdb): as in the lint job, on a push to main pull the
      # toolchain image docker-build pushed, by digest, and hold it until the
      # teardown; nothing on this path rebuilds the image (DS-3516). On every
      # other event, the runner's own image, held by image ID; no login
      # (claude-agents#329). The four jobs below take it the same way.
      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the lint job).
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make coverage (unit tests and the threshold)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage GO_BUILD_TAGS='$GO_BUILD_TAGS' COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # CUSTOMIZE (go-qrdb): the suites `make coverage` does not reach, one job
  # each, every one shaped as the coverage job. test-clusterproof is a
  # separate module under its own tags.
  test-clusterproof:
    name: Unit [make test-clusterproof]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes, docker-build]
    timeout-minutes: 45       # CUSTOMIZE (ruling 211): no per-suite time on record; the four suites' share of the ~36 warm minutes, doubled
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-test-clusterproof-toolchain
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make test-clusterproof
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k test-clusterproof GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # coverage-fts runs pkg/fts's real index under qrdb_fts and ratchets it
  # against test/coverage-baseline-fts.txt (#610).
  coverage-fts:
    name: Unit [make coverage-fts]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes, docker-build]
    timeout-minutes: 45       # CUSTOMIZE (ruling 211): as test-clusterproof's
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-coverage-fts-toolchain
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make coverage-fts
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k coverage-fts GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # test-tags RUNS the CLI suites under the reduced protocol-family rungs.
  test-tags:
    name: Unit [make test-tags]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes, docker-build]
    timeout-minutes: 45       # CUSTOMIZE (ruling 211): as test-clusterproof's
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-test-tags-toolchain
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make test-tags
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k test-tags GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # test-sdk is the sdk/go module's race suite (#132), which `./...` at the
  # root never crosses.
  test-sdk:
    name: Unit [make test-sdk]
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes, docker-build]
    timeout-minutes: 45       # CUSTOMIZE (ruling 211): as test-clusterproof's
    permissions:
      contents: read
      packages: read
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-test-sdk-toolchain
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh "$CI_STACK_PREFIX" && scripts/reap-stale-ci-stacks.sh qrdb-ci-

      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      - name: make test-sdk
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make -k test-sdk GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # Integration tests run in the integration image (ci-standard.md §2), as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, the job reaps stale stacks
  # first (v1.18) and keeps its own teardown last under `if: always()`.
  # v1.23: full tier only (CI_FULL_TIER's expression); never on a plain PR.
  #
  # CUSTOMIZE (go-qrdb): the template's one `integration` job is two jobs
  # here, both on the full tier (#674). DS-3044: both need docker-build,
  # test-typescript and arch-gates, not the lint and image jobs, so the legs
  # start once the images are built and run beside those jobs' stages; CI
  # Gate still needs every job.
  # `ci:full` goes on once, when the PR is green on the PR tier and ready to
  # merge.
  #
  # integration-features runs the self-spawned qrdbdharness suites
  # (./test/integration: single-node and real 3-node Raft clusters) in six
  # shards, each a fixed list of features (owner ruling 10; sharded so a
  # feature pays the checkout, reap, image build and teardown once per shard,
  # not once per feature). Each shard is
  # `make integration-test-features IT_FEATURES_IN=image`, which runs
  # `make integration-test IT_FEATURE=<feature>` in the integration image for
  # every feature in its list, goes on past a failing one, prints a PASS/FAIL
  # line with seconds per feature and fails the shard if any failed; the
  # selection `make integration-test-<feature>` runs on a host
  # (test/integration/features.mk). Every test in these packages is mapped to
  # some feature (make check-integration-feature-coverage), so the shards
  # together run the whole suite. The lists are balanced longest-first by the
  # per-feature job times of main run 65165, about 550 s a shard
  # (docs/release/engineering.md, "Per-feature integration jobs"); each shard
  # has its own limit, 30 minutes on a light fleet, about three times that,
  # and 45 while one of the two Dell runner hosts is off (#1286), and they
  # run in parallel. The lists are literal because Gitea cannot expand a matrix
  # computed at run time (devops.md §1). Their union is exactly
  # `make -s print-integration-features`, each feature once:
  # test/buildgates/feature_jobs_gate_test.go fails on a missing, duplicated or
  # unknown feature, on a limit over its featureJobLimit, on fail-fast, on a tier other than the
  # full one, and on a step that narrows the target. fail-fast is off so one
  # red shard does not cancel the others' results; CI Gate reads the aggregate
  # result.
  #
  # The project names are under qrdb-ci- (the gate pins the prefix) and carry
  # the run, the attempt and the shard, so shards sharing a daemon never share
  # a stack. CUSTOMIZE (go-qrdb, DS-3516): on a push to main the image is the
  # one docker-build pushed, needs.docker-build.outputs.it_ref, a digest
  # reference: every shard pulls exactly it (scripts/ci-registry.sh, at most
  # three tries). `make integration-test` runs a digest reference only if it
  # is on the daemon and never builds one, so a shard runs that image or fails.
  # On every other event nothing was pushed (claude-agents#329): the shard
  # takes the image from its runner's daemon by content-hash tag, building it
  # when missing (scripts/ci-registry.sh local it). Either way the shard holds
  # it (IT_HOLD) to its teardown and every feature in the shard runs it,
  # shards on one daemon share the copy, and the reap step, not the teardown,
  # removes it once no job holds it.
  # The teardown is `make docker-down-it`, not a bare `docker compose down`:
  # test/buildgates/integration_image_tag_test.go keeps every compose call
  # behind a make target. GOMAXPROCS=8 reaches go test, the harness's go
  # build and every spawned qrdbd through the compose service's environment
  # (#682), and the per-feature go test takes -p 4 (the Makefile's INT_PROCS,
  # #1286), so a shard builds at most four packages at once on a shared runner
  # host; the job sets neither. The gate holds a shard to exactly the reap,
  # the pull or the local build, the run and the teardown.
  integration-features:
    name: Integration (shard ${{ matrix.shard }})
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build, test-typescript, arch-gates]
    timeout-minutes: 45       # CUSTOMIZE (#1286): 22 min worst shard on a light fleet (main run 70592); in run 70834 five of six shards hit 30 on the one Dell runner host left, at load 494 on 80 cores (claude-agents#452), while the other is off (owner-queue 178). Back to 30, with the gate's featureJobLimit, when it returns
    # CUSTOMIZE (go-qrdb): the run's own token pulls the integration image
    # from the Gitea registry (DS-3516).
    permissions:
      contents: read
      packages: read
    env:
      IT_PROJECT: qrdb-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      IT_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      IT_FEATURES: ${{ matrix.features }}
      # CUSTOMIZE (go-qrdb): IT_IMAGE is not set here. The image step below
      # writes it to GITHUB_ENV: the digest docker-build pushed on a push to
      # main, which make integration-test refuses to build (DS-3516), or this
      # runner's content-hash tag on every other event (claude-agents#329).
      # An empty IT_IMAGE in the job environment would reach make as a
      # defined, empty variable and override its own default.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            features: audit databases distributed-locks multi-tenancy time-series
          - shard: 2
            features: backup-restore capabilities ceremony clustering firstboot tenant-dek
          - shard: 3
            features: barrier-seal certificate-authority guarded-swap key-wrapping rag trust-anchors watch
          - shard: 4
            features: api-server auth-factors replica-forwarding run-modes secondary-indexes storage-engines volume-pools
          - shard: 5
            features: cluster-verification collections embeddings identity-rbac key-value shamir-custody vectors
          - shard: 6
            features: coordination credentials etcd-compatibility leases row-locking sql transactions trust-bootstrap
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE (go-qrdb): on a push to main, pull the integration image by
      # digest and hold it (IT_HOLD) until the teardown; a pull that fails
      # three times fails the shard, which never rebuilds the image (DS-3516).
      - name: Pull the integration image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          IT_REF: ${{ needs.docker-build.outputs.it_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$IT_REF" "$IT_HOLD"
          echo "IT_IMAGE=$IT_REF" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, claude-agents#329): on every other event nothing
      # was pushed. Take the integration image from this runner's daemon by
      # its content-hash tag, building it when missing, and hold it (IT_HOLD)
      # until the teardown; this step never logs in.
      - name: Build or reuse the integration image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local it "$IT_HOLD")
          echo "IT_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Integration tests (shard ${{ matrix.shard }})
        run: make integration-test-features IT_FEATURES="$IT_FEATURES" IT_FEATURES_IN=image IT_PROJECT="$IT_PROJECT"

      # integration-test downs its own stack; this covers a cancelled shard,
      # pass, fail or cancel, releases the shard's hold, and keeps the image
      # the other shards on this daemon reuse.
      - name: Tear down (shard ${{ matrix.shard }})
        if: always()
        run: make docker-down-it IT_PROJECT="$IT_PROJECT"

  # CUSTOMIZE (go-qrdb): the multi-protocol CLI suites against two real qrdbd
  # servers in the Docker stack under test/integration/api. The image bakes
  # the source: compose reaches the host daemon through the mounted socket, so
  # a bind mount of this checkout would resolve on the daemon's host. The
  # tests run in the stack's own container, so the runner needs no Go.
  # INT_PROJECT namespaces the containers, networks and volumes per run (its
  # default is per host, and two runs on one daemon would evict each other by
  # name); it is read from the shell, never a ${{ }} expression that has
  # resolved empty before. The make target dumps the server logs before its
  # own teardown. The teardown goes through `make integration-down`, which
  # derives the run's image name from INT_PROJECT and removes it; a bare
  # `docker compose down` is refused for want of that name.
  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build, test-typescript, arch-gates]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      - name: Tear down the stack
        if: always()
        run: make integration-down INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}" || true

  # CUSTOMIZE (go-qrdb, #20): FIPS 140-3, a required gate on the full tier
  # (security-review.md §6, docs/seal/fips140-mode.md). The whole unit suite,
  # both modules, race-enabled, built against the Go Cryptographic Module and
  # run under GODEBUG=fips140=only. Full tier because the suite takes 18 to 35
  # minutes under fips140=only and a plain PR does not pay for that; main pays
  # on every push and every dispatch, so the run that introduces non-approved
  # cryptography on a tested path turns CI Gate red on main and is reverted
  # through a PR like any other full-tier red.
  #
  # GOFIPS140 selects the module at BUILD time; GODEBUG selects the
  # enforcement level at RUN time, and both are needed. "only" rather than
  # "on": "on" loads the module but still PERMITS non-approved algorithms, so
  # a regulated path using MD5, SHA-1 or GCM with a caller-chosen IV passes
  # silently and the gate reports green on exactly the thing it exists to
  # catch. "only" makes those operations error or panic. Ratified by the owner
  # 2026-08-17; see ../handbook/software/conventions/configuration.md §5.
  #
  # The two settings ride in each stage's command (FIPS_ENV), not in the job
  # environment: in-toolchain-image.sh forwards a fixed environment to the
  # container, and on the runner they would reach only the host's own Go
  # programs (the docker CLI), which are not under test.
  #
  # A red here IS the finding: something on a tested path is using
  # non-approved cryptography. Fix the call site, or -- when an external
  # format mandates the primitive -- isolate it and record a cited exemption
  # in docs/seal/fips140-mode.md. Do NOT set this back to "on", add
  # continue-on-error, add a build tag that skips a package, or narrow the
  # package list.
  #
  # The suites run as parallel legs (#1230): one run of both took 69.9 minutes
  # and set the time to a green main and to every tag. Each leg is
  # `make test-fips-leg FIPS_LEG=<leg>`; the Makefile's FIPS_LEGS is the one
  # list of legs, and its two remainder legs put every package no leg names
  # in `rest` (the root module) or `sdk` (sdk/go), so the legs together are
  # exactly `make test` and `make test-sdk`, each package once.
  # test/buildgates/fips_legs_test.go fails when this matrix is not FIPS_LEGS
  # or a package is in two legs or none. The legs are split by measured cost;
  # a leg past 30 minutes is rebalanced by moving a package between
  # FIPS_LEG_<leg> lists, never by narrowing one.
  fips:
    name: FIPS 140-3 (${{ matrix.leg }})
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}   # ruling 214
    needs: [docker-build]
    strategy:
      fail-fast: false
      # Each leg's limit is its measured time (run 68401) with room for a
      # loaded runner, at most 45; go test's per-package budget is the limit
      # less 5 minutes, so a runaway package is named before the leg is
      # killed. pkg/tenant and pkg/seal each run past 30 minutes alone, and
      # pkg/server near it, so each is split by test name over two legs
      # (#1234, docs/seal/fips140-mode.md).
      matrix:
        include:
          - leg: tenant-lifecycle
            minutes: 30
          - leg: tenant
            minutes: 30
          - leg: seal-barrier
            minutes: 30
          - leg: seal
            minutes: 30
          - leg: server-raft
            minutes: 25
          - leg: server
            minutes: 25
          - leg: auth
            minutes: 25
          - leg: service
            minutes: 25
          - leg: api-keys
            minutes: 20
          - leg: rest
            minutes: 30
          - leg: sdk-transport
            minutes: 30
          - leg: sdk
            minutes: 30
    timeout-minutes: ${{ matrix.minutes }}
    # CUSTOMIZE (go-qrdb): on a push to main the run's own token pulls the
    # toolchain image from the registry on github.com (DS-3516).
    permissions:
      contents: read
      packages: read
    env:
      FIPS_ENV: GOFIPS140=latest GODEBUG=fips140=only
      # CUSTOMIZE (go-qrdb): this leg's hold on the pulled toolchain image
      # (DS-3516), one per leg, so two legs on one runner never share it.
      TOOLCHAIN_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-fips-${{ matrix.leg }}-toolchain
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1 (Company Agent m605 item 8): mask the forge credentials before
      # any other step. The runner injects them as plain environment
      # (dependency-resolution.md §6), which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # CUSTOMIZE (go-qrdb): on a push to main, pull the toolchain image
      # docker-build pushed, by digest, and hold it until the teardown, as the
      # lint job does; nothing on this path rebuilds it (DS-3516).
      - name: Pull the toolchain image
        if: ${{ env.CI_PUBLISH == 'true' }}
        env:
          TOOLCHAIN_REF: ${{ needs.docker-build.outputs.toolchain_ref }}
          CI_REGISTRY_USER: ${{ github.actor }}
          CI_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/ci-registry.sh pull "$TOOLCHAIN_REF" "$TOOLCHAIN_HOLD"
          echo "TOOLCHAIN_IMAGE=$TOOLCHAIN_REF" >> "$GITHUB_ENV"

      # CUSTOMIZE (go-qrdb, claude-agents#329): on every other event, as in
      # the lint job, the runner's own image, held by image ID; no login.
      - name: Build or reuse the toolchain image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local toolchain "$TOOLCHAIN_HOLD")
          echo "TOOLCHAIN_IMAGE=$image" >> "$GITHUB_ENV"

      # GODEBUG is a runtime setting and cannot fail a compile, but building
      # against the module first keeps a genuine build break from being
      # reported as a test failure.
      - name: Build all packages against the FIPS module
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$FIPS_ENV go build ./..."

      # The packages the unit suites run, with the same build tags: this leg's
      # share of them, and every leg together is the whole of both. The scope
      # is deliberately identical: a FIPS job over a subset of the suite
      # cannot tell you the product is FIPS-clean.
      #
      # GOTEST_TIMEOUT is go test's PER-PACKAGE budget and is raised only here.
      # FIPS mode swaps the KDF from Argon2id to PBKDF2-HMAC-SHA256 at 600,000
      # iterations, which measured 2.6x on pkg/seal, and pkg/seal has been
      # killed at exactly 30m (go-qrdb#147). The budget is the leg's limit
      # less 5 minutes (40m on the 45-minute legs), so it cannot outlive the
      # leg. This raises a
      # runaway guard; it does not skip a package, weaken an assertion or
      # narrow the scope.
      #
      # pipefail matters: without it tee's exit status hides a failing suite.
      - name: Unit tests (race, FIPS 140-only)
        env:
          FIPS_LEG: ${{ matrix.leg }}
          FIPS_LEG_MINUTES: ${{ matrix.minutes }}
        run: |
          set -o pipefail
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "$FIPS_ENV make test-fips-leg FIPS_LEG='$FIPS_LEG' GOTEST_TIMEOUT=$((FIPS_LEG_MINUTES - 5))m GO_BUILD_TAGS='$GO_BUILD_TAGS'" 2>&1 | tee fips-test.log

      # A per-package timeout panic names whichever test was running when the
      # alarm fired, NOT the test that consumed the budget. This step lists the
      # leg's package results, with each package's time, and its slowest
      # completed tests, on success too, so the trend is visible before the
      # cliff and a leg nearing 30 minutes shows which package to move. A
      # missing log is reported: it means the suite never started.
      - name: Package results and slowest tests
        if: always()
        run: |
          log=fips-test.log
          if [ ! -f "$log" ]; then
            echo "no ${log}: this leg's suite never started -- see the step above" >&2
            exit 0
          fi
          # Captured into variables rather than piped straight to stdout so
          # the "nothing parsed" case can actually be reported. A `grep ...
          # | sort || echo fallback` cannot do that: the pipeline's status is
          # sort's, which is 0 on empty input, so the fallback is unreachable.
          pkgs=$(grep -aE '^(ok|FAIL|\?)[[:space:]]+github\.com/jeremyhahn/go-qrdb/' \
            "$log" | sort -u || true)
          slow=$(grep -aoE '^--- (PASS|FAIL): [A-Za-z0-9_/]+ \([0-9.]+s\)' "$log" \
            | sed -E 's/^--- (PASS|FAIL): ([A-Za-z0-9_/]+) \(([0-9.]+)s\)/\3 \1 \2/' \
            | sort -rn | head -25 || true)

          echo "== package results =="
          if [ -n "$pkgs" ]; then
            echo "$pkgs"
            echo "-- counts: $(printf '%s\n' "$pkgs" | grep -c '^ok') ok, $(printf '%s\n' "$pkgs" | grep -c '^FAIL') FAIL"
          else
            echo "(no package result lines parsed -- the suite may have died before any package finished)"
          fi

          echo
          echo "== 25 slowest tests that COMPLETED =="
          echo "A timeout panic names the test holding the alarm, not the one"
          echo "that spent the budget. These are the candidates that did."
          if [ -n "$slow" ]; then
            echo "$slow"
          else
            echo "(no completed top-level tests parsed)"
          fi

      # CUSTOMIZE (go-qrdb): release the hold the pull took (DS-3516).
      - name: Tear down
        if: always()
        run: scripts/ci-registry.sh release "$TOOLCHAIN_HOLD"

  # CUSTOMIZE (go-qrdb): the TypeScript SDK and the desktop frontend, which
  # rotted unseen while they had no CI. `make test-typescript` runs the SDK's
  # npm ci, tsc, npm test (vitest, and the wire contract test pinning the
  # SDK's types to the REST handler's output) and build, then svelte-check on
  # the frontend against the built SDK, then the MOCKED Playwright tier. A job
  # of its own because the toolchain image carries no Node. The real-backend
  # Playwright tiers run through `make test-e2e`, not here. Code tier
  # (DS-3160): a docs-only PR changes nothing it builds or tests.
  test-typescript:
    name: Test (TypeScript SDK + desktop frontend)
    runs-on: ubuntu-latest
    if: ${{ (needs.changes.outputs.docs_only != 'true') && !github.event.pull_request.draft }}   # ruling 214
    needs: [changes]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step (see the lint job):
      # npm, curl and make all run here with them in the environment.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # Fleet dev-cache passthrough (devops.md §2a), fetched from the
      # dev-cache repo's own tag. FAILS OPEN: on a 404, a timeout or no
      # reachable cache nothing reaches $GITHUB_ENV and the next step runs as
      # it does without the cache. Gitea-only.
      - name: Load dev-cache settings (fail open)
        if: github.server_url != 'https://github.com'
        run: |
          if curl -fsS --max-time 5 -o "$RUNNER_TEMP/devcache-env" \
              "${{ github.server_url }}/jeremyhahn/dev-cache/raw/tag/v0.1.0/client/devcache-env"; then
            chmod +x "$RUNNER_TEMP/devcache-env"
            "$RUNNER_TEMP/devcache-env" env >> "$GITHUB_ENV" || true
          fi

      - name: TypeScript SDK and desktop frontend
        run: make test-typescript

  # Soak (v1.23, owner item 101): the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. v1.24 (owner ruling 2026-10-19, Company Agent m751 (e)): nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  #
  # The soak runs on the nightly schedule and on workflow_dispatch, as the
  # template's; the schedule is the one scheduler (ruling 135, ruling 216(1)).
  # CUSTOMIZE (go-qrdb): the iteration is one feature's suite, SOAK_FEATURE, not the whole suite: the
  # whole suite is forty legs of up to 45 minutes run in parallel, and one
  # iteration of it would not fit the job's limit. clustering runs real
  # 3-node Raft clusters, the suite most sensitive to load. The image hold is
  # IT_HOLD (#813), not the template's lease. CUSTOMIZE (go-qrdb, DS-3516):
  # the soak pulls docker-build's integration image by digest and holds it;
  # `make integration-test` runs that reference and downs its own stack each
  # iteration, and `make docker-down-it` releases the hold at the teardown.
  # Nothing builds, so there is no credential file.
  soak:
    name: Soak [integration image]
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !github.event.pull_request.draft }}   # ruling 214
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    # CUSTOMIZE (go-qrdb, claude-agents#329): the soak runs on a
    # workflow_dispatch or the nightly schedule, neither of which publishes
    # (CI_PUBLISH), so it takes
    # the integration image from this runner's daemon by content-hash tag,
    # building it when missing, and holds it; it never logs in to a registry.
    needs: [docker-build]
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration
    permissions:
      contents: read
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_FEATURE: clustering   # CUSTOMIZE (go-qrdb): the suite each iteration runs
      IT_PROJECT: qrdb-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
      IT_HOLD: qrdb-ci-hold-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: scripts/reap-stale-ci-stacks.sh qrdb-ci-

      # CUSTOMIZE (go-qrdb, claude-agents#329): build or reuse and hold the
      # integration image, as an integration leg does off main.
      - name: Build or reuse the integration image on this runner
        if: ${{ env.CI_PUBLISH != 'true' }}
        run: |
          image=$(scripts/ci-registry.sh local it "$IT_HOLD")
          echo "IT_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make integration-test IT_FEATURE="$SOAK_FEATURE" IT_PROJECT="$p" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      # integration-test downs each iteration's stack; this covers a cancelled
      # iteration and releases the hold, keeping the image.
      - name: Tear down
        if: always()
        run: |
          p="$IT_PROJECT"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then read -r p < "$RUNNER_TEMP/soak-project"; fi
          make docker-down-it IT_PROJECT="$p"
          rm -f "$RUNNER_TEMP/soak-project"

  # CUSTOMIZE: further stages run in the lint or image job as steps of the same
  # shape (one `make` target in the toolchain image, `if: !cancelled()`). A
  # suite that needs its own runner or stack (tagged suites, cross-arch,
  # contrib modules) is a job of the integration job's shape and joins CI
  # Gate's needs list and check lines. v1.23: such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build,
  # unit or race, which stay on the PR tier.

  # Architecture gate (v1.20, Company Agent m270 item 9; go-xkms arch-gates).
  # go-objstore owns every blob backend (docs/00), and a repo reaches it only
  # through the packages that are its storage seam. Test files are exempt, and
  # go-objstore itself passes. CUSTOMIZE: OBJSTORE_SEAMS, an extended regex of
  # the paths that may import go-objstore (go-xkms: 'pkg/ca/|pkg/storage/');
  # empty means none may. CUSTOMIZE: the repo's own layering rules (go-xkms:
  # xkmsctl and xkey depend only on sdk/go) are further steps in this job.
  # A source check with grep, not a stage: it runs on the runner's shell.
  # v1.23: a lint-class check, so it stays on the PR tier.
  # CUSTOMIZE (go-qrdb, DS-3160): make check-public-releasable scans the whole
  # tracked tree, docs included, so a docs-only PR runs this job; its two
  # code-only steps skip there.
  arch-gates:
    if: ${{ !github.event.pull_request.draft }}   # ruling 214: a draft PR runs no CI
    name: Architecture Gates
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      # go-qrdb: the objstore storage backend, and the embedded transport's
      # volume pool, which is go-objstore's pool type.
      OBJSTORE_SEAMS: 'pkg/storage/objstore/|sdk/go/transport/embedded/'      # CUSTOMIZE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step (see the lint job):
      # the make targets below run with them in the environment.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: No direct go-objstore import outside the storage seam
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

      # CUSTOMIZE (go-qrdb): no tracked file carries a fleet value (AGENTS.md,
      # "The whole tracked tree is publicly releasable"). The patterns are a
      # repository secret, written to a file outside the checkout, read, and
      # removed; they never enter the tree or a log. Gitea-only: the github.com
      # mirror is the published tree and has no fleet to leak.
      - name: make check-public-releasable
        if: github.server_url != 'https://github.com'
        env:
          PUBLIC_RELEASE_PATTERNS: ${{ secrets.PUBLIC_RELEASE_PATTERNS }}
        run: |
          umask 077
          printf '%s\n' "$PUBLIC_RELEASE_PATTERNS" > "$RUNNER_TEMP/public-release-patterns"
          PUBLIC_RELEASE_PATTERNS_FILE="$RUNNER_TEMP/public-release-patterns" make check-public-releasable
          rm -f "$RUNNER_TEMP/public-release-patterns"

      # CUSTOMIZE (go-qrdb): every compose service that names a build target
      # names a stage its Dockerfile declares, with each overlay resolved by
      # `docker compose config` (client-side, no daemon). The toolchain image
      # carries no Docker CLI, so the check runs on the runner's.
      - name: make check-compose-targets test-compose-targets
        if: needs.changes.outputs.docs_only != 'true'
        run: make check-compose-targets test-compose-targets

  # The single required check (devops.md §1). Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it evaluates empty
  # on Gitea and reports success while jobs fail.
  # v1.21: on the ci-gate runners (Company Agent m386: only CI Gate runs there;
  # a 1-CPU gate runner cannot hold a stage). trivy is in nightly.yml (v1.9,
  # devops.md §8a: the alpha regime); fips is a full-tier job here (#20).
  ci-gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-gate' }}
    if: always()
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs.
    #
    # go-qrdb: test/buildgates/ci_tiers_test.go asserts that every job is in
    # needs AND has a check line reading its result from an env var
    # (RESULT_*: ${{ needs.<job>.result }}), tagged to match its tier: pr,
    # code (every event but a docs-only PR, DS-3160), full or nightly. A matrix
    # job is ONE entry: needs.<job>.result is the aggregate over its legs.
    needs: [changes, docker-build, lint, lint-gates, image, coverage, test-clusterproof, coverage-fts, test-tags, test-sdk, test-typescript, arch-gates, integration-standalone, integration-features, fips, soak]
    steps:
      - name: Fail closed on any non-success
        env:
          # ruling 214: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_DOCKER_BUILD: ${{ needs.docker-build.result }}
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_LINT_GATES: ${{ needs.lint-gates.result }}
          RESULT_IMAGE: ${{ needs.image.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_TEST_CLUSTERPROOF: ${{ needs.test-clusterproof.result }}
          RESULT_COVERAGE_FTS: ${{ needs.coverage-fts.result }}
          RESULT_TEST_TAGS: ${{ needs.test-tags.result }}
          RESULT_TEST_SDK: ${{ needs.test-sdk.result }}
          RESULT_TEST_TYPESCRIPT: ${{ needs.test-typescript.result }}
          RESULT_ARCH_GATES: ${{ needs.arch-gates.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_INTEGRATION_FEATURES: ${{ needs.integration-features.result }}
          RESULT_FIPS: ${{ needs.fips.result }}
          RESULT_SOAK: ${{ needs.soak.result }}
          # The full tier is CI_FULL_TIER (v1.23): every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # v1.24: a `nightly` job runs on schedule and workflow_dispatch only.
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # CUSTOMIZE (go-qrdb, DS-3160): a `code` job runs on every event but
          # a docs-only PR (the changes job's docs_only, false off
          # pull_request and on ci:full).
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly selected: ${NIGHTLY}; docs-only pull request: ${DOCS_ONLY}"
          # CUSTOMIZE (go-qrdb): an unreadable FULL_TIER, NIGHTLY or DOCS_ONLY
          # cannot say which skips to excuse, so it fails closed. DOCS_ONLY is
          # empty only when changes did not succeed, which fails the gate too.
          case "${DOCS_ONLY}" in
            true|false) ;;
            *) echo "FAIL: DOCS_ONLY is unreadable ('${DOCS_ONLY}')"; BAD=1;;
          esac
          case "${FULL_TIER}" in
            true|false) ;;
            *) echo "FAIL: FULL_TIER is unreadable ('${FULL_TIER}')"; BAD=1;;
          esac
          case "${NIGHTLY}" in
            true|false) ;;
            *) echo "FAIL: NIGHTLY is unreadable ('${NIGHTLY}')"; BAD=1;;
          esac
          check() { # <job> <result> <pr|code|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # CUSTOMIZE: one line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to schedule and
          # workflow_dispatch is nightly, one skipped on a docs-only PR
          # (go-qrdb, DS-3160) is code; every other job is pr.
          check changes "$RESULT_CHANGES" pr
          check docker-build "$RESULT_DOCKER_BUILD" pr
          check lint "$RESULT_LINT" pr
          check lint-gates "$RESULT_LINT_GATES" pr
          check image "$RESULT_IMAGE" code
          check coverage "$RESULT_COVERAGE" code
          check test-clusterproof "$RESULT_TEST_CLUSTERPROOF" code
          check coverage-fts "$RESULT_COVERAGE_FTS" code
          check test-tags "$RESULT_TEST_TAGS" code
          check test-sdk "$RESULT_TEST_SDK" code
          check test-typescript "$RESULT_TEST_TYPESCRIPT" code
          check arch-gates "$RESULT_ARCH_GATES" pr
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE" full
          # A matrix job's result is success only when every leg succeeded.
          check integration-features "$RESULT_INTEGRATION_FEATURES" full
          check fips "$RESULT_FIPS" full
          check soak "$RESULT_SOAK" nightly
          exit $BAD
