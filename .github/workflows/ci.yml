name: CI

# One workflow, both hosts. Gitea Actions is GitHub-Actions-compatible, so the
# GitHub-only mechanics (SARIF upload to code scanning, and actions whose setup
# cannot authenticate to github.com from a Gitea runner) are guarded on
# `github.server_url`, and the Gitea leg installs the equivalent CLI instead.
# See automatethethings software/conventions/devops.md §1 and §8.
#
# This is the PUSH path, and it holds only jobs that can pass and do gate.
# ci-template v1.9 moved the known-red and long-horizon jobs — fips and trivy —
# to nightly.yml (owner ruling 2026-08-20, go-qrdb#48).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:                    # manual rerun — Gitea has no rerun API

permissions:
  contents: read
  security-events: write

env:
  # Latest 1.26 patch (owner ruling 2026-08-20). setup-go 'stable' is prohibited
  # as a spec — it flipped to 1.27.0 mid-campaign and broke every repo riding it.
  #
  # The swiss BLOCKER THAT USED TO BE RECORDED HERE IS GONE (#177, 2026-09-02):
  # cockroachdb/swiss widened its build tag to `!go1.28` and this module's pin
  # moved, so both modules now compile clean under 1.27.0 — measured on this
  # tree, `GOTOOLCHAIN=go1.27.0 go build ./...` exits 0 in the root and in
  # sdk/go. What remains is not technical: raising the directive is the
  # portfolio toolchain wave (#39), which is still `task:blocked` on the owner's
  # ruling and is dispatched centrally, not per repo. So this stays at 1.26.7
  # and #39 moves it — but nobody should re-derive a blocker from this comment,
  # because there isn't one.
  GO_VERSION: "1.26.7"

  # ANALYSIS TOOL PINS (#179, #195). These are the versions BAKED into the
  # self-hosted runner image; the steps below ASSERT the binary they got matches
  # and refuse to run otherwise. Nothing in this workflow installs them.
  #
  # Two separate defects closed here, and pinning alone fixed neither:
  #
  #   * A `go install` is a NETWORK dependency at job time. A pin fixes WHICH
  #     version you get and says nothing about whether you can reach it. Every
  #     host in this fleet resolves an AAAA record for sum.golang.org and none
  #     has a default IPv6 route; job containers use host networking, so they
  #     inherit that stack. Go's v6->v4 fallback usually saves it, which is why
  #     this was intermittent — and why this file had grown a hand-rolled
  #     3-attempt retry loop around each install, treating the symptom.
  #
  #   * A `go install` is a VERSION SUBSTITUTION. actions/setup-go prepends
  #     GOPATH/bin to PATH, so an installed binary SHADOWS /usr/local/bin. This
  #     workflow installed golangci-lint v2.12.2 unconditionally on top of an
  #     image baking v2.13.2 — pinned on paper, running something else in fact.
  #
  # GOLANGCI_LINT_VERSION moved v2.12.2 -> v2.13.2 here, deliberately and on
  # evidence rather than on a version number. v2.12.2 was pinned because
  # @latest had reached v2.13.0, which panicked under Go 1.26 ("nilness:
  # internal error: unhandled builtin recover") and took the gate down. v2.13.2
  # was measured against THIS tree under Go 1.26.7 before the pin moved: it does
  # not panic, reports `0 issues`, and enables the SAME fifteen linters as
  # v2.12.2 under this repo's .golangci.yml — which is the check that matters,
  # because the quiet way a linter bump goes wrong is silently dropping a
  # security linter while still exiting 0. The binary measured self-reports mod
  # sum h1:bCyq3E4vo9qwzifjpzJqYndEt7Ncva80qkk8G2B4TXU=, identical to the
  # image's, so it is the same artifact and not merely the same version string.
  #
  # GOVULNCHECK_VERSION replaces an unpinned `@latest`. `@latest` means the same
  # commit is scanned by different analyser versions on different days, so a new
  # finding cannot be told apart from a scanner that moved underneath you.
  #
  # BUMPING ONE OF THESE IS A DELIBERATE CHANGE, one issue per bump, and the
  # runner image moves in the same breath (its pins live in the company repo at
  # infra/gitea/ci-runner/Dockerfile). Do NOT add a `go install` back to move a
  # version: a skew between this file and the image must fail the job, which is
  # what the require-tool.sh assertions below are for.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.7.0"
  # Builds never resolve through a workspace: first-party modules come from
  # Gitea tags (conventions/dependency-resolution.md §2). The runner injects
  # GOPRIVATE and the tokenised git rewrite for github.com/jeremyhahn/* itself —
  # no credentials belong in this file.
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # NO NETWORK INSTALL (#179, #195). golangci-lint is baked into the
      # self-hosted runner image at GOLANGCI_LINT_VERSION; this step asserts the
      # binary that will run IS that version and fails the job otherwise.
      #
      # What it replaces was a 3-attempt retry loop around
      # `go install ...@v2.12.2`, and the loop was the tell: the durable fix
      # named in its own comment was "bake the pinned linter into the runner
      # image", which has since happened. Retrying was treating the symptom in
      # one repo.
      #
      # FAIL CLOSED, and specifically do NOT fall back to a network install when
      # the binary is missing. The fallback would reinstate the flake at exactly
      # the moment the image is wrong, and it would do so while reporting
      # success. A failed tool install leaves a red check carrying NO verdict on
      # the code; refusing to run without the pinned binary is what makes an
      # image defect and a code defect distinguishable in the log.
      #
      # The assertion is not redundant with the pin. actions/setup-go prepends
      # GOPATH/bin to PATH, so anything installed there shadows /usr/local/bin,
      # and /etc/ci-runner-tools.txt describes the IMAGE — it says nothing about
      # what a job actually ran. require-tool.sh reads the binary's own
      # self-report, and carries its own regression suite
      # (scripts/require-tool_test.sh) because on a healthy runner only its
      # accepting branch is ever exercised.
      - name: Require golangci-lint at the pinned version
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            golangci-lint "$GOLANGCI_LINT_VERSION" \
            "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

      # The guard's own rejecting branches, which the step above never reaches
      # while the image is healthy. It runs AFTER that step deliberately: if the
      # runner image is broken, the first failure a reader should see is the
      # image, not a self-test. No network, no Go build — sub-second.
      - name: Test the tool-version guard
        run: make test-require-tool

      # Same reasoning, for the module sweep's guard. A healthy tree exercises
      # only vet-modules.sh's ACCEPTING path, so its rejecting branches — an
      # unmapped module, an empty or rootless discovery, a partial traversal —
      # would ship untested. That target was wrong six times as an inline
      # recipe, every time by being narrower than its own claim and silent
      # about it (#221), which is precisely what an untested guard looks like.
      # No network, no Go build; the sweep itself uses a fake `go`.
      - name: Test the module-sweep guard
        run: make test-vet-modules

      # devops.md §4: CI runs the same targets a developer runs. `make fmt` is
      # the gofmt check, not a rewrite.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Compile-check every package with the default (untagged) build, then the
      # real server binary with the Makefile's default feature tag set — this
      # repository is build-tag driven, so an untagged build alone compiles very
      # little of it.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

      - name: Build sdk/go module
        working-directory: sdk/go
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint (#143): a linter tooling outage must
    # never stop tests from EXECUTING. `ci-gate` still requires lint DIRECTLY
    # and fails closed on `skipped`, so nothing merges on red lint — but test
    # results keep existing while lint is down, instead of CI reporting failure
    # while silently verifying less than it appears to.
    #
    # This comment used to sit above `needs: [lint, build]`, asserting an intent
    # its own dependency list defeated: a lint outage SKIPPED the tests and the
    # gate reported SKIP, producing exactly the outcome the comment says it
    # exists to prevent. The list now matches the claim (#143).
    #
    # `build` is a REAL dependency and stays: the tests cannot run against a
    # tree that does not compile.
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test` = `go test -race -count=1 -v -tags "$(BUILD_TAGS)"
      # ./pkg/... ./cmd/...`. The tags matter: without them the codec registry
      # is empty and packages such as pkg/invite fail at run time while
      # pkg/api/mcp, pkg/api/unix and pkg/server fail to build at all.
      - name: Unit tests (race)
        run: make test

  test-sdk:
    name: Test (sdk/go module)
    runs-on: ubuntu-latest
    # `sdk/go` is a SEPARATE Go module, so `./pkg/... ./cmd/...` in the `test`
    # job above never reaches it and this repository shipped the SDK untested by
    # CI: `build` compiled it, nothing ran it (go-qrdb#132). The whole guarded-
    # verb transport plane v0.12 rests on — the GuardedKVClient capability and
    # its embedded implementation (#119/#122) and the gRPC one (#123) — merged
    # on green CI that never executed a line of its tests. This is the standing
    # multi-module hazard exactly as written: a nested module's tests that CI
    # never runs can stop compiling, or start racing, without turning anything
    # red. Running the suite once by hand immediately turned up a data race
    # (#131).
    #
    # A separate job rather than another step in `test`: `test` already runs the
    # whole root module under -race and is the long pole, so appending this
    # would serialise them, and a distinct job makes the gate say WHICH module
    # broke.
    #
    # needs EXCLUDES lint for the same reason as `test` above (#143). This job
    # copied neither that comment nor its dependency list from anywhere — it
    # simply inherited `[lint, build]` — so it carried the defect without even
    # the contradicting comment to make it visible.
    needs: [build]
    # sdk/go/node boots real nodes, including single-replica raft groups whose
    # leader election alone costs ~2.4s per shard and more under -race. This is
    # not a pure unit suite and must not inherit a timeout tuned for one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # `make test-sdk` = `cd sdk/go && go test -race -count=1 -v -timeout=30m
      # -tags "$(BUILD_TAGS)" ./...`. The tags are the same set the root `test`
      # job uses and matter for the same reason: without them the codec registry
      # is empty and several packages fail to build outright.
      - name: Unit tests (race, sdk/go module)
        run: make test-sdk

  integration-standalone:
    name: Integration (standalone stack)
    runs-on: ubuntu-latest
    # needs deliberately EXCLUDES lint, and now actually does (#143) — see the
    # `test` job above for the full reasoning and for what this list used to
    # say. `ci-gate` requires lint directly and fails closed on `skipped`.
    needs: [build]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The multi-protocol CLI suites against two real qrdbd servers in a
      # compose stack. The image bakes the source: a bind mount cannot work
      # here, because compose reaches the HOST daemon through the mounted
      # socket and this checkout's path does not exist on the runner host.
      #
      # The variables are read straight from the shell environment, NOT
      # through ${{ env.X }} -- that expression reads this workflow's own
      # env: block, which does not define them, and would silently write
      # blanks. The runner injects them into the job's process environment
      # (dependency-resolution.md section 6). `make integration-image` does
      # the staging and passes the file as a BuildKit secret; it writes an
      # empty file when the variables are absent, which is what happens on
      # GitHub, where these modules resolve from the public proxy instead.
      # INT_PROJECT namespaces the containers, networks and volumes. Its
      # default is per-HOST, which is not enough here: a runner with capacity 4
      # can land two go-qrdb jobs on the same daemon, and compose would then
      # evict the other run's containers by name. The run id makes it per-run.
      #
      # Read from the shell rather than through a ${{ }} expression: that
      # context has resolved empty before and would hand compose a bare
      # "qrdb-int-" shared by every job, which is the collision this avoids.
      - name: Integration tests (standalone stack)
        run: |
          export INT_PROJECT="qrdb-int-${GITHUB_RUN_ID:-local}"
          echo "compose project: $INT_PROJECT"
          make integration-test-standalone INT_PROJECT="$INT_PROJECT"

      # The server logs are dumped by the make target itself, which is the only
      # place that runs before its own teardown -- a workflow step here fires
      # after the containers are already gone and prints nothing, which is what
      # the first attempt did.

      # Compose leaks containers and volumes when a run is interrupted, and a
      # leftover stack makes the NEXT run fail while attaching. Always tear
      # down, and do not let the teardown itself fail the job.
      - name: Tear down the stack
        if: always()
        run: |
          cd test/integration/api
          docker compose -p "qrdb-int-${GITHUB_RUN_ID:-local}" down -v || true

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: [lint, build]
    # ci-template v1.9 staged fail-fast (owner ruling 2026-08-20): Gitea has no
    # cancel API, so ORDERING is the only fail-fast available. lint+build run in
    # minutes and gate the expensive tier, so a broken push reports fast and burns
    # nothing downstream.
    #
    # This job KEEPS `lint` in needs while the three test jobs above dropped it
    # (#143), and the asymmetry is deliberate rather than an oversight. #143's
    # argument is that a test result which could have existed should exist; a
    # gosec and govulncheck pass over the whole module graph is the expensive
    # tier the owner ruling stages precisely to avoid burning, and its findings
    # keep until the lint outage is over. If that ever stops being the right
    # trade, it is a change to the staged fail-fast ruling, not to this line.
    #
    # (This paragraph previously said the arrangement "supersedes the
    # lint-decoupling of #42, whose silent-skip hazard is closed by the
    # golangci-lint pin". Both halves were wrong: #42 is long closed, the pin
    # closes nothing about skipping, and the hazard was live in this file until
    # #143 — a pinned linter still fails when its tooling or its host does,
    # which is the outage the decoupling is for.)
    # ci-template v1.6: the Go toolchain is cgroup-unaware — in a 16 GB job
    # container it sees the HOST's 24 cores and 94 GB, so gosec ran 24 workers
    # and the GC grew the heap to ~27 GB, swapping 11 GB of anonymous memory
    # and stalling the whole host (memory PSI 98, 43% CPU in iowait; measured
    # 2026-08-18 from the live cgroup). GOMEMLIMIT makes the GC respect the
    # container budget; GOMAXPROCS bounds the worker fan-out.
    env:
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # NO NETWORK INSTALL (#179, #195), same reason as the lint job: both tools
      # are baked into the runner image at the pinned versions in the env block
      # above, and the retry loops this replaces were the workaround for a live
      # ENETUNREACH failure rather than a fix for it.
      #
      # gosec stays PINNED to v2.29.0 (owner-ruled fleet-wide 2026-08-26,
      # go-qrdb#154) for the reason measured then: @latest self-updated mid-day
      # and introduced G703, which reddened the Security job on every branch —
      # including main — on code nobody had touched since 2026-04-10. Run 6862
      # on main was green at 08:04Z and run 6885 red at 08:47Z with the
      # offending file identical in both. What the pin does NOT do is fix that
      # finding: v2.29.0 still raises G703 (checked, not assumed) and the
      # Makefile's GOSEC_EXCLUDE entry with its three-legged justification is
      # what clears it. The pin buys reproducibility, not a green gate.
      #
      # THE ASSERTION IS THE DELIVERABLE HERE, NOT THE PIN, and gosec is why.
      # It takes its version string from ldflags rather than from the module
      # path, so `go install ...@v2.29.0` still self-reports `dev` — meaning
      # the job log could not attribute a scan to a scanner version AT ALL, and
      # the workflow comment was the only record of what was requested. The
      # image builds it with `-X main.Version=`, so the baked binary reports
      # v2.29.0 and require-tool.sh can check it. Do not read `dev` in an old
      # log as "unpinned"; read it as "unattributable", which is the defect.
      #
      # govulncheck moves from `@latest` to a pin in this change. Unpinned, the
      # same commit is scanned by different analyser versions on different days
      # and a new finding cannot be distinguished from a scanner that moved.
      - name: Require gosec and govulncheck at the pinned versions
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            gosec "$GOSEC_VERSION" \
            "github.com/securego/gosec/v2/cmd/gosec" \
            -ldflags "-X main.Version=${GOSEC_VERSION}"
          "${GITHUB_WORKSPACE}/scripts/require-tool.sh" \
            govulncheck "$GOVULNCHECK_VERSION" \
            "golang.org/x/vuln/cmd/govulncheck"

      # gosec type-loads every package, so the full module graph must be in
      # the local cache BEFORE it runs: on a cold cache its loader surfaces
      # each missing module as `could not import ... (invalid package name)`
      # and fails the job with zero actual findings. `go build` warms the
      # cache as a side effect on the build job, but each job runs in its
      # own container — download explicitly here.
      - name: Download modules
        run: go mod download all

      # `make gosec` carries GOSEC_EXCLUDE and its written justifications in the
      # Makefile, so the exclusion list is single-sourced rather than copied
      # into this file (devops.md §8).
      - name: gosec
        run: make gosec

      # SARIF is a GitHub code-scanning feature; Gitea has no equivalent
      # ingest. The gate above already ran, so this leg only produces the
      # report — `|| true` keeps a SARIF-writing failure from double-failing a
      # build the gate step has already judged.
      - name: gosec (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make gosec-sarif || true

      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      # Blocking, in both modules. This is also the §9 forcing function for
      # toolchain currency — it fails on a known-vulnerable stdlib.
      - name: govulncheck (root module)
        run: govulncheck ./...

      - name: govulncheck (sdk/go module)
        working-directory: sdk/go
        run: govulncheck ./...

      - name: go mod verify
        run: make mod-verify

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # devops.md §1: one gate for branch protection to require, with every job
    # listed explicitly. `join(needs.*.result)` is a GitHub extension that
    # evaluates to an empty string on Gitea, so a gate built on it reports
    # success while jobs fail. Adding a job means adding it to `needs` AND to
    # the env block and the loop below.
    #
    # `fips` and `trivy` are not here because they are not in this workflow at
    # all any more: ci-template v1.9 moved both to nightly.yml (owner ruling
    # 2026-08-20, go-qrdb#48). Both are known-red with tracked issues — fips on
    # #18 and #20, trivy on #42 — so running them per push produced information
    # we already had while holding a runner for up to 90 minutes.
    #
    # `trivy` was previously REQUIRED here, which meant the gate was red on
    # every push from a known-red job. That is not a gate; it is a gate nobody
    # can read. Removing it is the point of #48, not an incidental side effect
    # of the move.
    #
    # ARMING EITHER ONE AGAIN is a deliberate act, and the whole act: move the
    # job back into this file, add it to `needs`, add its RESULT_ env var, and
    # add a `check` call below. A job that can pass and is not required is a
    # fail-open gate; a job that is required and cannot pass freezes the
    # repository without closing a single finding. Neither is acceptable, which
    # is why the two halves must move together.
    needs: [lint, build, test, test-sdk, integration-standalone, security]
    steps:
      - name: Verify every job succeeded
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_TEST_SDK: ${{ needs.test-sdk.result }}
          RESULT_INTEGRATION_STANDALONE: ${{ needs.integration-standalone.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
        run: |
          status=0
          # skipped is not the same as failed, and BOTH fail the gate. A
          # skipped job means an upstream stage failed (test, integration and
          # security all stage behind lint and build), so naming it prevents
          # the go-qrdb#42 class: a red that reads like a test failure while
          # the tests never ran at all.
          check() {
            name="$1"
            result="$2"
            case "$result" in
              success)  echo "ok:   $name = success" ;;
              skipped)  echo "SKIP: $name (an upstream stage failed - see its job)"; status=1 ;;
              "")       echo "FAIL: $name result is unreadable - failing closed"; status=1 ;;
              *)        echo "FAIL: $name = $result"; status=1 ;;
            esac
          }
          check lint "$RESULT_LINT"
          check build "$RESULT_BUILD"
          check test "$RESULT_TEST"
          check test-sdk "$RESULT_TEST_SDK"
          check integration-standalone "$RESULT_INTEGRATION_STANDALONE"
          check security "$RESULT_SECURITY"
          exit $status
