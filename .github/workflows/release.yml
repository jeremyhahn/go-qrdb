# Release -- validates a release tag after it is published (owner ruling
# 2026-10-06: "all our projects should follow the same standards" --
# go-quicraft, go-xkms and go-quicbaas all cut alpha releases the same way,
# and this workflow brings go-qrdb into line with them).
#
# WHO CREATES THE TAG. The project agent does, by hand, with
# `make release-alpha VERSION=vX.Y.Z-alpha` (release-versioning.md §1a, the
# "Alpha" row: "the project agent, any time CI is green on main"). That
# recipe already carries every preventive check a release needs -- the
# lockstep audit, the CHANGELOG reconciliation, the duplicate-tag check, the
# standalone-resolution check for each nested module, signed annotated tags,
# one atomic `git push --atomic` of exactly those tags -- and it refuses
# before touching anything unless `HEAD` is exactly what `main` holds and is
# SSH-signed. There is no bot, no bot secret and no workflow that creates a
# tag: this file does not write one, and test/buildgates/release_workflow_test.go
# fails if any workflow in this repository does.
#
# WHAT THIS WORKFLOW DOES, once the tag push above triggers it:
#
#   1. validate -- re-derives the same facts release-alpha already checked
#      before cutting the tag, against what the server now holds rather than
#      against the operator's local clone: the tag is a well-formed semver
#      (optionally `-alpha`), `VERSION` at the tagged commit is byte-equal to
#      it, and CHANGELOG.md's newest released section names it too
#      (scripts/check-version-reconciled.sh -- the same script release-alpha
#      and the Release Lockstep workflow both run). It then fetches and
#      audits the lockstep tags (sdk/go/vX.Y.Z, sdk/go/gorm/conformance/vX.Y.Z)
#      against this one, with a bounded retry: release-alpha publishes every
#      lockstep tag in ONE atomic push, but that does not bound how soon a
#      `git fetch` on a different connection observes all of them, so the
#      first fetch failing to see a sibling tag is not yet evidence of a
#      skew.
#   2. the gate jobs -- re-run the build/lint/test signal from ci.yml's
#      `lint`, `image`, `coverage` and `test-tags` jobs against the exact
#      tagged tree: `make fmt`, `make vet`, `make lint`, `go build ./...` and
#      `make build-server` in `gate`; `make vet-tags` and
#      `make secure-analyzer` in `gate-sweeps`; `make test-tags` in
#      `gate-tags`; and the repo-wide coverage gate as ci.yml measures it,
#      `make coverage-leg` per COVER_LEGS leg in `coverage`, then
#      `make coverage-merge` (COVER_RATCHET) in `coverage-merge`. They are
#      separate jobs because a GitHub-hosted runner has 4 vCPUs and a 6-hour
#      job limit (DS-7377): run in one job, the race suite alone outlasts it.
#      Every job carries a timeout-minutes of at most 350
#      (test/buildgates/ci_runners_test.go). They do NOT re-run every ci.yml step: `release-alpha`
#      refuses to tag anything but the commit the remote's `main` holds, so
#      the tagged tree is bit-for-bit what `ci-gate` already verified clean
#      moments earlier, and re-running a guard's own self-test or a
#      whole-tree scan that cannot have changed since (check-publication-bound,
#      check-public-releasable, every `test-*` meta-guard, the integration and
#      security/trivy suites) would re-check the same guard code against the
#      same tree for the same answer. What CAN still fail here, and is worth
#      the re-run, is the FUNCTIONAL signal: a checkout that resolved the
#      wrong object, a toolchain mismatch on this runner, a race the first
#      run got lucky on.
#   3. publish -- needs validate and every gate job green, then builds the release
#      binaries (`make release-artifacts`: qrdbd and the headless qrdb CLI
#      for linux/amd64 and linux/arm64, each plain and FIPS, plus
#      SHA256SUMS), lifts the matching `## [X.Y.Z]` section out of
#      CHANGELOG.md and publishes it as this tag's release notes, through the
#      forge's own releases API (`${{ github.api_url }}`, which resolves to
#      the right base on Gitea and on GitHub without this file knowing which
#      one it is running on), and attaches the binaries to that release.
#
# NOT A PUBLICATION STEP. Nothing here pushes anywhere; it only reads the tag
# that already exists and writes release notes and binaries for it. Publishing the tag set
# itself to github.com is version-control.md §5a's separate, owner-approved
# step, and when that push lands, this same workflow validates and annotates
# the mirrored tag there too -- there is no bot secret guarding it off that
# plane anymore, so there is nothing to gate it on.

name: Release

on:
  push:
    tags: ["v*"]

# No concurrency block. Unlike a branch ref, a tag is immutable and unique --
# release-alpha refuses to create one that already exists, locally or on the
# remote -- so two runs of this workflow for the SAME ref cannot both be
# in flight from a live publication race the way two pushes to `main` can.
# release-lockstep.yml, the other tag-triggered workflow here, carries none
# either, for the same reason.

permissions:
  contents: read

env:
  # The go directive of go.mod: GOTOOLCHAIN=local refuses an older Go, so a
  # stale pin fails the tagged tree at its first go command.
  # test/buildgates/release_workflow_test.go fails when the two differ.
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  validate:
    name: Validate the tag, VERSION and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history AND every tag: check-tag-lockstep.sh walks ancestry
      # between arbitrary past root tags and their lockstep counterparts
      # (`git merge-base --is-ancestor`), which a shallow clone cannot answer.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: The tag is a well-formed release version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          printf '%s' "${TAG}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha)?$' || {
            echo "::error::${TAG} does not name a vX.Y.Z or vX.Y.Z-alpha release"
            exit 1
          }

      # VERSION byte-equal to the tag, and CHANGELOG.md's newest released
      # section naming the same version -- both halves of
      # release-versioning.md §2, checked by the one script release-alpha
      # already ran against this exact commit before it was tagged.
      - name: VERSION and CHANGELOG.md agree with the tag
        run: ./scripts/check-version-reconciled.sh . "${GITHUB_REF_NAME}"

      # BOUNDED RETRY, NOT A SINGLE SHOT. release-alpha's `git push --atomic`
      # makes the server apply every lockstep tag or none, but says nothing
      # about how soon a fetch on a different connection sees all of them --
      # so the first attempt failing to find a sibling tag is "not visible
      # yet", not "missing", and the only way to tell them apart is to ask
      # again. Ten attempts, three seconds apart: generous next to how this
      # forge's own tag-push event already fired for THIS job to be running.
      - name: Fetch and audit the lockstep tags
        run: |
          set -eu
          attempt=1
          max_attempts=10
          while :; do
            git fetch --quiet --tags origin
            if ./scripts/check-tag-lockstep.sh; then
              break
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::the lockstep tags for ${GITHUB_REF_NAME} were still not in lockstep after ${max_attempts} attempts; see the audit output above"
              exit 1
            fi
            echo "lockstep audit not clean yet (attempt ${attempt}/${max_attempts}); sibling tags from the same atomic push may not have reached this fetch. Retrying in 3s."
            attempt=$((attempt + 1))
            sleep 3
          done

  gate:
    name: Build and lint the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Same commands as ci.yml's `lint` job, minus that job's own meta-guards
      # (tool-version pin assertions, every guard's self-test, the
      # publication-bound and public-releasable scans): those check the
      # GUARD against a tree that cannot have changed since `ci-gate` already
      # ran them, because release-alpha refuses to tag anything but the exact
      # commit `main` holds. What is kept is the functional signal.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      # Same commands as ci.yml's `image` job.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

  # The two whole-tree sweeps ci.yml runs on its nightly schedule. A job of
  # their own: together they take over an hour on 8 cores, so they would
  # take most of gate's limit on 4.
  gate-sweeps:
    name: Vet every tag set and run the secure analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go vet across every supported tag set
        run: make vet-tags

      - name: pkg/secure rules hold across every module and tag set
        run: make secure-analyzer

  # Same command as ci.yml's `test-tags` job.
  gate-tags:
    name: Protocol-family build tags (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Protocol-family build tags (runtime)
        run: make test-tags

  # ci.yml's `coverage` legs: the race suite with coverage, one leg per name
  # in the Makefile's COVER_LEGS (`make -s print-coverage-legs`), each
  # uploading its profile. test/buildgates/coverage_legs_test.go fails when
  # this matrix is not COVER_LEGS or a leg's go test budget is not 5 minutes
  # inside its limit.
  coverage:
    name: Coverage leg ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg: [tenant-lifecycle, tenant, seal-barrier, seal, server-raft, server, auth, service, api-keys, rest, sdk-transport, sdk]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests (race) with coverage, one leg
        env:
          COVER_LEG: ${{ matrix.leg }}
        run: make coverage-leg COVER_LEG="$COVER_LEG" GOTEST_TIMEOUT=175m

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-leg-${{ matrix.leg }}
          path: coverage/leg-${{ matrix.leg }}.out
          retention-days: 1
          if-no-files-found: error

  # The one repo-wide coverage gate over the legs' profiles (COVER_RATCHET).
  coverage-merge:
    name: Coverage gate
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-leg-*
          merge-multiple: true
          path: coverage

      - name: Coverage gate
        run: make coverage-merge

  publish:
    name: Publish the release notes
    needs: [validate, gate, gate-sweeps, gate-tags, coverage-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # No persisted credentials: this job's token can write releases, and
      # the build below has no use for it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # qrdbd and the headless qrdb CLI for linux/amd64 and linux/arm64, each
      # plain and FIPS, plus SHA256SUMS -- built BEFORE the release exists, so
      # a failed build leaves no release with missing binaries behind it.
      - name: Build the release artifacts
        run: make release-artifacts

      # The section between this version's `## [X.Y.Z]` heading and the next
      # one, exclusive of both -- `validate` already proved this heading
      # exists and names this exact version, so a match here is guaranteed
      # rather than hoped for.
      - name: Extract this version's CHANGELOG section
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="${VER}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::found no CHANGELOG.md section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      # ${{ github.api_url }} resolves to this forge's own API base, Gitea or
      # GitHub, so one call publishes the release on whichever plane the tag
      # push landed on. ${{ secrets.GITHUB_TOKEN }} is the run's own token,
      # scoped by the `permissions:` block above -- there is no separate bot
      # identity to authenticate as.
      - name: Create the release
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg name "${GITHUB_REF_NAME}" \
            --rawfile body "${RUNNER_TEMP}/release-notes.md" \
            --argjson prerelease "$(case "${GITHUB_REF_NAME}" in *-alpha) echo true ;; *) echo false ;; esac)" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
            > "${RUNNER_TEMP}/release-payload.json"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${FORGE_TOKEN}" \
            -H "Content-Type: application/json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            -d @"${RUNNER_TEMP}/release-payload.json" \
            -o "${RUNNER_TEMP}/release.json"

      # Every file make release-artifacts wrote, SHA256SUMS included. The
      # release's own upload_url is the asset endpoint on both forges (GitHub
      # serves it from a different host than its API), so it is read from
      # the response rather than built from github.api_url; its URI-template
      # suffix ({?name,label}) is dropped and the name passed as a query.
      # Gitea returns upload_url from 1.21 on, as
      # <api>/repos/{owner}/{repo}/releases/{id}/assets with no template, so
      # the strip leaves it unchanged. The body is the raw file as
      # application/octet-stream, which GitHub requires and Gitea 1.22 or
      # later accepts beside multipart/form-data, naming the asset from the
      # ?name= query; the forge runs Gitea 1.27 (ci.yml).
      - name: Attach the release artifacts
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          UPLOAD_URL="$(jq -er '.upload_url' "${RUNNER_TEMP}/release.json")"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          for f in dist/*; do
            curl -fsS -X POST \
              -H "Authorization: Bearer ${FORGE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${f}" \
              "${UPLOAD_URL}?name=$(basename "${f}")" > /dev/null
          done
