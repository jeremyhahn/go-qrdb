# Release: validates a release tag after it is published.

name: Release

on:
  push:
    tags: ["v*"]

# No concurrency block.

permissions:
  contents: read

env:
  # The go directive of go.mod; test/buildgates/release_workflow_test.go fails when the two differ.
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOWORK: "off"
  GOFLAGS: "-buildvcs=false"

jobs:
  validate:
    name: Validate the tag, VERSION and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history and every tag, for the lockstep ancestry checks.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: The tag is a well-formed release version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          printf '%s' "${TAG}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha)?$' || {
            echo "::error::${TAG} does not name a vX.Y.Z or vX.Y.Z-alpha release"
            exit 1
          }

      # VERSION and CHANGELOG.md must name the tag's version.
      - name: VERSION and CHANGELOG.md agree with the tag
        run: ./scripts/check-version-reconciled.sh . "${GITHUB_REF_NAME}"

      # Retries the fetch, since a newly pushed tag can take a moment to become visible.
      - name: Fetch and audit the lockstep tags
        run: |
          set -eu
          attempt=1
          max_attempts=10
          while :; do
            git fetch --quiet --tags origin
            if ./scripts/check-tag-lockstep.sh; then
              break
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              echo "::error::the lockstep tags for ${GITHUB_REF_NAME} were still not in lockstep after ${max_attempts} attempts; see the audit output above"
              exit 1
            fi
            echo "lockstep audit not clean yet (attempt ${attempt}/${max_attempts}); sibling tags from the same atomic push may not have reached this fetch. Retrying in 3s."
            attempt=$((attempt + 1))
            sleep 3
          done

  gate:
    name: Build and lint the tagged tree
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same commands as ci.yml's lint job, without its meta-guards.
      - name: gofmt
        run: make fmt

      - name: go vet
        run: make vet

      - name: golangci-lint
        run: make lint

      # Same commands as ci.yml's `image` job.
      - name: Build all packages (default tags)
        run: go build ./...

      - name: Build qrdbd with the default feature set
        run: make build-server

  # The two whole-tree sweeps ci.yml runs on its nightly schedule.
  gate-sweeps:
    name: Vet every tag set and run the secure analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: go vet across every supported tag set
        run: make vet-tags

      - name: pkg/secure rules hold across every module and tag set
        run: make secure-analyzer

  # Same command as ci.yml's `test-tags` job.
  gate-tags:
    name: Protocol-family build tags (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Protocol-family build tags (runtime)
        run: make test-tags

  # The coverage legs, one per name in the Makefile's COVER_LEGS.
  coverage:
    name: Coverage leg ${{ matrix.leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        leg: [tenant-lifecycle, tenant, seal-barrier, seal, server-raft, server, auth, service, api-keys, rest, sdk-transport, sdk]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests (race) with coverage, one leg
        env:
          COVER_LEG: ${{ matrix.leg }}
        run: make coverage-leg COVER_LEG="$COVER_LEG" GOTEST_TIMEOUT=175m

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-leg-${{ matrix.leg }}
          path: coverage/leg-${{ matrix.leg }}.out
          retention-days: 1
          if-no-files-found: error

  # The one repo-wide coverage gate over the legs' profiles (COVER_RATCHET).
  coverage-merge:
    name: Coverage gate
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: coverage-leg-*
          merge-multiple: true
          path: coverage

      - name: Coverage gate
        run: make coverage-merge

  publish:
    name: Publish the release notes
    needs: [validate, gate, gate-sweeps, gate-tags, coverage-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      # No persisted credentials: this job's token can write releases.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}

      # Build the release artifacts before the release exists.
      - name: Build the release artifacts
        run: make release-artifacts

      # The CHANGELOG section of this version.
      - name: Extract this version's CHANGELOG section
        run: |
          set -eu
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="${VER}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "::error::found no CHANGELOG.md section for ${GITHUB_REF_NAME}"
            exit 1
          fi

      # ${{ github.api_url }} is this forge's API base.
      - name: Create the release
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          jq -n \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg name "${GITHUB_REF_NAME}" \
            --rawfile body "${RUNNER_TEMP}/release-notes.md" \
            --argjson prerelease "$(case "${GITHUB_REF_NAME}" in *-alpha) echo true ;; *) echo false ;; esac)" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: $prerelease}' \
            > "${RUNNER_TEMP}/release-payload.json"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${FORGE_TOKEN}" \
            -H "Content-Type: application/json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases" \
            -d @"${RUNNER_TEMP}/release-payload.json" \
            -o "${RUNNER_TEMP}/release.json"

      # Every file make release-artifacts wrote, SHA256SUMS included.
      - name: Attach the release artifacts
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          UPLOAD_URL="$(jq -er '.upload_url' "${RUNNER_TEMP}/release.json")"
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          for f in dist/*; do
            curl -fsS -X POST \
              -H "Authorization: Bearer ${FORGE_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"${f}" \
              "${UPLOAD_URL}?name=$(basename "${f}")" > /dev/null
          done
