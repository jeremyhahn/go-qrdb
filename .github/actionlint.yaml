# actionlint-template: v5 — fleet self-hosted runner labels for actionlint.
# Source of truth: software/templates/github-actions/actionlint.yaml in the
# automatethethings repo. Copy to <repo>/.github/actionlint.yaml.
#
# Without this file actionlint reports every self-hosted label as an unknown
# runner (runner-label), which trains readers to ignore its output — the
# signal-integrity failure mode. With it, a MISSPELLED label is still caught.
#
# Labels must match the live Gitea runner fleet. `codex`, `claude` and
# `code-review-qwen` are restricted labels (review workflows only — they carry
# credential mounts, conventions/sdlc.md); listing them here affects linting
# only, not policy.
#
# v2 (2026-09-05, go-truststrap #46): add `code-review-qwen`, the label of
# the review host's Gitea runner (id 48), introduced with the label-driven
# qwen review pilot. The runner was live and completing jobs while this
# allowlist still omitted it, so actionlint correctly reported an unknown
# runner and took `Lint` — and with it the whole staged gate — red on main.
# Adding a self-hosted label to a workflow means adding it here in the same
# change.
#
# v3 (2026-09-07): `code-review-qwen` -> `code-review`. Runner 48 was renamed
# and this file was not, so the TEMPLATE said one thing while every repo copy
# said another — go-sysmon's `.github/actionlint.yaml` already carried
# `code-review`, matching the live fleet. Any repo that had copied the template
# verbatim would have taken `Lint` red on the very label v2 was written to fix.
# The dead name is removed rather than kept alongside: an allowlist that still
# accepts a label no runner has cannot catch that label as a typo.
#
# v4 (2026-10-12): `batch`, the label of the batch runners Infrastructure
# registers for batch.yml (owner order 10:43 EDT: more work for the fleet).
#
# v5 (2026-10-18, ci-template v1.21): `bigdisk`, where the image job builds the
# devcontainer images and runs the stages in them, and `ci-gate`, where CI Gate runs
# (Company Agent m386). go-quicraft's ci.yml has used both since v1.18.
#
# CUSTOMIZE (go-qrdb, DS-7377): `batch`, `bigdisk` and `ci-gate` are removed.
# Every job of ci.yml, nightly.yml, release.yml and batch.yml runs on
# GitHub-hosted ubuntu-latest, so no workflow names those labels, and an
# allowlist that still accepts a label no runner has cannot catch it as a typo
# (the v3 reasoning above). Only code-review.yml keeps self-hosted labels.
#
# CUSTOMIZE (go-qrdb): `qwen`, the opencode review host's runner label, which
# code-review-template v5.5 runs `review-opencode` on. The actionlint template
# does not list it yet, so adopting v5.5 without it took `Lint` red (the v2
# failure mode above).
#
# CUSTOMIZE (go-qrdb, 2026-11-10, Company Agent m2396): `self-hosted`, `linux`,
# `x64` and `bigdisk`, the labels of the returned worker node, which ci.yml's
# test-typescript job runs on for push and same-repository pull_request.
#
# Verify against the fleet, not against this comment:
#   curl -sH "Authorization: token $TOK" \
#     "$GITEA/api/v1/admin/actions/runners" \
#     | jq -r '.runners[] | select(.status=="online")
#              | "\(.name)\t\(.labels|map(.name)|join(","))"'
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - codex
    - codex-task
    - claude
    - code-review
    - qwen
    - self-hosted
    - linux
    - x64
    - bigdisk
