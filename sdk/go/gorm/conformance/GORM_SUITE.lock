  "budgets_comment": "maxexpected is the ceiling on allowlist entries per target, edited downward only (a raised ceiling is a red flag in code review, not a routine change). Every ceiling here is the top-level Test-function FAILURE COUNT actually measured on that target, never a guess and never a number chosen to make a run look green. node's 172 is its original seeding measurement (213 top-level tests observed: 30 pass, 172 fail, 11 skip) and is deliberately left untouched even though the target now measures far better \u2014 this file is edited downward only as entries are retired, not re-baselined upward or downward on a whim. mysql's 12 and pgsql's 304 are FIRST baselines for targets that had never been run before 2026-08-13; see README.md's 'Observed results' for the exact commands and the full failure lists. mysql's 12 is the UNION across three consecutive whole-suite runs (11 failures are stable; TestSelectWithUpdate is order-dependent and appeared in one of the three), deliberately taking the higher figure so the ceiling is not quietly below what a real run can produce. pgsql's ceiling was first measured at 304 and is now 200, lowered on 2026-08-13 after the PostgreSQL endpoint gained contextual DDL type mapping for text columns named by a key, INSERT ... DEFAULT VALUES, the quoted spelling of the EXCLUDED pseudo-table, and PARSE-time result-column description for INSERT ... RETURNING; 200 is a converged run \u2014 converged meaning every upstream test that PANICS on this target had to be named to -skip before the binary reached process exit at all. The -skip list is re-derived from scratch whenever the target improves, because a test that panicked only because its table was missing stops panicking once the table exists, while progress elsewhere can carry a previously-failing test far enough to reach a panic of its own: the list that converged at 200 is 13 entries (TestGenericsPreloads, TestGenericsNestedPreloads, TestPreparedStmtDeadlock, TestEmbeddedPointerTypeStruct, TestDifferentTypeWithoutDeclaredLength, TestMigrateArrayTypeModel, TestMigrateWithDefaultValue, TestManyToManyPreloadForNestedPointer, TestPrefixedPreloadDuplication, TestPreloadWithConds, TestUpdateReturning, TestNestedPreloadWithConds, TestSaveWithHooks), and the 15-entry list that produced 304 can no longer reach process exit at all. Neither wire target has ANY allowlist entry, so both budgets are pure documented ceilings today: every failure on them is reported by runner.go as unexpected rather than silently pre-excused, which is the intended posture for a freshly measured target. pgsql's ceiling was lowered 200 -> 126 on 2026-08-14, the top-level failure count measured on that target once the suite could be run to completion (in chunks, so that a panicking upstream test truncated only its own chunk); 63 of those 126 are two go-mysql-server RETURNING defects, see docs/sql/upstream-gaps.md. RAISED 131 -> 140 on 2026-08-16, which is a deliberate, review-visible exception to the edited-downward-only rule and must be read as one. The prior figures were not comparable measurements: 126 was measured IN CHUNKS so that a panicking test truncated only its own chunk, and 131 was the entry count of an allowlist that has since been rewritten. Upstream tests share database state, so a chunked run and a single-process run do not produce the same outcomes and the chunked number cannot bound the single-process one. 140 is the converged SINGLE-PROCESS count: 7 process-aborting tests, found by iterated runs until one reached process exit, plus 133 top-level failures observed in that run (243 pass / 133 fail / 17 skip of 393 measured). It is the measured number, not a number chosen to make the run green -- but it IS a raise, and the next edit to it must be downward. Set to 141 rather than 140 for the one order-dependent entry (TestConcurrentMany2ManyAssociation) that the converged run and the ratchet run disagreed on; seven entries on this target carry Unstable for the same reason.",
